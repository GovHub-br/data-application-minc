# Curadoria do site de documentação do data-application-minc.
#
# ESTE É O ÚNICO ARQUIVO ESCRITO À MÃO. Contagens, modelos, DAGs e entregas são
# lidos do repositório a cada coleta — aqui fica só o que o código não sabe
# dizer: o que cada conjunto de dados significa e para que ele serve.
#
# COMO ESCREVER AQUI
#   O público não é só quem programa. É também quem é de geografia, estatística,
#   comunicação e gestão. A régua: uma pessoa que nunca abriu o repositório
#   precisa entender o que este domínio responde, sem abrir nenhum arquivo.
#
#   Escreva o problema antes da solução. "Ninguém sabia se a cota estava sendo
#   cumprida" explica mais que "modelagem dimensional das cotas".
#
# O QUE NÃO FAZER
#   Não digite número aqui. Se um número precisa aparecer no site, ele se
#   calcula em tooling/dados.py e o template consome. Número escrito à mão
#   mente na primeira mudança do repositório, e ninguém percebe.
#
# REVISAR ANTES DE PUBLICAR
#   Os campos marcados com "A CONFERIR" precisam de validação de quem conhece a
#   política antes de o site ir ao ar. Estão escritos com o que o repositório
#   permite afirmar, e podem estar incompletos.

programa:
  nome: Política Nacional Aldir Blanc e Lei Paulo Gustavo
  sigla: PNAB / LPG
  resumo: |
    Duas políticas de fomento à cultura que repassam recursos federais a estados
    e municípios, que por sua vez selecionam e pagam agentes culturais. Este
    repositório acompanha esse caminho do dinheiro e o perfil de quem recebe.
  por_que_e_dificil: |
    O dado não nasce num lugar só. Ele vem de sistemas diferentes, de formatos
    diferentes e em momentos diferentes: o repasse ao ente federado está no
    TransfereGov, o pagamento ao agente cultural está nas planilhas de relatório
    de gestão e no BB Ágil, e o perfil de quem recebeu — raça, deficiência,
    território — está numa terceira ponta, preenchida pelo próprio proponente.
    Cruzar isso é o trabalho, e é onde os números costumam divergir.

# As metas que o repositório acompanha. Servem de eixo do site: cada domínio
# responde a uma delas.
metas:
  - numero: 2
    rotulo: Execução Financeira
    resumo: |
      Quanto foi repassado, para quem, e quanto disso chegou de fato ao agente
      cultural. São duas perguntas diferentes, e confundi-las é o erro mais caro
      da análise.
    situacao: em construção

  - numero: 3
    rotulo: Diversidade, Cotas e Territórios
    resumo: |
      As leis reservam parte dos recursos para pessoas negras, indígenas, com
      deficiência e — na LPG — de territórios vulnerabilizados. A pergunta é
      simples de enunciar e difícil de responder: a reserva foi cumprida?
    situacao: com resultado

  - numero: 5
    rotulo: Primeiro Acesso
    resumo: |
      Quantos dos contemplados nunca haviam acessado recurso público de fomento
      à cultura antes. É o indicador de que a política alcançou gente nova, e
      não apenas quem já sabia acessar.
    situacao: com resultado

dominios:
  - slug: cotas
    rotulo: Cotas e territórios
    meta: 3
    subtitulo: A reserva legal foi cumprida, e com que grau de confiança
    contexto: |
      A PNAB e a Lei Paulo Gustavo reservam percentuais dos recursos para
      pessoas negras, indígenas e com deficiência; a LPG acrescenta uma reserva
      territorial. Antes deste trabalho não havia como responder se a reserva
      foi cumprida — os pagamentos estavam num sistema, e o perfil de quem
      recebeu, em outro, sem chave comum confiável.
    o_que_faz: |
      Parte do pagamento, e não do proponente: cada linha da tabela base é um
      pagamento, com marcações de qual cota ele atende, se o perfil de quem
      recebeu é conhecido e de que ano o recurso é. A partir daí, calcula a
      distribuição por cota e compara com o que a lei exige, separando PNAB de
      LPG porque as reservas são diferentes.
    perguntas:
      - Que percentual dos recursos foi para agentes de cada cota?
      - A reserva legal foi cumprida em cada programa?
      - De quantos pagamentos a gente sabe o perfil de quem recebeu?
      - Que parcela do total está datada com confiança?
    sistemas: [TransfereGov, BB Ágil, Relatórios de gestão, FCU]
    armadilhas: |
      Duas coisas que quem lê estes números precisa saber. A primeira: o valor
      total dos repasses não é o valor pago a agentes culturais — o repasse vai
      ao ente federado, que depois paga o agente, e os dois montantes são
      diferentes por ordens de grandeza. A segunda: a cobertura não é de 100%.
      Parte dos pagamentos não tem perfil declarado ou não tem ano confiável, e
      há uma tabela específica no domínio que mede esse teto de confiabilidade.
      Ler a distribuição sem olhar a cobertura leva a conclusão errada.

  - slug: agentes
    rotulo: Perfil dos agentes
    meta: 5
    subtitulo: Quantos agentes chegaram ao fomento federal pela primeira vez
    contexto: |
      Uma política de fomento pode distribuir muito recurso e ainda assim
      alcançar sempre as mesmas pessoas. O indicador de primeiro acesso existe
      para responder se a política alargou o alcance — quantos agentes que
      receberam recurso nunca haviam sido contemplados antes, em nenhum
      mecanismo federal.
    o_que_faz: |
      Junta numa linha do tempo única, por CPF ou CNPJ, cada vez que um agente
      recebeu recurso federal: pagamentos da LAB, LPG e PNAB no extrato do BB
      Ágil, captações da Lei Rouanet no SALIC e captações do audiovisual na
      Ancine. O primeiro evento de cada agente, em qualquer mecanismo, é a sua
      porta de entrada. As tabelas do Cultura em Números (eixo 2, Meta 5)
      contam os novos entrantes por ano e por mecanismo, e medem quem entrou
      pelo fomento direto e depois chegou à Rouanet.
    perguntas:
      - Que percentual dos agentes atendidos em cada ano era de primeiro acesso?
      - Quantos novos entrantes a Rouanet recebeu ao longo dos anos?
      - Quantos novos entrantes vieram pela LAB, pela LPG e pela PNAB?
      - Quem entrou pelo fomento direto depois chegou a captar pela Rouanet?
    sistemas: [BB Ágil, SALIC, Ancine, TransfereGov]
    armadilhas: |
      "Novo entrante" quer dizer "sem evento anterior nas fontes disponíveis",
      não "nunca acessou". Fonte que falta só transforma veterano em falso novo
      entrante, nunca o contrário, então os percentuais são teto. O fomento
      direto só é observável desde 2023 (a Aldir Blanc emergencial está fora do
      escopo por decisão de 20/08/2026), e o BB Ágil só enxerga contas
      administradas pelo Banco do Brasil. O último ano da série é parcial.

  - slug: snc
    rotulo: Sistema Nacional de Cultura
    subtitulo: Quais estados e municípios aderiram ao SNC, e com que estrutura
    sem_modelos: true
    contexto: |
      O Eixo 1 do Cultura em Números acompanha a adesão de estados e
      municípios ao Sistema Nacional de Cultura e se cada um tem lei do
      sistema, órgão gestor, conselho, fundo e plano de cultura. Os scripts
      que fazem essas contas liam uma planilha exportada da Plataforma SNC, e
      cada atualização dependia de alguém enviar o arquivo à mão.
    o_que_faz: |
      Lê a mesma lista no portal de dados abertos do MinC, uma linha por
      ente, todo mês, e guarda cada versão que encontra ao lado das
      anteriores. O portal só mostra a versão atual, então o histórico começa
      na primeira carga e tem só as versões que estavam no ar no dia de
      alguma carga: uma versão publicada e trocada entre duas cargas não fica
      registrada. Ainda não há tabela de uso final: a lista está carregada no
      schema seeds e espera o modelo que vai tratá-la.
    perguntas:
      - Quais estados e municípios aderiram ao SNC, e em que situação está cada adesão?
      - Quais têm lei do sistema, órgão gestor, conselho, fundo e plano de cultura?
      - Como a adesão mudou de uma versão carregada para a seguinte?
    sistemas: [Portal de dados abertos do MinC]
    armadilhas: |
      A tabela seeds.dados_cultura_snc_entes guarda as versões da lista que a
      carga encontrou, uma ao lado da outra. Por isso o mesmo estado ou
      município aparece uma vez em cada versão, e o código IBGE só é único
      dentro de uma versão. Contar entes sem escolher a versão conta o mesmo
      ente mais de uma vez. Para o retrato atual, filtre a versão mais
      recente: as linhas em que a coluna versao é a maior da tabela. Ela é a
      data em que o arquivo mudou no portal, no formato ano-mês-dia. Mesmo
      dentro de uma versão, nem toda linha é um ente: há uma linha com código
      IBGE "Não cadastrado" e UF "Não encontrada", que entra na contagem dos
      que não aderiram se não for retirada. E nem todo município está na
      lista: na versão de 28/05/2026 faltavam Boa Esperança do Norte (MT),
      Santa Isabel (GO), Fernando de Noronha (PE) e Brasília, e o Distrito
      Federal aparece só como unidade da federação. Por isso um percentual de
      adesão muda conforme o denominador, o total da lista ou o total de
      municípios do IBGE: diga qual usou. A lista traz ainda dados bancários,
      com agência e conta, do órgão gestor e do fundo de cultura, além de
      CNPJs, nomes de prefeitos e de gestores de cultura e endereços. São
      dados que a Plataforma SNC publica sobre órgãos e agentes públicos e
      ficam na tabela como vieram, mas nenhum indicador do Eixo 1 usa essas
      colunas: quem for publicar ou cruzar a tabela decide antes o que fazer
      com elas. Por fim, o portal anda atrás da planilha interna da
      Plataforma SNC: a lista fica tão atual quanto o portal, não mais.

  - slug: senado
    rotulo: Legislação federal
    subtitulo: As leis, leis complementares e decretos federais, como o Senado os publica
    contexto: |
      O Eixo 3 do Cultura em Números levanta a legislação federal sobre
      patrimônio, arquivos, acervos e memória. Ninguém mantém essa lista
      pronta: é preciso percorrer todas as normas federais e decidir quais
      tratam do tema. O script do eixo fazia isso a partir de um cache no
      computador de quem o rodava, e cada atualização dependia de rodá-lo de
      novo à mão.
    o_que_faz: |
      Todo mês, pede à API de Dados Abertos do Senado a lista de leis, leis
      complementares e decretos de cada ano, desde 1988, e o detalhe de cada
      norma que ainda não tinha sido baixada: as publicações, as alterações,
      os dispositivos, a indexação e a classe temática do Senado. Guarda as
      respostas como vieram e as põe em tabelas no schema senado, sem escolher
      nada. Ainda não há tabela de uso final: a seleção das normas do tema é
      uma regra do Eixo 3 e vai ser feita na etapa seguinte.
    perguntas:
      - Que normas federais foram assinadas em cada ano, de cada tipo?
      - O que diz a ementa, a indexação e a classe temática de cada norma?
      - Quais normas posteriores alteraram ou revogaram uma norma?
    sistemas: [API de Dados Abertos do Senado]
    armadilhas: |
      Os decretos incluem os que não têm número: atos de nomeação, de
      declaração de utilidade pública e afins, que se identificam pela data.
      Contar "decretos" sem separar os dois tipos mistura coisas diferentes.
      A lista do ano corrente é pedida de novo a cada mês, até abril do ano
      seguinte, e cada pedido fica guardado: a mesma norma aparece uma vez por
      pedido. Para contar normas, use só a lista mais recente de cada tipo e
      ano. O detalhe de cada norma é baixado uma vez só, então as alterações
      que ela sofrer depois não aparecem nele. Muitas normas vêm sem classe
      temática: a ausência da classe não quer dizer que a norma não trata de
      cultura. A legislação estadual não está aqui: o Senado só publica a
      federal. E a escolha do que é patrimônio, arquivo ou memória não está
      nestas tabelas: elas trazem todas as normas, do tema ou não.

  - slug: metadata
    rotulo: Metadados do pipeline
    subtitulo: O que o próprio pipeline registra sobre sua execução
    contexto: |
      Domínio de apoio: guarda o que o pipeline sabe sobre si mesmo. Não
      responde pergunta de política pública, e existe para dar rastreabilidade
      ao resto.
    o_que_faz: |
      Registra informação de execução usada pelos outros domínios para datar e
      rastrear a origem dos registros.
    perguntas:
      - De que arquivo e de que carga veio determinado registro?
    sistemas: [Interno]
