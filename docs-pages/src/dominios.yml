# Curadoria do site de documentação do data-application-minc.
#
# ESTE É O ÚNICO ARQUIVO ESCRITO À MÃO. Contagens, modelos, DAGs e entregas são
# lidos do repositório a cada coleta — aqui fica só o que o código não sabe
# dizer: o que cada conjunto de dados significa e para que ele serve.
#
# COMO ESCREVER AQUI
#   O público não é só quem programa. É também quem é de geografia, estatística,
#   comunicação e gestão. A régua: uma pessoa que nunca abriu o repositório
#   precisa entender o que este domínio responde, sem abrir nenhum arquivo.
#
#   Escreva o problema antes da solução. "Ninguém sabia se a cota estava sendo
#   cumprida" explica mais que "modelagem dimensional das cotas".
#
# O QUE NÃO FAZER
#   Não digite número aqui. Se um número precisa aparecer no site, ele se
#   calcula em tooling/dados.py e o template consome. Número escrito à mão
#   mente na primeira mudança do repositório, e ninguém percebe.
#
# REVISAR ANTES DE PUBLICAR
#   Os campos marcados com "A CONFERIR" precisam de validação de quem conhece a
#   política antes de o site ir ao ar. Estão escritos com o que o repositório
#   permite afirmar, e podem estar incompletos.

programa:
  nome: Política Nacional Aldir Blanc e Lei Paulo Gustavo
  sigla: PNAB / LPG
  resumo: |
    Duas políticas de fomento à cultura que repassam recursos federais a estados
    e municípios, que por sua vez selecionam e pagam agentes culturais. Este
    repositório acompanha esse caminho do dinheiro e o perfil de quem recebe.
  por_que_e_dificil: |
    O dado não nasce num lugar só. Ele vem de sistemas diferentes, de formatos
    diferentes e em momentos diferentes: o repasse ao ente federado está no
    TransfereGov, o pagamento ao agente cultural está nas planilhas de relatório
    de gestão e no BB Ágil, e o perfil de quem recebeu — raça, deficiência,
    território — está numa terceira ponta, preenchida pelo próprio proponente.
    Cruzar isso é o trabalho, e é onde os números costumam divergir.

# As metas que o repositório acompanha. Servem de eixo do site: cada domínio
# responde a uma delas.
metas:
  - numero: 2
    rotulo: Execução Financeira
    resumo: |
      Quanto foi repassado, para quem, e quanto disso chegou de fato ao agente
      cultural. São duas perguntas diferentes, e confundi-las é o erro mais caro
      da análise.
    situacao: em construção

  - numero: 3
    rotulo: Diversidade, Cotas e Territórios
    resumo: |
      As leis reservam parte dos recursos para pessoas negras, indígenas, com
      deficiência e — na LPG — de territórios vulnerabilizados. A pergunta é
      simples de enunciar e difícil de responder: a reserva foi cumprida?
    situacao: com resultado

  - numero: 5
    rotulo: Primeiro Acesso
    resumo: |
      Quantos dos contemplados nunca haviam acessado recurso público de fomento
      à cultura antes. É o indicador de que a política alcançou gente nova, e
      não apenas quem já sabia acessar.
    situacao: com resultado

dominios:
  - slug: cotas
    rotulo: Cotas e territórios
    meta: 3
    subtitulo: A reserva legal foi cumprida, e com que grau de confiança
    contexto: |
      A PNAB e a Lei Paulo Gustavo reservam percentuais dos recursos para
      pessoas negras, indígenas e com deficiência; a LPG acrescenta uma reserva
      territorial. Antes deste trabalho não havia como responder se a reserva
      foi cumprida — os pagamentos estavam num sistema, e o perfil de quem
      recebeu, em outro, sem chave comum confiável.
    o_que_faz: |
      Parte do pagamento, e não do proponente: cada linha da tabela base é um
      pagamento, com marcações de qual cota ele atende, se o perfil de quem
      recebeu é conhecido e de que ano o recurso é. A partir daí, calcula a
      distribuição por cota e compara com o que a lei exige, separando PNAB de
      LPG porque as reservas são diferentes.
    perguntas:
      - Que percentual dos recursos foi para agentes de cada cota?
      - A reserva legal foi cumprida em cada programa?
      - De quantos pagamentos a gente sabe o perfil de quem recebeu?
      - Que parcela do total está datada com confiança?
    sistemas: [TransfereGov, BB Ágil, Relatórios de gestão, FCU]
    armadilhas: |
      Duas coisas que quem lê estes números precisa saber. A primeira: o valor
      total dos repasses não é o valor pago a agentes culturais — o repasse vai
      ao ente federado, que depois paga o agente, e os dois montantes são
      diferentes por ordens de grandeza. A segunda: a cobertura não é de 100%.
      Parte dos pagamentos não tem perfil declarado ou não tem ano confiável, e
      há uma tabela específica no domínio que mede esse teto de confiabilidade.
      Ler a distribuição sem olhar a cobertura leva a conclusão errada.

  - slug: agentes
    rotulo: Perfil dos agentes
    meta: 5
    subtitulo: Quantos agentes chegaram ao fomento federal pela primeira vez
    contexto: |
      Uma política de fomento pode distribuir muito recurso e ainda assim
      alcançar sempre as mesmas pessoas. O indicador de primeiro acesso existe
      para responder se a política alargou o alcance — quantos agentes que
      receberam recurso nunca haviam sido contemplados antes, em nenhum
      mecanismo federal.
    o_que_faz: |
      Junta numa linha do tempo única, por CPF ou CNPJ, cada vez que um agente
      recebeu recurso federal: pagamentos da LAB, LPG e PNAB no extrato do BB
      Ágil, captações da Lei Rouanet no SALIC e captações do audiovisual na
      Ancine. O primeiro evento de cada agente, em qualquer mecanismo, é a sua
      porta de entrada. As tabelas do Cultura em Números (eixo 2, Meta 5)
      contam os novos entrantes por ano e por mecanismo, e medem quem entrou
      pelo fomento direto e depois chegou à Rouanet.
    perguntas:
      - Que percentual dos agentes atendidos em cada ano era de primeiro acesso?
      - Quantos novos entrantes a Rouanet recebeu ao longo dos anos?
      - Quantos novos entrantes vieram pela LAB, pela LPG e pela PNAB?
      - Quem entrou pelo fomento direto depois chegou a captar pela Rouanet?
    sistemas: [BB Ágil, SALIC, Ancine, TransfereGov]
    armadilhas: |
      "Novo entrante" quer dizer "sem evento anterior nas fontes disponíveis",
      não "nunca acessou". Fonte que falta só transforma veterano em falso novo
      entrante, nunca o contrário, então os percentuais são teto. O fomento
      direto só é observável desde 2023 (a Aldir Blanc emergencial está fora do
      escopo por decisão de 20/08/2026), e o BB Ágil só enxerga contas
      administradas pelo Banco do Brasil. O último ano da série é parcial.

  - slug: snc
    rotulo: Sistema Nacional de Cultura
    subtitulo: Quais estados e municípios aderiram ao SNC, e com que estrutura
    sem_modelos: true
    contexto: |
      O Eixo 1 do Cultura em Números acompanha a adesão de estados e
      municípios ao Sistema Nacional de Cultura e se cada um tem lei do
      sistema, órgão gestor, conselho, fundo e plano de cultura. Os scripts
      que fazem essas contas liam uma planilha exportada da Plataforma SNC, e
      cada atualização dependia de alguém enviar o arquivo à mão.
    o_que_faz: |
      Lê a mesma lista no portal de dados abertos do MinC, uma linha por
      ente, todo mês, e guarda cada versão que encontra ao lado das
      anteriores. O portal só mostra a versão atual, então o histórico começa
      na primeira carga e tem só as versões que estavam no ar no dia de
      alguma carga: uma versão publicada e trocada entre duas cargas não fica
      registrada. Ainda não há tabela de uso final: a lista está carregada no
      schema seeds e espera o modelo que vai tratá-la.
    perguntas:
      - Quais estados e municípios aderiram ao SNC, e em que situação está cada adesão?
      - Quais têm lei do sistema, órgão gestor, conselho, fundo e plano de cultura?
      - Como a adesão mudou de uma versão carregada para a seguinte?
    sistemas: [Portal de dados abertos do MinC]
    armadilhas: |
      A tabela seeds.dados_cultura_snc_entes guarda as versões da lista que a
      carga encontrou, uma ao lado da outra. Por isso o mesmo estado ou
      município aparece uma vez em cada versão, e o código IBGE só é único
      dentro de uma versão. Contar entes sem escolher a versão conta o mesmo
      ente mais de uma vez. Para o retrato atual, filtre a versão mais
      recente: as linhas em que a coluna versao é a maior da tabela. Ela é a
      data em que o arquivo mudou no portal, no formato ano-mês-dia. Mesmo
      dentro de uma versão, nem toda linha é um ente: há uma linha com código
      IBGE "Não cadastrado" e UF "Não encontrada", que entra na contagem dos
      que não aderiram se não for retirada. E nem todo município está na
      lista: na versão de 28/05/2026 faltavam Boa Esperança do Norte (MT),
      Santa Isabel (GO), Fernando de Noronha (PE) e Brasília, e o Distrito
      Federal aparece só como unidade da federação. Por isso um percentual de
      adesão muda conforme o denominador, o total da lista ou o total de
      municípios do IBGE: diga qual usou. A lista traz ainda dados bancários,
      com agência e conta, do órgão gestor e do fundo de cultura, além de
      CNPJs, nomes de prefeitos e de gestores de cultura e endereços. São
      dados que a Plataforma SNC publica sobre órgãos e agentes públicos e
      ficam na tabela como vieram, mas nenhum indicador do Eixo 1 usa essas
      colunas: quem for publicar ou cruzar a tabela decide antes o que fazer
      com elas. Por fim, o portal anda atrás da planilha interna da
      Plataforma SNC: a lista fica tão atual quanto o portal, não mais.

  - slug: senado
    rotulo: Legislação federal
    subtitulo: As leis, leis complementares e decretos federais, como o Senado os publica
    contexto: |
      O Eixo 3 do Cultura em Números levanta a legislação federal sobre
      patrimônio, arquivos, acervos e memória. Ninguém mantém essa lista
      pronta: é preciso percorrer todas as normas federais e decidir quais
      tratam do tema. O script do eixo fazia isso a partir de um cache no
      computador de quem o rodava, e cada atualização dependia de rodá-lo de
      novo à mão.
    o_que_faz: |
      Todo mês, pede à API de Dados Abertos do Senado a lista de leis, leis
      complementares e decretos de cada ano, desde 1988, e o detalhe de cada
      norma que ainda não tinha sido baixada: as publicações, as alterações,
      os dispositivos, a indexação e a classe temática do Senado. Guarda as
      respostas como vieram e as põe em tabelas no schema senado, sem escolher
      nada. Ainda não há tabela de uso final: a seleção das normas do tema é
      uma regra do Eixo 3 e vai ser feita na etapa seguinte.
    perguntas:
      - Que normas federais foram assinadas em cada ano, de cada tipo?
      - O que diz a ementa, a indexação e a classe temática de cada norma?
      - Quais normas posteriores alteraram ou revogaram uma norma?
    sistemas: [API de Dados Abertos do Senado]
    armadilhas: |
      Os decretos incluem os que não têm número: atos de nomeação, de
      declaração de utilidade pública e afins, que se identificam pela data.
      Contar "decretos" sem separar os dois tipos mistura coisas diferentes.
      A lista do ano corrente é pedida de novo a cada mês, até abril do ano
      seguinte, e cada pedido fica guardado: a mesma norma aparece uma vez por
      pedido. Para contar normas, use só a lista mais recente de cada tipo e
      ano. O detalhe de cada norma é baixado uma vez só, então as alterações
      que ela sofrer depois não aparecem nele. Muitas normas vêm sem classe
      temática: a ausência da classe não quer dizer que a norma não trata de
      cultura. A legislação estadual não está aqui: o Senado só publica a
      federal. E a escolha do que é patrimônio, arquivo ou memória não está
      nestas tabelas: elas trazem todas as normas, do tema ou não.

  - slug: palmares
    rotulo: Comunidades quilombolas certificadas
    subtitulo: As certidões de autodefinição que a Fundação Cultural Palmares emitiu
    sem_modelos: true
    contexto: |
      O Eixo 3 do Cultura em Números conta as comunidades quilombolas
      reconhecidas no país e onde elas estão. O reconhecimento começa pela
      certidão de autodefinição da Fundação Cultural Palmares, publicada por
      portaria no Diário Oficial. O script do eixo lia uma cópia da lista
      guardada no computador de quem o rodava, e cada atualização dependia de
      alguém baixar o arquivo de novo.
    o_que_faz: |
      Todo mês, baixa a planilha de certidões que a Palmares mantém no Google
      Sheets e guarda cada versão que encontra ao lado das anteriores. A
      versão é a data de "última atualização" que a própria Palmares escreve
      na planilha. Uma versão nova só aparece quando a Palmares atualiza a
      planilha; buscar de novo a mesma versão a substitui. Ainda não há
      tabela de uso final: a lista está carregada no schema seeds e espera o
      modelo que vai tratá-la.
    perguntas:
      - Quantas comunidades quilombolas foram certificadas, em cada ano e em cada estado?
      - Em que municípios estão as comunidades certificadas?
      - Quantas certidões já têm processo de titulação aberto no Incra?
    sistemas: [Fundação Cultural Palmares]
    armadilhas: |
      Uma linha da tabela seeds.palmares_quilombos_certificados é uma
      certidão, não uma comunidade: uma certidão pode cobrir várias, e o
      número delas está na coluna no_de_crq. Na versão de 11/11/2026 eram
      3.578 certidões e 4.783 comunidades. Contar linhas conta certidões.
      As versões ficam lado a lado, então a mesma certidão aparece uma vez em
      cada versão: para o retrato atual, filtre a maior versao. O número do
      registro não identifica a certidão, porque se repete (6 números em 14
      linhas); dentro de uma versão, quem identifica é a coluna linha, o
      número da linha na planilha. Uma certidão pode cobrir mais de um
      município: municipio e codigo_do_ibge trazem vários, separados de
      jeitos diferentes, e há códigos IBGE inexistentes ou de outro estado.
      Somar por município exige separar os códigos antes, ou as certidões de
      vários municípios ficam de fora ou contam em dobro. No número da
      portaria, valores como "nov./06" são datas que o Excel inventou: querem
      dizer Portaria 11/2006. Desde 2025 a portaria vem sem o ano. A coluna
      de moradores mistura famílias e pessoas e está quase toda vazia, a de
      população do IBGE traz coordenadas, e cont vale sempre 1. Acre,
      Roraima e Distrito Federal não têm certidão na lista. Célula vazia,
      inclusive a que a planilha preenche com um espaço invisível, chega
      como nula.

  - slug: ancine_salas
    rotulo: Salas de cinema
    subtitulo: O cadastro de salas de exibição e complexos que a ANCINE publica
    sem_modelos: true
    contexto: |
      O Eixo 5 do Cultura em Números conta as salas de cinema em
      funcionamento em cada município. O script do eixo lia uma planilha da
      ANCINE guardada no repositório dele, sem registro de quando nem de onde
      ela tinha vindo, e cada atualização dependia de alguém baixar o arquivo
      de novo.
    o_que_faz: |
      Todo mês, baixa o cadastro de salas de exibição e complexos que a
      ANCINE publica nos dados abertos e guarda cada versão que encontra ao
      lado das anteriores. A versão é a data em que a ANCINE alterou o
      arquivo, a mesma que o portal de dados abertos mostra. Buscar de novo a
      mesma versão a substitui. Ainda não há tabela de uso final: o cadastro
      está carregado no schema seeds e espera o modelo que vai contar as
      salas.
    perguntas:
      - Quantas salas de cinema estão em funcionamento em cada município e em cada estado?
      - Quantos municípios têm ao menos uma sala de cinema funcionando?
      - Quantos assentos acessíveis as salas oferecem?
    sistemas: [ANCINE]
    armadilhas: |
      Uma linha da tabela seeds.ancine_salas_exibicao é uma sala, não um
      cinema: o complexo reúne várias salas, e as colunas dele se repetem em
      cada uma. O cadastro guarda também as salas fechadas. Para contar o que
      funciona, filtre situacao_sala igual a EM FUNCIONAMENTO; a situação do
      complexo e a do exibidor são outras colunas e não dizem o mesmo. As
      versões ficam lado a lado, então a mesma sala aparece uma vez em cada
      versão, e contar sem filtrar a versão multiplica o total: para o
      retrato atual, filtre a maior versao. O registro da sala vem vazio nas
      salas que a ANCINE marcou como não encontradas; dentro de uma versão,
      quem identifica a sala é a coluna linha, o número da linha no arquivo.
      O arquivo não traz o código IBGE: o município vem só por nome e UF do
      complexo, em maiúsculas, e juntar com outras bases por município exige
      casar o nome antes. Na versão de 06/11/2026, comparando sem acento com a
      lista de municípios do IBGE, só Campos dos Goitacazes (RJ), com 5 salas
      em funcionamento, não casa: o IBGE escreve Goytacazes. As 25 linhas sem
      município são todas de salas fora de funcionamento. Datas vêm como
      dd/mm/aaaa e números como texto, do jeito que estão no arquivo. Cinemas
      itinerantes também fazem parte do cadastro. O cadastro traz ainda o
      CNPJ da sala e do exibidor, o nome do exibidor, que em microempresas
      costuma ser o nome de uma pessoa, e o endereço do complexo. São dados
      públicos de empresas e ficam na tabela como vieram, mas a contagem de
      salas não usa essas colunas: quem for publicar ou cruzar a tabela
      decide antes o que fazer com elas.

  - slug: iphan
    rotulo: Patrimônio imaterial e diversidade linguística
    subtitulo: Os bens registrados e os inventários que o Iphan publica no Tainacan
    contexto: |
      O Eixo 3 do Cultura em Números descreve o patrimônio imaterial e as
      línguas inventariadas no país. O Iphan publica três acervos na
      plataforma Tainacan: o Bem Brasileiro, com os bens culturais registrados
      e os documentos, mídias e ações de salvaguarda de cada registro; o INRC,
      Inventário Nacional de Referências Culturais; e o INDL, Inventário
      Nacional da Diversidade Linguística. O script do eixo extraía os três e
      guardava o resultado no computador de quem o rodava.
    o_que_faz: |
      Todo mês, pede à API pública de cada acervo a lista de coleções e todos
      os itens publicados de cada uma, e guarda as respostas como vieram. Cada
      coleção vira uma tabela própria, porque cada uma tem o próprio
      formulário: juntar todas numa tabela só deixaria a maior parte das
      colunas vazia em cada linha. Cada busca substitui a coleção inteira, e
      confere se o número de itens trazidos bate com o que a API declara. Ainda
      não há tabela de uso final: os campos do formulário estão guardados como
      vieram, e abri-los em colunas é a etapa seguinte.
    perguntas:
      - Quais bens culturais imateriais estão registrados, e com que documentos e ações de salvaguarda?
      - Que referências culturais, grupos e detentores o INRC inventariou, e em que territórios?
      - Que línguas o INDL inventariou, onde são faladas e por quais comunidades?
    sistemas: [Iphan (Tainacan)]
    armadilhas: |
      Só entra o que está publicado: rascunho, item privado e item na lixeira
      não saem na API pública, e algumas coleções do INRC têm mais itens
      privados que publicados. Os campos do formulário ficam juntos na coluna
      metadata, e o vazio aparece de dois jeitos: texto vazio ou o valor
      lógico false, resto do sistema, que não quer dizer "não" (o script do
      eixo o escrevia como a palavra "False"). Um termo de lista (a categoria do bem, por exemplo) vem com o nome dentro,
      e um campo que aponta para outro item traz só o número desse item, que
      fica em outra coleção. As datas de criação e de modificação estão como
      texto, cada acervo num formato: "21/09/2026" no Bem Brasileiro, "19 de
      outubro de 2026" no INRC, "outubro 22, 2026" no INDL. As datas digitadas
      no formulário vêm como ano-mês-dia ou como dia/mês/ano. A data de criação
      é a do cadastro no sistema, não a do registro do bem nem a da pesquisa.
      As coleções do INRC são numeradas no nome ("06 - Bem Cultural"), e a
      numeração não é a do endereço ("05-identificacao-bem-cultural"): a tabela
      segue o endereço. Os acervos ainda recebem coleções novas; quando aparece
      uma, a carga do mês termina com erro até alguém acrescentá-la, e as
      outras são carregadas mesmo assim. Bens tombados não estão aqui: o
      tombamento não é publicado no Tainacan.

  - slug: ibram
    rotulo: Museus e Pontos de Memória
    subtitulo: O Cadastro Nacional de Museus e os Pontos de Memória, como o Ibram os publica
    contexto: |
      Os eixos 3 e 5 do Cultura em Números contam os museus e os pontos de
      memória do país e descrevem onde estão e como funcionam. O Ibram mantém
      os dois cadastros na plataforma Tainacan, em cadastro.museus.gov.br, e o
      script do eixo os extraía para o computador de quem o rodava.
    o_que_faz: |
      Todo mês, pede à API pública do cadastro todos os itens publicados das
      coleções Museus e Pontos de Memória e guarda as respostas como vieram.
      Cada coleção é uma tabela, cada busca substitui a coleção inteira e
      confere o número de itens com o que a API declara. As outras coleções do
      cadastro (agentes de participação social, pesquisa anual, gestão de
      risco) ficam de fora. Ainda não há tabela de uso final: os campos do
      formulário estão guardados como vieram.
    perguntas:
      - Quantos museus estão cadastrados, de que tipo e em que municípios?
      - Que pontos de memória existem, e com que temática?
      - Que infraestrutura de acessibilidade os museus declaram?
    sistemas: [Ibram (Tainacan)]
    armadilhas: |
      Só entra o que está publicado: museu em rascunho ou privado não aparece.
      Nos Pontos de Memória, a data de criação é a da carga em lote, feita em
      poucos dias, e não a do cadastro do ponto: não serve para série
      histórica. Os campos do formulário ficam juntos na coluna metadata, com o
      vazio como texto vazio ou como o valor lógico false, que não quer dizer
      "não"; termo de lista vem com o nome dentro, e campo que aponta para
      outro museu traz só o número dele. As datas de criação e de
      modificação estão como texto, no formato dia/mês/ano. O cadastro traz
      contatos (e-mail, telefone, nome do responsável), marcados como dado
      pessoal no catálogo. O site pontosdememoria.museus.gov.br e a Brasiliana
      Museus são outros sistemas e não estão aqui.

  - slug: cnefe
    rotulo: Endereços de estabelecimentos do Censo 2022
    subtitulo: Escolas e estabelecimentos de outras finalidades que o recenseador encontrou em cada município
    sem_modelos: true
    contexto: |
      O Eixo 5 do Cultura em Números procura equipamentos culturais que não
      aparecem nos registros administrativos, como centros culturais e
      espaços de artes cênicas, pelo nome dos estabelecimentos que o
      recenseador anotou no Censo 2022. Essa lista é o Cadastro Nacional de
      Endereços para Fins Estatísticos (CNEFE), que o IBGE publica como um
      arquivo por município. O script do eixo baixava os milhares de
      arquivos para o computador de quem o rodava, a cada vez.
    o_que_faz: |
      Baixa do FTP do IBGE o arquivo de cada município, uma UF por vez, e
      guarda cada um como veio. Do conteúdo, leva ao schema seeds só os
      endereços das duas espécies que o eixo usa, a 4 (estabelecimento de
      ensino) e a 6 (estabelecimento de outras finalidades), e só as colunas
      que o eixo lê: o código do endereço, o setor censitário, o CEP, o
      logradouro, as coordenadas e o nome do estabelecimento. Confere, para
      cada UF, se vieram todos os municípios e se o número de endereços
      dessas espécies é o mesmo no arquivo, no staging e no banco. Ainda não
      há tabela de uso final: a busca dos equipamentos culturais pelo nome é
      uma regra do Eixo 5 e vai ser feita na etapa seguinte.
    perguntas:
      - Que estabelecimentos o Censo 2022 encontrou em cada município e setor censitário?
      - Onde fica cada um, pelas coordenadas do Censo?
      - Que estabelecimentos têm no nome um termo ligado a cultura?
    sistemas: [IBGE]
    armadilhas: |
      A espécie 4 é estabelecimento de ensino, e não "estabelecimento em
      funcionamento", como diz o README do eixo: o dicionário do IBGE é a
      referência. A espécie 6 reúne tudo o que não é domicílio, escola,
      saúde, agropecuária, religião ou obra, então um nome de
      estabelecimento ali pode ser de um bar, de uma loja ou de um teatro: a
      tabela não diz quais são culturais. Uma linha é um endereço numa
      espécie, não um estabelecimento. O mesmo código de endereço aparece
      duas vezes quando no endereço há uma escola e um estabelecimento de
      outra finalidade, então o código sozinho não identifica a linha: o
      código junto com a espécie, sim (conferido em Roraima e no Amapá). A
      linha traz um nome só, mesmo quando o IBGE marca que no endereço há
      mais de um estabelecimento (essa marca fica só no arquivo original), e
      o mesmo estabelecimento pode aparecer em endereços vizinhos, que o
      eixo junta quando o nome se repete a menos de 50 metros. O nome é o que o recenseador escreveu, sem acento e sem
      padronização. As coordenadas variam de precisão: a coluna
      nv_geo_coord diz se ela é do endereço, da face de quadra, da
      localidade ou só do setor censitário. O CNEFE é um retrato de 2022 e
      não é atualizado. As outras espécies e colunas do arquivo, como os
      domicílios e os complementos de endereço, ficam só no arquivo
      original guardado no datalakehouse.

  - slug: metadata
    rotulo: Metadados do pipeline
    subtitulo: O que o próprio pipeline registra sobre sua execução
    contexto: |
      Domínio de apoio: guarda o que o pipeline sabe sobre si mesmo. Não
      responde pergunta de política pública, e existe para dar rastreabilidade
      ao resto.
    o_que_faz: |
      Registra informação de execução usada pelos outros domínios para datar e
      rastrear a origem dos registros.
    perguntas:
      - De que arquivo e de que carga veio determinado registro?
    sistemas: [Interno]
