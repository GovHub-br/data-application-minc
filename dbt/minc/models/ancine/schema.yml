version: 2

# Ancine, na estrutura do ADR 0010. ancine.consulta é carregada fora deste
# pipeline, direto da planilha da Ancine; bronze_consulta a copia como está e
# silver_consulta resolve os cabeçalhos e tipa.
models:
  - name: bronze_consulta
    description: >
      Camada Bronze — cópia fiel de ancine.consulta, sem cast, filtro nem join
      (ADR 0010). Todas as colunas chegam como na origem.
      Os cabeçalhos ficam como vieram da planilha (maiúscula, espaço e acento).
    config:
      tags:
        - bronze
        - ancine
    meta:
      openmetadata:
        domain: Cultura.Audiovisual
        tier: Tier.Tier4
        owner: minc-data-engineering

  - name: silver_consulta
    description: >
      Camada Silver / Ancine. Captações de projeto audiovisual registradas
      pela Ancine (`ancine.consulta`), tipadas e com o documento do
      proponente normalizado.

      GRÃO: uma linha por captação. UNIVERSO: as linhas de ancine.consulta
      com data e valor nos formatos esperados e documento que não seja só de
      zeros. Todos os mecanismos ficam.

      PARA QUE SERVE: é a entrada do audiovisual e do FSA na Meta 5, via
      int_ancine_bbagil_salic. Escolher quais mecanismos contam para um
      indicador é da Gold de cada produto.

      ARMADILHAS DE FORMATO, as duas medidas nesta tabela: a data da origem
      é TEXT no padrão AMERICANO M/D/YYYY ('7/12/2007' é 12 de julho, não 7
      de dezembro), e o valor é TEXT no padrão brasileiro ('50.000,00').
      Linha fora desses padrões fica de fora.

      LIMITAÇÕES: a fonte é quase toda CNPJ — proponente pessoa física é, na
      prática, invisível aqui. ancine.consulta é carregada fora deste
      pipeline, direto da planilha da Ancine, então a atualidade do dado
      depende de quem a recarrega. O FSA por planilha da Ancine não está
      nesta tabela.

      ZONA RESTRITA. Carrega CPF/CNPJ e nome do proponente em claro: não
      publicável e proibida em corpus de RAG. A anonimização no momento do
      acesso é responsabilidade do Apache Ranger (ADR 0009).

      ATUALIZAÇÃO: table, recalculada a cada `dbt build`; não há carga
      incremental.
    config:
      tags: [silver, ancine, audiovisual]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — captações de projeto audiovisual (Ancine)'
        origem_dados: 'bronze_consulta'
        governance:
          produto_dados: 'Ancine — audiovisual'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.Proponente
    columns:
      - name: proponente_documento
        description: >
          CPF (11) ou CNPJ (14) de quem recebeu a captação, normalizado com
          LPAD. Documento só de zeros fica de fora.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: proponente_nome
        description: Nome do proponente como a Ancine registra.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: mecanismo
        description: >
          Mecanismo de financiamento como a Ancine registra ('FSA', 'ART1',
          'ART25', 'ART41 (FUNCINES)', 'RENDIMENTOS', 'LEI ESTADUAL'...), sem
          agrupamento.
        data_type: text
      - name: data_captacao
        description: Data da captação, convertida do formato americano da origem.
        data_type: date
        tests:
          - not_null
      - name: valor_captacao
        description: >
          Valor captado, convertido do formato brasileiro da origem. Pode ser
          zero ou negativo como na origem.
        data_type: numeric
        tests:
          - not_null
      - name: no_salic
        description: >
          Número do projeto no SALIC anotado pela Ancine. Não vem do SALIC — é
          coluna da própria `ancine.consulta`.
        data_type: text
