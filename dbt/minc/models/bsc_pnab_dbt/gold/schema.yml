version: 2

models:
  - name: fato_bbagil
    description: >
      Camada Gold — fato final do BB Gestao Agil (PNAB Ciclo 1): valor total
      pago a cada beneficiario final por ente, apos os 13 filtros de negocio
      (silver) e o limiar minimo de R$ 375. Antes gerado em pandas e
      persistido pelo Airflow (upsert incremental); agora e recalculado do
      zero a cada run do dbt (full refresh) a partir das camadas raw/bronze/
      silver -- unico escritor da tabela.
    config:
      meta:
        tags:
          - gold
          - bsc_pnab
          - bbagil
    columns:
      - name: ente_bbagil
        description: id_plano_acao do Transferegov, identifica o ente recebedor.
        tests:
          - not_null
      - name: documento_beneficiario_bbagil
        description: CPF/CNPJ do beneficiario final do pagamento.
        tests:
          - not_null
      - name: valor_transacao_total_bbagil
        description: Soma do valor pago ao beneficiario, ja acima do limiar minimo.
