version: 2

models:
  - name: bbagil_extrato_transacoes
    description: >
      Camada Bronze — extrato do BB Gestao Agil com os campos TEXT do raw
      convertidos para os tipos reais (valor numerico, datas, quantidade de
      subtransacoes).
    config:
      meta:
        tags:
          - bronze
          - bsc_pnab
          - bbagil
    columns:
      - name: ente
        description: id_plano_acao do Transferegov, identifica o ente recebedor.
        tests:
          - not_null
      - name: id
        description: id da transacao no extrato do BB Gestao Agil.
        tests:
          - not_null
      - name: value
        description: Valor da transacao (positivo ou negativo conforme creditdebitindicator).
      - name: creditdebitindicator
        description: "'D' (debito/pagamento) ou 'C' (credito/estorno)."
      - name: subtransactionquantity
        description: >
          Quantidade de sub-lancamentos da transacao. Transacoes com valor > 0
          sao representadas via bbagil_subtransacoes, nao aqui.

  - name: bbagil_subtransacoes
    description: >
      Camada Bronze — sub-lancamentos do BB Gestao Agil com os campos TEXT
      do raw convertidos para os tipos reais.
    config:
      meta:
        tags:
          - bronze
          - bsc_pnab
          - bbagil
    columns:
      - name: ente
        description: id_plano_acao do Transferegov, identifica o ente recebedor.
        tests:
          - not_null
      - name: id_transacao_pai
        description: id da transacao-mae no extrato (bbagil_extrato_transacoes.id).
        tests:
          - not_null
      - name: id
        description: >
          id do sub-lancamento -- sequencial por transacao-mae, nao um
          identificador global (a chave unica e ente+id_transacao_pai+id).
        tests:
          - not_null
      - name: subtransactionaccountabilityname
        description: Status de prestacao de contas do sub-lancamento (por exemplo "Pago").
