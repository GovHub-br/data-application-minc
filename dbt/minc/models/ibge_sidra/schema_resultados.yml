version: 2

# ibge_sidra.resultados: os valores das tabelas do SIDRA que a ibge_agregados_dag
# grava para os agregados da Variable ibge_config. Arquivo à parte do schema.yml
# da pasta, que documenta o catálogo.
models:
  - name: bronze_resultados
    description: >
      Camada Bronze — cópia fiel de ibge_sidra.resultados, sem cast, filtro nem
      join (ADR 0010). Todas as colunas chegam como na origem, em text.
    config:
      tags:
        - bronze
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering

  - name: silver_resultados
    description: >
      Camada Silver — valores das tabelas do SIDRA, tipados. Uma linha por
      agregado, variável, nível territorial, localidade, período e
      classificação, a chave com que a DAG grava.


      PARA QUE SERVE no Eixo 1: a população residente do Censo 2022 por
      município (agregado_id 4709, variavel_id 93, nivel 'N6', periodo '2022'),
      que dá o porte do município nas golds do orçamento (via
      int_ibge_sidra_siconfi).


      Nos Eixos 3 e 5 (issue #170), o contexto territorial de municípios (N6) e
      UFs (N3): população do Censo 2022 (4714) e estimada 2025-2026 (6579),
      situação urbana/rural (9923), cor ou raça (9605), quilombolas (9578),
      indígenas (9718), envelhecimento e idade mediana (9756), alfabetização
      (9543), PIB 2023 (5938) e umbanda e candomblé (9537). Um indicador é um
      agregado, uma variável e as categorias: % de pretos é agregado_id 9605,
      variavel_id 1000093, categorias '86[2777]'.


      Os símbolos do SIDRA no lugar do número: '-' é zero absoluto e vira 0;
      '..', '...' e 'X' viram nulo. O texto original fica em valor_original.
      As estimativas de população (6579) têm 5.571 municípios, um a mais que o
      Censo 2022: o município criado depois do Censo não tem linha nos
      agregados do Censo.
    config:
      tags:
        - silver
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier3
        owner: minc-data-engineering
    tests:
      - unique:
          column_name: >-
            agregado_id || '|' || variavel_id || '|' || nivel || '|' || localidade_id
            || '|' || periodo || '|' || coalesce(categorias, '')
    columns:
      - name: agregado_id
        description: Código da tabela (agregado) do SIDRA. 4709 = Censo 2022, população.
        data_type: integer
        tests:
          - not_null
      - name: variavel_id
        description: Código da variável no agregado. 93 = população residente.
        data_type: integer
        tests:
          - not_null
      - name: variavel_nome
        description: Nome da variável, como o SIDRA devolve.
        data_type: text
      - name: unidade
        description: Unidade de medida da variável (por exemplo, 'Pessoas').
        data_type: text
      - name: nivel
        description: >
          Nível territorial pedido à API: 'N1' Brasil, 'N2' grande região, 'N3' UF,
          'N6' município.
        data_type: text
        tests:
          - not_null
      - name: localidade_id
        description: >
          Código da localidade no nível: no N6, o código IBGE de 7 dígitos do
          município (o mesmo cod_ibge do SICONFI).
        data_type: bigint
        tests:
          - not_null
      - name: localidade_nome
        description: Nome da localidade, como o SIDRA devolve ('Cidade - UF' no N6).
        data_type: text
      - name: periodo
        description: Período do valor, como rótulo ('2022'). Texto, não número.
        data_type: text
        tests:
          - not_null
      - name: valor
        description: >
          O valor, numérico. 0 onde o SIDRA põe '-' (zero absoluto); nulo onde
          põe '..', '...' ou 'X'.
        data_type: numeric
      - name: valor_original
        description: O valor como o SIDRA devolve, com os símbolos.
        data_type: text
      - name: categorias
        description: >
          As categorias da linha só pelos IDs, na sintaxe do SIDRA: '86[2776]'
          (classificação 86, cor ou raça, categoria 2776, branca), ou
          '1714[60024]|2661[32776]' com mais de uma classificação, em ordem de
          ID. Faz parte da chave e é por ela que se filtra um indicador. Nulo no
          agregado sem classificação, como a 4709.
        data_type: text
      - name: classificacoes
        description: >
          As mesmas categorias com os nomes, em JSON
          ('[{"id": "86", "nome": "Cor ou raça", "categoria": {"2776": "Branca"}}]').
          Nulo no agregado sem classificação. Linha gravada antes de 11/2026
          pode trazer o formato antigo, que não é JSON.
        data_type: text
