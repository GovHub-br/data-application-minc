version: 2

# Cultura em Números, produto de dados (Gold, ADR 0010).
#
# CONVENÇÃO DE NOME DESTE PRODUTO: eixo<N>_meta<M>_<nome>, porque é por eixo e
# meta que a coordenação procura um indicador. A Meta 5 (novos entrantes no
# fomento federal) é do eixo 2.
#
# A regra de negócio da Meta 5 vive toda aqui (ADR 0010). Duas golds são a base
# das outras e não respondem pergunta sozinhas: eixo2_meta5_evento_fomento
# (quem conta, por fonte) e eixo2_meta5_primeiro_acesso_agente (a definição de
# novo entrante). Gold lê Gold só dentro do mesmo produto.
#
# A Meta 3 (cotas e reservas da LPG e do PNAB) é eixo2_meta3_*. Duas golds-base:
# eixo2_meta3_perfil_agente (quem é negra, indígena, PCD) e
# eixo2_meta3_pagamento_elegivel (o denominador, 1 linha por pagamento, com as
# flags e o território). As demais leem delas. Migrado da antiga pasta de cotas sem mudança
# de número; o que ainda mistura limpeza com regra está dito em cada description.
models:
  - name: eixo2_meta5_evento_fomento
    description: >
      Camada Gold — Meta 5. Espinha do indicador: um evento por vez que um
      agente cultural recebeu recurso de uma política federal de fomento, já
      com a política classificada. É a tabela que permite perguntar "este
      agente já havia sido contemplado antes?" acima do mecanismo, que é o
      que a pergunta da meta exige. Grão: 1 linha por (documento, mecanismo,
      data, valor).

      Lê int_ancine_bbagil_salic, que só junta as fontes, e concentra a regra
      de negócio (ADR 0010). O que é pagamento efetivo: no extrato do BB
      Ágil, só o débito e fora os dois lados de um estorno (débito e crédito
      da mesma conta, documento e valor); no sublançamento, só o status
      'Pago'. Quem conta: no BB Ágil, fora repasse a ente
      público, devolução ao FNC, transferência ao Banco do Brasil e
      lançamento interno, com a política (LPG, PNAB, LAB) derivada do código
      do programa; na Ancine, só FSA e o fomento federal ao audiovisual
      (fora ART25/ART18, que já entram pelo SALIC); na Rouanet e na Ancine,
      só valor positivo.

      Janelas de observação, muito assimétricas: ROUANET 1993+, AUDIOVISUAL
      2005+, FSA 2011+, LAB/LPG/PNAB 2023+. Por isso a coluna
      ano_inicio_observacao, que a gold anual usa para marcar os anos
      censurados à esquerda.

      O piso de valor (var limiar_valor_fomento, padrão 375) é aplicado sobre
      o TOTAL do agente naquele mecanismo, não por transação, e só ao BB Ágil
      — é lá que existe resíduo de transação que não é repasse de fomento.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — espinha de eventos de acesso a fomento federal'
        origem_dados: 'int_ancine_bbagil_salic'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.AgenteCultural
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do agente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Mecanismo — 'AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB' ou 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: data_evento
        description: Data em que o recurso chegou ao agente.
        data_type: date
        tests:
          - not_null
      - name: ano_evento
        description: Ano civil de data_evento.
        data_type: integer
        tests:
          - not_null
      - name: valor
        description: Valor do evento, em reais.
        data_type: numeric
        tests:
          - not_null
      - name: fonte
        description: "'BB_AGIL', 'SALIC' ou 'ANCINE'."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ANCINE', 'BB_AGIL', 'SALIC']
      - name: ano_inicio_observacao
        description: >
          Primeiro ano em que a fonte daquele mecanismo enxerga qualquer
          coisa: 1993 ROUANET, 2005 AUDIOVISUAL, 2011 FSA, 2023 LAB/LPG/PNAB.
          A gold usa este valor para marcar o ano censurado, em que todo mundo
          parece estreante porque não existe passado observável.
        data_type: integer
        tests:
          - not_null
      - name: tipo_pessoa
        description: "'PF' (11 dígitos) ou 'PJ' (14)."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']

  - name: eixo2_meta5_primeiro_acesso_agente
    description: >
      Camada Gold — Meta 5. Grão fino do indicador de novos entrantes: uma
      linha por (agente × mecanismo), com a data em que ele entrou naquele
      mecanismo e se aquela entrada foi a porta de entrada dele no fomento
      federal como um todo. Substitui primeiro_pagamento_bancario, que
      comparava datas apenas entre LPG e PNAB — num universo de dois
      programas, "não é novo entrante" só conseguia significar "recebeu o
      outro programa antes", e quem aparecia num programa só era sempre
      classificado como novo. Aqui a comparação é cross-mecanismo de
      verdade, e inclui a Rouanet desde 1993.

      Exatamente uma linha por agente tem eh_porta_de_entrada = true;
      empates de data no mesmo dia são desempatados por ordem de mecanismo
      (ROUANET, AUDIOVISUAL, FSA, LAB, LPG, PNAB) para que ninguém conte duas
      vezes.

      É Gold, e não Intermediate, porque não cruza base: aplica a definição
      de novo entrante. Lê eixo2_meta5_evento_fomento, Gold do mesmo produto.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Primeiro Acesso ao Fomento Federal (por agente)'
        origem_dados: 'eixo2_meta5_evento_fomento'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.AgenteCultural
            - MinC.Agentes.PrimeiroAcesso
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: >
          CPF (11) ou CNPJ (14) do agente, normalizado com LPAD. Chave de
          ligação com a lista de contemplados e com as demais fontes de
          evento. NÃO é pseudonimizado — sai em claro, como toda coluna de
          documento neste domínio hoje.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Mecanismo de fomento — 'AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB'
          ou 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: tipo_pessoa
        description: "'PF' quando o documento tem 11 dígitos, 'PJ' quando tem 14."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: data_primeiro_acesso_mecanismo
        description: Primeiro evento observado do agente neste mecanismo.
        data_type: date
        tests:
          - not_null
      - name: data_ultimo_acesso_mecanismo
        description: >
          Último evento observado do agente neste mecanismo. Não entra no
          indicador de primeiro acesso; serve para medir por quanto tempo o
          agente permaneceu naquele mecanismo.
        data_type: date
        tests:
          - not_null
      - name: ano_entrada_mecanismo
        description: >
          Ano de data_primeiro_acesso_mecanismo. É o ano de entrada NESTE
          mecanismo — não confundir com ano_primeiro_acesso_geral, que é o ano
          de entrada no fomento federal. Os dois coincidem só na linha em que
          eh_porta_de_entrada é verdadeiro.
        data_type: integer
        tests:
          - not_null
      - name: data_primeiro_acesso_geral
        description: >
          Primeiro evento do agente em QUALQUER mecanismo. É a data que
          define se ele é novo entrante.
        data_type: date
        tests:
          - not_null
      - name: ano_primeiro_acesso_geral
        description: Ano de data_primeiro_acesso_geral.
        data_type: integer
        tests:
          - not_null
      - name: qtd_mecanismos_agente
        description: Em quantos mecanismos distintos o agente já recebeu recurso.
        data_type: bigint
        tests:
          - not_null
      - name: qtd_eventos
        description: >
          Quantos eventos de fomento o agente teve neste mecanismo. Um
          pagamento parcelado conta várias vezes — é contagem de lançamento,
          não de projeto nem de contrato.
        data_type: bigint
        tests:
          - not_null
      - name: valor_total
        description: >
          Soma dos valores dos eventos do agente neste mecanismo, em reais.
          Já reflete o piso de eixo2_meta5_evento_fomento (var limiar_valor_fomento),
          que descarta o agente inteiro do mecanismo quando o total fica
          abaixo dele — nenhuma linha aqui tem total abaixo do piso no BB Ágil.
        data_type: numeric
        tests:
          - not_null
      - name: eh_porta_de_entrada
        description: >
          Verdadeiro no mecanismo pelo qual o agente entrou no fomento
          federal. Exatamente uma linha por agente.
        data_type: boolean
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: categoria_primeiro_acesso
        description: "'Sim' quando esta linha é a porta de entrada do agente; 'Não' caso contrário."
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sim', 'Não']
      - name: entrada_em_ano_censurado
        description: >
          Verdadeiro quando a entrada caiu no primeiro ano observável daquele
          mecanismo (2023 para LAB/LPG/PNAB). Descritivo: para a LAB isso é
          corte de janela, para LPG e PNAB é o ano de nascimento do programa —
          ver ano_censurado em eixo2_meta5_primeiro_acesso_anual, que separa os dois.
        data_type: boolean
        tests:
          - not_null

  - name: eixo2_meta5_primeiro_acesso_anual
    description: >
      Camada Gold — Meta 5. A série que responde às perguntas 1, 2.1 e 2.2:
      percentual anual de agentes de primeiro acesso, no total
      (programa_fomento = 'TODOS') e por mecanismo (AUDIOVISUAL, FSA, LAB,
      LPG, PNAB, ROUANET). Grão: 1 linha por (ano × mecanismo) mais o roll-up.

      A linha 'TODOS' não é a soma das linhas por mecanismo — um agente
      atendido por dois mecanismos no mesmo ano conta uma vez só nela.

      Os percentuais são TETO, não estimativa pontual: falta o FSA por
      planilha da Ancine (fora do banco) e a Lei Aldir Blanc I emergencial
      de 2020-2021 (não existe em nenhuma fonte do banco). Fonte ausente
      só transforma veterano em falso novo entrante, nunca o contrário,
      então o valor real é menor ou igual ao publicado.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso, serie_anual]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Percentual anual de proponentes de primeiro acesso'
        origem_dados: 'eixo2_meta5_evento_fomento + eixo2_meta5_primeiro_acesso_agente'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.PrimeiroAcesso
            - MinC.Agentes.AgenteCultural
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: ano
        description: Ano civil do evento de recebimento de recurso.
        data_type: integer
        tests:
          - not_null
      - name: programa_fomento
        description: Mecanismo, ou 'TODOS' para o roll-up de todos os mecanismos.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET', 'TODOS']
      - name: agentes_atendidos
        description: Agentes distintos que receberam recurso do mecanismo naquele ano (denominador).
        data_type: bigint
        tests:
          - not_null
      - name: novos_entrantes
        description: >
          Destes, quantos tiveram ali o primeiro acesso a qualquer fomento
          federal observável (numerador).
        data_type: bigint
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: ja_contemplados_antes
        description: agentes_atendidos - novos_entrantes.
        data_type: bigint
        tests:
          - not_null
      - name: percentual_primeiro_acesso
        description: novos_entrantes / agentes_atendidos, em %.
        data_type: numeric
        tests:
          - not_null
      - name: ano_censurado
        description: >
          Verdadeiro quando a JANELA DE EXTRAÇÃO cortou passado que existe na
          origem: Rouanet em 1993 (a lei é de 1991) e o primeiro ano de cada
          trilha da Ancine, cujo piso duro em 2005-01-03 tem cara de extrato
          cortado e não de início de política. NÃO marca o primeiro ano de um
          programa novo: LPG e PNAB nasceram em 2023, nenhuma das 22.371
          contas deles é anterior, e a comparação contra a Rouanet rodou. A
          LAB também não é censurada — o que ficou de fora dela é a Aldir
          Blanc emergencial, que saiu do escopo por decisão de negócio.
        data_type: boolean
        tests:
          - not_null
      - name: ano_parcial
        description: >
          Verdadeiro no último ano com dado, que ainda não terminou. O
          percentual de um ano parcial vem deprimido — menos gente nova
          acumulada — e não deve ser comparado com anos fechados.
        data_type: boolean
        tests:
          - not_null

  - name: eixo2_meta5_trajetoria_fomento_direto_rouanet
    description: >
      Camada Gold — Meta 5, pergunta 2.3: há novos entrantes pelo fomento
      direto (LAB/LPG/PNAB) que depois acessaram a Lei Rouanet? Grão: 1
      linha por (trajetória × tipo de pessoa × mecanismo de porta de entrada).

      Mede as duas direções. DIRETO_DEPOIS_ROUANET responde a pergunta 2.3
      literalmente. ROUANET_ANTES_DIRETO é a direção oposta e vale como
      controle do indicador inteiro: são agentes que já acessavam recurso
      público federal antes de 2023 e que, sem a fonte do SALIC, seriam
      contados como novos entrantes do fomento direto.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso, rouanet]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Trajetória entre fomento direto e Rouanet'
        origem_dados: 'eixo2_meta5_primeiro_acesso_agente'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.PrimeiroAcesso
            - MinC.Politicas.Rouanet
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: trajetoria
        description: >
          'SO_DIRETO', 'SO_ROUANET', 'DIRETO_DEPOIS_ROUANET',
          'ROUANET_ANTES_DIRETO', 'MESMO_DIA' ou 'SO_AUDIOVISUAL' (so na trilha da Ancine,
          fora da pergunta 2.3).
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SO_DIRETO', 'SO_ROUANET', 'SO_AUDIOVISUAL', 'DIRETO_DEPOIS_ROUANET', 'ROUANET_ANTES_DIRETO', 'MESMO_DIA']
      - name: tipo_pessoa
        description: "'PF' ou 'PJ'."
        data_type: text
        tests:
          - not_null
      - name: mecanismo_porta_entrada
        description: >
          Mecanismo pelo qual o agente entrou no fomento federal. Necessário
          para separar percurso de novidade: DIRETO_DEPOIS_ROUANET com porta
          em AUDIOVISUAL ou FSA é agente que já acessava recurso federal antes
          de 2023, e portanto não responde à 2.3. É NULL só para o balde
          SO_AUDIOVISUAL quando o agente não tem porta única identificada.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
      - name: agentes
        description: Quantidade de agentes distintos naquela trajetória.
        data_type: bigint
        tests:
          - not_null
      - name: primeira_entrada_direto
        description: >
          Data de entrada no fomento direto (LAB/LPG/PNAB) do agente mais
          antigo do grupo. NULL nos baldes que não têm fomento direto
          (SO_ROUANET, SO_AUDIOVISUAL). Serve para situar o grupo no tempo,
          não para comparar taxas — para isso use
          eixo2_meta5_conversao_direto_rouanet_coorte, que controla tempo de exposição.
        data_type: date
      - name: ultima_entrada_direto
        description: >
          Data de entrada no fomento direto do agente mais recente do grupo.
          Junto com primeira_entrada_direto delimita a janela em que o grupo
          se formou. NULL nos mesmos baldes.
        data_type: date
      - name: primeira_entrada_rouanet
        description: >
          Data de captação na Rouanet do agente mais antigo do grupo. NULL nos
          baldes sem Rouanet (SO_DIRETO, SO_AUDIOVISUAL).
        data_type: date
      - name: ultima_entrada_rouanet
        description: >
          Data de captação na Rouanet do agente mais recente do grupo. NULL nos
          mesmos baldes.
        data_type: date
      - name: media_dias_entre_mecanismos
        description: >
          Média, em dias, da distância ABSOLUTA entre a entrada no fomento
          direto e a captação na Rouanet, com uma casa decimal. Por ser em
          módulo, não distingue direção — mede quanto tempo separa os dois
          acessos, não qual veio primeiro; a direção está em trajetoria. Só
          considera agentes com as duas datas, então é NULL em SO_DIRETO,
          SO_ROUANET e SO_AUDIOVISUAL, e 0 em MESMO_DIA.
        data_type: numeric

  - name: eixo2_meta5_conversao_direto_rouanet_coorte
    description: >
      Camada Gold — Meta 5, pergunta 2.3 com tempo de exposição controlado:
      dos agentes que ENTRARAM no fomento federal pelo fomento direto
      (LAB/LPG/PNAB), quantos depois captaram na Lei Rouanet? Grão: 1 linha
      por (coorte de entrada × porta de entrada × tipo de pessoa).

      Existe separada de eixo2_meta5_trajetoria_fomento_direto_rouanet porque a contagem
      bruta é enganosa: o fomento direto nasceu em 2023, então cada coorte
      teve uma janela diferente para converter. converteram_ate_12m dá a
      todas a mesma janela; coorte_com_12m_completos marca quais coortes já
      a cumpriram por inteiro — nas que não cumpriram, a taxa é piso.

      Denominador é porta de entrada, não passagem: quem já aparecia na
      trilha da Ancine antes de 2023 não é novo entrante e fica fora.
      Numerador é captação real na Rouanet, não projeto protocolado nem
      aprovado.
    config:
      tags: [gold, agentes, meta5, primeiro_acesso, rouanet]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Conversão do fomento direto para a Rouanet, por coorte'
        origem_dados: 'eixo2_meta5_primeiro_acesso_agente'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.PrimeiroAcesso
            - MinC.Politicas.Rouanet
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: coorte_entrada
        description: Ano em que o agente entrou no fomento federal pela primeira vez.
        data_type: integer
        tests:
          - not_null
      - name: porta_de_entrada
        description: "Mecanismo de entrada: 'LAB', 'LPG' ou 'PNAB'."
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LAB', 'LPG', 'PNAB']
      - name: tipo_pessoa
        description: "'PF' ou 'PJ'."
        data_type: text
        tests:
          - not_null
      - name: entrantes
        description: Agentes distintos que entraram por aquela porta naquela coorte.
        data_type: bigint
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: converteram_rouanet
        description: >
          Quantos deles captaram na Rouanet em data posterior à entrada.
          Nunca maior que entrantes.
        data_type: bigint
        tests:
          - not_null
      - name: converteram_ate_12m
        description: >
          Subconjunto de converteram_rouanet que captou em até 365 dias.
          Métrica comparável entre coortes.
        data_type: bigint
        tests:
          - not_null
      - name: pct_converteram
        description: >
          converteram_rouanet / entrantes, em %, com três casas. NÃO é
          comparável entre coortes: a coorte de 2023 teve mais tempo para
          converter que a de 2025. Para comparar, use
          pct_converteram_ate_12m.
        data_type: numeric
        tests:
          - not_null
      - name: pct_converteram_ate_12m
        description: >
          converteram_ate_12m / entrantes, em %, com três casas. É a taxa
          comparável entre coortes, porque dá a todas a mesma janela de 365
          dias. Nas coortes com coorte_com_12m_completos falso ela ainda é
          piso — parte dos agentes não teve os 12 meses inteiros.
        data_type: numeric
        tests:
          - not_null
      - name: mediana_dias_ate_rouanet
        description: >
          Mediana de dias entre a entrada no fomento direto e a captação na
          Rouanet, considerando só quem converteu. PERCENTILE_DISC, então é um
          valor que existe nos dados, não uma interpolação. NULL quando
          ninguém do grupo converteu.
        data_type: integer
      - name: coorte_com_12m_completos
        description: >
          Verdadeiro quando o agente de entrada MAIS RECENTE da coorte já
          completou 365 dias de exposição. Onde é falso, converteram_ate_12m e
          pct_converteram_ate_12m são piso, não taxa final — parte da coorte
          ainda está dentro da janela de conversão.
        data_type: boolean
        tests:
          - not_null

  - name: eixo2_meta5_primeiro_acesso_contemplados
    description: >
      Camada Gold — Meta 5. O mesmo indicador de novos entrantes, restrito a
      quem aparece nas listas oficiais de contemplados dos editais (LPG e
      PNAB), em vez de a todo agente visto recebendo dinheiro. Grão: 1 linha
      por (programa × categoria de primeiro acesso).

      A classificação vem de eixo2_meta5_primeiro_acesso_agente, então já é
      cross-mecanismo e já considera a Rouanet desde 1993.

      Cobertura parcial e medida: a interseção entre lista de contemplados e
      extrato bancário fica em torno de 46% na LPG e 89% no PNAB. A causa
      não é atraso de pagamento nem filtro agressivo — o BB Ágil só enxerga
      contas administradas pelo Banco do Brasil, e o município frequentemente
      declara ter pago um contemplado cujo pagamento não passou por lá.
      Contemplado sem evento observável fica de fora, sem fallback
      autodeclarado.
    config:
      tags: [gold, agentes, bbagil, meta5, contemplados, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Novos Entrantes entre contemplados de edital'
        origem_dados: 'eixo2_meta5_primeiro_acesso_agente + int_ancine_bbagil_salic_transferegov'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Gold
          glossary:
            - MinC.Agentes.Contemplado
            - MinC.Agentes.PrimeiroAcesso
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']
      - name: categoria_primeiro_acesso
        description: >
          'Sim' — foi por este mecanismo que o agente entrou no fomento
          federal (novo entrante); 'Não' — já havia recebido recurso antes,
          em qualquer mecanismo observável.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sim', 'Não']
      - name: total_proponentes
        description: Contagem distinta de contemplados com evento observável, por categoria.
        data_type: bigint
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.Contemplado
        tests:
          - not_null
      - name: percentual
        description: >
          Percentual da categoria sobre o total de contemplados com evento
          observável no mesmo programa_fomento (cada programa soma 100%).
        data_type: numeric
        tests:
          - not_null

  - name: eixo2_meta3_perfil_agente
    description: >
      Perfil unificado LPG + PNAB — une as 5 silvers de agentes
      (silver_agentes_pf, _pj, _coletivos, _pnab_pf, _pnab_pj). Deduplicado por identificador_unico
      (1 linha por documento, não por tipo de proponente, para permitir join
      1:1 com pagamentos): prioriza, na desambiguação, a linha que já traz
      raça preenchida, depois por origem. Normaliza raça/cor em 5 categorias
      (negra, indigena, branca, amarela, nao_declarada) via regex sobre texto
      sem acento. Deriva as flags flag_negra, flag_indigena (raça normalizada
      OU campo indígena explícito) e is_pcd. cidade/uf só existem nas fontes
      LPG (as silvers do PNAB não trazem localização do agente) e ficam NULL para
      PNAB; são propagadas até aqui exclusivamente para viabilizar a 4ª cota
      territorial (só aplicável à LPG). chave_municipio_uf (cidade+UF sem
      acento, minúsculo) é a chave de join com silver_territorio_municipio; fica NULL
      quando não há localização — nesse caso o agente não é classificável pela
      cota territorial. Mistura limpeza (união e dedup das cinco silvers) com regra de
      produto (as flags de quem conta em cada cota); separar a limpeza numa silver é dívida
      registrada no PR da migração.

    config:
      tags: [gold, cotas, meta3]
      meta:
        status: Active
        origem_dados: 'silver_agentes_pf + silver_agentes_pj + silver_agentes_coletivos + silver_agentes_pnab_pf + silver_agentes_pnab_pj'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold", "PII.Sensitive"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: identificador_unico
        description: >
          CPF/CNPJ normalizado do agente — chave primária desta dimensão e a
          entidade de junção 1:1 com os fatos de pagamento. A dedup por este
          campo (e não por tipo_proponente) existe justamente para garantir
          que um pagamento nunca se multiplique ao casar com o perfil.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]
        tests:
          - unique
          - not_null

      - name: tipo_proponente
        description: >
          Natureza do proponente na linha vencedora da dedup (pf, pj ou
          coletivo). Como a dedup é por documento, um mesmo agente que apareceu
          como PF e como coletivo é representado por uma linha só.
        data_type: text

      - name: origem
        description: >
          Política de onde veio a linha vencedora da dedup ('lpg' ou 'pnab').
          Não significa que o agente só participou dessa política — significa
          que essa foi a fonte escolhida na desambiguação.
        data_type: text

      - name: raca_bruto
        description: >
          Raça/cor autodeclarada em texto livre, preservada da fonte para
          auditoria da normalização. Cuidado: a semântica muda por origem
          (indivíduo no PNAB PF, corpo diretivo na LPG PJ, maioria no coletivo).
        data_type: text
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: raca_normalizada
        description: >
          Raça/cor reduzida a 5 categorias por regex sobre o texto sem acento:
          'negra' (preta/parda/negra), 'indigena', 'branca', 'amarela' e
          'nao_declarada' — que absorve vazio, 'nan' e qualquer grafia não
          reconhecida. É a base do numerador das cotas raciais.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary: ["MinC.Qualificadores.RacaNormalizada"]
        tests:
          - accepted_values:
              arguments:
                values: ['negra', 'indigena', 'branca', 'amarela', 'nao_declarada']

      - name: cidade
        description: >
          Município do agente em texto livre. Preenchido só para agentes LPG —
          NULL para PNAB, que não coleta localização do agente.
        data_type: text

      - name: uf
        description: UF do agente, sigla. NULL para PNAB, mesma razão de cidade.
        data_type: text

      - name: chave_municipio_uf
        description: >
          Chave de junção com silver_territorio_municipio no formato
          "municipio_sem_acento|uf_sem_acento", ambos em minúsculo. NULL quando
          cidade ou UF faltam — e agente sem esta chave não é classificável
          pela cota territorial, entrando como não-coberto, não como fora da cota.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.CodigoIBGE"]

      - name: flag_negra
        description: >
          True quando raca_normalizada = 'negra'. Numerador da cota racial de
          25% (meta legal mínima).
        data_type: boolean
        meta:
          openmetadata: {}

      - name: flag_indigena
        description: >
          True quando raca_normalizada = 'indigena' OU o campo indigena_bruto do
          PNAB indica sim. É um OR de propósito: a autodeclaração indígena do
          PNAB é um campo separado da raça/cor, e ignorá-lo subestimaria a cota
          de 10%.
        data_type: boolean
        meta:
          openmetadata:
            tags:
              - PII.Sensitive

      - name: is_pcd
        description: >
          True quando pcd_bruto indica sim (sim/s/1/true, sem acento). Numerador
          da cota de 5% para pessoas com deficiência. No fato chama-se flag_pcd.
        data_type: boolean
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

  - name: eixo2_meta3_identificador_agente
    description: >
      Chaves distintas de agentes (identificador_unico, tipo_proponente,
      origem) extraídas de eixo2_meta3_perfil_agente — usada para teste de
      unicidade e para contagem secundária de proponentes.

    config:
      tags: [gold, cotas, meta3]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_perfil_agente'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: identificador_unico
        description: >
          CPF/CNPJ normalizado. Como o perfil já é deduplicado por este campo,
          o teste de unicidade aqui é uma segunda barreira: se falhar, a dedup
          do perfil quebrou e todo cálculo de cota a jusante está inflado.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]
        tests:
          - unique
          - not_null

      - name: tipo_proponente
        description: Natureza do proponente (pf, pj, coletivo), herdada do perfil.
        data_type: text

      - name: origem
        description: Política de origem da linha ('lpg' ou 'pnab'), herdada do perfil.
        data_type: text

  - name: eixo2_meta3_diag_valores_cortados
    description: >
      Diagnóstico de valores por magnitude — audita o que o teto de R$10M do
      parse_valor cortou (valores acima do teto viram NULL em valor_pago_num
      e saem do denominador de valor). Classifica cada linha de
      silver_contemplados_lpg/pnab em faixas (sem valor; até R$10M/ok; R$10M–100M
      cortado; R$100M–1tri cortado; acima de 1tri cortado) e conta por origem.

    config:
      tags: [gold, cotas, meta3, diagnostico]
      meta:
        status: Active
        origem_dados: 'silver_contemplados_lpg + silver_contemplados_pnab'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: origem
        description: Política de origem das linhas contadas ('lpg' ou 'pnab').
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['lpg', 'pnab']

      - name: faixa_valor
        description: >
          Faixa de magnitude do valor bruto: sem valor, até R$10M (ok), e as
          três faixas cortadas pelo teto (R$10M–100M, R$100M–1tri, acima de
          1tri). Valor absurdo em geral é erro de parsing da planilha.
        data_type: text

      - name: qtd
        description: Quantidade de linhas naquela faixa e origem.
        data_type: bigint

  - name: eixo2_meta3_pagamento_elegivel
    description: >
      1 linha por pagamento (payment-first) — base do denominador das cotas.
      Parte de silver_contemplados_unif com LEFT JOIN para eixo2_meta3_perfil_agente
      e silver_territorio_municipio, preservando todos os pagamentos (inclusive
      órfãos sem perfil casado, marcados por tem_perfil=false, e pagamentos
      sem ano derivado, 'sem_ano'). Carrega flag_negra, flag_indigena, flag_pcd
      e, exclusivo da LPG, flag_territorio_vulneravel: true quando o município
      do agente casa (por nome + UF normalizados) com o crosswalk IBGE de
      zonas periféricas (silver_territorio_municipio); NULL quando o agente não tem
      cidade informada (majoritariamente PNAB). O casamento por nome cobre
      cerca de 47,5% dos agentes com perfil — grafias divergentes ainda não
      refinadas. Meta da cota territorial: 20% (ver eixo2_meta3_distribuicao_cotas_lpg).

    config:
      tags: [gold, cotas, meta3]
      meta:
        status: Active
        origem_dados: 'silver_contemplados_unif + eixo2_meta3_perfil_agente + silver_territorio_municipio'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold", "PII.Sensitive"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: identificador_unico
        description: >
          Documento normalizado do agente (só dígitos). É a entidade `foreign`
          agente_documento do semantic model; NULL quando o documento veio
          mascarado na origem.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]
        tests:
          # Integridade da entidade de junção do MetricFlow: todo pagamento que
          # se declara casado com perfil (tem_perfil) precisa mesmo existir na
          # dimensão. O `where` é obrigatório — o fato preserva órfãos de
          # propósito (payment-first), então o teste sem filtro falharia por
          # design, não por defeito.
          - relationships:
              arguments:
                to: ref('eixo2_meta3_perfil_agente')
                field: identificador_unico
              config:
                where: "tem_perfil"

      - name: valor_pago_num
        description: >
          Valor pago em reais, com o teto de R$10M já aplicado no bronze. É a
          medida somada em todas as cotas — o denominador e, filtrado pelas
          flags, também os numeradores.
        data_type: numeric
        meta:
          openmetadata: {}

      - name: ano_final
        description: >
          Ano do edital resolvido pela cascata de datação, ou 'sem_ano'. Os
          'sem_ano' entram no total geral mas ficam fora de qualquer recorte
          anual — ver cobertura_temporal_pct em eixo2_meta3_cobertura_pagamento.
        data_type: text

      - name: origem_ano
        description: >
          Etapa da cascata que resolveu ano_final, do mais preciso ao mais
          frágil: nome_edital, anexo_edital, nome_arquivo, sem_ano.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Qualificadores.OrigemDoAno"]
        tests:
          - accepted_values:
              arguments:
                values: ['nome_edital', 'anexo_edital', 'nome_arquivo', 'sem_ano']

      - name: origem
        description: Política de origem do pagamento ('lpg' ou 'pnab').
        data_type: text

      - name: chave_anonimizada
        description: >
          True quando o documento veio mascarado na planilha. Explica por que
          tem_perfil é false sem que isso indique falha de casamento.
        data_type: boolean

      - name: nome_edital
        description: Nome do edital de origem do pagamento.
        data_type: text
        meta:
          openmetadata:

      - name: nome_programa
        description: Rótulo do programa ('LPG' ou 'PNAB') para leitura humana.
        data_type: text

      - name: anexo_id
        description: >
          Anexo do relatório de gestão que originou o pagamento — permite
          rastrear qualquer linha do fato de volta à planilha exata.
        data_type: text

      - name: nome_arquivo
        description: Nome do xlsx de origem, preservado para rastreio.
        data_type: text

      - name: tem_perfil
        description: >
          True quando o pagamento casou com eixo2_meta3_perfil_agente. É o
          divisor de águas da leitura: as cotas calculadas "sobre com perfil"
          usam só estas linhas; as calculadas "sobre total" incluem os órfãos.
        data_type: boolean

      - name: flag_negra
        description: >
          Agente autodeclarado negro (preto ou pardo). Numerador da cota de 25%.
          False também quando não há perfil — leia sempre junto de tem_perfil.
        data_type: boolean
        meta:
          openmetadata:

      - name: flag_indigena
        description: >
          Agente autodeclarado indígena, por raça normalizada OU pelo campo
          indígena do PNAB. Numerador da cota de 10%.
        data_type: boolean
        meta:
          openmetadata:
            tags:
              - PII.Sensitive

      - name: flag_pcd
        description: >
          Agente autodeclarado pessoa com deficiência (is_pcd no perfil).
          Numerador da cota de 5%.
        data_type: boolean
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: agente_cidade
        description: >
          Município do agente, propagado do perfil. Preenchido só para LPG —
          NULL no PNAB, que não coleta localização.
        data_type: text

      - name: agente_uf
        description: UF do agente, propagada do perfil. NULL no PNAB.
        data_type: text

      - name: tem_territorio
        description: >
          True quando o município do agente casou com o crosswalk IBGE. Separa
          "não é território vulnerável" de "não deu para saber" — sem esta
          coluna, os dois virariam false e subestimariam a cota territorial.
        data_type: boolean

      - name: flag_territorio_vulneravel
        description: >
          True quando o município do agente tem ao menos um setor censitário
          FCU (zona periférica). Numerador da 4ª cota, meta 20%, EXCLUSIVA da
          LPG. NULL quando o agente não tem cidade informada. Cobertura atual
          do casamento por nome: ~47,5% dos agentes com perfil — subestima a
          cota, não a superestima.
        data_type: boolean
        meta:
          openmetadata:

  - name: eixo2_meta3_cobertura_pagamento
    description: >
      Cobertura por ano — teto de confiabilidade das cotas; leitura recomendada
      antes de consultar as tabelas de distribuição de cotas. Por ano
      (ano_final, com 'sem_ano' quando não há ano derivado), reporta
      quantidade de pagamentos, pessoas distintas (documentos, já excluindo
      mascarados), pessoas com perfil casado, valor total e valor com perfil,
      e três percentuais (0–100): cobertura_pessoas_pct (pessoas com perfil
      sobre o total de pessoas), cobertura_valor_pct (valor com perfil sobre
      valor total) e cobertura_temporal_pct (valor com ano derivado sobre
      valor total).

    config:
      tags: [gold, cotas, meta3, qualidade]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_pagamento_elegivel'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: ano_final
        description: >
          Ano do edital, ou 'sem_ano'. A linha 'sem_ano' é a mais importante
          desta tabela: mede quanto dinheiro não pôde ser atribuído a um ano.
        data_type: text

      - name: qtd_pagamentos
        description: Número de linhas de pagamento no ano.
        data_type: bigint

      - name: qtd_pessoas
        description: >
          Documentos distintos no ano, já excluindo os mascarados. Não é
          "pessoas" no sentido estrito — um CNPJ conta como um.
        data_type: bigint

      - name: qtd_pessoas_com_perfil
        description: Subconjunto de qtd_pessoas que casou com o perfil de raça/PCD.
        data_type: bigint

      - name: valor_total
        description: Soma de valor_pago_num no ano, incluindo pagamentos sem perfil.
        data_type: numeric
        meta:
          openmetadata:

      - name: valor_com_perfil
        description: >
          Soma de valor_pago_num restrita a pagamentos com perfil casado. É o
          denominador honesto das cotas — o único sobre o qual a proporção
          demográfica é mensurável.
        data_type: numeric

      - name: cobertura_pessoas_pct
        description: >
          qtd_pessoas_com_perfil / qtd_pessoas, em 0–100. Mede quanto do público
          é demograficamente conhecido.
        data_type: numeric

      - name: cobertura_valor_pct
        description: >
          valor_com_perfil / valor_total, em 0–100. Mais relevante que a
          cobertura por pessoas, porque as cotas são ponderadas por valor.
        data_type: numeric

      - name: cobertura_temporal_pct
        description: >
          Valor com ano derivado / valor total, em 0–100. Percentual baixo aqui
          invalida qualquer leitura por ano, mesmo que a cobertura de perfil
          esteja boa.
        data_type: numeric

  - name: eixo2_meta3_distribuicao_cotas_lpg
    description: >
      Cotas SOMENTE LPG, via macro compartilhada distribuicao_cotas (mesma
      lógica de eixo2_meta3_distribuicao_cotas_pnab, sem duplicar SQL). Valor ponderado
      (não por contagem de agentes) por ano, para 4 grupos com meta legal
      mínima: negra 25%, indígena 10%, PCD 5%, território vulnerabilizado
      (periférico) 20% — só a LPG tem a cota territorial, pois depende de
      flag_territorio_vulneravel (exige cidade/UF do agente). Reporta o
      percentual do grupo sobre o valor total do ano E sobre o valor
      total-com-perfil, além do veredito ('alcancada'/'descumprida') comparando
      o percentual sobre valor-com-perfil contra a meta.

    config:
      tags: [gold, cotas, meta3, lpg, entrega]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_pagamento_elegivel'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: programa
        description: Programa da linha. Constante 'LPG' neste modelo.
        data_type: text

      - name: ano_final
        description: Ano do edital, ou 'sem_ano' para o bloco sem datação.
        data_type: text

      - name: grupo
        description: >
          Grupo com cota legal. Na LPG são 4, incluindo a territorial, que não
          existe no PNAB por falta de localização do agente.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['negra', 'indigena', 'pcd', 'territorio_vulneravel']

      - name: valor_grupo
        description: >
          Soma de valor_pago_num dos pagamentos cuja flag do grupo é true.
          Numerador da cota, ponderado por dinheiro e não por número de agentes.
        data_type: numeric
        meta:
          openmetadata:

      - name: valor_total_ano
        description: >
          Valor total do ano, incluindo pagamentos SEM perfil. Denominador
          otimista: a cota calculada sobre ele é sempre subestimada.
        data_type: numeric

      - name: valor_total_com_perfil_ano
        description: >
          Valor do ano restrito a pagamentos com perfil casado. É o denominador
          honesto e o que define o veredito de status_sobre_com_perfil.
        data_type: numeric

      - name: pct_sobre_total
        description: >
          valor_grupo / valor_total_ano, em 0–100. Piso da estimativa — trata
          todo pagamento sem perfil como se fosse fora da cota.
        data_type: numeric

      - name: pct_sobre_com_perfil
        description: >
          valor_grupo / valor_total_com_perfil_ano, em 0–100. É o percentual
          comparado com a meta legal, e o que deve ser citado.
        data_type: numeric

      - name: qtd_agentes_grupo
        description: >
          Documentos distintos no grupo. Contagem secundária, informativa: a
          cota é medida por valor, não por cabeça.
        data_type: bigint

      - name: meta_minima_pct
        description: >
          Meta legal mínima do grupo, em 0–100: negra 25, indígena 10, PCD 5,
          território vulnerabilizado 20.
        data_type: numeric

      - name: status_sobre_com_perfil
        description: >
          Veredito comparando pct_sobre_com_perfil com meta_minima_pct.
          'alcancada' ou 'descumprida'. Só é interpretável junto da cobertura
          do ano — cobertura baixa torna o veredito frágil nas duas direções.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['alcancada', 'descumprida']

  - name: eixo2_meta3_distribuicao_cotas_pnab
    description: >
      Cotas SOMENTE PNAB, via macro compartilhada distribuicao_cotas. 3 grupos
      com meta legal mínima (negra 25%, indígena 10%, PCD 5%), sem a cota
      territorial — flag_territorio_vulneravel exige cidade/UF do agente, que
      o lado-valor do PNAB (listas/bbágil) não traz. Ressalva (Diagnóstico 4):
      enquanto o lado-valor do PNAB vier das listas de contemplados, o
      denominador mede o valor RECEBIDO pelos entes (repasse, ~R$2,7bi), não o
      valor efetivamente PAGO a pessoas (~R$447mi). Quando eixo2_meta3_pagamento_bbagil
      estiver ativo, este modelo deve passar a ler o valor pago real.

    config:
      tags: [gold, cotas, meta3, pnab, entrega]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_pagamento_elegivel'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: programa
        description: Programa da linha. Constante 'PNAB' neste modelo.
        data_type: text

      - name: ano_final
        description: Ano do edital, ou 'sem_ano'.
        data_type: text

      - name: grupo
        description: >
          Grupo com cota legal. No PNAB são 3 — sem a territorial, que exige
          localização do agente inexistente nesta fonte.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['negra', 'indigena', 'pcd']

      - name: valor_grupo
        description: >
          Soma de valor_pago_num do grupo. ATENÇÃO: hoje mede repasse recebido
          por entes, não pagamento a pessoas — ver a ressalva do modelo.
        data_type: numeric
        meta:
          openmetadata:

      - name: valor_total_ano
        description: Valor total do ano, incluindo pagamentos sem perfil.
        data_type: numeric

      - name: valor_total_com_perfil_ano
        description: Valor do ano restrito a pagamentos com perfil casado.
        data_type: numeric

      - name: pct_sobre_total
        description: valor_grupo / valor_total_ano, em 0–100. Piso da estimativa.
        data_type: numeric

      - name: pct_sobre_com_perfil
        description: >
          valor_grupo / valor_total_com_perfil_ano, em 0–100. É o percentual
          comparado com a meta legal.
        data_type: numeric

      - name: qtd_agentes_grupo
        description: Documentos distintos no grupo, contagem informativa.
        data_type: bigint

      - name: meta_minima_pct
        description: "Meta legal mínima em 0–100: negra 25, indígena 10, PCD 5."
        data_type: numeric

      - name: status_sobre_com_perfil
        description: >
          Veredito 'alcancada'/'descumprida' comparando pct_sobre_com_perfil
          com a meta. Herda a ressalva do denominador do PNAB.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['alcancada', 'descumprida']

  # ---------------------------------------------------------------------------
  # DESABILITADOS — aguardam a extração bbágil gerar bsc_pnab.fato_bbagil
  # ---------------------------------------------------------------------------
  - name: eixo2_meta3_pagamento_bbagil
    description: >
      [MODELO DESABILITADO — config(enabled=false)] Desabilitado junto com
      bronze_fato_bbagil, até a extração bbágil rodar. Reativar
      (enabled=true) junto.

      Fato de pagamentos via extrato bancário (valor PAGO ao beneficiário
      final) cruzado com o perfil de raça/PCD. Espelha eixo2_meta3_pagamento_elegivel
      (payment-first, LEFT JOIN, preserva órfãos sem perfil), mas usa o bbágil
      como lado-valor — o denominador correto para as cotas (pago a pessoas,
      não repasse a entes). Projetado para rodar em PARALELO a
      eixo2_meta3_pagamento_elegivel, não substituí-lo ainda; eixo2_meta3_comparativo_recebido_vs_pago
      confronta os dois. A decisão de trocar o denominador oficial das cotas
      para este modelo é do lab (ver plano_integracao_meta3).

    config:
      tags: [gold, cotas, meta3, pnab, bbagil]
      meta:
        status: Disabled
        origem_dados: 'int_bbagil_transferegov + eixo2_meta3_perfil_agente'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold", "PII.Sensitive"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: identificador_unico
        description: >
          CPF/CNPJ do beneficiário final, normalizado pela mesma macro do
          perfil. Aqui o documento vem real (não mascarado), então o casamento
          com perfil é muito melhor que no lado das listas.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]

      - name: ente_bbagil
        description: Ente federado que efetuou o pagamento, vindo do extrato.
        data_type: text

      - name: valor_pago_num
        description: >
          Valor EFETIVAMENTE PAGO à pessoa. É a diferença essencial em relação
          a eixo2_meta3_pagamento_elegivel, que mede o repasse recebido pelo ente.
        data_type: numeric
        meta:
          openmetadata:

      - name: chave_anonimizada
        description: True quando o documento do extrato veio mascarado.
        data_type: boolean

      - name: ano_final
        description: >
          Ano de início da vigência do plano de ação, vindo de silver_plano_acao_ente_ano.
          Aproximação do ano do edital, não o ano exato.
        data_type: integer

      - name: origem_ano
        description: >
          Constante 'vigencia_plano' — marca explicitamente que a datação aqui
          é menos precisa que a cascata usada no lado das listas.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Qualificadores.OrigemDoAno"]

      - name: codigo_ibge
        description: Código IBGE do município do ente, de silver_plano_acao_ente_ano.
        data_type: text

      - name: municipio
        description: Município do ente federado pagador.
        data_type: text

      - name: uf
        description: UF do ente federado pagador.
        data_type: text

      - name: origem
        description: Constante 'pnab_bbagil' — distingue esta trilha da das listas.
        data_type: text

      - name: tem_perfil
        description: True quando o beneficiário casou com eixo2_meta3_perfil_agente.
        data_type: boolean

      - name: flag_negra
        description: Beneficiário autodeclarado negro. Numerador da cota de 25%.
        data_type: boolean
        meta:
          openmetadata:

      - name: flag_indigena
        description: Beneficiário autodeclarado indígena. Numerador da cota de 10%.
        data_type: boolean
        meta:
          openmetadata:
            tags:
              - PII.Sensitive

      - name: flag_pcd
        description: Beneficiário autodeclarado PCD. Numerador da cota de 5%.
        data_type: boolean
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

  - name: eixo2_meta3_comparativo_recebido_vs_pago
    description: >
      [MODELO DESABILITADO — config(enabled=false)] Desabilitado junto com
      bronze_fato_bbagil, pois depende de eixo2_meta3_pagamento_bbagil. Reativar
      (enabled=true) junto.

      Valida o "Diagnóstico 4": confronta os dois lados-valor.
      eixo2_meta3_pagamento_elegivel (listas de contemplados) mede o valor RECEBIDO
      pelos entes (esperado ~R$2,7bi, ≈ painel oficial "recebido");
      eixo2_meta3_pagamento_bbagil (extrato bancário) mede o valor PAGO ao
      beneficiário final (esperado ~R$447mi, ≈ painel oficial "gasto"). Se o
      bbágil bater com o "gasto" do painel, ele passa a ser o denominador
      correto para as cotas. Enquanto a extração bbágil estiver parcial
      (amostra de 1 programa/ano), o total do bbágil será menor que o real —
      este modelo serve para acompanhar a convergência à medida que a
      extração avança.

    config:
      tags: [gold, cotas, meta3, pnab, bbagil, diagnostico]
      meta:
        status: Disabled
        origem_dados: 'eixo2_meta3_pagamento_elegivel + eixo2_meta3_pagamento_bbagil'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: fonte
        description: >
          Qual lado-valor a linha resume: 'recebido (listas/contemplados)' ou
          'pago (bbágil/extrato bancário)'. A tabela tem exatamente 2 linhas.
        data_type: text

      - name: linhas
        description: Quantidade de linhas de pagamento naquele lado.
        data_type: bigint

      - name: docs_distintos
        description: Documentos distintos naquele lado — mede sobreposição de público.
        data_type: bigint

      - name: valor_total
        description: >
          Soma de valor_pago_num do lado, arredondada a 2 casas. É a comparação
          que decide se o bbágil pode virar o denominador oficial das cotas.
        data_type: numeric
        meta:
          openmetadata:
