version: 2

# Meta 3 — a medida das cotas pelo valor PAGO no BB Ágil. Complementa a medida pelas
# listas de contemplados (eixo2_meta3_pagamento_elegivel e as golds que leem dela,
# documentadas em schema.yml) e não a substitui: qual das duas é a oficial é
# decisão de regra, para um PR próprio. Arquivo separado de schema.yml para não
# disputar linhas com os PRs que editam aquele arquivo.

models:
  - name: eixo2_meta3_pagamento_bbagil
    description: >
      O valor pago pelo BB Ágil a agentes culturais da LPG e da PNAB: o filtro de
      eixo2_meta5_evento_fomento com fonte 'BB_AGIL' e programa_fomento LPG ou
      PNAB. Não refaz a regra de pagamento efetivo (débito sem estorno,
      sublançamento 'Pago', fora ente público, FNC e Banco do Brasil, piso de
      valor por agente na política), que mora em eixo2_meta5_evento_fomento. A
      regra própria da Meta 3 é o escopo: só as duas leis que exigem as cotas; a
      LAB fica de fora. 1 linha por (documento, política, data, valor). View.

    config:
      tags: [gold, cotas, meta3, bbagil]
      meta:
        status: Active
        origem_dados: 'eixo2_meta5_evento_fomento'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold", "PII.Sensitive"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: beneficiario_documento
        description: CPF ou CNPJ normalizado de quem recebeu o pagamento.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]
        tests:
          - not_null

      - name: programa_fomento
        description: Política do pagamento, pelo código do programa no extrato.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']

      - name: data_evento
        description: Data do pagamento no extrato.
        data_type: date

      - name: ano_evento
        description: Ano de data_evento. É o ano das golds de distribuição pelo pago.
        data_type: integer
        tests:
          - not_null

      - name: valor
        description: Valor pago, em reais.
        data_type: numeric

      - name: tipo_pessoa
        description: "'PF' ou 'PJ', pelo tamanho do documento."
        data_type: text

  - name: eixo2_meta3_pagamento_bbagil_perfil
    description: >
      Gold-base da medida pelo pago: cada pagamento de eixo2_meta3_pagamento_bbagil
      com o perfil de quem recebeu (eixo2_meta3_perfil_agente) e o território do
      município dele (silver_territorio_municipio), por LEFT JOIN — nenhum
      pagamento sai, e o sem perfil entra no denominador com tem_perfil false.
      Sem perfil, flag_negra, flag_indigena e flag_pcd ficam NULL, não false
      (ADR 0010, regra 1). A cota territorial usa a mesma regra de
      eixo2_meta3_pagamento_elegivel. Só uma fatia pequena de quem recebeu tem
      perfil — medido em novembro de 2026, 6,4% dos documentos da LPG e 3,7% dos
      da PNAB —, e as cotas valem para essa fatia. Grão de
      eixo2_meta3_pagamento_bbagil.

    config:
      tags: [gold, cotas, meta3, bbagil]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_pagamento_bbagil + eixo2_meta3_perfil_agente + silver_territorio_municipio'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold", "PII.Sensitive"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: beneficiario_documento
        description: >
          CPF ou CNPJ normalizado de quem recebeu. Casa com
          eixo2_meta3_perfil_agente.identificador_unico.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('eixo2_meta3_perfil_agente')
                field: identificador_unico
              config:
                where: "tem_perfil"

      - name: programa_fomento
        description: Política do pagamento ('LPG' ou 'PNAB').
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']

      - name: data_evento
        description: Data do pagamento no extrato.
        data_type: date

      - name: ano_evento
        description: Ano do pagamento.
        data_type: integer

      - name: valor
        description: >
          Valor pago, em reais. Medida somada nas cotas — o denominador e,
          filtrado pelas flags, os numeradores.
        data_type: numeric

      - name: tipo_pessoa
        description: "'PF' ou 'PJ'."
        data_type: text

      - name: raca_normalizada
        description: >
          Raça/cor do perfil em 5 categorias (negra, indigena, branca, amarela,
          nao_declarada). NULL sem perfil.
        data_type: text
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: flag_negra
        description: >
          Agente autodeclarado negro (preto ou pardo). Numerador da cota de 25%.
          NULL sem perfil: não ter respondido à planilha não diz que o agente não é
          negro (ADR 0010, regra 1).
        data_type: boolean
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: flag_indigena
        description: >
          Agente autodeclarado indígena, pela raça normalizada ou pelo campo
          indígena da PNAB. Numerador da cota de 10%. NULL sem perfil.
        data_type: boolean
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: flag_pcd
        description: >
          Agente autodeclarado pessoa com deficiência. Numerador da cota de 5%.
          NULL sem perfil.
        data_type: boolean
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: agente_cidade
        description: Município declarado no perfil. NULL sem perfil e nos perfis da PNAB.
        data_type: text

      - name: agente_uf
        description: UF declarada no perfil. NULL sem perfil e nos perfis da PNAB.
        data_type: text

      - name: tem_perfil
        description: >
          True quando o documento casou com eixo2_meta3_perfil_agente. As cotas
          "sobre com perfil" usam só estas linhas.
        data_type: boolean
        tests:
          - not_null

      - name: flag_territorio_vulneravel
        description: >
          True quando o município declarado está no crosswalk de concentrações
          urbanas do IBGE (silver_territorio_municipio). Numerador da cota de 20%,
          só da LPG. NULL quando o agente não declarou cidade (sem perfil ou perfil
          da PNAB).
        data_type: boolean

  - name: eixo2_meta3_distribuicao_cotas_lpg_bbagil
    description: >
      Cotas da LPG por ano do pagamento, sobre o valor PAGO pelo BB Ágil
      (eixo2_meta3_pagamento_bbagil_perfil). Mesma macro distribuicao_cotas e
      mesmos 4 grupos de eixo2_meta3_distribuicao_cotas_lpg, que mede pelas listas de
      contemplados; esta não a substitui, corre ao lado. A cota territorial é só da LPG e usa a mesma regra de
      eixo2_meta3_pagamento_elegivel (município declarado no crosswalk do IBGE).
      A cobertura de perfil é baixa (só uma fatia de quem recebeu respondeu à
      planilha de perfil), então leia valor_total_com_perfil_ano contra
      valor_total_ano antes do veredito. Ano sem nenhum valor com perfil sai
      'descumprida', como na medida pelas listas.

    config:
      tags: [gold, cotas, meta3, lpg, bbagil]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_pagamento_bbagil_perfil'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: programa
        description: Programa da linha. Constante 'LPG' neste modelo.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['LPG']

      - name: ano_evento
        description: >
          Ano do pagamento no extrato do BB Ágil (não o ano do edital, que é o
          ano_final da medida pelas listas).
        data_type: integer
        tests:
          - not_null

      - name: grupo
        description: Grupo com cota legal. São 4 na LPG.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['negra', 'indigena', 'pcd', 'territorio_vulneravel']

      - name: valor_grupo
        description: >
          Soma do valor pago aos documentos cuja flag do grupo é true. Numerador
          da cota, ponderado por dinheiro e não por número de agentes.
        data_type: numeric

      - name: valor_total_ano
        description: >
          Valor pago no ano, incluindo quem não tem perfil. A cota calculada sobre
          ele trata todo pagamento sem perfil como fora da cota.
        data_type: numeric

      - name: valor_total_com_perfil_ano
        description: >
          Valor pago no ano a quem tem perfil. Denominador do veredito. NULL quando
          nenhum pagamento do ano casou com perfil.
        data_type: numeric

      - name: pct_sobre_total
        description: valor_grupo / valor_total_ano, em 0–100. Piso da estimativa.
        data_type: numeric

      - name: pct_sobre_com_perfil
        description: >
          valor_grupo / valor_total_com_perfil_ano, em 0–100. É o percentual
          comparado com a meta legal.
        data_type: numeric

      - name: qtd_agentes_grupo
        description: Documentos distintos no grupo. Contagem informativa.
        data_type: bigint

      - name: meta_minima_pct
        description: "Meta legal mínima em 0–100: negra 25, indígena 10, PCD 5, território vulnerabilizado 20."
        data_type: numeric

      - name: status_sobre_com_perfil
        description: >
          'alcancada' ou 'descumprida', comparando pct_sobre_com_perfil com
          meta_minima_pct. Frágil quando a cobertura do ano é baixa.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['alcancada', 'descumprida']

  - name: eixo2_meta3_distribuicao_cotas_pnab_bbagil
    description: >
      Cotas da PNAB por ano do pagamento, sobre o valor PAGO pelo BB Ágil
      (eixo2_meta3_pagamento_bbagil_perfil). Mesma macro distribuicao_cotas e
      mesmos 3 grupos de eixo2_meta3_distribuicao_cotas_pnab, que mede pelas listas de
      contemplados; esta não a substitui, corre ao lado. Sem a cota territorial, que só a LPG tem.
      Aqui o denominador é o valor pago a pessoas: o repasse recebido pelos
      entes, que pesa na medida pelas listas, já saiu em eixo2_meta5_evento_fomento.
      A cobertura de perfil é baixa (só uma fatia de quem recebeu respondeu à
      planilha de perfil), então leia valor_total_com_perfil_ano contra
      valor_total_ano antes do veredito. Ano sem nenhum valor com perfil sai
      'descumprida', como na medida pelas listas.

    config:
      tags: [gold, cotas, meta3, pnab, bbagil]
      meta:
        status: Active
        origem_dados: 'eixo2_meta3_pagamento_bbagil_perfil'
        openmetadata:
          tier: "Tier.Tier1"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Gold"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: programa
        description: Programa da linha. Constante 'PNAB' neste modelo.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['PNAB']

      - name: ano_evento
        description: >
          Ano do pagamento no extrato do BB Ágil (não o ano do edital, que é o
          ano_final da medida pelas listas).
        data_type: integer
        tests:
          - not_null

      - name: grupo
        description: Grupo com cota legal. São 3 na PNAB.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['negra', 'indigena', 'pcd']

      - name: valor_grupo
        description: >
          Soma do valor pago aos documentos cuja flag do grupo é true. Numerador
          da cota, ponderado por dinheiro e não por número de agentes.
        data_type: numeric

      - name: valor_total_ano
        description: >
          Valor pago no ano, incluindo quem não tem perfil. A cota calculada sobre
          ele trata todo pagamento sem perfil como fora da cota.
        data_type: numeric

      - name: valor_total_com_perfil_ano
        description: >
          Valor pago no ano a quem tem perfil. Denominador do veredito. NULL quando
          nenhum pagamento do ano casou com perfil.
        data_type: numeric

      - name: pct_sobre_total
        description: valor_grupo / valor_total_ano, em 0–100. Piso da estimativa.
        data_type: numeric

      - name: pct_sobre_com_perfil
        description: >
          valor_grupo / valor_total_com_perfil_ano, em 0–100. É o percentual
          comparado com a meta legal.
        data_type: numeric

      - name: qtd_agentes_grupo
        description: Documentos distintos no grupo. Contagem informativa.
        data_type: bigint

      - name: meta_minima_pct
        description: "Meta legal mínima em 0–100: negra 25, indígena 10, PCD 5."
        data_type: numeric

      - name: status_sobre_com_perfil
        description: >
          'alcancada' ou 'descumprida', comparando pct_sobre_com_perfil com
          meta_minima_pct. Frágil quando a cobertura do ano é baixa.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['alcancada', 'descumprida']
