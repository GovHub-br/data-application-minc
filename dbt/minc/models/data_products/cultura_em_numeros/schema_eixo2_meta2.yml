version: 2

# Meta 2 do PNAB (execução financeira) no Cultura em Números: eixo2_meta2_*.
# Convenção de nome do produto no schema.yml desta pasta.
#
# Primeiro recorte, sem a medida de execução: o plano de ação de cada ente, com o
# repasse planejado pela União e os fatos dos relatórios de gestão. O executado
# (o declarado no relatório ou a saída de caixa no BB Ágil), quais situações do
# plano contam e qual relatório vale quando há mais de um dependem de decisão do
# MinC e ficam para a issue da Meta 2.
#
# Gold-base: eixo2_meta2_plano_acao. A outra gold lê dela.
models:
  - name: eixo2_meta2_plano_acao
    description: >
      Camada Gold / Meta 2 do Cultura em Números. Gold-base: o plano de ação
      que cada estado, o DF e cada município apresentou para receber o repasse
      da PNAB.

      GRÃO: uma linha por id_plano_acao. UNIVERSO: todos os planos de ação dos
      programas 60, 61 e 62 (PNAB ciclo 1, 2023) e 111 e 112 (PNAB 2025) no
      TransfereGov, em qualquer situação. Em 11/11/2026 são 11.331 planos: 27,
      697, 4.759, 27 e 5.821, os mesmos da silver_plano_acao_minc em cada
      programa (teste eixo2_meta2_plano_acao_igual_silver).

      PARA QUE SERVE: é a base da distribuição do repasse planejado por ciclo,
      porte, UF e situação do plano (eixo2_meta2_repasse_planejado) e a
      espinha onde a medida de execução vai entrar quando for decidida.

      A REGRA: o escopo são os cinco programas, pelo id_programa. O porte vem
      do programa, pela regra do painel da Meta 2: 60 é ESTADO_DF, 61 é
      MUNICIPIO_GE_360K (repasse a partir de R$ 360 mil), 62 é
      MUNICIPIO_LT_360K. O 111, de estados em 2025, segue o 60. O 112 reúne os
      dois portes de município e fica MUNICIPIO_SEM_PORTE. O DF aparece no
      programa de estados e no de municípios de cada ciclo; no de municípios é
      a única linha com tipo_ente = 'ESTADO' (1 no 61 e 1 no 112).

      DOS RELATÓRIOS DE GESTÃO, SÓ FATOS: quantos o plano tem, o mais recente
      por data_e_hora e se algum foi APROVADO. Em 11/11/2026, 4.407 planos têm
      relatório (4.454 relatórios), 46 têm dois ou mais e 61 têm algum
      APROVADO; em 29 deles o aprovado não é o mais recente. Por isso a
      situação do mais recente e o flag de aprovado respondem coisas
      diferentes, e nenhum dos dois decide qual relatório vale.

      O QUE NÃO ESTÁ AQUI: o valor executado, nem o declarado no relatório
      (valor_executado_relatorio_gestao) nem a saída de caixa do BB Ágil; a
      escolha das situações do plano que contam (há 1 plano REJEITADO no 62 e
      182 no 112, e 171 dos 222 entes do 112 com mais de um plano têm um
      rejeitado); e a região, que espera a dimensão de território (issue #164).

      LIMITAÇÕES: os programas de 2025 têm 4 parcelas, e o repasse planejado
      é o do plano inteiro, não o do ano. Um plano do 62 tem início de
      vigência anterior a 2023, como veio da origem.

      ATUALIZAÇÃO: table, recalculada a cada `dbt build`; não há carga
      incremental.
    config:
      tags:
        - gold
        - cultura_em_numeros
        - eixo2
        - meta2
        - pnab
      meta:
        openmetadata:
          domain: Cultura.Repasse Federativo
          tier: Tier.Tier1
          owner: minc-data-engineering
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação no TransfereGov.
        data_type: bigint
        tests:
          - not_null
          - unique
      - name: codigo_plano_acao
        description: Código do plano de ação, como o TransfereGov o exibe.
        data_type: text
        tests:
          - not_null
      - name: id_programa
        description: Programa do TransfereGov a que o plano pertence.
        data_type: bigint
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [60, 61, 62, 111, 112]
                quote: false
      - name: ano_programa
        description: >
          Ano do programa, de silver_programa_minc: 2023 no ciclo 1 (60, 61 e
          62) e 2025 na PNAB 2025 (111 e 112). É o ciclo das agregações.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2023, 2025]
                quote: false
      - name: nome_programa
        description: Nome do programa no TransfereGov.
        data_type: text
        tests:
          - not_null
      - name: porte_ente
        description: >
          Porte do ente, pelo programa: ESTADO_DF (60 e 111),
          MUNICIPIO_GE_360K (61), MUNICIPIO_LT_360K (62) e MUNICIPIO_SEM_PORTE
          (112, que reúne os dois portes de município).
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ESTADO_DF
                  - MUNICIPIO_GE_360K
                  - MUNICIPIO_LT_360K
                  - MUNICIPIO_SEM_PORTE
      - name: tipo_ente
        description: >
          Tipo do ente recebedor na origem. Nos programas de municípios, a linha
          com 'ESTADO' é o DF.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ESTADO', 'MUNICIPIO']
      - name: id_ente_recebedor_plano_acao
        description: Identificador do ente recebedor no TransfereGov.
        data_type: bigint
        tests:
          - not_null
      - name: sigla_uf
        description: Sigla da UF do ente recebedor (uf_ente_recebedor_plano_acao).
        data_type: text
        tests:
          - not_null
      - name: cod_ibge_uf
        description: Código IBGE da UF do ente recebedor, com 2 dígitos.
        data_type: bigint
        tests:
          - not_null
      - name: cod_ibge_municipio
        description: >
          Código IBGE do município recebedor, com 7 dígitos. NULL para estados
          e para o DF.
        data_type: bigint
      - name: situacao_plano_acao
        description: >
          Situação do plano no TransfereGov (AUTORIZADO, EM_ELABORACAO,
          REJEITADO e outras). Nenhuma é filtrada.
        data_type: text
        tests:
          - not_null
      - name: data_inicio_vigencia_plano_acao
        description: Início da vigência do plano.
        data_type: date
      - name: data_fim_vigencia_plano_acao
        description: Fim da vigência do plano.
        data_type: date
      - name: valor_total_repasse_plano_acao
        description: >
          Repasse planejado pela União para o plano, em reais. É o valor
          previsto no plano, não o executado.
        data_type: numeric
        tests:
          - not_null
      - name: id_relatorio_gestao_recente
        description: >
          O relatório de gestão mais recente do plano: o de maior data_e_hora,
          com o maior id_relatorio_gestao como desempate. NULL quando não há
          relatório.
        data_type: bigint
      - name: situacao_relatorio_gestao_recente
        description: Situação do relatório mais recente. NULL quando não há relatório.
        data_type: text
      - name: data_e_hora_relatorio_gestao_recente
        description: Data e hora do relatório mais recente. NULL quando não há relatório.
        data_type: timestamp
      - name: flag_relatorio_aprovado
        description: >
          Se algum relatório do plano, não só o mais recente, está APROVADO.
          NULL quando o plano não tem relatório (regra transversal 1 do ADR
          0010).
        data_type: boolean
      - name: quantidade_relatorios_gestao
        description: Quantidade de relatórios de gestão do plano. Zero quando não há.
        data_type: bigint
        tests:
          - not_null

  - name: eixo2_meta2_repasse_planejado
    description: >
      Camada Gold / Meta 2 do Cultura em Números. O repasse planejado da PNAB
      somado por ciclo, porte, UF e situação do plano.

      GRÃO: uma linha por ano_programa, porte_ente, UF e situacao_plano_acao.
      UNIVERSO: todos os planos de eixo2_meta2_plano_acao, sem filtro. A soma
      de quantidade_planos e de valor_total_repasse_planejado é a da
      silver_plano_acao_minc nos cinco programas (teste
      eixo2_meta2_repasse_planejado_soma_igual_silver).

      PARA QUE SERVE: a distribuição federativa do repasse planejado em cada
      ciclo, a primeira pergunta da Meta 2, do lado do planejado.

      COMO LER: é o repasse PLANEJADO pela União ao ente, não o executado nem o
      pago a agentes culturais. Cada situação do plano fica numa linha própria,
      porque quais situações contam ainda não foi decidido. Somar todas pode
      contar o mesmo ente duas vezes: no 112, 171 dos 222 entes com mais de um
      plano têm um plano REJEITADO.
      Nos programas de 2025 o valor é o do plano inteiro, de 4 parcelas, e não
      o de um ano. A região fica de fora até a dimensão de território (issue
      #164).
    config:
      tags:
        - gold
        - cultura_em_numeros
        - eixo2
        - meta2
        - pnab
      meta:
        openmetadata:
          domain: Cultura.Repasse Federativo
          tier: Tier.Tier1
          owner: minc-data-engineering
    columns:
      - name: ano_programa
        description: Ciclo, pelo ano do programa (2023 ou 2025).
        data_type: integer
        tests:
          - not_null
      - name: porte_ente
        description: Porte do ente, como em eixo2_meta2_plano_acao.
        data_type: text
        tests:
          - not_null
      - name: sigla_uf
        description: Sigla da UF do ente recebedor.
        data_type: text
        tests:
          - not_null
      - name: cod_ibge_uf
        description: Código IBGE da UF do ente recebedor.
        data_type: bigint
        tests:
          - not_null
      - name: situacao_plano_acao
        description: Situação do plano no TransfereGov.
        data_type: text
        tests:
          - not_null
      - name: quantidade_planos
        description: Quantidade de planos de ação no grupo.
        data_type: bigint
        tests:
          - not_null
      - name: valor_total_repasse_planejado
        description: Soma de valor_total_repasse_plano_acao dos planos do grupo, em reais.
        data_type: numeric
        tests:
          - not_null
