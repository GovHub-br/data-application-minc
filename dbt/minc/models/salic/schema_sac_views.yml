          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anorecibo
        description: >
          Ano do recibo de captação.
        data_type: integer
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: medidaprovisoria
        description: >
          Medida provisória do incentivo: 1 ou 2.
        data_type: text
      - name: captacaoufir
        description: >
          Valor captado, em UFIR.
        data_type: numeric
      - name: captacaoreal
        description: >
          Valor captado, em reais.
        data_type: numeric
      - name: _fatia
        description: >
