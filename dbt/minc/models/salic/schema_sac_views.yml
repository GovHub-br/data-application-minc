version: 2

# Silvers do assunto domínios e outros (parte 2) do banco sac do SALIC: as
# views que sobravam, quase todas agregações e recortes de projetos, captação,
# aprovação, renúncia fiscal, cartas, convênios e regularidade usados por telas
# e relatórios do SALIC antigo. Nenhuma é fonte primária. Medições de 30/10/2026
# na Bronze, por agregados.

models:
  - name: silver_sac_vcaptado
    description: >
      Uma linha por projeto com o total captado, em UFIR e em reais. São 55.043
      projetos. Recorte calculado pela origem; a fonte primária é
      silver_sac_captacao.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_vcaptado'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: captacaoufir
        description: >
          Valor captado, em UFIR.
        data_type: numeric
      - name: captacaoreal
        description: >
          Valor captado, em reais.
        data_type: numeric
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_vcaptadoano
    description: >
      Uma linha por projeto, ano do recibo e medida provisória com o captado.
      São 88.974 linhas. Recorte calculado pela origem; a fonte primária é
      silver_sac_captacao.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_vcaptadoano'
        governance:
          produto_dados: 'SALIC — Rouanet'
