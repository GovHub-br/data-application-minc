  - name: silver_sac_vcartas
    description: >
      Uma linha por carta enviada sobre um projeto, com projeto, proponente e
      endereço. São 824.175 cartas, a mesma base de silver_sac_historicocarta,
      de projetos de 1992 a 2020.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_vcartas'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: orgao
        description: >
          Órgão, código de silver_tabelas_orgaos.
        data_type: integer
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtcarta
        description: >
          Data em que a carta foi enviada.
        data_type: timestamp
      - name: area
        description: >
          Área cultural do projeto, código de silver_sac_area: 1 Artes Cênicas,
          2 Audiovisual, 3 Música, 4 Artes Visuais, 5 Patrimônio Cultural, 6
          Humanidades, 7 Artes Integradas, 9 Museus e Memória.
        data_type: integer
      - name: segmento
        description: >
          Segmento cultural, código de silver_sac_vsegmento, em texto porque há
          códigos com letra. O código só é único junto com a área.
        data_type: text
      - name: numero
        description: >
          Número da carta ou do imóvel.
        data_type: text
      - name: situacao
        description: >
          Situação atual do projeto, código de três caracteres da tabela
          sac.situacao, como K00 arquivado, E10 autorizada a captação total ou
          E19 prestação de contas aprovada.
        data_type: text
      - name: ano
        description: >
          Ano de referência da linha.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: nomeprojeto
        description: >
          Nome do projeto cultural.
        data_type: text
      - name: processo
        description: >
          Número do processo administrativo.
        data_type: text
      - name: cgccpf
        description: >
          CPF ou CNPJ do proponente, sem máscara, em texto para manter o zero à
          esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nome
        description: >
          Nome do proponente, pessoa ou entidade.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: responsavel
        description: >
          Nome do responsável pelo proponente.
        data_type: text
        meta:
          openmetadata:
            tags:
