version: 2

# Silvers do banco corporativo do SALIC (bdcorporativo, schema scsac na origem):
# comprovantes de pagamento da execução dos projetos, o trâmite da prestação de
# contas e os pedidos de alteração do nome do proponente. Medições de 29/10/2026
# na Bronze (salic.bronze_bdcorporativo_*). A sysdiagrams, diagrama interno do
# SQL Server, fica só na Bronze: não tem dado de negócio.

models:
  - name: silver_bdcorporativo_tbalteracaonomeproponente
    description: >
      Uma linha por pedido de alteração do nome do proponente, com o documento
      e o nome pedido. A tabela tem só 2 pedidos, um de pessoa física e um de
      pessoa jurídica: o fluxo quase não é usado. idpedidoalteracao é único.
    config:
      tags: [silver, salic, bdcorporativo]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_bdcorporativo_tbalteracaonomeproponente'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          # o nome casa com a busca de PII (alteRACAo, prestCONTAs,
          # DOCUMENTO fiscal), mas a coluna não identifica pessoa
          derivadas_nao_identificantes:
            - idpedidoalteracao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idpedidoalteracao
        description: >
          Identificador do pedido de alteração. Único e preenchido nos 2 pedidos.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: nrcnpjcpf
        description: >
          CPF ou CNPJ do proponente que pediu a alteração, só dígitos. Num dos 2
          pedidos é CPF, então a coluna identifica pessoa física.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: nmproponente
        description: >
          Nome do proponente como pedido na alteração. Num dos pedidos é nome de
          pessoa física.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
        tests:
          - not_null
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_bdcorporativo_tbcomprovantepagamento
    description: >
      Uma linha por comprovante de pagamento que o proponente lança na
      comprovação da execução financeira do projeto: nota fiscal, recibo, RPA
      e afins, com valor, datas, fornecedor e forma de pagamento. São 4.191.494
      comprovantes, com idcomprovantepagamento único. A ligação com o projeto
      e com o item do orçamento não está aqui: no SalicWeb ela passa pela
      tabela tbComprovantePagamentoxPlanilhaAprovacao, que a ingestão não traz.


      Armadilhas: as datas têm valores impossíveis, de 1767 a 9201, e em
      266.904 comprovantes, 6,4%, a data de pagamento é anterior à de emissão.
      3.724 comprovantes têm valor zero ou negativo. 95 não têm fornecedor
      nenhum. A coluna tbcomprovantepagamento da origem, vazia em todas as
      linhas, foi retirada.
    config:
      tags: [silver, salic, bdcorporativo]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_bdcorporativo_tbcomprovantepagamento'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          # o nome casa com a busca de PII (alteRACAo, prestCONTAs,
          # DOCUMENTO fiscal), mas a coluna não identifica pessoa
          derivadas_nao_identificantes:
            - tpdocumento
            - nrdocumentodepagamento
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: tpdocumento
        description: >
          Tipo do documento fiscal, pelo formulário de comprovação do SalicWeb:
          1 cupom fiscal, com 164.470; 2 guia de recolhimento, 397.064; 3 nota
          fiscal ou fatura, 2.803.000; 4 recibo de pagamento, 726.753; 5 RPA,
          recibo de pagamento a autônomo, 84.893. Os códigos 6, com 11.904, e
          7, com 3.410, não aparecem no código público e não têm significado
          conhecido.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
              config:
                severity: warn
      - name: nrcomprovante
        description: >
          Número do documento fiscal como o proponente digitou, em texto livre.
          Vazio em 856 comprovantes.
        data_type: text
      - name: nrserie
        description: >
          Série do documento fiscal, quando há. Preenchida em 672.243
          comprovantes, 16%.
        data_type: text
      - name: idcomprovantepagamento
        description: >
          Identificador do comprovante, único e preenchido em todas as linhas.
        data_type: integer
        tests:
          - not_null
      - name: dsjustificativa
        description: >
          Justificativa em texto livre que acompanha o comprovante. Preenchida
          em 1.469.117 comprovantes, 35%.
        data_type: text
      - name: vlcomprovacao
        description: >
          Valor comprovado no documento, em reais, preenchido em todas as
          linhas. 3.724 comprovantes têm valor zero ou negativo.
        data_type: numeric
        tests:
          - not_null
      - name: dtemissao
        description: >
          Data de emissão do documento fiscal, preenchida em todas as linhas.
          Tem datas impossíveis: 83 antes de 1990 e 1.068 depois de 2026, até
          o ano 9093. Filtre por intervalo antes de usar.
        data_type: timestamp
        tests:
          - not_null
      - name: dtpagamento
        description: >
          Data do pagamento, preenchida em todas as linhas. 50 antes de 1990 e
          601 depois de 2026. Em 266.904 comprovantes é anterior à dtemissao.
        data_type: timestamp
        tests:
          - not_null
      - name: idfornecedor
        description: >
          Fornecedor brasileiro que emitiu o documento. É o idagente do banco
          agentes: 99,9% dos valores existem lá. Vazio em 13.407 comprovantes,
          que são, menos 95, os de fornecedor do exterior.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idfornecedorexterior
        description: >
          Fornecedor do exterior, preenchido em 13.312 comprovantes, sempre
          quando idfornecedor está vazio. Nunca os dois juntos.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idarquivo
        description: >
          Arquivo digitalizado do comprovante, um por linha: os 4.191.494
          valores são distintos.
        data_type: integer
        tests:
          - not_null
      - name: dsoutrasfontes
        description: >
          Texto livre sobre outras fontes de pagamento. Preenchido em só 68
          comprovantes.
        data_type: text
      - name: tpformadepagamento
        description: >
          Forma de pagamento, pelo formulário do SalicWeb: 1 cheque, em
          530.756 comprovantes; 2 transferência bancária, 3.606.185; 3 saque ou
          dinheiro, 40.516. O 0 é a opção "Selecione" que ficou gravada, em 44.
          Vazio em 13.993.
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
              config:
                severity: warn
      - name: nrdocumentodepagamento
        description: >
          Número do cheque, da transferência ou do saque, em texto livre. Vazio
          em 14.011 comprovantes.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_bdcorporativo_tbencaminhamentoprestacaocontas
    description: >
      Uma linha por encaminhamento da prestação de contas de um projeto entre
      setores e pessoas do MinC. São 8.096 encaminhamentos, de 2015 a 2026,
      para 3.883 PRONACs, todos existentes em sac.projetos. Cada PRONAC tem
      exatamente um encaminhamento ativo, com stativo verdadeiro, que é onde a
      prestação de contas está agora. Os outros 4.213 são o histórico.


      O fluxo mais comum vai da CGPC-Incent, órgão 733, para a SGPTC, 731, e
      do grupo Coordenador de Prestação de Contas, 125, para Administradores
      do Sistema, 1. Os nomes de órgão e grupo estão em tabelas.orgaos e
      tabelas.grupos. 5 encaminhamentos terminam antes de começar.
    config:
      tags: [silver, salic, bdcorporativo]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_bdcorporativo_tbencaminhamentoprestacaocontas'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          # o nome casa com a busca de PII (alteRACAo, prestCONTAs,
          # DOCUMENTO fiscal), mas a coluna não identifica pessoa
          derivadas_nao_identificantes:
            - idencprestcontas
            - idsituacaoencprestcontas
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
          glossary:
            - MinC.Identificadores.PRONAC
    tests:
      - unique:
          arguments:
            column_name: "case when stativo then idpronac end"
    columns:
      - name: idencprestcontas
        description: >
          Identificador do encaminhamento, único e preenchido nas 8.096 linhas.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Projeto cuja prestação de contas foi encaminhada. Liga com o
          idpronac de sac.projetos, sem órfão.
        data_type: integer
        tests:
          - not_null
      - name: idagenteorigem
        description: >
          Pessoa que encaminhou, como idagente do banco agentes. Todos os
          valores existem lá.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: idagentedestino
        description: >
          Pessoa que recebeu o encaminhamento, como idagente do banco agentes.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: dtinicioencaminhamento
        description: >
          Data e hora do encaminhamento, de 2015 a 2026.
        data_type: timestamp
        tests:
          - not_null
      - name: dtfimencaminhamento
        description: >
          Data e hora em que o encaminhamento foi encerrado. Preenchida só em
          324 encaminhamentos, então não serve para medir duração. Em 5 é
          anterior ao início.
        data_type: timestamp
      - name: dsjustificativa
        description: >
          Texto livre do encaminhamento. Vazio em 164 dos 8.096.
        data_type: text
      - name: idorgaoorigem
        description: >
          Órgão de onde saiu o encaminhamento, código de tabelas.orgaos. O mais
          comum é o 733, CGPC-Incent.
        data_type: integer
        tests:
          - not_null
      - name: idorgaodestino
        description: >
          Órgão para onde foi o encaminhamento, código de tabelas.orgaos. Os
          mais comuns são 731, SGPTC, e 1, MinC.
        data_type: integer
        tests:
          - not_null
      - name: cdgruposorigem
        description: >
          Grupo de perfil de quem encaminhou, código de tabelas.grupos. O mais
          comum é o 125, Coordenador de Prestação de Contas.
        data_type: integer
        tests:
          - not_null
      - name: cdgruposdestino
        description: >
          Grupo de perfil de quem recebeu, código de tabelas.grupos. O mais
          comum é o 1, Administradores do Sistema, seguido do 124, Técnico de
          Prestação de Contas.
        data_type: integer
        tests:
          - not_null
      - name: idsituacaoencprestcontas
        description: >
          Situação da análise neste encaminhamento. Liga com
          silver_bdcorporativo_tbsituacaoencaminhamentoprestacaocontas. Só
          aparecem 1, Aguardando Análise, em 7.877; 2, Em Análise, em 169; e 3,
          Analisado, em 50.
        data_type: integer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_bdcorporativo_tbsituacaoencaminhamentoprestacaocontas')
                field: idsituacaoencprestcontas
      - name: idsituacao
        description: >
          Situação do projeto no momento do encaminhamento, código de
          sac.situacao: E27, Análise Financeira da Prestação de Contas, em 269;
          E68, Aguarda análise financeira, em 51; E30, Análise de resposta de
          diligência, em 9. As outras 7.767 linhas têm o valor 1, que não é
          código de sac.situacao e não tem significado conhecido.
        data_type: text
        tests:
          - not_null
      - name: stativo
        description: >
          Verdadeiro no encaminhamento atual do projeto, falso no histórico.
          Há exatamente um verdadeiro por PRONAC.
        data_type: boolean
        tests:
          - not_null
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_bdcorporativo_tbsituacaoencaminhamentoprestacaocontas
    description: >
      Uma linha por situação possível da análise de um encaminhamento de
      prestação de contas. São 5: 1 Aguardando Análise, 2 Em Análise, 3
      Analisado, 4 Consultoria AECI e 5 Consultoria CONJUR. A 4 e a 5 nunca
      aparecem em silver_bdcorporativo_tbencaminhamentoprestacaocontas.
    config:
      tags: [silver, salic, bdcorporativo]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_bdcorporativo_tbsituacaoencaminhamentoprestacaocontas'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          # o nome casa com a busca de PII (alteRACAo, prestCONTAs,
          # DOCUMENTO fiscal), mas a coluna não identifica pessoa
          derivadas_nao_identificantes:
            - idsituacaoencprestcontas
            - dssituacaoencprestcontas
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idsituacaoencprestcontas
        description: >
          Código da situação, de 1 a 5.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: dssituacaoencprestcontas
        description: >
          Nome da situação, como Aguardando Análise ou Consultoria CONJUR.
        data_type: text
        tests:
          - not_null
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text
