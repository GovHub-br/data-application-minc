version: 2
# Source do SALIC: a Bronze é a tabela que a ingestão (salic_ingestion_trino)
# grava no schema salic como bronze_<banco>_<tabela>; não há modelo dbt bronze.
# Este arquivo declara só as duas tabelas que silver_sac_captacao_proponente lê;
# o lote sac traz as demais, com as descrições de salic_dbt/bronze/sources_sac.yml.
sources:
  - name: salic
    schema: salic
    description: >
      SALIC (Sistema de Apoio às Leis de Incentivo à Cultura). Bronze: réplica do
      sistema de origem via Trino, tudo text, sem tratamento, com a coluna técnica
      _fatia da carga em fatias. Uma tabela por <banco>__<tabela> da origem, como
      salic.bronze_<banco>_<tabela>. As descrições das tabelas vêm do dicionário
      de dados do SALIC (export SchemaSpy) cruzado com o perfil do banco; o
      catálogo completo está em dbt/minc/docs/salic/.
    tables:
      - name: bronze_sac_tbapicomprovacoes
        description: >
          Comprovações de pagamento dos projetos da Lei Rouanet: um registro por
          item comprovado, com fornecedor, documento, valor e localidade.
          2.621.182 linhas em 29/10/2026. Ingerida em 2026-09-04.

          É a fonte do indicador de primeiro acesso da Meta 5. Traz `nmmunicipio`
          e `dsregiao` no próprio registro e o PRONAC em `nrpronac`. `sguf` não é
          sigla de UF: são as duas primeiras letras do nome do estado, ambíguas.
        config:
          tags: [bronze, salic, sac]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idapicomprovacoes
            description: Identificador do registro de comprovação.
            data_type: text
          - name: idpronac
            description: Surrogate do projeto nas tabelas de análise.
            data_type: text
          - name: nrpronac
            description: PRONAC do projeto, a chave de negócio.
            data_type: text
          - name: nmprojeto
            description: Nome do projeto.
            data_type: text
          - name: nmfornecedor
            description: >
              Nome do fornecedor pago. Dado pessoal quando o fornecedor é pessoa
              física.
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.NonSensitive
          - name: aaanocomprovacao
            description: Ano da comprovação, como texto na origem.
            data_type: text
          - name: mmmescomprovacao
            description: Mês da comprovação, como texto na origem.
            data_type: text
          - name: vlpagamento
            description: Valor pago no item comprovado.
            data_type: text
          - name: sguf
            description: Duas primeiras letras do nome do estado do fornecedor. Não é sigla de UF.
            data_type: text
          - name: nmmunicipio
            description: Nome do município onde a despesa foi realizada.
            data_type: text
          - name: dsregiao
            description: >
              Região gravada no próprio registro de comprovação. É fonte
              independente da cadeia territorial do IBGE, e as duas podem
              divergir.
            data_type: text
      - name: bronze_sac_abrangencia
        description: >
          Tabela responsável por registrar a abrangência territorial dos projetos, incluindo
          país, UF, município, datas de realização, justificativas e status.
        config:
          tags:
            - bronze
            - salic
            - sac
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idabrangencia
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
          - name: idprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
          - name: idpais
