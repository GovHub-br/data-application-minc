      - name: bronze_sac_preprojeto
        description: >
          Uma linha por pré-projeto (proposta antes de virar PRONAC): descreve a
          proposta, seus textos longos em HTML (justificativa, objetivos, sinopse,
          ficha técnica) e o ciclo de aceite/arquivamento. Camada bronze (raw do
          SALIC via Trino, tudo text).
        config:
          tags: [bronze, salic, sac]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idpreprojeto
            description: Identificador do pré-projeto. Chave da tabela.
            data_type: text
          - name: idagente
            description: Agente proponente. Aponta para agentes__agentes.idagente.
            data_type: text
          - name: nomeprojeto
            description: Nome da proposta.
            data_type: text
          - name: mecanismo
            description: Código do mecanismo de incentivo.
            data_type: text
          - name: agenciabancaria
            description: Código da agência bancária. Pode conter dígito não numérico (ex. '6856X').
            data_type: text
          - name: areaabrangencia
            description: Flag de abrangência (bit True/False).
            data_type: text
          - name: dtiniciodeexecucao
            description: Data de início prevista de execução.
            data_type: text
          - name: dtfinaldeexecucao
            description: Data de fim prevista de execução.
            data_type: text
          - name: justificativa
            description: Justificativa da proposta. Texto longo em HTML.
            data_type: text
          - name: nratotombamento
            description: Número do ato de tombamento. Preenchida em ~1% das linhas.
            data_type: text
          - name: dtatotombamento
            description: Data do ato de tombamento. Muitos valores são o sentinela '1900-01-01'.
            data_type: text
          - name: esferatombamento
            description: Código da esfera do tombamento.
            data_type: text
          - name: resumodoprojeto
            description: Resumo da proposta.
            data_type: text
          - name: objetivos
            description: Objetivos da proposta. Texto longo em HTML.
            data_type: text
          - name: acessibilidade
            description: Descrição de acessibilidade. Texto longo em HTML.
            data_type: text
          - name: democratizacaodeacesso
            description: Democratização de acesso. Texto longo em HTML.
            data_type: text
          - name: etapadetrabalho
            description: Etapas de trabalho. Texto longo em HTML.
            data_type: text
          - name: fichatecnica
            description: Ficha técnica. Texto longo em HTML.
            data_type: text
          - name: sinopse
            description: Sinopse. Texto longo em HTML.
            data_type: text
          - name: impactoambiental
            description: Impacto ambiental. Texto em HTML, ~30% preenchida.
            data_type: text
          - name: especificacaotecnica
            description: Especificação técnica. Texto longo em HTML.
            data_type: text
          - name: estrategiadeexecucao
            description: Estratégia de execução. Texto longo em HTML.
            data_type: text
          - name: dtaceite
            description: Data de aceite da proposta.
            data_type: text
          - name: dtarquivamento
            description: Data de arquivamento. ~18% preenchida.
            data_type: text
          - name: stestado
            description: Flag de estado (bit True/False).
            data_type: text
          - name: stdatafixa
            description: Flag de data fixa (bit True/False).
            data_type: text
          - name: stplanoanual
            description: Flag de plano anual (bit True/False).
            data_type: text
          - name: idusuario
            description: Identificador do usuário.
            data_type: text
          - name: sttipodemanda
            description: Tipo de demanda (ex. NA, ED).
            data_type: text
          - name: idedital
            description: Identificador do edital, quando aplicável. ~25% preenchida.
            data_type: text
          - name: stproposta
            description: Código do status da proposta. ~40% preenchida.
            data_type: text
          - name: tpprorrogacao
            description: Flag de prorrogação (bit True/False). ~40% preenchida.
            data_type: text
          - name: descricaoatividade
            description: Descrição de atividade. Texto em HTML, ~15% preenchida.
            data_type: text
          - name: tptipicidade
            description: Código de tipicidade. ~32% preenchida.
            data_type: text
          - name: tptipologia
            description: Código de tipologia. ~32% preenchida.
            data_type: text
          - name: idpronaccontinuacao
            description: '[VAZIA EM 100% DAS LINHAS] PRONAC de continuação; sem valor na origem.'
            data_type: text
          - name: _fatia
            description: Coluna técnica da ingestão por fatias (ADR 0005). Não é campo de negócio.
            data_type: text
