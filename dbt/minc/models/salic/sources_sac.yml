          - name: stabrangencia
            description: >
              Representa o status da abrangência sendo 0 para desativado e 1 para ativado. Tipo
              original (SQL Server): bit(1).
            data_type: text
          - name: siabrangencia
            description: >
              Diz se realizou ou não o evento na localidade indicada. 0 - Sem informação 1 -
              Não, 2 - Sim. Tipo original (SQL Server): char(1).
            data_type: text
          - name: dsjustificativa
            description: >
              Descreve o por que do evento não ter sido realizado no local descrito. Tipo original
              (SQL Server): varchar(500).
            data_type: text
          - name: dtiniciorealizacao
            description: >
