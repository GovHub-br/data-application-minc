version: 2
# Source do SALIC: a Bronze é a tabela que a ingestão (salic_ingestion_trino)
# grava no schema salic como bronze_<banco>_<tabela>; não há modelo dbt bronze.
# Este arquivo declara só as duas tabelas que silver_sac_captacao_proponente lê;
# o lote sac traz as demais, com as descrições de salic_dbt/bronze/sources_sac.yml.
sources:
  - name: salic
    schema: salic
    description: >
      Núcleo do SALIC (Sistema de Apoio às Leis de Incentivo à Cultura) — projetos
      culturais incentivados, proponentes, captação de recursos, editais, prestação
      de contas, pareceres e patrocínio (Lei Rouanet e leis correlatas de incentivo
      fiscal à cultura). Bronze: réplica do sistema de origem via Trino, tudo text,
      sem tratamento, com a coluna técnica _fatia da carga em fatias.
    tables:
      - name: bronze_sac_captacao
        description: >
          Tabela responsável por registrar as captações de recursos dos projetos, incluindo
          recibos, datas, valores captados, tipo de apoio e informações do mecenas.
        config:
          tags:
            - bronze
            - salic
            - sac
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idcaptacao
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
            tests:
              - not_null
          - name: anoprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(2).
            data_type: text
          - name: sequencial
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(5).
            data_type: text
          - name: numerorecibo
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(5).
            data_type: text
          - name: cgccpfmecena
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(14).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.Sensitive
          - name: tipoapoio
            description: "patrocinio ou doação 1\tDoação2\tPatrocínio Tipo original (SQL Server): char(1).\n"
            data_type: text
          - name: medidaprovisoria
            description: >
              1 - artigo 26 (lei 8.313/91) e 2 - artigo 18MedidaProvisoria : 1.Artigo 26 e  2.100%
              Tipo original (SQL Server): char(1).
            data_type: text
          - name: dtchegadarecibo
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): datetime(16,3).
            data_type: text
          - name: dtrecibo
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): datetime(16,3).
            data_type: text
          - name: captacaoreal
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): money(21,4).
            data_type: text
          - name: captacaoufir
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): money(21,4).
            data_type: text
          - name: logon
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
          - name: idprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
          - name: sitransferenciarecurso
            description: >
              Recurso Bloqueado; 1.Recurso Liberado Tipo original (SQL Server): char(1).
            data_type: text
          - name: dttransferenciarecurso
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): datetime(16,3).
            data_type: text
          - name: isbemservico
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(1).
            data_type: text
      - name: bronze_sac_projetos
        description: >
          Uma linha por projeto cultural (PRONAC) submetido ao mecanismo de
          incentivo fiscal (Lei Rouanet). Núcleo do domínio SAC: liga proponente,
          situação, valores solicitados e datas de tramitação. Camada bronze
          (raw do SALIC via Trino, tudo text).
        config:
          tags: [bronze, salic, sac]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idpronac
            description: Identificador interno do PRONAC. Chave do projeto.
            data_type: text
          - name: anoprojeto
            description: Ano do projeto em 2 dígitos ('00'=2000, '08'=2008). Mantido text para preservar o zero à esquerda.
            data_type: text
          - name: sequencial
            description: Sequencial do projeto no ano, 4 dígitos com zero à esquerda.
            data_type: text
          - name: ufprojeto
            description: Sigla da UF do projeto.
            data_type: text
          - name: area
            description: Código da área cultural.
            data_type: text
          - name: segmento
            description: Código do segmento cultural.
            data_type: text
          - name: mecanismo
            description: Código do mecanismo de incentivo.
            data_type: text
          - name: nomeprojeto
            description: Nome do projeto cultural.
            data_type: text
          - name: processo
            description: Número do processo administrativo (15 dígitos). Identificador, mantido text.
            data_type: text
          - name: cgccpf
            description: CNPJ/CPF do proponente. Dado pessoal; mantido text (zero à esquerda).
            data_type: text
          - name: situacao
            description: Código da situação do projeto. Aponta para sac__situacao.codigo.
            data_type: text
          - name: dtprotocolo
            description: Data de protocolo do projeto.
            data_type: text
          - name: dtanalise
            description: Data de análise.
            data_type: text
          - name: modalidade
            description: Código da modalidade. Preenchida em ~21% das linhas.
            data_type: text
          - name: orgaoorigem
            description: Código do órgão de origem.
            data_type: text
          - name: orgao
            description: Código do órgão responsável.
            data_type: text
          - name: dtsaida
            description: Data de saída para análise externa. Parcialmente preenchida.
            data_type: text
          - name: dtretorno
            description: Data de retorno da análise externa. Parcialmente preenchida.
            data_type: text
          - name: unidadeanalise
            description: Unidade responsável pela análise. ~56% preenchida.
            data_type: text
          - name: analista
            description: Nome do analista. Dado pessoal de servidor.
            data_type: text
          - name: dtsituacao
            description: Data da última mudança de situação.
            data_type: text
          - name: resumoprojeto
            description: Resumo textual do projeto.
            data_type: text
          - name: providenciatomada
            description: Providência administrativa registrada.
            data_type: text
          - name: localizacao
            description: Localização física do processo. ~18% preenchida.
            data_type: text
          - name: dtinicioexecucao
            description: Data de início da execução. Preenchida em poucas linhas.
            data_type: text
          - name: dtfimexecucao
            description: Data de fim da execução. Preenchida em poucas linhas.
            data_type: text
          - name: solicitadoufir
            description: Valor solicitado em UFIR.
            data_type: text
          - name: solicitadoreal
            description: Valor solicitado em reais.
            data_type: text
          - name: solicitadocusteioufir
            description: Valor de custeio solicitado em UFIR.
            data_type: text
          - name: solicitadocusteioreal
            description: Valor de custeio solicitado em reais.
            data_type: text
          - name: solicitadocapitalufir
            description: Valor de capital solicitado em UFIR.
            data_type: text
          - name: solicitadocapitalreal
            description: Valor de capital solicitado em reais.
            data_type: text
          - name: logon
            description: Identificador do usuário que registrou.
            data_type: text
          - name: idprojeto
            description: '[VAZIA EM 100% DAS LINHAS] Sem valor na origem.'
            data_type: text
          - name: _fatia
            description: Coluna técnica da ingestão por fatias (ADR 0005). Não é campo de negócio.
            data_type: text
