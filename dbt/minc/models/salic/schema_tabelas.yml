        data_type: integer
      - name: org_sigla
        description: >
          Sigla do órgão, como SEFIC ou CNIC. Não é única: a mesma sigla
          aparece em órgãos de épocas diferentes.
        data_type: text
      - name: org_cei
        description: >
          Código do órgão no sistema de estrutura do governo. Preenchido em
          poucos órgãos.
        data_type: integer
      - name: org_uf
        description: >
          UF do órgão, em sigla.
        data_type: text
      - name: org_tipo
        description: >
          Tipo do órgão na origem, de 0 a 9: 1 em 418 órgãos, 2 em 166, 3 em
          58, 9 em 89. O significado dos códigos não está em tabela de domínio.
        data_type: integer
      - name: org_status
        description: >
          Situação do órgão: 1 ativo, 0 desativado.
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: False
              config:
