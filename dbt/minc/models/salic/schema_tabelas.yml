    description: >
      Uma linha por órgão: unidade da estrutura do MinC, superintendência do
      IPHAN, entidade vinculada ou comissão como a CNIC. São 733 órgãos, 716
      ativos, com hierarquia por org_superior. É o domínio de usu_orgao e de
      uog_orgao. Cada órgão tem uma pessoa jurídica em silver_tabelas_pessoas.
      11 org_superior apontam para órgão que não existe.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_orgaos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: org_codigo
        description: >
          Código do órgão, unidade da estrutura do MinC ou entidade vinculada.
          Chave do cadastro de órgãos.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: org_pessoa
        description: >
          Pessoa jurídica do cadastro corporativo que corresponde ao órgão.
          Liga com silver_tabelas_pessoas.pes_codigo.
        data_type: integer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_tabelas_pessoas')
                field: pes_codigo
      - name: org_gerente
        description: >
          Órgão gerente, o que administra o cadastro deste órgão.
