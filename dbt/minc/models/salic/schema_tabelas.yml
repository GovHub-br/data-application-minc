      Uma linha por permissão: um usuário interno, num órgão, com um grupo de
      acesso. É a tabela que diz quem pode fazer o quê nos sistemas internos,
      inclusive no SalicWeb e no PRONAC. São 30.401 permissões para 6.992
      usuários, 536 órgãos e 112 grupos, sem repetição e sem órfão. Por
      sistema, as mais comuns são SalicWeb, 11.085; SAD, 10.090; e PRONAC,
      7.505.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_usuariosxorgaosxgrupos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    tests:
      - unique:
          arguments:
            column_name: "uog_usuario || '-' || uog_orgao || '-' || uog_grupo"
    columns:
      - name: uog_usuario
        description: >
          Usuário que recebe a permissão. Liga com
          silver_tabelas_usuarios.usu_codigo.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_tabelas_usuarios')
                field: usu_codigo
      - name: uog_orgao
        description: >
          Órgão em que a permissão vale. Liga com
          silver_tabelas_orgaos.org_codigo.
        data_type: integer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_tabelas_orgaos')
                field: org_codigo
      - name: uog_grupo
        description: >
          Grupo de acesso concedido. Liga com silver_tabelas_grupos.gru_codigo.
        data_type: integer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_tabelas_grupos')
                field: gru_codigo
      - name: uog_status
        description: >
          Situação da permissão: 1 ativa, 20.852; 2, 8.774; 0, 775. A view
          silver_tabelas_vwusuariosorgaosgrupos trata 1 como ativa e o resto
          como inativa.
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: False
              config:
                severity: warn
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

