version: 2

# Silvers do banco tabelas do SALIC: o cadastro corporativo dos sistemas
# internos do MinC (usuários servidores, órgãos, grupos de acesso, menus,
# pessoas, e-mails) e a base de CEP. Medições de 29/10/2026 na Bronze
# (salic.bronze_tabelas_*), por agregados, sem valor de linha. As cópias
# *_ares e *_minc11 são fotografias antigas de outros ambientes; a tabela
# sem sufixo é a viva.

models:
  - name: silver_tabelas_autorizados
    description: >
      Uma linha por autorização de um operador para executar uma rotina de
      manutenção do cadastro: usuários, pessoas ou e-mails. São 604
      autorizações para 52 operadores.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_autorizados'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - aut_operacao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: aut_identificacao
        description: >
          CPF do operador autorizado, 11 dígitos. Em 5 linhas é um asterisco,
          que vale para todos.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: aut_procedure
        description: >
          Rotina autorizada: spManutencaoUsuarios, 516; spManutencaoEmails, 46;
          spManutencaoPessoas, 42.
        data_type: text
      - name: aut_operacao
        description: >
          Operação da rotina que o operador pode executar, em texto.
        data_type: text
      - name: aut_codigo
        description: >
          Código complementar da autorização, de 0 a 8. O significado não está
          documentado.
        data_type: integer
      - name: aut_status
        description: >
          Situação da autorização: 1 em todas as linhas.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_avisos
    description: >
      Uma linha por aviso exibido aos usuários internos. Tem 1 aviso, de
      janeiro de 2001. Sem uso atual.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_avisos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: avi_destino
        description: >
          Destino do aviso, 0 na única linha.
        data_type: integer
      - name: avi_codigo
        description: >
          Código do aviso, 5 na única linha.
        data_type: integer
      - name: avi_tipo
        description: >
          Tipo do aviso, 0 na única linha.
        data_type: integer
      - name: avi_data_inicio
        description: >
          Data em que o aviso começa a aparecer.
        data_type: timestamp
      - name: avi_data_limite
        description: >
          Data em que o aviso deixa de aparecer.
        data_type: timestamp
      - name: avi_texto
        description: >
          Texto do aviso exibido aos usuários.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_bairros
    description: >
      Uma linha por bairro da base de CEP: 20.420 bairros, cada um num
      município de silver_tabelas_localidades.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_bairros'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: bai_codigo
        description: >
          Código do bairro. Chave da tabela.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: bai_localidade
        description: >
          Município do bairro. Liga com silver_tabelas_localidades.loc_codigo.
        data_type: integer
      - name: bai_nome
        description: >
          Nome do bairro, como na base de CEP.
        data_type: text
      - name: bai_status
        description: >
          Situação do bairro: 1 em todas as linhas.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_cadastro
    description: >
      Uma linha por pessoa numa lista de contatos, com nome, lotação por sigla,
      telefone e e-mail. São 983 linhas, em 111 lotações. Não liga por código a
      nenhuma outra tabela; pelo conteúdo, é uma lista de ramais antiga.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_cadastro'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: nome
        description: >
          Nome da pessoa da lista de contatos.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: lotacao
        description: >
          Lotação, como caminho de siglas.
        data_type: text
      - name: telefone
        description: >
          Telefone de trabalho, em texto livre. Vazio em 38.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: email
        description: >
          E-mail da pessoa da lista de contatos.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_categorias_pessoa
    description: >
      Uma linha por categoria de pessoa: 4, 0 não informada, 1 órgãos internos
      do MinC, 2 delegacias regionais e 3 entidades vinculadas.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_categorias_pessoa'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: ctp_codigo
        description: >
          Código da categoria, de 0 a 3.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: ctp_descricao
        description: >
          Nome da categoria de pessoa.
        data_type: text
      - name: ctp_orgao_gerente
        description: >
          Órgão gerente da categoria. Vazio nas 4 linhas.
        data_type: integer
      - name: ctp_status
        description: >
          Situação da categoria: 1 em todas.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_cdpe
    description: >
      Uma linha por pessoa numa lista sem nome de colunas: campo2 tem um nome e
      campo3 um CPF de 11 dígitos; campo4 a campo6 estão vazios. São 33 linhas.
      O propósito não está documentado.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_cdpe'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: campo2
        description: >
          Nome de pessoa, nas 33 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: campo3
        description: >
          CPF, 11 dígitos sem máscara, nas 33 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: campo4
        description: >
          Coluna sem uso: vazia nas 33 linhas.
        data_type: text
      - name: campo5
        description: >
          Coluna sem uso: vazia nas 33 linhas.
        data_type: text
      - name: campo6
        description: >
          Coluna sem uso: vazia nas 33 linhas.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_ect_bairros
    description: >
      Uma linha por bairro na forma da carga dos Correios: chave da base de
      CEP, nome abreviado e o bairro correspondente em silver_tabelas_bairros.
      Tem os mesmos 20.420 bairros, todos ligados.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_ect_bairros'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: ectb_estruturado
        description: >
          Localidade do bairro no formato estruturado da base de CEP.
        data_type: text
      - name: ectb_hash
        description: >
          Chave de 8 caracteres do bairro na base de CEP dos Correios. É
          identificador de carga, não senha.
        data_type: text
      - name: ectb_abreviado
        description: >
          Nome abreviado do bairro, como os Correios usam no endereçamento.
        data_type: text
      - name: ectb_cod_bairro
        description: >
          Bairro correspondente. Liga com silver_tabelas_bairros.bai_codigo,
          sem órfão.
        data_type: integer
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('silver_tabelas_bairros')
                field: bai_codigo
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_ect_localidades
    description: >
      Uma linha por localidade na forma da carga dos Correios: 9.626
      municípios, distritos e povoados, com UF, nome sem acento e a chave da
      base de CEP.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_ect_localidades'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: ectl_uf
        description: >
          UF da localidade, em sigla.
        data_type: text
      - name: ectl_hash
        description: >
          Chave de 8 caracteres da localidade na base de CEP dos Correios. É
          identificador de carga, não senha.
        data_type: text
      - name: ectl_local
        description: >
          Nome da localidade em maiúsculas, sem acento.
        data_type: text
      - name: ectl_tipo_local
        description: >
          Tipo da localidade nos Correios: M município, 4.978; D distrito,
          3.993; P povoado, 655.
        data_type: text
      - name: ectl_estruturado
        description: >
          Código estruturado da localidade, que liga com
          silver_tabelas_localidades.loc_estruturado.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_ect_recusados
    description: >
      Uma linha por registro da carga dos Correios que a origem recusou ao
      importar: 65 bairros, localidades e logradouros, com o motivo no texto da
      localidade.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_ect_recusados'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          derivadas_nao_identificantes:
            - ectr_cep5
            - ectr_cep8
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: ectr_tipo
        description: >
          O que foi recusado: B bairro, 48; L localidade, 16; E logradouro, 1.
        data_type: text
      - name: ectr_uf
        description: >
          UF do registro recusado.
        data_type: text
      - name: ectr_cep5
        description: >
          Prefixo de 5 dígitos do CEP recusado.
        data_type: text
      - name: ectr_cep8
        description: >
          CEP completo recusado, 8 dígitos.
        data_type: text
      - name: ectr_local
        description: >
          Localidade do registro recusado, com o motivo entre parênteses.
        data_type: text
      - name: ectr_tipo_local
        description: >
          Tipo da localidade recusada nos Correios: D distrito ou P povoado.
        data_type: text
      - name: ectr_nome
        description: >
          Nome do logradouro ou da localidade recusada.
        data_type: text
      - name: ectr_bairro
        description: >
          Bairro do registro recusado.
        data_type: text
      - name: ectr_bairro_final
        description: >
          Bairro final do registro recusado. Preenchido em 1 linha.
        data_type: text
      - name: ectr_tipo_lograd
        description: >
          Tipo do logradouro recusado. Preenchido em 1 linha.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_emails
    description: >
      Uma linha por conta de e-mail do domínio minc.gov.br: pessoal ou
      institucional, com o CPF do responsável. São 2.224 contas, 729 ativas.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_emails'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: eml_id
        description: >
          Código da conta de e-mail. Chave da tabela.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: eml_conta
        description: >
          Nome da conta, a parte antes do @.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eml_email
        description: >
          Endereço de e-mail completo.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eml_dominio
        description: >
          Domínio do e-mail: minc.gov.br em todas as linhas.
        data_type: text
      - name: eml_tipo
        description: >
          Tipo da conta: P pessoal, 1.873; I institucional, 333; A e S, 9 cada,
          sem significado confirmado. Pessoal e institucional batem com as
          listas de silver_tabelas_listapessoais e
          silver_tabelas_listainstitucionais.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['A', 'I', 'P', 'S']
              config:
                severity: warn
      - name: eml_cpf
        description: >
          CPF do responsável pela conta, 11 dígitos. Em 2.200 das 2.224 contas
          é um usuário de silver_tabelas_usuarios.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eml_orgao
        description: >
          Órgão do responsável pela conta, código de silver_tabelas_orgaos.
        data_type: integer
      - name: eml_aliases
        description: >
          Apelidos da conta, outros nomes que entregam na mesma caixa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eml_utilizacao
        description: >
          Uso declarado da conta institucional. Preenchido em 33 linhas.
        data_type: text
      - name: eml_status
        description: >
          Situação da conta: 1 em 729 contas, que são as das listas de contas
          ativas; 9 em 1.477 e 2 em 18, sem significado confirmado.
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 9]
                quote: False
              config:
                severity: warn
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_eventos
    description: >
      Uma linha por evento do registro de auditoria do cadastro de usuários e
      e-mails: quem fez, o quê, sobre quem e quando. São 220.280 eventos, de
      2002 a 2026, com o pico entre 2009 e 2013 e menos de mil por ano desde
      2019. O tipo do evento (eve_operacao) se traduz por
      silver_tabelas_tabelas com tab_tipo 100: os mais comuns são 1016 senha
      confirmada pelo usuário, 62.649, e 1017 senha alterada pelo usuário,
      47.655.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_eventos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - eve_operacao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: eve_datahora
        description: >
          Data e hora do evento, de 2002 a 2026.
        data_type: timestamp
      - name: eve_usuario
        description: >
          CPF de quem fez a ação, 11 dígitos. Em 218.334 eventos é um usuário
          de silver_tabelas_usuarios.usu_identificacao. Não é o código do
          usuário. Vazio em 776.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eve_operacao
        description: >
          Tipo do evento, código de silver_tabelas_tabelas com tab_tipo 100,
          como 1002 usuário desativado ou 1011 órgão ou grupo autorizado para o
          usuário.
        data_type: integer
      - name: eve_codigo
        description: >
          Código do usuário afetado pela ação. Em 203.716 eventos existe em
          silver_tabelas_usuarios.usu_codigo; vale 0 em 7.688.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eve_parametros
        description: >
          Parâmetros da operação, em texto. Em 171.487 eventos é um CPF de 11
          dígitos.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: eve_resultado
        description: >
          Resultado da operação: 0 em 218.756 eventos e 1 em 1.524. Pela
          proporção, 1 é falha; não confirmado.
        data_type: integer
      - name: eve_texto
        description: >
          Texto livre do evento. Preenchido em 12.275 linhas, com poucos
          valores distintos, entre eles nomes de pessoa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_funcoes
    description: >
      Uma linha por função ou cargo do cadastro corporativo, como diretor ou
      coordenador. São 7.185, todas ativas, com descrição em texto livre.
      silver_tabelas_pessoasxfuncoes liga pessoas a funções, mas tem só 6
      linhas.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_funcoes'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: fun_codigo
        description: >
          Código da função. Chave da tabela.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: fun_descricao
        description: >
          Nome da função, em texto livre. Vazio em 1.
        data_type: text
      - name: fun_status
        description: >
          Situação da função: 1 em todas as linhas.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_tabelas_grupos
    description: >
      Uma linha por grupo de acesso, o perfil que dá permissões num sistema
      interno. São 131 grupos em 20 sistemas, 130 ativos. Todo gru_sistema
      existe em silver_tabelas_sistemas.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_grupos'
        governance:
          produto_dados: 'SALIC — Rouanet'
