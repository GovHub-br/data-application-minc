  - name: silver_tabelas_usuarios
    description: >
      Uma linha por conta de usuário interno dos sistemas do MinC, servidor ou
      colaborador, identificada por usu_codigo e pelo CPF em usu_identificacao,
      ambos únicos. São 11.765 contas, 10.491 ativas. Não é o login do público
      externo, que fica em silver_controledeacesso_sgcacesso: as duas faixas de
      código se sobrepõem, então confira a tabela certa antes de cruzar um
      idusuario do banco sac.


      Toda conta tem pessoa em silver_tabelas_pessoas e órgão em
      silver_tabelas_orgaos, sem órfão. A senha, a senha do SQL Server e os
      três códigos de segurança da conta (usu_seguranca, usu_validacao e
      usu_controle, calculados por função do SQL Server com a senha
      criptografada) existem na Bronze e foram retirados desta silver.
    config:
      tags: [silver, salic, tabelas]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_tabelas_usuarios'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - usu_duracao_senha
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: usu_codigo
        description: >
          Código do usuário interno, servidor ou colaborador do MinC. É a chave
          do cadastro de usuários dos sistemas internos e o que
          usuariosxorgaosxgrupos.uog_usuario grava.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: usu_identificacao
        description: >
          CPF do usuário, 11 dígitos sem máscara. É o login dos sistemas
          internos. Único em silver_tabelas_usuarios.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: usu_nome
        description: >
          Nome curto do usuário, cortado em 20 caracteres. O nome inteiro está
          em usu_nome_completo ou em silver_tabelas_v_pessoas_nome_completo.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: usu_pessoa
        description: >
          Pessoa do cadastro corporativo que corresponde ao usuário. Liga com
          silver_tabelas_pessoas.pes_codigo.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_tabelas_pessoas')
                field: pes_codigo
      - name: usu_orgao
        description: >
          Órgão de lotação do usuário. Liga com
          silver_tabelas_orgaos.org_codigo.
        data_type: integer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_tabelas_orgaos')
                field: org_codigo
      - name: usu_sala
        description: >
          Sala do usuário. Vale 0 em todas as linhas: não é preenchida.
        data_type: integer
      - name: usu_ramal
        description: >
          Ramal do usuário. Vale 0 em todas as linhas: não é preenchido.
        data_type: integer
      - name: usu_nivel
        description: >
          Nível do usuário na origem. Vale 9 em todas as linhas, o valor que o
          SalicWeb grava ao criar a conta.
        data_type: integer
      - name: usu_exibicao
        description: >
          Indicador de exibição do usuário, S em todas as linhas.
        data_type: text
      - name: usu_sql_login
        description: >
          Login do usuário no SQL Server. Em parte das contas é o próprio CPF,
          então é dado pessoal.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: usu_duracao_senha
        description: >
          Validade da senha, em dias, somada à data da troca para calcular
          usu_data_validade. Não é a senha: 30 dias é o padrão.
        data_type: integer
      - name: usu_data_validade
        description: >
          Data em que a senha atual expira.
        data_type: timestamp
      - name: usu_limite_utilizacao
        description: >
          Data limite de uso da conta, gravada na criação.
        data_type: timestamp
      - name: usu_status
        description: >
          Situação da conta: 1 ativa, 0 inativa, 2 em 1 conta. O login do
          SalicWeb só aceita 1.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: False
              config:
                severity: warn
      - name: usu_data_atualizacao
        description: >
          Data da última atualização da conta. Há valores de 1900, sentinela de
          data ausente.
        data_type: timestamp
      - name: usu_conta_nt
        description: >
          Código da conta de rede Windows da origem: -1, 0 ou um valor único.
          Vazio em parte das linhas; não identifica a pessoa sozinho.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: usu_dica_intranet
        description: >
          Código da página inicial da intranet do usuário. O SalicWeb grava
          10009 ao criar a conta.
        data_type: integer
      - name: usu_localizacao
        description: >
          Prédio de trabalho do usuário: 0 não informado, 1 Esplanada/Ed. Sede,
          2 SCS/Ed. Vera Cruz, 3 outros estados, 4 SCS/Ed. Parque Cidade. A
          tradução vem de silver_tabelas_vwusuarios.
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
                quote: False
              config:
                severity: warn
      - name: usu_andar
        description: >
          Andar de trabalho do usuário, em texto livre.
        data_type: text
      - name: usu_telefone
        description: >
          Telefone de trabalho do usuário, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

