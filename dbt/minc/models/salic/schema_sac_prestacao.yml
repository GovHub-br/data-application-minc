  - name: silver_sac_tbcomprovantetrimestral
    description: >
      Tabela responsável por registrar comprovantes trimestrais de execução física e
      financeira. Camada Silver tipada a partir de salic.bronze_sac_tbcomprovantetrimestral.
    columns:
      - name: idcomprovantetrimestral
        description: >
          Identifica o relatório trimestral entregue pelo proponente.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: idpronac
        description: >
          Identiticador único de uma proposta de um projeto cultural no Ministério da Cultura
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtcomprovante
        description: >
          Data em que foi cadastrado o relatório trimestral (comprovante).
        data_type: timestamp
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: dtinicioperiodo
        description: >
          Data inicial do período de cadastro do relatório trimestral. (Comprovante).
        data_type: timestamp
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtfimperiodo
        description: >
          Data do fim do período do relatório trimestral.
        data_type: timestamp
        tests:
          - not_null   # inferido do perfil do banco
      - name: dsetapasexecutadas
        description: >
          Descrição das etapas do projeto executado.
        data_type: text
      - name: dsacessibilidade
        description: >
          descrição das medidas de acessibilidade implantadas até o momento do relatório.
        data_type: text
      - name: dsdemocratizacaoacesso
        description: >
          descrição das medidas de democratização de acesso.
        data_type: text
      - name: dsimpactoambiental
        description: >
          Descrição das medidas efetivadas para não haver impacto ambiental na execução
          doprojeto.
        data_type: text
      - name: sicomprovantetrimestral
        description: >
          Situação dos comprovantes trimestrais: 1 - Salvo pelo proponente, 2 - Enviado pelo
          Proponente, 3 - Encaminhado pelo técnico de Acompanhamento, 4 - Em análise pelo
          técnico, 5 - Finalizado pelo técnico, 6 - Finalizado pelo coordenador.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrcomprovantetrimestral
        description: >
          Número de ordem, a sequência do relatório trimestral.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: idcadastrador
        description: >
          É o usuário logado no sistema do lado do proponente (Usuário externo). O controle
          de acesso será feito através do banco controle de acesso na tabela SGCAcesso.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dsparecertecnico
        description: >
          Descrição do parecer emitido pelo técnico de acompanhamento do Minc.
        data_type: text
      - name: dsrecomendacao
        description: >
          São as recomendações do técnico de acompanhamento ao proponente.
        data_type: text
      - name: idtecnicoavaliador
        description: >
          É o usuário logado no sistema do lado do Minc (Usuário interno). O controle de
          acesso será feito através do banco Tabelas tabela Usuarios.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a linha. Não
          é campo de negócio.
        data_type: integer

