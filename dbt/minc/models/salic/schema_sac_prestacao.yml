version: 2

# Silvers do assunto prestação de contas e readequação do banco sac do SALIC:
# relatórios de execução e cumprimento do objeto, laudo final, conformidade
# financeira, readequação e prorrogação do projeto e as views de alteração.
# Medições de 29/10/2026 na Bronze (salic.bronze_sac_*), por agregados, sem
# valor de linha.

models:
  - name: silver_sac_tbreadequacao
    description: >
      Uma linha por pedido de readequação de um projeto: mudar planilha, prazo,
      local, objetivo, proponente ou outro aspecto depois da aprovação. São
      104.820 pedidos de 20.522 projetos, desde 2013; uma data vai a 2091,
      digitada errada. O tipo do pedido não tem tabela de domínio ingerida (ver
      idtiporeadequacao). siencaminhamento é a etapa do pedido, de
      sac.tbTipoEncaminhamento, também não ingerida; 15 é solicitação
      finalizada pelo MinC. stestado true marca 96.184 pedidos.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbreadequacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - iddocumento
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idreadequacao
        description: >
          Identificador do pedido. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idtiporeadequacao
        description: >
          Tipo da readequação, de tbtiporeadequacao, que não é ingerida; os
          nomes vêm de silver_sac_vwpareceresdereadequacao: 2 planilha
          orçamentária, 13 período de execução, 11 plano de distribuição, 16
          objetivos, 9 local de realização, 23 transferência de recursos entre
          projetos, entre outros. O 1, com 23.583 pedidos, não aparece na view
          e fica sem nome.
        data_type: integer
      - name: dtsolicitacao
        description: >
          Data do pedido, de 2013 a 2026, com uma data de 2091 digitada errada.
        data_type: timestamp
      - name: idsolicitante
        description: >
          Agente que pediu, normalmente o proponente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dsjustificativa
        description: >
          Justificativa, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: dssolicitacao
        description: >
          O que foi pedido, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: iddocumento
        description: >
          Documento anexado ao pedido.
        data_type: integer
      - name: idavaliador
        description: >
          Avaliador designado, usuário interno ou parecerista.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtavaliador
        description: >
          Data em que o pedido foi avaliado.
        data_type: timestamp
      - name: dsavaliacao
        description: >
          Texto da avaliação, em HTML.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: statendimento
        description: >
          Resultado do atendimento do pedido: D em 63.688 (2 em minúscula), N
          em 37.574, E em 2.905, I em 644, A em 9; sem domínio ingerido.
        data_type: text
      - name: siencaminhamento
        description: >
          Etapa do pedido, código de sac.tbTipoEncaminhamento, não ingerida. O
          mais comum é 15, solicitação finalizada pelo MinC, com 73.052.
        data_type: integer
      - name: stanalise
        description: >
          Situação da análise. Preenchida em 19.
        data_type: text
      - name: idnrreuniao
        description: >
          Reunião da CNIC que apreciou o pedido.
        data_type: integer
      - name: stestado
        description: >
          Se o pedido está ativo: true em 96.184.
        data_type: boolean
      - name: dtenvio
        description: >
          Data de envio, preenchida só em duas datas de dezembro de 2014.
        data_type: timestamp
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

