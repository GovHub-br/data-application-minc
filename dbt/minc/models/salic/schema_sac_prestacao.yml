  - name: silver_sac_tbhistoricoalteracaoprojeto
    description: >
      Uma linha por alteração registrada num projeto: situação, nome, área,
      segmento, datas de execução ou enquadramento, com a providência. São
      284.325 alterações de 70.497 projetos, de 2013 a 2026. Cada linha só
      preenche o campo que mudou.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbhistoricoalteracaoprojeto'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - idhistoricoalteracaoprojeto
            - dthistoricoalteracaoprojeto
            - dshistoricoalteracaoprojeto
            - idenquadramento
            - iddocumento
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idhistoricoalteracaoprojeto
        description: >
          Identificador da alteração. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: cdarea
        description: >
          Área cultural do projeto, código de silver_sac_area: 1 Artes Cênicas,
          2 Audiovisual, 3 Música, 4 Artes Visuais, 5 Patrimônio Cultural, 6
          Humanidades, 7 Artes Integradas, 9 Museus e Memória.
        data_type: text
      - name: cdsegmento
        description: >
          Segmento cultural, código de silver_sac_vsegmento, em texto porque há
          códigos com letra. O código só é único junto com a área.
        data_type: text
      - name: nmprojeto
        description: >
          Nome do projeto cultural.
        data_type: text
      - name: cdsituacao
        description: >
          Situação nova, código de sac.situacao. Preenchida em 215.312.
