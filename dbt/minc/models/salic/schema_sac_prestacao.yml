      - name: dtfimexecucao
        description: >
          Data de fim da execução do projeto.
        data_type: timestamp
      - name: idlogon
        description: >
          Usuário interno que alterou.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: iddocumento
        description: >
          Documento da alteração. Vazio em todas.
        data_type: integer
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idenquadramento
        description: >
          Enquadramento alterado. Preenchido em 598.
        data_type: integer
      - name: dthistoricoalteracaoprojeto
        description: >
          Data em que o projeto foi alterado.
        data_type: timestamp
      - name: dshistoricoalteracaoprojeto
        description: >
          Descrição da alteração, em texto livre.
        data_type: text
      - name: cgccpf
        description: >
          CPF ou CNPJ novo do proponente. Preenchido em 231.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dsprovidenciatomada
        description: >
          Providência registrada na alteração.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

