version: 2

# Silvers do assunto documentos e histórico do banco sac do SALIC: documentos
# exigidos e entregues, certidões, despachos, documentos assinados, tramitação,
# notificações e mensagens ao proponente, portarias e os históricos de situação,
# carta, unidade e inabilitação. Medições de 29/10/2026 na Bronze
# (salic.bronze_sac_*), por agregados, sem valor de linha.

models:
  - name: silver_sac_auditoria
    description: >
      Uma linha por comando registrado pela auditoria do SQL Server sobre
      objetos do banco sac: tabelas (U), views (V), funções (FN) e
      procedimentos (P). São 989.565 comandos sobre cerca de 380 objetos; os
      mais auditados são vwAnexarDocumentoEdital (153.537) e Projetos (85.689).
      Não tem data nem usuário. O texto do comando pode trazer valores de
      parâmetro, inclusive CPF ou CNPJ.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_auditoria'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: database_name
        description: >
          Banco auditado: sac em todas.
        data_type: text
      - name: schema_name
        description: >
          Schema auditado: dbo em todas.
        data_type: text
      - name: class_type
        description: >
          Tipo do objeto: U tabela, V view, FN função, P procedimento, com
          espaço à direita nos de uma letra.
        data_type: text
      - name: object_name
        description: >
          Nome do objeto auditado, como Projetos ou vwAnexarDocumentoEdital.
        data_type: text
      - name: statement
        description: >
          Comando SQL auditado, em texto. Quase todos são SELECT.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_certidoesnegativas
    description: >
      Uma linha por certidão negativa apresentada por um proponente para um
      projeto: tipo, emissão e validade. São 98.908 certidões de 35.215
      proponentes e 44.030 projetos; as datas vão de 1998 a 9200, com erro de
      digitação.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_certidoesnegativas'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: cgccpf
        description: >
          CPF ou CNPJ do proponente, sem máscara, em texto para manter o zero à
          esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: codigocertidao
        description: >
          Tipo da certidão: 49 (38.316), 244 (12.458), 51, 52, 50, 70, 71 e
          247. Sem domínio ingerido; os mesmos números na verificação do sac
          são de outro grupo e não se aplicam.
        data_type: integer
      - name: dtemissao
        description: >
          Data de emissão da certidão.
        data_type: timestamp
      - name: dtvalidade
        description: >
          Data de validade da certidão.
        data_type: timestamp
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idcertidoesnegativas
        description: >
          Identificador da certidão. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: cdprotocolonegativa
        description: >
          Protocolo da certidão. Vazio em todas as linhas.
        data_type: text
      - name: cdsituacaocertidao
        description: >
          Situação da certidão: 1 em 18.974, 0 em 19; vazia no resto. Sem
          domínio ingerido.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

