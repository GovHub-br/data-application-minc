        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: codigo
        description: >
          Tipo do documento: 2 (834), 1 (1.140), 6, 5 e 4. Sem domínio
          ingerido.
        data_type: integer
      - name: seq
        description: >
          Ordem do documento no projeto, de 0 a 6.
        data_type: integer
      - name: campo1
        description: >
          Número do documento.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: campo2
        description: >
          Órgão emissor, como sigla e UF.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: campo3
        description: >
          Data de emissão, em dd/mm/aaaa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: campo4
        description: >
          Campo livre. Preenchido em 1.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: campo5
        description: >
          Campo livre. Vazio em todas.
        data_type: text
      - name: status
        description: >
          Se o documento está válido: true em 409.
        data_type: boolean
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

