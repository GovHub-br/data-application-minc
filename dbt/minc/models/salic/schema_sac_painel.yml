version: 2

# Silvers do assunto painéis do banco sac do SALIC: as views que alimentam as
# telas de trabalho do SalicWeb (filas de admissibilidade, análise técnica,
# vinculadas, readequação, assinatura, homologação e prestação de contas). São
# retratos do momento da carga, não histórico. Medições de 30/10/2026 na Bronze
# (salic.bronze_sac_*), por agregados, sem valor de linha.

models:
  - name: silver_sac_vwpaineladequacaorealidadeexecucao
    description: >
      Uma linha por projeto na fila de adequação à realidade de execução, com
      valores e técnico. São 39 projetos. É uma fila de tela do SalicWeb:
      retrata o estado no momento da carga e muda a cada carga.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_vwpaineladequacaorealidadeexecucao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
      - name: pronac
        description: >
          PRONAC do projeto, ano em dois dígitos seguido do sequencial, em
          texto com zero à esquerda.
        data_type: text
      - name: nomeprojeto
        description: >
          Nome do projeto cultural.
        data_type: text
      - name: cnpjcpf
        description: >
          CPF ou CNPJ do proponente, sem máscara, em texto para manter o zero à
          esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: proponente
        description: >
          Nome do proponente, pessoa ou entidade.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: ufprojeto
        description: >
          UF do projeto, em sigla.
        data_type: text
      - name: dstipologia
        description: >
          Tipologia da proposta por extenso.
        data_type: text
      - name: dsplanoexecucaoimediata
        description: >
          Plano de execução por extenso.
        data_type: text
      - name: area
        description: >
          Área cultural do projeto, por extenso.
        data_type: text
      - name: segmento
        description: >
          Segmento cultural do projeto, por extenso.
        data_type: text
      - name: dtinicioexecucao
        description: >
          Data de início da execução do projeto.
        data_type: timestamp
      - name: dtfimexecucao
        description: >
          Data de fim da execução do projeto.
        data_type: timestamp
      - name: orgao
        description: >
          Unidade responsável, código de silver_tabelas_orgaos.
        data_type: text
      - name: idsecretaria
        description: >
          Secretaria: 160 SAV ou 251 SEFIC, na maioria.
        data_type: text
      - name: dtsituacao
        description: >
          Data da situação atual.
        data_type: timestamp
      - name: qtdias
        description: >
          Dias desde a situação.
        data_type: integer
      - name: idtecnico
        description: >
          Técnico responsável, usuário interno.
        data_type: integer
        meta:
