      Uma linha por projeto de intercâmbio do FNC na pauta de reunião, com
      evento, país e valores. Tem 1 linha, de 2010: sem uso atual.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_vpautadereuniaofncintercambio'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: nrprojeto
        description: >
          PRONAC do projeto, ano em dois dígitos seguido do sequencial, em
          texto com zero à esquerda.
        data_type: text
      - name: nomeprojeto
        description: >
          Nome do projeto cultural.
        data_type: text
      - name: evento
        description: >
          Nome do evento de intercâmbio.
        data_type: text
      - name: entidadepromotora
        description: >
          Entidade que promove o evento.
        data_type: text
      - name: cidadeevento
        description: >
          Cidade onde ocorre o evento.
        data_type: text
      - name: pais
        description: >
          País onde ocorre o evento.
        data_type: text
      - name: processo
        description: >
          Número do processo administrativo.
        data_type: text
      - name: resumoprojeto
        description: >
          Resumo do projeto, em texto livre.
        data_type: text
      - name: parecertecnico
        description: >
          Parecer técnico. Vazio.
        data_type: text
      - name: proponente
        description: >
          Nome do proponente, pessoa ou entidade.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: area
        description: >
          Área cultural do projeto, código de silver_sac_area: 1 Artes Cênicas,
          2 Audiovisual, 3 Música, 4 Artes Visuais, 5 Patrimônio Cultural, 6
          Humanidades, 7 Artes Integradas, 9 Museus e Memória.
        data_type: text
      - name: cidade
        description: >
          Cidade do proponente.
        data_type: text
      - name: uf
        description: >
          UF do proponente ou da proposta.
        data_type: text
      - name: resumocurriculo
        description: >
          Resumo do currículo do proponente.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: vlnormal
        description: >
          Valor da passagem normal, em reais.
        data_type: text
      - name: vlpromocional
        description: >
          Valor da passagem promocional, em reais.
        data_type: text
      - name: vlnormaltotal
        description: >
          Valor total normal, em reais.
        data_type: text
      - name: vlpromocionaltotal
        description: >
          Valor total promocional, em reais.
        data_type: text
      - name: dtinicio
        description: >
          Data de início do evento.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

