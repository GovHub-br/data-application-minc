version: 2

# Silvers do assunto Programa Rouanet, pessoas, CNIC e editais do banco sac do
# SALIC: os programas de seleção pública do Programa Rouanet (propostas,
# avaliação, recurso, resultado), o cadastro antigo de interessados e as views
# de proponentes, a pauta antiga da CNIC e os editais do FNC. Medições de
# 29 e 30/10/2026 na Bronze (salic.bronze_sac_*), por agregados, sem valor de linha.

models:
  - name: silver_sac_cnic
    description: >
      Uma linha por projeto pautado numa reunião antiga da CNIC, com o tipo de
      pauta e o resultado. São 17.491 pautas de 15.420 projetos, de 2004 a 2007
      (reuniões 112 a 145). O sistema atual guarda a pauta em
      silver_sac_tbpauta.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_cnic'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: nrreuniao
        description: >
          Número da reunião da CNIC.
        data_type: integer
      - name: dtreuniao
        description: >
          Data da reunião da CNIC.
        data_type: timestamp
      - name: tipodepauta
        description: >
          Tipo de pauta: 0 em 15.402, 1, 2 e 3 nas outras. Sem domínio
          ingerido.
        data_type: integer
      - name: resultadodaanalise
        description: >
          Resultado: 0 em 15.769, 4 em 775, 2 em 487, 1 em 459. Sem domínio
          ingerido.
        data_type: integer
      - name: observacao
        description: >
          Observação, em texto livre. Preenchida em 10.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_vpautadereuniaofncintercambio
