    columns:
      - name: id
        description: Identificador da linha na API. Chave da tabela.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: idaprovacao
        description: Identificador da aprovação no SALIC.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: idpronac
        description: Identificador interno do PRONAC.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrpronac
        description: Número PRONAC (zero à esquerda). Mantido text.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmprojeto
        description: Nome do projeto.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dsarea
        description: Área cultural (descrição).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dssegmento
        description: Segmento cultural (descrição).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: tpaprovacao
        description: Tipo de aprovação (Aprovação Inicial, Prorrogação, ...).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: resumoaprovacao
        description: Resumo/parecer da aprovação. Texto longo.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: portariaaprovacao
        description: Número da portaria de aprovação (ex. 0004/11).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtportariaaprovacao
        description: Data da portaria (AAAA-MM-DD).
        data_type: date
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtpublicacaoaprovacao
        description: Data de publicação da portaria (AAAA-MM-DD).
        data_type: date
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtiniciocaptacao
        description: Início do período de captação autorizado. ~96% preenchida.
        data_type: date
      - name: dtfimcaptacao
        description: Fim do período de captação autorizado. ~96% preenchida.
        data_type: date
      - name: vlaprovado
        description: Valor aprovado para captação, em reais.
        data_type: numeric
        tests:
          - not_null   # inferido do perfil do banco
      - name: hashregistro
        description: Hash SHA (hex, 64 caracteres) do registro na API.
        data_type: text
      - name: dtatualizacao
        description: Instante da carga do registro pela API. Não é data de negócio.
        data_type: timestamp
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a
          linha (ADR 0005). Não é campo de negócio.
        data_type: integer
