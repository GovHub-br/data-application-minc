  - name: silver_sac_tbapiincentivos
    description: >
      Uma linha por aporte de incentivo (captação) publicado pela API pública do
      SALIC: quem incentivou qual projeto, quanto e quando. ~669 mil linhas.
      Camada Silver tipada a partir de salic.bronze_sac_tbapiincentivos. Cruza
      com sac__projetos por idpronac.
      Armadilha: `dtatualizacao` não é data de negócio — é o instante da carga da
      API (constante por lote); `dstransferenciarecurso`/`dttransferenciarecurso`
      chegam vazias e `dsbemservico` é constante 'Aporte em conta'.
    columns:
      - name: idcaptacao
        description: Identificador da captação. Chave da tabela.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: idpronac
        description: Identificador interno do PRONAC.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrpronac
        description: Número PRONAC (6 dígitos, zero à esquerda). Mantido text.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmprojeto
        description: Nome do projeto.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrcnpjcpfproponente
        description: CNPJ/CPF do proponente, sem máscara. Dado pessoal; text.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmproponente
        description: Nome do proponente.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrcnpjcpfincentivador
        description: CNPJ/CPF do incentivador, sem máscara. Dado pessoal; text.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmincentivador
        description: Nome do incentivador.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmmunicipioincentivador
        description: Município do incentivador (nome; pode vir 'Não Informado').
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: sgufincentivador
        description: Sigla da UF do incentivador.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: tppessoa
        description: Tipo de pessoa do incentivador (Pessoa Física/Jurídica).
