version: 2

# Silvers do assunto bancário e captação do banco sac do SALIC: contas
# dos projetos, lançamentos e extratos do Banco do Brasil, captação por
# incentivador, empenho e ordem bancária, pagamento de parecerista e as
# views de incentivador, renúncia e inconsistência. Medições de 29/10/2026 na
# Bronze (salic.bronze_sac_*), por agregados, sem valor de linha.

models:
  - name: silver_sac_contabancaria
    description: >
      Uma linha por projeto com as duas contas correntes que o Banco do Brasil,
      código 001, abre para ele: a conta bloqueada, que recebe a captação, e a
      conta livre, de onde o proponente paga as despesas. São 138.482 contas,
      uma por PRONAC, todas no Banco do Brasil. Liga ao projeto por anoprojeto
      e sequencial; 2 não existem em silver_sac_projetos. ocorrenciacb e
      ocorrenciacl são o retorno do banco ao pedido de abertura: 000 é aberta
      sem ocorrência.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_contabancaria'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - ocorrenciacb
            - ocorrenciacl
            - loteremessacb
            - loteremessacl
            - dtloteremessacb
            - dtloteremessacl
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    tests:
      - unique:
          arguments:
            column_name: "anoprojeto || '-' || sequencial"
    columns:
      - name: idcontabancaria
        description: >
          Identificador da conta. Único.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: mecanismo
        description: >
          Mecanismo do projeto: 1, 2 ou 6.
        data_type: text
      - name: banco
        description: >
          Banco: 001, o Banco do Brasil, código 001, em todas as linhas.
        data_type: text
      - name: agencia
        description: >
          Agência bancária, em texto com zero à esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: contabloqueada
        description: >
          Número da conta bloqueada, que recebe a captação.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtloteremessacb
        description: >
          Data do lote de remessa ao banco que pediu a conta bloqueada.
        data_type: timestamp
      - name: loteremessacb
        description: >
          Lote de remessa ao banco da conta bloqueada.
        data_type: text
      - name: ocorrenciacb
        description: >
          Retorno do banco à abertura da conta bloqueada: 000 sem ocorrência,
          137.070; os outros são códigos de ocorrência do banco.
        data_type: text
      - name: contalivre
        description: >
          Número da conta livre, de movimentação.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtloteremessacl
        description: >
          Data do lote de remessa ao banco que pediu a conta livre.
        data_type: timestamp
      - name: loteremessacl
        description: >
          Lote de remessa ao banco da conta livre.
        data_type: text
      - name: ocorrenciacl
        description: >
          Retorno do banco à abertura da conta livre: 000 sem ocorrência,
          137.232.
        data_type: text
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac. Preenchido só em 91: use anoprojeto e
          sequencial.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbcontabancariabloqueada
    description: >
      Uma linha por liberação de recurso da conta bloqueada de um projeto para
      a conta livre. São 8.035 liberações, somando 4,5 bilhões de reais, com o
      servidor que liberou.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbcontabancariabloqueada'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - idcontabancariabloqueada
            - dtliberacao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idcontabancariabloqueada
        description: >
          Identificador da liberação. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: dtliberacao
        description: >
          Data em que o recurso foi liberado para a conta livre.
        data_type: timestamp
      - name: dtbloqueio
        description: >
          Data em que a conta foi bloqueada.
        data_type: timestamp
      - name: tpbloqueio
        description: >
          Tipo do bloqueio: 1 em todas as linhas.
        data_type: text
      - name: idusuarioliberouconta
        description: >
          Servidor que liberou o recurso.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: vlliberado
        description: >
          Valor liberado para a conta livre, em reais.
        data_type: numeric
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbhistoricoexclusaoconta
    description: >
      Uma linha por conta bancária de projeto excluída do cadastro, com as
      contas, o motivo e quem excluiu. São 4.085 exclusões.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbhistoricoexclusaoconta'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - idhistoricoexclusaoconta
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idhistoricoexclusaoconta
        description: >
          Identificador da exclusão. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idcontabancaria
        description: >
          Conta excluída, código de silver_sac_contabancaria.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: banco
        description: >
          Banco, em texto: 001 é o Banco do Brasil, código 001.
        data_type: text
      - name: agencia
        description: >
          Agência bancária, em texto com zero à esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: contabloqueada
        description: >
          Número da conta bloqueada excluída.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: contalivre
        description: >
          Número da conta livre excluída.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtexclusao
        description: >
          Data em que a conta foi excluída do cadastro.
        data_type: timestamp
      - name: motivo
        description: >
          Motivo da exclusão, em texto livre.
        data_type: text
      - name: idusuario
        description: >
          Conta que gravou a linha. Confira a origem antes de cruzar: em
          silver_sac_preprojeto quase todas são contas do SalicWeb
          (silver_controledeacesso_sgcacesso).
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbcontacartao
    description: >
      Uma linha por cartão de pagamento ligado à conta de um projeto, com o
      portador. Tem 3 linhas: o recurso quase não é usado.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbcontacartao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idcontacartao
        description: >
          Identificador do cartão.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idcontabancaria
        description: >
          Conta do projeto, código de silver_sac_contabancaria.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nrcontacartao
        description: >
          Número da conta do cartão.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nrcentrodecusto
        description: >
          Centro de custo do cartão no banco.
        data_type: text
      - name: nrcpfportadordocartao
        description: >
          CPF do portador do cartão.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: cdproponentenobanco
        description: >
          Código do proponente no banco.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: cdportadorcartaonobanco
        description: >
          Código do portador no banco.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: stestado
        description: >
          Se a linha está ativa na origem: true ativa, false inativa ou
          substituída.
        data_type: boolean
      - name: idusuario
        description: >
          Conta que gravou a linha. Confira a origem antes de cruzar: em
          silver_sac_preprojeto quase todas são contas do SalicWeb
          (silver_controledeacesso_sgcacesso).
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_vcontacorrente
    description: >
      Uma linha por conta corrente de projeto, numa view antiga da origem. Tem
      1 linha: não é usada.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_vcontacorrente'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: banco
        description: >
          Banco, em texto: 001 é o Banco do Brasil, código 001.
        data_type: text
      - name: agencia
        description: >
          Agência bancária, em texto com zero à esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: contacorrente
        description: >
          Número da conta corrente.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: artigo
        description: >
          Artigo de enquadramento gravado pela view.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tblancamentobancario
    description: >
      Uma linha por lançamento no extrato da conta de um projeto, como o Banco
      do Brasil envia: TED, transferência, cheque compensado, resgate de
      aplicação, boleto, impostos. São 8.330.253 lançamentos de 42.849
      projetos, de dezembro de 2008 a julho de 2026. Créditos (C) somam 108,9
      bilhões e débitos (D) 108,9 bilhões. É a base do confronto entre o que
      saiu da conta e o que foi comprovado.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tblancamentobancario'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - stcontalancamento
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idlancamentobancario
        description: >
          Identificador do lançamento. Único.
        data_type: integer
        tests:
          - not_null
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idmovimentacaobancariaitem
        description: >
          Linha do arquivo do banco de onde veio o lançamento, em
          silver_sac_tbmovimentacaobancariaitem.
        data_type: integer
      - name: stcontalancamento
        description: >
          Se o lançamento é da conta de movimento (true, 7.514.526) ou da conta
          de captação (false, 815.727). A leitura não está documentada; vem da
          proporção e do fluxo da conta.
        data_type: boolean
      - name: nragencialancamento
        description: >
          Agência da conta, em texto.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nrcontalancamento
        description: >
          Número da conta, em texto.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: cdlancamento
        description: >
          Código do tipo de lançamento do banco, em texto.
        data_type: text
      - name: dslancamento
        description: >
          Descrição do lançamento pelo banco, como TED, CHEQ COMPENSADO ou
          RESGATE AUTOMAT.
        data_type: text
      - name: nrlancamento
        description: >
          Número do documento do lançamento.
        data_type: text
      - name: dtlancamento
        description: >
          Data do lançamento no extrato.
        data_type: timestamp
      - name: vllancamento
        description: >
          Valor do lançamento, em reais, sempre positivo: o sentido está em
          stlancamento.
        data_type: numeric
      - name: stlancamento
        description: >
          Sentido do lançamento: C crédito, 2.276.740; D débito, 6.053.513.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C', 'D']
              config:
                severity: warn
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbmovimentacao
    description: >
      Uma linha por passo de tramitação de uma proposta, com o estado em que
      ela entrou. São 1.682.584 passos de 448.920 propostas, de 2009 a 2026. O
      estado é código da tabela de verificação do banco sac: 95 com o
      proponente, 96 para análise inicial, 97 em conformidade visual ou análise
      documental, 127 com o coordenador, 128 em análise final. 227.517
      propostas têm mais de um passo com stestado true, então ele não marca só
      o estado atual: para o estado de hoje, use o passo mais recente.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbmovimentacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - movimentacao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idmovimentacao
        description: >
          Identificador do passo. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idprojeto
        description: >
          Proposta, idpreprojeto de silver_sac_preprojeto, sem órfão.
        data_type: integer
        tests:
          - not_null
      - name: movimentacao
        description: >
          Estado da proposta, código da tabela de verificação do banco sac: 95,
          96, 97, 127 ou 128.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [95, 96, 97, 127, 128]
                quote: False
              config:
                severity: warn
      - name: dtmovimentacao
        description: >
          Data em que a proposta entrou no estado.
        data_type: timestamp
      - name: stestado
        description: >
          Se o passo está ativo: true em 1.233.664 linhas, mais de uma por
          proposta em 227.517 delas.
        data_type: boolean
      - name: usuario
        description: >
          Usuário interno que gravou a linha.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbmovimentacaobancaria
    description: >
      Uma linha por arquivo de extrato recebido do Banco do Brasil. São 199
      arquivos, de 2011 a 2026, cada um cobrindo um período de movimento.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbmovimentacaobancaria'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          derivadas_nao_identificantes:
            - idusuario
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idmovimentacaobancaria
        description: >
          Identificador do arquivo. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: nrbanco
        description: >
          Banco do arquivo: 001.
        data_type: text
      - name: nmarquivo
        description: >
          Nome do arquivo recebido.
        data_type: text
      - name: dtarquivo
        description: >
          Data em que o arquivo de extrato foi gerado.
        data_type: timestamp
      - name: dtiniciomovimento
        description: >
          Início do período de movimento.
        data_type: timestamp
      - name: dtfimmovimento
        description: >
          Fim do período de movimento.
        data_type: timestamp
      - name: idusuario
        description: >
          Usuário que carregou: um só valor, o do sistema.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbmovimentacaobancariaitem
    description: >
      Uma linha por registro dos arquivos de extrato do Banco do Brasil. São
      18.588.833 registros, de dois tipos: 10.067.875 do tipo 2, cabeçalho da
      conta, com titular, abertura e saldos; e 8.520.958 do tipo 3, movimento,
      de 2010 a 2026. É a maior tabela do banco sac. Os lançamentos já
      interpretados estão em silver_sac_tblancamentobancario.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbmovimentacaobancariaitem'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - dtaberturaconta
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idmovimentacaobancariaitem
        description: >
          Identificador do registro. Único.
        data_type: integer
        tests:
          - not_null
      - name: tpregistro
        description: >
          Tipo do registro: 2 cabeçalho da conta, 3 movimento.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['2', '3']
              config:
                severity: warn
      - name: nragencia
        description: >
          Agência da conta, em texto.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nrconta
        description: >
          Número da conta, em texto.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nmtitulorazao
        description: >
          Título da conta, só no tipo 2.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: nmabreviado
        description: >
          Nome abreviado do titular, só no tipo 2.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: dtaberturaconta
        description: >
