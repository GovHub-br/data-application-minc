        description: Mês do incentivo (1 a 12).
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtincentivo
        description: Data do incentivo (AAAA-MM-DD).
        data_type: date
        tests:
          - not_null   # inferido do perfil do banco
      - name: vlcaptado
        description: Valor captado, em reais.
        data_type: numeric
        tests:
          - not_null   # inferido do perfil do banco
      - name: dstransferenciarecurso
        description: '[VAZIA EM 100% DAS LINHAS]'
        data_type: text
      - name: dttransferenciarecurso
        description: '[VAZIA EM 100% DAS LINHAS]'
        data_type: timestamp
