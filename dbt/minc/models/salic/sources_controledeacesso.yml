version: 2
sources:
  - name: salic
    schema: salic
    description: >
      SALIC (Sistema de Apoio às Leis de Incentivo à Cultura). Bronze: réplica do
      sistema de origem via Trino, tudo text, sem tratamento, com a coluna técnica
      _fatia da carga em fatias. Uma tabela por <banco>__<tabela> da origem, como
      salic.bronze_<banco>_<tabela>. As descrições das tabelas vêm do dicionário
      de dados do SALIC (export SchemaSpy) cruzado com o perfil do banco; o
      catálogo completo está em dbt/minc/docs/salic/.
    tables:
      - name: bronze_controledeacesso_sgcacesso
        description: >
          Tabela responsável por armazenar os dados de acesso dos usuários, incluindo identificação,
          CPF, senha, e situação do cadastro.
        config:
          tags:
            - bronze
            - salic
            - controledeacesso
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idusuario
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
          - name: cpf
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(11).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.Sensitive
            tests:
              - not_null
          - name: nome
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(100).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.NonSensitive
          - name: dtnascimento
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): smalldatetime(16).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.NonSensitive
          - name: email
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(60).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.NonSensitive
          - name: senha
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(15).
            data_type: text
            meta:
              openmetadata:
                tags:
                  - PII.Sensitive
          - name: dtcadastro
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): smalldatetime(16).
            data_type: text
          - name: situacao
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): tinyint(1).
            data_type: text
          - name: dtsituacao
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): smalldatetime(16).
            data_type: text
      - name: bronze_controledeacesso_sgcsistema
        description: >
          Tabela responsável por registrar os sistemas disponíveis no ambiente e suas respectivas
          descrições.
        config:
          tags:
            - bronze
            - salic
            - controledeacesso
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idsistema
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int identity(4).
            data_type: text
            tests:
              - not_null
              - unique
          - name: nomesistema
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(20).
            data_type: text
          - name: descricaosistema
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(100).
            data_type: text
      - name: bronze_controledeacesso_sgcusuarioxsistema
        description: >
          Tabela responsável por controlar quais usuários têm permissão para acessar cada sistema.
        config:
          tags:
            - bronze
            - salic
            - controledeacesso
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idusuario
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
            tests:
              - not_null
          - name: idsistema
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): int(4).
            data_type: text
            tests:
              - not_null