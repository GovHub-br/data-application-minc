        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: nmsocio
        description: >
          Nome do sócio, pessoa ou empresa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: dtinclusaosociedade
        description: >
          Data em que o sócio entrou na sociedade.
        data_type: date
      - name: cdqualificacao
        description: >
          Qualificação do sócio na Receita, código de 2 dígitos: 49
          sócio-administrador, 156.480; 22 sócio, 55.441; 10 diretor, 32.109;
          16 presidente, 26.229; 05 administrador, 22.012.
        data_type: text
      - name: dsqualificacaosocio
        description: >
          Descrição da qualificação do sócio, uma para cada código.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
