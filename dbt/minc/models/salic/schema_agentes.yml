  - name: silver_agentes_vwcadastrarparecerista
    description: >
      Uma linha por agente pessoa física e endereço, com o nome de registro.
      É a view que a tela de cadastro de parecerista do SalicWeb usa para
      escolher uma pessoa, e não a lista de pareceristas: só 2.731 das
      546.448 linhas são de agentes com a visão 209, parecerista. São 543.641
      agentes, praticamente todos os de CPF de silver_agentes_agentes.


      É a única silver do banco agentes com o nome da pessoa, porque a
      tabela de nomes da origem não é ingerida. Os campos de endereço vêm de
      silver_agentes_endereconacional e estão vazios em 43.173 linhas, de
      agentes sem endereço.
    config:
