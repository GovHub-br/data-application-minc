        data_type: integer
      - name: uf
        description: >
          Código IBGE da UF, 2 dígitos. Liga com silver_agentes_uf.iduf.
        data_type: integer
      - name: cep
        description: >
          CEP, 8 dígitos sem máscara, em texto para manter o zero à esquerda:
          40.561 CEPs começam com zero.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: divulgarendereco
        description: >
          Se o agente autorizou divulgar o endereço, em texto True ou False.
        data_type: text
      - name: correspondencia
        description: >
          Se o endereço é o de correspondência, em texto True ou False.
        data_type: text
      - name: usuario
        description: >
          Conta que fez o último registro da linha. Mesmo campo de
          silver_agentes_agentes.usuario.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vwempresajuridica
    description: >
      Uma linha por CNPJ com os dados cadastrais da Receita Federal: razão
      social, situação cadastral, natureza jurídica, abertura, capital
      social, porte e opção pelo Simples e pelo MEI. São 273.447 CNPJs,
      únicos, todos menos 1 existentes em silver_agentes_agentes.cnpjcpf.
      263.766 estão ativos.


      Armadilhas: tpestabelecimento diz 0 Matriz e 1 e 2 FILIAL, mas na
      Receita o código 1 é matriz, e 223.458 "filiais" é improvável; não use
      sem conferir. dsnaturezajuridica está vazia em 83%: use
      cdnaturezajuridica. vlcapitalsocial chega a 20 trilhões, valor
      digitado errado na origem.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vwempresajuridica'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: nrcnpj
        description: >
          CNPJ, 14 dígitos sem máscara. Único e preenchido em todas as linhas.
          Liga com silver_agentes_agentes.cnpjcpf. É dado pessoal no caso do
          empresário individual.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: tpestabelecimento
        description: >
          Código do tipo de estabelecimento: 0 em 39.079 linhas, 1 em
          223.458, 2 em 10.910. Ver a armadilha na descrição da tabela.
        data_type: integer
      - name: dsestabelecimento
        description: >
          Descrição gravada do tipo de estabelecimento: Matriz para o código 0
          e FILIAL para 1 e 2.
        data_type: text
      - name: nmempresarial
        description: >
          Razão social. Preenchida em todas as linhas. No empresário
          individual, é o nome da pessoa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: nmfantasia
        description: >
          Nome fantasia. Preenchido em 44%.
        data_type: text
      - name: cdsituacaocadastral
        description: >
          Situação cadastral na Receita, código: 2 ativa, 263.766; 8 baixada,
          7.170; 4 inapta, 2.403; 3 suspensa, 100; 1 nula, 8.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '8']
              config:
                severity: warn
      - name: dssituacaocadastral
        description: >
          Descrição da situação cadastral, uma para cada código.
        data_type: text
      - name: dtsituacaocadastral
        description: >
          Data da última mudança de situação cadastral.
        data_type: date
      - name: cdnaturezajuridica
        description: >
          Código de natureza jurídica da Receita, com 49 valores distintos.
          Há valores de um dígito, como 2 e 8, que não são códigos da tabela
          de natureza jurídica da Receita, que tem 4 dígitos.
        data_type: integer
      - name: dsnaturezajuridica
        description: >
          Descrição da natureza jurídica. Vazia em 226.269 linhas, 83%.
        data_type: text
      - name: dtabertura
        description: >
          Data de abertura da empresa, de 1901 a 2026.
        data_type: date
      - name: eecorreioeletronico
        description: >
          E-mail da empresa na Receita. Preenchido em 88%. No empresário
          individual, é contato da pessoa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: vlcapitalsocial
        description: >
          Capital social declarado, em reais. Vai de 0 a mais de 20 trilhões:
          há valores digitados errados, filtre antes de somar.
        data_type: numeric
      - name: cdporteempresa
        description: >
          Porte da empresa, código: 01 microempresa, 186.485; 03 pequeno
          porte, 26.786; 05 demais, 60.173. Vazio em 3.
        data_type: text
      - name: dsporteempresa
        description: >
          Descrição do porte da empresa, uma para cada código.
        data_type: text
      - name: sioptantesimples
        description: >
          Se a empresa é optante do Simples Nacional, SIM ou NÃO: SIM em
          184.842.
        data_type: text
      - name: sioptantemei
        description: >
          Se a empresa é optante do MEI, SIM ou NÃO: SIM em 84.483, todas
          também optantes do Simples.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

