      - name: tipologradouro
        description: >
          Tipo do logradouro, código de silver_agentes_verificacao. Ver
          silver_agentes_endereconacional.tipologradouro.
        data_type: integer
      - name: logradouro
        description: >
          Nome do logradouro, texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: numero
        description: >
          Número do imóvel, em texto porque aceita "S/N" e letras.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: bairro
        description: >
          Bairro, texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: complemento
        description: >
          Complemento do endereço, texto livre. Preenchido em 60%.
        data_type: text
        meta:
          openmetadata:
            tags:
