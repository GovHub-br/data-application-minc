  - name: silver_agentes_vwportifolio
    description: >
      Uma linha por análise do portfólio de um proponente. Pelo conteúdo, é a
      conferência da atuação cultural do proponente, que o MinC aceita ou
      rejeita; a regra não foi confirmada no código do SalicWeb. São
      12.841 análises para 8.448 proponentes, de junho de 2024 a 2026: 7.848
      aceitas, 4.982 rejeitadas e 11 pendentes. Um proponente rejeitado pode
      reapresentar, por isso há mais de uma linha por proponente. A view da
      origem liga pelo documento, sem idagente.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vwportifolio'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: cnpjcpf
        description: >
          CPF ou CNPJ do proponente, sem máscara, em texto para manter o zero
          à esquerda: 3.818 começam com zero. Liga com
          silver_agentes_agentes.cnpjcpf.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: proponente
        description: >
          Nome do proponente, pessoa ou entidade.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: dtportifolio
        description: >
          Data da análise do portfólio, de 2024-06-05 a 2026-08-24.
        data_type: timestamp
        tests:
          - not_null
      - name: siportifolio
        description: >
          Resultado da análise: Aceito, 7.848; Rejeitado, 4.982; Pendente de
          Validação, 11.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Aceito', 'Rejeitado', 'Pendente de Validação']
              config:
                severity: warn
      - name: responsavel
        description: >
          Nome de quem analisou o portfólio, pelo que se vê no dado, um
          servidor do MinC.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vwpropostasemavaliacao
    description: >
      Uma linha por proposta de projeto Rouanet que está em avaliação de
      admissibilidade, com o técnico responsável. Pelo nome e pelo conteúdo,
      só tem proposta ainda em avaliação: é a fila do momento da carga, não
      histórico. Na
      medição eram 5.868 linhas, de 5.864 propostas, 5.242 proponentes e 19
      técnicos, das secretarias SEFIC e SAV, apresentadas de 2023 a 2026.
      Quase todas, 5.360, são de projeto aprovado em edital.


      Liga com o banco sac por idpreprojeto, sem órfão. 4 propostas aparecem
      duas vezes.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vwpropostasemavaliacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idpreprojeto
        description: >
          Proposta em avaliação. Liga com sac.preprojeto.idpreprojeto. Não é
          única: 4 propostas têm duas linhas.
        data_type: integer
        tests:
          - not_null
      - name: nomeprojeto
        description: >
          Título da proposta, texto livre.
        data_type: text
      - name: tptipicidade
        description: >
          Tipicidade da proposta, código da tabela de verificação do banco sac
          (grupo 28), com 9 valores. O mais comum é 836, editais
          compartilhados, 5.647.
        data_type: integer
      - name: dstipicidade
        description: >
          Descrição da tipicidade, uma para cada código.
        data_type: text
      - name: tptipologia
        description: >
          Tipologia da proposta, código com 29 valores, como o edital ou
          programa a que ela pertence.
        data_type: integer
      - name: dstipologia
        description: >
          Descrição da tipologia, uma para cada código.
        data_type: text
      - name: stproposta
        description: >
          Plano de execução imediata da proposta, código da tabela de
          verificação do banco sac (grupo 23), de 610 a 619: 618 projeto
          aprovado em editais, 5.360; 610 projeto normal, 466; 614 planos
          anuais, 22. O nome da coluna sugere situação, mas não é.
        data_type: integer
      - name: dsplanoexecucaoimediata
        description: >
          Descrição do plano de execução imediata, uma para cada código de
          stproposta.
        data_type: text
      - name: secretaria
        description: >
          Secretaria responsável pela avaliação: SEFIC, Fomento e Incentivo à
          Cultura, 5.014; SAV, Audiovisual, 854.
        data_type: text
      - name: ano
        description: >
          Ano da proposta, de 2023 a 2026.
        data_type: integer
      - name: conformidade
        description: >
          Etapa da avaliação: Aguardando análise, 5.741; Diligenciado, 78;
          Diligência respondida, 48. Vazia em 1.
        data_type: text
      - name: idtecnico
        description: >
          Técnico do MinC responsável pela avaliação, 19 distintos.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nmtecnico
        description: >
          Nome abreviado do técnico responsável.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: cdproponente
        description: >
          Agente proponente. Liga com silver_agentes_agentes.idagente, sem
          órfão.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: cnpjcpf
        description: >
          CPF ou CNPJ do proponente, sem máscara.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nmproponente
        description: >
          Nome do proponente, pessoa ou entidade. Vazio em 3 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_verificacao
    description: >
      Uma linha por valor de código usado no banco agentes: é a tabela de
      domínio genérica, com os valores agrupados por idtipo. São 293 valores
      em 27 grupos. Os grupos usados pelas outras silvers: 1 tipo de nome, 2
      tipo de endereço, 3 tipo de telefone, 4 tipo de contato na internet,
      13 tipo de logradouro, 14 perfil, 16 visão (papel do agente). Os
      valores com "- Receita Federal" no nome marcam o que veio da
      integração com a Receita.


      Armadilha: o grupo 26 tem nomes de pessoas, dirigentes que assinam
      documentos, e por isso a tabela não é publicável. A tabela de
      verificação do banco sac é outra, com outros códigos.
      silver_agentes_vverificacao tem as mesmas 293 linhas.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_verificacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idverificacao
        description: >
          Código do valor, o que as outras tabelas gravam em colunas como
          tipoendereco, tipotelefone, visao e perfil. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idtipo
        description: >
          Grupo a que o valor pertence, de 1 a 31, em 27 grupos usados. O
          código idverificacao é único na tabela inteira, então uma coluna
          pode receber código de outro grupo sem erro de chave, como
          tipologradouro 1.
        data_type: integer
        tests:
          - not_null
      - name: descricao
        description: >
          Rótulo do valor, como Residencial, Proponente ou Rua. No grupo 26 é
          nome de pessoa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
        tests:
          - not_null
      - name: sistema
        description: >
          Sistema que usa o valor, código de silver_agentes_vsistema; 0 é
          todos. O código 21, dos valores da Receita Federal e de vários
          papéis, não existe em silver_agentes_vsistema.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vverificacao
    description: >
      Uma linha por valor de código do banco agentes, vinda de uma view da
      origem. Tem as mesmas 293 linhas de silver_agentes_verificacao: a
      comparação não achou diferença. Prefira silver_agentes_verificacao.
      Como ela, inclui nomes de pessoas no grupo 26.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vverificacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idverificacao
        description: >
          Código do valor. Único. Ver silver_agentes_verificacao.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idtipo
        description: >
          Grupo a que o valor pertence. Ver silver_agentes_verificacao.
        data_type: integer
      - name: descricao
        description: >
          Rótulo do valor. No grupo 26 é nome de pessoa.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: sistema
        description: >
          Sistema que usa o valor, código de silver_agentes_vsistema.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vsistema
    description: >
      Uma linha por sistema do MinC que usa o cadastro de agentes. É o
      domínio da coluna sistema de silver_agentes_verificacao. São 20, de 0,
      todos os sistemas, a 19, como 3 PRONAC, 12 Cadastro de Proponentes, 13
      Conselhos de Cultura e 14 Ticket Cultural. Não confundir com
      silver_controledeacesso_sgcsistema, que é outra lista.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vsistema'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          derivadas_nao_identificantes:
            - usuario
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idsistema
        description: >
          Código do sistema, de 0 a 19. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: descricao
        description: >
          Nome do sistema, como PRONAC ou Ticket Cultural.
        data_type: text
      - name: usuario
        description: >
          Conta que registrou o sistema. Tem um único valor nas 20 linhas, o
          da carga inicial, e não liga o sistema a uma pessoa.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vprefeiturasregiaouf
    description: >
      Uma linha por agente com perfil de prefeitura, com o CNPJ, o nome da
      prefeitura, o município, a UF por extenso e a região. São 5.609 linhas,
      5.555 CNPJs e 5.553 municípios: algumas prefeituras têm mais de um
      cadastro. É a lista de prefeituras de silver_agentes_perfil com perfil
      48, já com os nomes. Não tem código IBGE: o município vem só por nome.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vprefeiturasregiaouf'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          derivadas_nao_identificantes:
            - cnpj
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: regiao
        description: >
          Região do país: Nordeste 1.800, Sudeste 1.694, Sul 1.199, Centro
          Oeste 466, Norte 450.
        data_type: text
      - name: uf
        description: >
          Nome da UF por extenso, como Goiás. Não é sigla nem código.
        data_type: text
      - name: perfil
        description: >
          Rótulo do perfil. Vale Prefeitura em todas as linhas.
        data_type: text
      - name: cnpj
        description: >
          CNPJ da prefeitura, 14 dígitos. Dado público de órgão, não
          identifica pessoa. Não é único: 5.555 distintos em 5.609 linhas.
        data_type: text
        tests:
          - not_null
      - name: prefeitura
        description: >
          Nome da prefeitura como cadastrado. Vazio em 5 linhas.
        data_type: text
      - name: municipio
        description: >
          Nome do município. Para o código IBGE, junte pelo nome e pela UF com
          silver_agentes_vufmunicipio.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_municipios
    description: >
      Uma linha por município brasileiro, com o código IBGE de 6 dígitos, a
      UF, a mesorregião e a microrregião. São 5.568 municípios, em 137
      mesorregiões e 558 microrregiões. É o domínio de cidade em
      silver_agentes_endereconacional e alimenta dim_municipio_ibge. Todo
      idufibge existe em silver_agentes_uf.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_municipios'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idmunicipioibge
        description: >
          Código IBGE do município, 6 dígitos, sem o dígito verificador. Único.
          Para o código de 7 dígitos, use
          silver_agentes_populacaomunicipio.idmunicipio7.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idufibge
        description: >
          Código IBGE da UF, 2 dígitos. Liga com silver_agentes_uf.iduf, sem
          órfão.
        data_type: integer
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_agentes_uf')
                field: iduf
      - name: idmeso
        description: >
          Código IBGE da mesorregião, 4 dígitos.
        data_type: integer
      - name: idmicro
        description: >
          Código IBGE da microrregião, 5 dígitos.
        data_type: integer
      - name: descricao
        description: >
          Nome do município, com acento.
        data_type: text
        tests:
          - not_null
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vufmunicipio
    description: >
      Uma linha por município, com a sigla e o código da UF. São as mesmas
      5.568 linhas de silver_agentes_municipios, com a sigla da UF no lugar
      da meso e microrregião: a comparação de código, UF e nome não achou
      diferença.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vufmunicipio'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iduf
        description: >
          Código IBGE da UF, 2 dígitos.
        data_type: integer
      - name: uf
        description: >
          Sigla da UF, como PA.
        data_type: text
      - name: idmunicipio
        description: >
          Código IBGE do município, 6 dígitos. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: municipio
        description: >
          Nome do município, igual a silver_agentes_municipios.descricao.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_uf
    description: >
      Uma linha por unidade da federação: as 27, com código IBGE, sigla, nome
      e região. Alimenta dim_municipio_ibge. silver_agentes_vuf tem as mesmas
      27 linhas.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_uf'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iduf
        description: >
          Código IBGE da UF, 2 dígitos. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: sigla
        description: >
          Sigla da UF, como SP. Única.
        data_type: text
        tests:
          - not_null
          - unique
      - name: descricao
        description: >
          Nome da UF por extenso.
        data_type: text
      - name: regiao
        description: >
          Região: Norte, Nordeste, Sudeste, Sul ou Centro Oeste, este sem
          hífen.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['Norte', 'Nordeste', 'Sudeste', 'Sul', 'Centro Oeste']
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vuf
    description: >
      Uma linha por unidade da federação, vinda de uma view da origem. Tem as
      mesmas 27 linhas de silver_agentes_uf: a comparação não achou
      diferença. Prefira silver_agentes_uf.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vuf'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iduf
        description: >
          Código IBGE da UF, 2 dígitos. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: sigla
        description: >
          Sigla da UF, como SP. Única.
        data_type: text
      - name: descricao
        description: >
          Nome da UF por extenso.
        data_type: text
      - name: regiao
        description: >
          Região, com Centro Oeste sem hífen.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_populacaomunicipio
    description: >
      Uma linha por município com a população. São 5.563 municípios, somando
      205,9 milhões de habitantes. O ano de referência não está na tabela, e
      o total não bate com os Censos de 2010 nem de 2022: não use como
      população atual. Alimenta dim_municipio_ibge. 2 municípios não existem
      em silver_agentes_municipios, e 7 de lá não têm população.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_populacaomunicipio'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idmunicipio
        description: >
          Código IBGE do município, 6 dígitos. Único. Liga com
          silver_agentes_municipios.idmunicipioibge; 2 não existem lá.
        data_type: integer
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('silver_agentes_municipios')
                field: idmunicipioibge
              config:
                severity: warn
      - name: idmunicipio7
        description: >
          Código IBGE do município com o dígito verificador, 7 dígitos. Os 6
          primeiros são sempre idmunicipio. É o código que as bases do IBGE
          usam hoje.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: populacao
        description: >
          Número de habitantes do município, de ano de referência não
          registrado.
        data_type: integer
        tests:
          - not_null
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vpais
    description: >
      Uma linha por país, com nome em português e continente. São 236
      países. Nenhuma outra silver do banco usa idpais: o nome
      endereconacional sugere uma tabela de endereço no exterior, e ela não é
      ingerida. A coluna sigla está vazia em
      todas as linhas.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vpais'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idpais
        description: >
          Código do país no SALIC. Único. Não é código ISO.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: sigla
        description: >
          Sigla do país. Vazia nas 236 linhas.
        data_type: text
      - name: descricao
        description: >
          Nome do país em português.
        data_type: text
        tests:
          - not_null
      - name: continente
        description: >
          Continente, em 7 valores: África, América Central, América do
          Norte, América do Sul, Ásia, Europa e Oceania.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text
