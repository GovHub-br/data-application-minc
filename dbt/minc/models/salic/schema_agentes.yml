      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vwcadastrarparecerista'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - tipoendereco
            - divulgarendereco
            - correspondencia
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idagente
