version: 2

# Silvers do banco agentes do SALIC: o cadastro de agentes culturais
# (pessoa física e jurídica), seus endereços, telefones, papéis e vínculos, os
# dados da Receita Federal sobre empresas e sócios, e as tabelas de domínio
# geográfico e de códigos. Medições de 29/10/2026 na Bronze
# (salic.bronze_agentes_*), por agregados, sem valor de linha. O significado
# dos códigos vem da tabela de domínio silver_agentes_verificacao e do código
# público do SalicWeb.
#
# O nome do agente não está aqui: ele fica na tabela agentes.Nomes da origem,
# que a ingestão não traz. A única fonte de nome neste banco é
# silver_agentes_vwcadastrarparecerista, para pessoa física.

models:
  - name: silver_agentes_agentes
    description: >
      Uma linha por agente cadastrado no SALIC, pessoa física ou jurídica,
      identificado por idagente. É a raiz do banco agentes: endereço,
      telefone, papel (visão), perfil e vínculo apontam para idagente. São
      997.756 agentes, cadastrados de 2007 a 2026: 547.492 com CPF e 450.263
      com CNPJ. O agente é a pessoa ou entidade; o papel que ela tem no SALIC
      (proponente, incentivador, fornecedor, dirigente) está em
      silver_agentes_vvisao, e um mesmo agente pode ter vários.


      Armadilhas: o nome do agente não está nesta tabela nem em nenhuma
      silver do banco, a não ser em silver_agentes_vwcadastrarparecerista. O
      cnpjcpf não é único: 244 documentos aparecem em mais de um agente.
      status vale 0 em todas as linhas e não serve para filtrar agente ativo.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_agentes'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idagente
        description: >
          Identificador do agente, sequencial do SQL Server. Único e
          preenchido nas 997.756 linhas. É a chave que as outras tabelas do
          banco agentes usam, e a que sac.preprojeto grava em idagente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: cnpjcpf
        description: >
          CPF (11 dígitos) ou CNPJ (14 dígitos) do agente, sem máscara e com
          zero à esquerda, por isso texto. Preenchido em todas as linhas. Não
          é único: 997.512 documentos distintos para 997.756 agentes. Uma
          linha tem 7 dígitos.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: cnpjcpfsuperior
        description: >
          CNPJ da entidade superior do agente, pelo nome da coluna; o uso não
          foi confirmado no código do SalicWeb. Em 996.659 linhas vale só zeros, sem entidade
          superior; há 202 valores distintos no total. Para o vínculo entre
          pessoa e entidade, use silver_agentes_vvinculacao.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: tipopessoa
        description: >
          Tipo de pessoa do agente: false é pessoa física e true é pessoa
          jurídica. Confirmado pelo documento: os 547.492 false têm CPF de 11
          dígitos e os 450.263 true têm CNPJ de 14, menos 1 true com 7
          dígitos.
        data_type: boolean
        tests:
          - not_null
      - name: dtcadastro
        description: >
          Data e hora do cadastro do agente, de 2007 a 2026. Vazia em 8
          linhas.
        data_type: timestamp
      - name: dtatualizacao
        description: >
          Data e hora da última atualização do cadastro. Vazia em 8 linhas.
        data_type: timestamp
      - name: dtvalidade
        description: >
          Data de validade do cadastro. Em 805.245 das 997.748 linhas
          preenchidas é exatamente um ano depois de dtcadastro. Nenhuma é
          anterior ao cadastro. Vazia em 8 linhas.
        data_type: timestamp
      - name: status
        description: >
          Situação do agente na origem. Vale false (0) nas 997.756 linhas:
          não distingue nada e não indica agente ativo ou inativo.
        data_type: boolean
      - name: usuario
        description: >
          Conta que fez o último registro da linha. 98% dos valores existem
          em silver_controledeacesso_sgcacesso.idusuario, o login do público
          externo, e 22% também em tabelas.usuarios, o cadastro de
          servidores: as faixas se sobrepõem, e o destino não está
          confirmado. 19.152 linhas valem 0, sem conta.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_tbagentefisico
    description: >
      Uma linha por agente pessoa física com dados complementares: sexo,
      estado civil, necessidade especial, filiação, nascimento e cor ou raça.
      São 136.607 agentes, todos existentes em silver_agentes_agentes (liga
      por idagente); só um quarto dos agentes com CPF tem esta ficha, e 7
      linhas apontam para agente com CNPJ. Os códigos vêm do formulário de
      informações adicionais do SalicWeb.


      Dado sensível pela LGPD: cor ou raça e necessidade especial. Qualquer
      uso exige base legal e agregação que não identifique a pessoa.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_tbagentefisico'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idagente
        description: >
          Agente pessoa física. Único na tabela e existente em
          silver_agentes_agentes.idagente, sem órfão.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: stsexo
        description: >
          Sexo declarado: F em 66.073 linhas, M em 70.534. Preenchido em
          todas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['F', 'M']
              config:
                severity: warn
      - name: stestadocivil
        description: >
          Estado civil, em código de duas letras do formulário do SalicWeb:
          SO solteiro(a), 36.290; CA casado(a), 16.873; DI divorciado(a),
          3.770; VI viúvo(a), 499; SJ separado(a) judicialmente, 552; OU
          outros, 78.623. OU é a maior categoria, então a coluna diz pouco
          sobre o estado civil real.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SO', 'CA', 'DI', 'VI', 'SJ', 'OU']
              config:
                severity: warn
      - name: stnecessidadeespecial
        description: >
          Se a pessoa declarou necessidade especial: S em 739 linhas, N em
          135.868. O formulário não pergunta qual. Dado sensível de
          deficiência.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N', 'S']
              config:
                severity: warn
      - name: nmmae
        description: >
          Nome da mãe, texto livre de até 100 caracteres. Vazio em 36 linhas.
          Usado na origem para conferir identidade.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: nmpai
        description: >
          Nome do pai, texto livre de até 100 caracteres. Vazio em 43 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtnascimento
        description: >
          Data de nascimento, preenchida em todas as linhas. Não é confiável
          sem filtro: vai de 1790 a 9967, e 11 linhas têm ano anterior a 1901.
        data_type: timestamp
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: stcorraca
        description: >
          Cor ou raça autodeclarada, pelo formulário do SalicWeb: 1 branca,
          17.504; 2 negra, 3.963; 3 parda, 7.079; 4 amarela, 313; 5 indígena,
          227. O campo não é obrigatório: 107.499 linhas, 79%, não têm valor,
          e outras 22 têm um caractere que não é código e viram NULL. O
          formulário usa "negra", não "preta" como o IBGE.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
              config:
                severity: warn
      - name: nridentificadorprocessual
        description: >
          Número identificador processual, que o formulário só pede para um
          perfil específico de usuário. Preenchido em 1.545 linhas, 1%.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_endereconacional
    description: >
      Uma linha por endereço no Brasil de um agente. São 955.942 endereços
      para 950.302 agentes, todos existentes em silver_agentes_agentes: quase
      sempre um endereço por agente. O tipo do endereço diz de onde ele veio:
      519.803 são "Endereço - Receita Federal", gravados pela integração com
      a Receita, e o resto foi informado no cadastro, 243.258 comerciais e
      192.881 residenciais.


      Armadilhas: cidade e uf são códigos, não nomes, e as colunas municipio
      e ufdescricao estão vazias em 99,4% das linhas. Para o nome, junte
      cidade com silver_agentes_municipios.idmunicipioibge: 12.046 códigos de
      cidade não existem lá. O tipologradouro 1 aparece em 81.932 linhas, mas
      o código 1 de silver_agentes_verificacao é de outro grupo (natureza
      "Público"), então é valor sem significado de logradouro.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_endereconacional'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - tipoendereco
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idendereco
        description: >
          Identificador do endereço. Único e preenchido nas 955.942 linhas.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: idagente
        description: >
          Agente dono do endereço. Liga com silver_agentes_agentes.idagente,
          sem órfão.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: tipoendereco
        description: >
          Tipo do endereço, código de silver_agentes_verificacao: 282
          Endereço - Receita Federal, 519.803; 23 comercial, 243.258; 22
          residencial, 192.881.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [22, 23, 282]
                quote: false
              config:
                severity: warn
      - name: tipologradouro
        description: >
          Tipo do logradouro, código de silver_agentes_verificacao (grupo
          13): os mais comuns são 45 rua, 558.470, e 41 avenida, 130.621. O
          código 1, em 81.932 linhas, e o 13, em 259, não são tipo de
          logradouro.
        data_type: integer
      - name: logradouro
        description: >
          Nome do logradouro, texto livre. Vazio em 15.854 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: numero
        description: >
          Número do imóvel, em texto porque aceita "S/N" e letras: 6% dos
          valores preenchidos não são número. Vazio em 85.181 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: bairro
        description: >
          Bairro, texto livre. Vazio em 86.900 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: complemento
        description: >
          Complemento do endereço, texto livre. Preenchido em 54%.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: cidade
        description: >
          Código IBGE do município, 6 dígitos, sem o dígito verificador. Junte
          com silver_agentes_municipios.idmunicipioibge para ter o nome: 12.046
          linhas trazem código que não está lá. Vazio em 82.134 linhas, e 36
          valores não numéricos viram NULL.
        data_type: integer
      - name: uf
        description: >
          Código IBGE da UF, 2 dígitos. Liga com silver_agentes_uf.iduf; 1.203
          linhas trazem código que não está lá. Vazio em 563.
        data_type: integer
      - name: cep
        description: >
          CEP, 8 dígitos sem máscara, em texto para manter o zero à esquerda.
          Vazio em 81.902 linhas; 51 valores têm caractere que não é dígito.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: municipio
        description: >
          Nome do município. Preenchido em só 6.068 linhas, 0,6%: use cidade.
        data_type: text
      - name: ufdescricao
        description: >
          Nome da UF. Preenchido em só 6.068 linhas, 0,6%: use uf.
        data_type: text
      - name: status
        description: >
          Se o endereço está ativo: true em 945.731 linhas e false em 10.211.
        data_type: boolean
      - name: divulgar
        description: >
          Se o agente autorizou divulgar o endereço: true em 100.504 linhas,
          11%. Endereço com false não pode aparecer em publicação.
        data_type: boolean
      - name: usuario
        description: >
          Conta que fez o último registro da linha. É o mesmo campo de
          silver_agentes_agentes.usuario; o destino não foi medido nesta
          tabela.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vtelefones
    description: >
      Uma linha por telefone de um agente. São 493.419 telefones para 385.841
      agentes. Metade, 247.484, é "Telefone - Receita Federal", gravado pela
      integração com a Receita; o resto foi informado no cadastro, a maior
      parte celular. O prefixo v indica view na origem; a tabela de
      telefones por trás dela não é ingerida.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vtelefones'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - tipotelefone
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idtelefone
        description: >
          Identificador do telefone. Único e preenchido nas 493.419 linhas.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
          - unique
      - name: idagente
        description: >
          Agente dono do telefone. Liga com silver_agentes_agentes.idagente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: tipotelefone
        description: >
          Tipo do telefone, código de silver_agentes_verificacao: 280
          Telefone - Receita Federal, 247.484; 26 celular, 178.979; 25
          comercial, 41.323; 24 residencial, 24.619; 27 fax, 1.014.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [24, 25, 26, 27, 280]
                quote: false
              config:
                severity: warn
      - name: ddd
        description: >
          DDD do telefone, 2 dígitos.
        data_type: integer
      - name: numero
        description: >
          Número do telefone sem DDD, em texto: 154.496 valores têm hífen, e
          como inteiro virariam NULL. Vazio em 66 linhas.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: uf
        description: >
          Código IBGE da UF do telefone, 2 dígitos.
        data_type: integer
      - name: divulgar
        description: >
          Se o agente autorizou divulgar o telefone, em texto True ou False:
          True em 74.357 linhas, 15%.
        data_type: text
      - name: usuario
        description: >
          Conta que fez o último registro da linha. Mesmo campo de
          silver_agentes_agentes.usuario.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vvisao
    description: >
      Uma linha por papel ("visão") de um agente no SALIC. É aqui que se sabe
      se o agente é proponente, incentivador, fornecedor ou outro: o código
      visao é de silver_agentes_verificacao (grupo 16). São 1.083.125 linhas
      para 992.990 agentes, e só 1 par agente e visão se repete. Os papéis
      mais comuns: 248 fornecedor, 423.846; 144 proponente, 237.232; 198
      dirigente de instituição, 218.221; 145 incentivador, 113.957; 199
      beneficiário de produtos do projeto cultural, 77.052. Há 21 papéis com
      uso, os outros abaixo de 6 mil cada.


      Armadilha: ter a visão 144 diz que o agente se cadastrou como
      proponente, não que apresentou ou teve projeto aprovado. Para isso,
      cruze com o banco sac.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vvisao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idvisao
        description: >
          Identificador da linha. Único e preenchido nas 1.083.125 linhas.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idagente
        description: >
          Agente que tem o papel. Liga com silver_agentes_agentes.idagente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: visao
        description: >
          Papel do agente, código de silver_agentes_verificacao.idverificacao
          com idtipo 16, como 144 proponente, 145 incentivador, 248
          fornecedor, 198 dirigente de instituição e 209 parecerista de
          projeto cultural.
        data_type: integer
        tests:
          - not_null
      - name: usuario
        description: >
          Conta que fez o último registro da linha. Mesmo campo de
          silver_agentes_agentes.usuario.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_agentes_vvinculacao
    description: >
      Uma linha por vínculo entre uma pessoa física e uma entidade: o
      dirigente ou representante (idagente, com CPF) ligado à pessoa
      jurídica que ele representa (idvinculoprincipal, com CNPJ). É o que o
      SalicWeb usa para saber em nome de que entidades um CPF logado pode
      agir. São 242.997 vínculos, 203.567 pessoas e 144.826 entidades; em
      242.737 a pessoa tem CPF e a entidade tem CNPJ.


      Armadilha: idvinculado e idvinculoprincipal são iguais em 242.536
      linhas, 99,8%. O SalicWeb filtra por idvinculoprincipal; use essa.
    config:
      tags: [silver, salic, agentes]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_agentes_vvinculacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idvinculacao
        description: >
          Identificador do vínculo. Único e preenchido nas 242.997 linhas.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idagente
        description: >
          Pessoa vinculada, normalmente dirigente da entidade. Liga com
          silver_agentes_agentes.idagente. Em 198 linhas é o próprio
          idvinculado.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: idvinculado
        description: >
          Entidade a que a pessoa está vinculada. Igual a idvinculoprincipal
          em 99,8% das linhas.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idvinculoprincipal
        description: >
          Entidade principal do vínculo, a que o SalicWeb consulta. Liga com
          silver_agentes_agentes.idagente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: usuario
        description: >
          Conta que fez o último registro da linha. Mesmo campo de
          silver_agentes_agentes.usuario.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
