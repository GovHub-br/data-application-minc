version: 2

# SALIC na estrutura do ADR 0010: a Bronze é a tabela que a ingestão grava em
# salic.bronze_<banco>_<tabela> (source salic, em sources_sac.yml), e a Silver
# a lê por source(). Quando o salic_dbt migrar, os modelos sac__<tabela> de lá
# (que tipam) viram silver_sac_<tabela> aqui.
models:
  - name: silver_sac_captacao_proponente
    description: >
      Camada Silver — um recibo de captação da Lei Rouanet por linha, com o
      proponente que recebeu o recurso. Junta o recibo (sac__captacao) ao
      cadastro do projeto pelo PRONAC e tipa; não decide quais recibos
      contam para um indicador. Grão: 1 linha por recibo de captação.

      O proponente de cada PRONAC vem de sac__projetos (cgccpf), o cadastro
      oficial do projeto. O PRONAC sai da macro pronac_de_ano_sequencial nas
      duas tabelas, a mesma do silver_sac_captacao_rouanet. Recibo cujo PRONAC o
      cadastro não resolve fica de fora sem erro; o teste singular
      salic_recibo_sem_proponente (severity warn) avisa por PRONAC, separando
      PRONAC malformado de ausente do cadastro, e o
      salic_recibo_sem_proponente_em_massa (severity error) trava o build
      quando a perda passa de 1% dos recibos.

      Lê a Bronze do SALIC (salic.bronze_sac_*). Até 21/10/2026 lia a v1
      (schema `bronze`) e usava sac__tbapiprojetorouanet como reserva de
      proponente; a v2 não ingere essa tabela, e o cadastro sozinho já
      resolvia 100% dos recibos válidos.
    config:
      tags: [silver, salic, rouanet]
      meta:
        status: Active
        origem_dados: 'salic.bronze_sac_captacao + salic.bronze_sac_projetos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Agentes.Proponente
    columns:
      - name: proponente_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: proponente_nome
        description: >
          Nome do proponente. Sempre nulo hoje: o cadastro (sac__projetos)
          não traz o nome; a coluna fica pelo contrato do modelo.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: data_recibo
        description: Data do recibo de captação.
        data_type: date
        tests:
          - not_null
      - name: valor_captado
        description: >
          Valor captado no recibo, em reais, como a origem registra — pode ser
          zero ou negativo.
        data_type: numeric
        tests:
          - not_null
      - name: pronac
        description: >
          PRONAC do projeto que captou, pela macro pronac_de_ano_sequencial —
          anoprojeto (2 dígitos) concatenado ao sequencial, sem preencher o
          sequencial. Chave de ligação entre o recibo e
          o proponente.
        data_type: text
        tests:
          - not_null
  - name: silver_sac_chave_projeto_rouanet
    description: >
      Camada Silver / núcleo SALIC. Mapa das três chaves com que o SALIC
      identifica o mesmo projeto da Lei Rouanet: `pronac` (chave de negócio, 7
      posições), `id_pronac` (surrogate das tabelas de análise) e `id_projeto`
      (surrogate antigo, chave de `silver_sac_abrangencia`).

      GRÃO: uma linha por PRONAC. UNIVERSO: todo PRONAC observado em qualquer
      silver do sac que carregue a chave — `silver_sac_aprovacao`,
      `silver_sac_enquadramento`, `silver_sac_documentosprojeto`,
      `silver_sac_vwprojetositinerantes`, `silver_sac_vwalterarprojeto`,
      `silver_sac_vwagentesseusprojetos` e `silver_sac_captacao`. Nada é excluído por
      situação, ano ou valor.

      PARA QUE SERVE: sem ele a Meta 4 não liga abrangência territorial a
      PRONAC, porque `silver_sac_abrangencia` só tem `idprojeto`. Também é ele que
      define o universo de projetos da `silver_sac_projeto_rouanet`.

      DESCONHECIDOS E CONFLITO: quando o mesmo PRONAC aparece com mais de um
      `id_pronac` (ou mais de um `id_projeto`), a coluna do id sai NULL e a flag
      correspondente sai `true` — fail-closed. Um join que não acontece é
      visível; um join com o id errado não é. `idprojeto = 0`, que é o valor
      preenchido na maior parte de `silver_sac_captacao`, é tratado como ausência.

      LIMITAÇÕES: cobertura e taxa de ambiguidade dependem do que está
      carregado e ainda não foram medidas contra o banco (gate G1 do plano).
      ATUALIZAÇÃO: recalculado a cada `dbt build`; não há carga incremental.
    config:
      tags: [silver, salic, rouanet, core]
      meta:
        status: Disabled
        meta_objetivo: 'Chave conformada do projeto Rouanet — base das Metas 3, 4 e 5'
        origem_dados: 'salic.silver_sac_* — 7 silvers com chave de projeto'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Identificadores.PRONAC
    columns:
      - name: pronac
        description: >
          Chave de negócio do projeto na Rouanet: dois dígitos de ano seguidos
          do sequencial como registrado, com 5 a 7 posições na série observada.
          Não há padding do sequencial: fazê-lo mudaria a chave. Normalizado
          pela macro `pronac_normalizado` ou montado por
          `pronac_de_ano_sequencial`, conforme a forma da origem.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.PRONAC
        tests:
          - not_null
          - unique
      - name: ano_pronac
        description: >
          Ano de quatro dígitos derivado das duas primeiras posições do PRONAC.
          A regra é 91–99 para o século XX e 00–90 para o XXI, válida até 2091.
          É o ano de abertura do projeto, não o ano de nenhum evento
          financeiro — não use como ano de referência de indicador.
        data_type: integer
      - name: id_pronac
        description: >
          Surrogate inteiro do projeto usado pelas tabelas de análise do SALIC.
          NULL quando a origem apresenta mais de um valor para o mesmo PRONAC.
        data_type: integer
      - name: id_projeto
        description: >
          Surrogate antigo do projeto, chave de `silver_sac_abrangencia`. NULL quando
          ambíguo e quando a origem grava 0, que não identifica projeto.
        data_type: integer
      - name: id_pronac_ambiguo
        description: >
          `true` quando a origem associa mais de um `id_pronac` ao mesmo
          PRONAC. Nesses casos `id_pronac` é NULL de propósito.
        data_type: boolean
        tests:
          - not_null
      - name: id_projeto_ambiguo
        description: >
          `true` quando a origem associa mais de um `id_projeto` ao mesmo
          PRONAC. Nesses casos `id_projeto` é NULL de propósito.
        data_type: boolean
        tests:
          - not_null
      - name: qt_pronac_por_id_pronac
        description: >
          Quantos PRONAC distintos foram observados para o `id_pronac`
          candidato. Valor maior que um invalida o id e ativa
          `id_pronac_ambiguo`, cobrindo a ambiguidade no sentido inverso.
        data_type: integer
        tests:
          - not_null
      - name: qt_pronac_por_id_projeto
        description: >
          Quantos PRONAC distintos foram observados para o `id_projeto`
          candidato. Valor maior que um invalida o id e ativa
          `id_projeto_ambiguo`, cobrindo a ambiguidade no sentido inverso.
        data_type: integer
        tests:
          - not_null
      - name: qt_tabelas_origem
        description: >
          Quantas das sete tabelas de origem observaram este PRONAC. É a medida
          de confiança da chave: PRONAC visto em uma tabela só pode ser resíduo
          de carga, e o valor permite medir isso sem abrir o modelo.
        data_type: integer
        tests:
          - not_null

  - name: silver_agentes_municipio_ibge
    description: >
      Camada Silver / núcleo SALIC. Dimensão territorial de referência: os
      municípios brasileiros com os dois formatos de código IBGE, unidade
      federativa, região, mesorregião, microrregião e população.

      GRÃO: um município. UNIVERSO: os 5.568 municípios de
      `agentes__municipios`, sem exclusão por porte, situação ou qualquer outro
      critério.

      PARA QUE SERVE: é a dimensão contra a qual `silver_sac_projeto_local_execucao`
      resolve o local de execução, e é pré-requisito dos três indicadores da
      Meta 4 — o percentual executado fora das capitais, o executado no Norte,
      Nordeste e Centro-Oeste, e o captado em território vulnerabilizado.

      DUAS FORMAS DE CÓDIGO IBGE, E POR QUE AS DUAS. O SALIC identifica o
      município por um código de 6 posições, sem o dígito verificador; o IBGE e
      o `transferegov` usam o de 7. Cruzar as duas formas sem tratar não casa
      nenhuma linha e não levanta erro — junção que não encontra devolve vazio.
      A dimensão expõe as duas colunas, e a correspondência NÃO é calculada:
      vem de `agentes__populacaomunicipio`, que carrega os dois formatos na
      mesma linha. Derivar o dígito verificador seria uma regra a mais para
      manter, e erraria em silêncio se a regra do IBGE mudasse.

      DESCONHECIDOS: município sem UF correspondente, ou sem linha na tabela de
      população, permanece na dimensão com esses campos nulos. São 5.568
      municípios contra 5.563 com população — a diferença de cinco é esperada e
      precisa ficar visível, não ser descartada por um join interno.

      CAPITAL É ASSUNTO DO GOLD. O indicador P1 da Meta 4 compara execução
      dentro e fora das capitais, mas a marcação não mora aqui: o desenho
      declara a lista de capitais como base externa, casada no modelo do
      indicador. A dimensão entrega o município identificado; quem classifica é
      quem calcula o percentual.

      ATUALIZAÇÃO: recalculado a cada `dbt build`; não há carga incremental.
    config:
      tags: [silver, salic, rouanet, core, territorio]
      meta:
        status: Disabled
        meta_objetivo: 'Dimensão territorial de referência — base dos três indicadores da Meta 4'
        origem_dados: 'salic.silver_agentes_municipios + silver_agentes_uf + silver_agentes_populacaomunicipio'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: publico
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Identificadores.CodigoIBGE
    columns:
      - name: codigo_ibge_6
        description: >
          Código IBGE do município com seis posições, sem o dígito verificador,
          como o SALIC o registra. Chave da dimensão. Chega da bronze como
          inteiro — inócuo para código do IBGE, que nunca começa com zero, mas
          exige cast ao cruzar com fonte que traga o código como texto.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: codigo_ibge_7
        description: >
          Código IBGE do município com sete posições, com o dígito verificador.
          É a forma oficial e a usada pelo `transferegov`. Nulo para os
          municípios sem linha na tabela de população. Chega como inteiro,
          enquanto o `transferegov` traz o mesmo código como texto — cruzar as
          duas fontes exige cast explícito de um dos lados.
        data_type: integer
      - name: nome_municipio
        description: Nome do município como registrado na origem, sem normalização.
        data_type: text
        tests:
          - not_null
      - name: id_uf_ibge
        description: Código IBGE da unidade federativa. Chave de junção com a dimensão de UF.
        data_type: integer
      - name: sigla_uf
        description: >
          Sigla de duas letras da unidade federativa. Nulo quando o município
          não encontra UF correspondente — condição que deve permanecer
          visível, não corrigida em silêncio.
        data_type: text
      - name: nome_uf
        description: Nome da unidade federativa. Nulo nas mesmas condições da sigla.
        data_type: text
      - name: regiao
        description: >
          Região geográfica da unidade federativa. É o campo que sustenta o
          indicador P2 da Meta 4 pela cadeia territorial do IBGE. O SALIC também
          grava região direto em `tbApiComprovacoes.dsRegiao`; as duas fontes
          são independentes e podem divergir, e qual delas prevalece é decisão
          ainda não tomada.
        data_type: text
      - name: codigo_mesorregiao
        description: Código da mesorregião do IBGE, como vem da origem.
        data_type: integer
      - name: codigo_microrregiao
        description: Código da microrregião do IBGE, como vem da origem.
        data_type: integer
      - name: populacao
        description: >
          População do município como registrada na origem. Nulo para os cinco
          municípios sem linha na tabela de população.
        data_type: integer

  - name: silver_sac_projeto_rouanet
    description: >
      Camada Silver / núcleo SALIC. Dimensão do projeto cultural na Lei
      Rouanet: nome, área, segmento, mecanismo, enquadramento, situação, janela
      de execução, janela de captação e valores autorizados.

      GRÃO: uma linha por PRONAC. CHAVE: `pronac`. UNIVERSO: todo PRONAC de
      `silver_sac_chave_projeto_rouanet`, e não apenas os projetos que o cadastro
      resolve — um projeto que só aparece em captação existe para efeito de
      indicador, e incluí-lo só quando o cadastro o descreve produziria um
      denominador que muda sozinho conforme a carga avança. Projeto sem
      cadastro sai com atributos descritivos nulos e `cadastro_resolvido`
      `false`, nunca fora da tabela.

      IDENTIDADE FICA DE FORA: nem CPF/CNPJ, nem nome de proponente, nem
      `logon` de analista. A ligação projeto → proponente é
      `silver_sac_projeto_proponente_rouanet`, que é zona restrita. Esta dimensão
      existe para ser a parte publicável do projeto.

      APROVAÇÃO TEM HISTÓRICO; ENQUADRAMENTO NÃO. Cada projeto acumula atos de
      aprovação (inicial, complementação, prorrogação, redução, readequação).
      As datas e o valor autorizado vêm do ato mais recente. O valor aprovado
      não: o ato mais recente é prorrogação, de valor zero, em 126.064 dos
      181.292 projetos aprovados, e por isso ele segue a regra do SalicWeb
      (tipos 1 e 2 menos o tipo 4). O histórico completo está em
      `silver_sac_aprovacao_rouanet`. O enquadramento tem uma linha por projeto
      na origem: é o atual, sem histórico de reenquadramento.

      MEDIDA E UNIDADE: `valor_aprovado_reais` e `valor_autorizado_reais` estão
      em reais nominais da data da aprovação, sem correção monetária, e são
      teto de captação — não recurso realizado. Para recurso realizado use
      `silver_sac_captacao_rouanet`.

      JOINS: `silver_sac_vwalterarprojeto` (cadastro), `silver_sac_vwagentesseusprojetos`
      (mecanismo), `silver_sac_enquadramento`, `silver_sac_aprovacao`, `silver_sac_area` e
      `silver_sac_vsegmento` (dimensões descritivas, esta última casada por área +
      código, porque o código de segmento se repete entre áreas).

      LIMITAÇÕES: `Projetos` da ingestão v2 ainda não foi carregada, então o
      cadastro vem da view `silver_sac_vwalterarprojeto`, cujo grão não foi medido
      contra o banco — o `distinct on` do modelo garante o grão declarado
      independentemente disso. A cobertura de cadastro e a de nome de área e
      segmento também não foram medidas (gate G1).
      ATUALIZAÇÃO: recalculada a cada `dbt build`.
    config:
      tags: [silver, salic, rouanet, core, meta3, meta4, meta5]
      meta:
        status: Disabled
        meta_objetivo: 'Dimensão conformada do projeto Rouanet'
        origem_dados: 'salic.silver_sac_* + silver_sac_chave_projeto_rouanet'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.IncentivoFiscal.ProjetoCultural
            - MinC.Identificadores.PRONAC
    columns:
      - name: pronac
        description: >
          Chave de negócio do projeto, com 5 a 7 posições na série observada:
          ano de dois dígitos seguido do sequencial sem padding artificial.
          Chave primária desta dimensão.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.PRONAC
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('silver_sac_chave_projeto_rouanet')
                field: pronac
      - name: ano_pronac
        description: >
          Ano de abertura do projeto, de quatro dígitos, derivado do PRONAC.
          Não é ano de aprovação nem de captação.
        data_type: integer
      - name: id_pronac
        description: >
          Surrogate inteiro do projeto no SALIC. NULL quando a origem é ambígua
          — ver `silver_sac_chave_projeto_rouanet.id_pronac_ambiguo`.
        data_type: integer
      - name: nome_projeto
        description: >
          Nome do projeto cultural como cadastrado no SALIC. Campo público:
          consta das listagens oficiais da Lei Rouanet.
        data_type: text
      - name: codigo_area
        description: >
          Código da área cultural do projeto (dança, música, patrimônio e
          assemelhados), como inteiro. NULL quando o cadastro não resolve.
        data_type: integer
      - name: nome_area
        description: >
          Descrição da área cultural, de `silver_sac_area`. NULL quando o código não
          casa com a tabela de domínio — a ponte normaliza o código para
          dígitos, e área alfanumérica, se existir, resolve para nulo em vez de
          casar errado.
        data_type: text
      - name: codigo_segmento
        description: >
          Código do segmento cultural dentro da área, em texto: a maioria dos
          códigos tem letra. O código se repete entre áreas; a chave real do
          segmento é o par (área, código).
        data_type: text
      - name: nome_segmento
        description: >
          Descrição do segmento cultural, de `silver_sac_vsegmento`, casada por área
          e código.
        data_type: text
      - name: codigo_mecanismo
        description: >
          Código do mecanismo de incentivo do projeto, vindo de
          `silver_sac_vwagentesseusprojetos`. Exposto como código: a tabela de
          domínio ainda não foi identificada na bronze v2, e inventar a
          descrição seria pior que não tê-la.
        data_type: integer
      - name: codigo_enquadramento
        description: >
          Código do enquadramento atual do projeto (a origem não guarda
          histórico) — é ele que separa os
          artigos da lei com percentual de abatimento diferente. Exposto como
          código pelo mesmo motivo do mecanismo.
        data_type: integer
      - name: data_enquadramento
        description: Data do enquadramento atual do projeto; a origem não guarda reenquadramentos.
        data_type: date
      - name: codigo_situacao
        description: >
          Código da situação atual do projeto no SALIC. É um código de texto
          (não um rótulo legível); a tabela de domínio ainda não foi
          identificada na bronze v2. Nenhum indicador deve derivar "em
          execução" daqui antes da taxonomia temporal do gate A0.
        data_type: text
      - name: data_situacao
        description: >
          Data da última mudança de situação. NÃO é a data de registro do
          projeto — usá-la como entrada do proponente no sistema data errado
          todo indicador de primeiro acesso.
        data_type: date
      - name: data_inicio_execucao
        description: Início da janela de execução do projeto, como cadastrado.
        data_type: date
      - name: data_fim_execucao
        description: Fim da janela de execução do projeto, como cadastrado.
        data_type: date
      - name: data_primeira_aprovacao
        description: >
          Data da primeira aprovação registrada para o projeto. Distinta de
          `data_ultima_aprovacao` sempre que houve readequação ou prorrogação.
        data_type: date
      - name: data_ultima_aprovacao
        description: Data da aprovação mais recente registrada para o projeto.
        data_type: date
      - name: data_publicacao_ultima_aprovacao
        description: >
          Data de publicação da portaria da aprovação mais recente. É a data
          com efeito legal: é a partir dela que o projeto pode captar.
        data_type: date
      - name: data_inicio_captacao
        description: Início da janela em que o projeto está autorizado a captar.
        data_type: date
      - name: data_fim_captacao
        description: Fim da janela em que o projeto está autorizado a captar.
        data_type: date
      - name: valor_aprovado_reais
        description: >
          Valor aprovado do projeto pela regra do SalicWeb: soma do
          `aprovadoreal` dos atos de tipo 1 (inicial) e 2 (complementação)
          menos a dos de tipo 4 (redução), em reais nominais, sem correção
          monetária. É teto, não recurso realizado. Soma R$ 154,8 bi em
          181.292 projetos (R$ 28,9 bi pela regra antiga, do ato mais
          recente); 37 ficam negativos, e 5 não têm ato de tipo 1 nem
          2. A origem traz 95 reduções e 77 complementações com valor
          negativo; a regra soma e subtrai o valor como está.
        data_type: numeric
      - name: valor_autorizado_reais
        description: >
          Valor autorizado a captar na aprovação mais recente, em reais
          nominais, sem correção monetária. Comparar com o captado exige
          `silver_sac_captacao_rouanet`; usar este valor como execução superestima
          qualquer indicador.
        data_type: numeric
      - name: qt_aprovacoes
        description: >
          Quantas aprovações o projeto acumulou. Zero para projeto nunca
          aprovado — não NULL, porque a ausência de aprovação é informação.
        data_type: integer
        tests:
          - not_null
      - name: projeto_aprovado
        description: >
          `true` quando o projeto tem ao menos uma aprovação registrada.
          Aprovado não implica ter captado.
        data_type: boolean
        tests:
          - not_null
      - name: cadastro_resolvido
        description: >
          `false` quando o PRONAC existe em alguma tabela transacional mas o
          cadastro não o descreve. Expõe a cobertura do cadastro em vez de
          escondê-la reduzindo o universo.
        data_type: boolean
        tests:
          - not_null

  - name: silver_sac_projeto_proponente_rouanet
    description: >
      Camada Silver / núcleo SALIC. Ponte entre projeto e agente proponente na
      Lei Rouanet.

      ZONA RESTRITA — não publicável e proibida em corpus de RAG, no modelo
      inteiro e não por coluna. É o único modelo do núcleo que carrega
      identidade (CPF/CNPJ e nome), e existe separado da `silver_sac_projeto_rouanet`
      exatamente para que o projeto possa ser publicado sem arrastar a pessoa
      junto.

      GRÃO: uma linha por PRONAC × agente. CHAVE: `id_projeto_proponente`.
      UNIVERSO: os vínculos que `silver_sac_vwagentesseusprojetos` registra, com
      PRONAC e agente resolvidos.

      POR QUE UMA PONTE E NÃO UMA COLUNA NA DIMENSÃO: um projeto pode ter mais
      de um agente ligado a ele. Guardar o proponente como atributo do projeto
      obrigaria a escolher um em silêncio, e é essa escolha que muda a contagem
      de proponentes distintos das Metas 3 e 5.

      IDENTIDADE ENTRE BASES: a chave de cruzamento com LPG, PNAB e BB Ágil
      ainda não está aqui. O plano decidiu HMAC-SHA256 com segredo gerenciado,
      porque hash simples de CPF/CNPJ é enumerável; enquanto o segredo não
      existir, esta ponte guarda apenas o documento normalizado, na zona
      restrita, e nenhum modelo publicável o consome.

      LIMITAÇÕES: `silver_sac_vwagentesseusprojetos` não está no dicionário original
      do SALIC; o grão PRONAC × agente é leitura das colunas, não medição, e o
      `distinct on` garante o grão declarado independentemente do que a origem
      entregue. Que todo agente listado seja proponente, e não outro papel, é
      hipótese a confirmar antes de qualquer KPI contar proponentes a partir
      daqui (gate G1). ATUALIZAÇÃO: recalculada a cada `dbt build`.
    config:
      tags: [silver, salic, rouanet, core, restrito, meta3, meta5]
      meta:
        status: Disabled
        meta_objetivo: 'Ligação projeto → proponente, isolada da dimensão publicável'
        origem_dados: 'salic.silver_sac_vwagentesseusprojetos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          # Colunas cujo NOME parece identificador mas cujo CONTEUDO nao
          # identifica ninguem. A dispensa mora aqui, e nao na heuristica do
          # teste, para que ela seja revisavel no mesmo diff do modelo.
          derivadas_nao_identificantes: [documento_valido]
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - PII.Sensitive
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Agentes.Proponente
    columns:
      - name: id_projeto_proponente
        description: >
          Chave da ponte: PRONAC e id do agente concatenados. Existe para que a
          unicidade do grão composto seja testável sem depender de pacote
          externo. É chave técnica derivada de identificador de pessoa, por
          isso classificada como PII.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
        tests:
          - not_null
          - unique
      - name: pronac
        description: PRONAC do projeto, preservado sem padding artificial. Casa com `silver_sac_projeto_rouanet`.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.PRONAC
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_sac_projeto_rouanet')
                field: pronac
      - name: id_agente
        description: >
          Identificador do agente no cadastro do SALIC. Chave técnica que
          identifica pessoa indiretamente — classificada como PII por isso,
          e não pelo formato.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
        tests:
          - not_null
      - name: documento_proponente
        description: >
          CPF ou CNPJ do proponente, normalizado para dígitos (macro
          `normaliza_documento`), com zeros à esquerda preservados. Vazio vira
          NULL. Nunca sai da zona restrita.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
      - name: documento_valido
        description: >
          `true` quando o documento normalizado tem 11 ou 14 dígitos. Valida
          formato, não existência: não confere dígito verificador nem consulta
          base oficial.
        data_type: boolean
        tests:
          - not_null
      - name: tipo_pessoa_proponente
        description: >
          'PF' ou 'PJ', derivado apenas do comprimento do documento. NULL
          quando o comprimento não é 11 nem 14 — documento inválido não vira
          uma terceira categoria.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: nome_proponente
        description: >
          Nome ou razão social do proponente, como cadastrado. Dado pessoal:
          nunca sai da zona restrita, mesmo sendo público em listagens oficiais
          — aqui ele aparece ligado a documento e a projeto.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: id_solicitante
        description: >
          Identificador do solicitante do vínculo no SALIC, como texto na
          origem. Chave técnica ligada a pessoa. Em 9.117 vínculos a origem
          repete o vínculo com solicitantes diferentes; fica o menor, para o
          resultado não mudar entre execuções.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: descricao_vinculo
        description: >
          Texto da origem que descreve o vínculo entre agente e projeto. É o
          único campo que distingue o papel do agente, por isso fica; o domínio
          de valores não foi levantado e nenhum filtro do repositório depende
          dele. Por ser texto livre da origem, é tratado como campo que pode
          conter dado pessoal.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive

  - name: silver_sac_captacao_rouanet
    description: >
      Camada Silver / núcleo SALIC. Fato da captação de recurso na Lei Rouanet.

      GRÃO: uma linha por recibo de captação. CHAVE: `id_captacao`. UNIVERSO:
      todos os recibos de `silver_sac_captacao` com id, data e PRONAC resolvidos.
      Nenhum corte por ano, valor ou situação do projeto.

      O QUE MEDE: na Rouanet o MinC não repassa dinheiro ao agente — o projeto
      aprovado capta de um incentivador, que abate o valor do imposto devido. O
      recibo é o registro de que o recurso entrou, e por isso ele, e não a
      portaria de aprovação, é a medida de recurso captado das Metas 3 e 5.

      CAPTAÇÃO NÃO É PAGAMENTO: captado, comprovado e pago são três medidas
      diferentes, e um indicador nunca pode usar uma no numerador e outra no
      denominador. Este fato responde por captado.

      MEDIDA E UNIDADE: `valor_captado_reais` em reais nominais da data do
      recibo, sem correção monetária. `valor_captado_ufir` é o mesmo valor na
      unidade fiscal histórica e só faz sentido para série antiga.

      O MECENAS FICA DE FORA: `cgccpfmecena` identifica o incentivador e não é
      trazido. No lugar fica `tipo_pessoa_mecenas`, derivado só do comprimento
      do documento. É o que deixa este fato candidato a publicação depois da
      validação de segurança; análise por incentivador pede um fato restrito
      próprio.

      NULOS E DESCONHECIDOS: valor zero ou negativo (estorno) é preservado —
      filtrar aqui esconderia estorno de quem soma, e a decisão do que entra em
      cada indicador é do gold, com a regra declarada. Sai apenas o que não
      identifica evento: recibo sem id, sem data ou sem PRONAC resolvido.

      LIMITAÇÕES: a reconciliação por ano e PRONAC com
      `salic/silver_sac_captacao_proponente` é o gate G3 e ainda não foi
      feita. As duas leem a v2 e montam o PRONAC pela mesma macro; até a
      reconciliação os dois convivem e nenhum substitui o outro.
      ATUALIZAÇÃO: recalculado a cada `dbt build`.
    config:
      tags: [silver, salic, rouanet, core, meta3, meta5]
      meta:
        status: Disabled
        meta_objetivo: 'Recurso efetivamente captado por projeto — Metas 3 e 5'
        origem_dados: 'salic.silver_sac_captacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          pii_lido_sem_expor:
            - silver_sac_captacao.cgccpfmecena
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.IncentivoFiscal.CaptacaoEfetiva
    columns:
      - name: id_captacao
        description: Identificador do recibo de captação no SALIC. Chave do fato.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: pronac
        description: PRONAC do projeto que captou, preservado sem padding artificial.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.PRONAC
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_sac_projeto_rouanet')
                field: pronac
      - name: numero_recibo
        description: Número do recibo de captação, como texto na origem.
        data_type: text
      - name: data_recibo
        description: >
          Data do recibo — é o evento que data a captação e o que define o ano
          de referência de qualquer indicador de recurso captado.
        data_type: date
        tests:
          - not_null
      - name: ano_recibo
        description: Ano da data do recibo, para corte anual sem derivar data no gold.
        data_type: integer
        tests:
          - not_null
      - name: data_chegada_recibo
        description: >
          Data em que o recibo chegou ao SALIC. Diferente da data do recibo, e
          é a diferença entre as duas que explica atraso de série.
        data_type: date
      - name: valor_captado_reais
        description: >
          Valor captado em reais nominais da data do recibo, sem correção
          monetária. Valores zero e negativos (estorno) são preservados.
        data_type: numeric
      - name: valor_captado_ufir
        description: >
          Mesmo valor na unidade fiscal histórica (UFIR). Só faz sentido para a
          série anterior à extinção da unidade; não misture com reais.
        data_type: numeric
      - name: codigo_tipo_apoio
        description: >
          Código do tipo de apoio do recibo, como na origem. A tabela de
          domínio ainda não foi identificada na bronze v2.
        data_type: text
      - name: medida_provisoria
        description: >
          Medida provisória sob a qual a captação foi registrada, quando a
          origem preenche.
        data_type: text
      - name: tipo_pessoa_mecenas
        description: >
          'PF' ou 'PJ' do incentivador, derivado apenas do comprimento do
          documento. Deliberadamente não identificante: o CPF/CNPJ do mecenas
          não é trazido para esta camada.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: situacao_transferencia_recurso
        description: Situação da transferência do recurso, como código de texto na origem.
        data_type: text
      - name: data_transferencia_recurso
        description: Data da transferência do recurso, quando registrada.
        data_type: date
      - name: indicador_bem_servico
        description: >
          Marcador da origem para captação em bem ou serviço, em vez de
          dinheiro. Mantido como texto: o domínio de valores não foi levantado
          e convertê-lo para booleano aqui inventaria uma leitura.
        data_type: text

  - name: silver_sac_aprovacao_rouanet
    description: >
      Camada Silver / núcleo SALIC. Fato da aprovação de projeto na Lei
      Rouanet, com o histórico completo.

      GRÃO: uma linha por registro de aprovação. CHAVE: `id_aprovacao`.
      UNIVERSO: todos os registros de `silver_sac_aprovacao` com id e PRONAC
      resolvidos.

      POR QUE O HISTÓRICO INTEIRO: um projeto tem mais de uma aprovação ao
      longo da vida — inicial, readequação, prorrogação. A `silver_sac_projeto_rouanet`
      guarda só a mais recente, que é o que um painel lê; aqui nenhuma linha se
      perde, porque a série de valor autorizado e a janela de captação dependem
      do histórico. `codigo_tipo_aprovacao`, `id_readequacao` e
      `id_prorrogacao` são o que distingue os registros entre si.

      APROVAÇÃO NÃO É CAPTAÇÃO: o valor autorizado é teto — quanto o projeto
      pode captar, não quanto captou. Usá-lo como recurso realizado superestima
      qualquer indicador de execução.

      MEDIDA E UNIDADE: todos os valores `_reais` em reais nominais da data da
      aprovação, sem correção monetária; os `_ufir` na unidade fiscal
      histórica.

      DUAS COLUNAS DA ORIGEM FICAM DE FORA: `logon`, que identifica o servidor
      que registrou a aprovação, e `resumoaprovacao`, texto livre digitado por
      analista — texto livre é o vetor por onde nome, endereço e documento
      entram numa tabela que nenhuma classificação automática marca.

      LIMITAÇÕES: o domínio de `codigo_tipo_aprovacao` não foi levantado contra
      o banco e fica exposto como código, sem descrição inventada (gate G1).
      ATUALIZAÇÃO: recalculado a cada `dbt build`.
    config:
      tags: [silver, salic, rouanet, core, meta5]
      meta:
        status: Disabled
        meta_objetivo: 'Histórico de aprovação e teto de captação por projeto'
        origem_dados: 'salic.silver_sac_aprovacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.IncentivoFiscal.ProjetoCultural
    columns:
      - name: id_aprovacao
        description: Identificador do registro de aprovação no SALIC. Chave do fato.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: pronac
        description: PRONAC do projeto aprovado, preservado sem padding artificial.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.PRONAC
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_sac_projeto_rouanet')
                field: pronac
      - name: id_pronac
        description: Surrogate inteiro do projeto, como gravado na própria linha de origem.
        data_type: integer
      - name: id_parecer
        description: Identificador do parecer que embasou a aprovação.
        data_type: integer
      - name: codigo_tipo_aprovacao
        description: >
          Código que distingue aprovação inicial de readequação e prorrogação.
          Exposto como código: a tabela de domínio ainda não foi identificada.
        data_type: text
      - name: data_aprovacao
        description: Data em que a aprovação foi registrada.
        data_type: date
      - name: ano_aprovacao
        description: Ano da data de aprovação, para corte anual.
        data_type: integer
      - name: numero_portaria
        description: Número da portaria de aprovação.
        data_type: text
      - name: data_portaria
        description: Data da portaria de aprovação.
        data_type: date
      - name: data_publicacao
        description: >
          Data de publicação da portaria. É a data com efeito legal: a partir
          dela o projeto pode captar. Preferida a `data_aprovacao` quando se
          precisa datar o acesso.
        data_type: date
      - name: data_inicio_captacao
        description: Início da janela autorizada de captação.
        data_type: date
      - name: data_fim_captacao
        description: Fim da janela autorizada de captação.
        data_type: date
      - name: valor_aprovado_reais
        description: Valor aprovado, em reais nominais da data da aprovação.
        data_type: numeric
      - name: valor_autorizado_reais
        description: >
          Valor autorizado a captar, em reais nominais. É teto, não recurso
          realizado.
        data_type: numeric
      - name: valor_concedido_custeio_reais
        description: Parcela de custeio do valor concedido, em reais nominais.
        data_type: numeric
      - name: valor_concedido_capital_reais
        description: Parcela de capital do valor concedido, em reais nominais.
        data_type: numeric
      - name: valor_contrapartida_reais
        description: Contrapartida registrada na aprovação, em reais nominais.
        data_type: numeric
      - name: valor_aprovado_ufir
        description: Valor aprovado na unidade fiscal histórica (UFIR).
        data_type: numeric
      - name: valor_autorizado_ufir
        description: Valor autorizado na unidade fiscal histórica (UFIR).
        data_type: numeric
      - name: id_prorrogacao
        description: Identificador da prorrogação, quando a aprovação é uma prorrogação.
        data_type: integer
      - name: id_readequacao
        description: Identificador da readequação, quando a aprovação é uma readequação.
        data_type: integer

  - name: silver_sac_evento_acesso_rouanet
    description: >
      Camada Silver / núcleo SALIC. Espinha de eventos datados de acesso à Lei
      Rouanet, no grão do projeto.

      GRÃO: uma linha por evento qualificável. CHAVE: `id_evento`. UNIVERSO:
      união de `silver_sac_captacao_rouanet` e `silver_sac_aprovacao_rouanet`, restrita aos
      eventos com data resolvida.

      PARA QUE SERVE: a Meta 5 pergunta quantos proponentes acessaram a Rouanet
      pela primeira vez em um ano. Responder exige uma série de eventos datados
      e comparáveis, e exige que "primeira aprovação" e "primeira captação"
      continuem distinguíveis — são conceitos diferentes e o plano proíbe
      colapsá-los. Por isso o tipo do evento é coluna, e não filtro embutido.

      É MODELO DE PROJETO, NÃO DE PESSOA: não carrega proponente, documento nem
      id de agente. A ligação com identidade acontece uma camada acima, na zona
      restrita, cruzando com `silver_sac_projeto_proponente_rouanet`. Manter a espinha
      no grão do projeto é o que permite publicá-la.

      FALTA O EVENTO DE REGISTRO, e a ausência é conhecida: a data de registro
      da proposta está em `PreProjeto`/`Projetos` da v2, que não foram
      ingeridas. Derivá-la de `data_situacao` seria errado — aquilo é a última
      mudança de situação, não a entrada. Enquanto a fonte não chega,
      `tipo_evento` tem dois valores, e qualquer KPI de primeiro acesso
      construído sobre isto mede primeiro acesso A RECURSO, não primeiro
      contato com o sistema.

      MEDIDA E UNIDADE: `valor_reais` é captado quando o evento é captação e
      autorizado quando é aprovação. São medidas diferentes na mesma coluna, de
      propósito, porque a coluna é o valor associado ao evento — somar as duas
      juntas é erro, e é por isso que `tipo_evento` nunca deve ser agregado
      fora.

      REGRA DA DATA: publicação vem antes de data de aprovação no `coalesce`
      porque é a data com efeito legal. Quando a publicação não está
      preenchida, a data de aprovação entra como substituta e
      `data_evento_substituta` marca isso, para que o gold possa medir o quanto
      da série depende do substituto.

      LIMITAÇÕES: herda os limites dos dois fatos de origem, incluindo a
      reconciliação pendente com a bronze v1 (gate G3).
      ATUALIZAÇÃO: recalculado a cada `dbt build`.
    config:
      tags: [silver, salic, rouanet, core, meta5]
      meta:
        status: Disabled
        meta_objetivo: 'Meta 5 — série datada de acesso a recurso na Rouanet'
        origem_dados: 'silver_sac_captacao_rouanet + silver_sac_aprovacao_rouanet'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Agentes.PrimeiroAcesso
            - MinC.IncentivoFiscal.CaptacaoEfetiva
    columns:
      - name: id_evento
        description: >
          Chave do evento: tipo e id de origem concatenados. Garante unicidade
          entre os dois fatos, cujos ids são independentes entre si.
        data_type: text
        tests:
          - not_null
          - unique
      - name: tipo_evento
        description: >
          'APROVACAO' ou 'CAPTACAO'. Nunca agregue valores de tipos diferentes
          na mesma soma: são medidas distintas. 'REGISTRO' está previsto e
          ausente porque a fonte não foi ingerida.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['APROVACAO', 'CAPTACAO']
      - name: pronac
        description: PRONAC do projeto a que o evento pertence.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.PRONAC
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_sac_projeto_rouanet')
                field: pronac
      - name: id_origem
        description: >
          Id do registro no fato de origem — `id_captacao` ou `id_aprovacao`.
          Único apenas dentro do mesmo `tipo_evento`.
        data_type: integer
        tests:
          - not_null
      - name: data_evento
        description: >
          Data do evento: data do recibo, na captação; data de publicação da
          portaria (ou de aprovação, como substituta) na aprovação.
        data_type: date
        tests:
          - not_null
      - name: ano_evento
        description: Ano da data do evento, para corte anual.
        data_type: integer
        tests:
          - not_null
      - name: data_evento_substituta
        description: >
          `true` quando a data do evento veio de campo substituto — hoje, só
          aprovação sem data de publicação. Expõe a fragilidade da série em vez
          de escondê-la.
        data_type: boolean
        tests:
          - not_null
      - name: valor_reais
        description: >
          Valor em reais nominais associado ao evento: captado, quando
          captação; autorizado, quando aprovação. Só é somável dentro de um
          mesmo `tipo_evento`.
        data_type: numeric
  - name: silver_sac_pagamento_profissional_rouanet
    description: >
      Camada Silver restrita da Meta 3. Preserva os registros de pagamentos a
      fornecedores e profissionais devolvidos pela view detalhada do SALIC.
      GRÃO PROVISÓRIO: uma linha por registro da origem; a combinação projeto,
      item, comprovante, prestador, data e valor é uma chave candidata, e
      `ocorrencia_chave_candidata` evidencia repetições sem descartá-las.
      MEDIDA: valor efetivamente pago em reais nominais; não é valor captado,
      aprovado ou apenas comprovado. O ano é o da data de pagamento, em linha
      com o recorte de execução do estudo FGV para 2024. Valores nulos, zero,
      negativos e estornos não são filtrados na silver. IDENTIDADE: documento
      e nome do prestador tornam o modelo inteiro restrito e proibido para RAG.
      O texto livre de justificativa da origem é deliberadamente excluído.
      LIMITAÇÕES: o grão e a reconciliação financeira aguardam a execução pela
      DAG com permissão de escrita; a ligação com perfil demográfico e o filtro
      temporal de prestação de contas ainda não têm fonte homologada.
    config:
      tags: [silver, salic, rouanet, meta3, restrito]
      meta:
        status: Disabled
        meta_objetivo: 'Pagamentos auditáveis a profissionais e fornecedores da Rouanet'
        origem_dados: 'salic.silver_sac_vwpagamentodefornecedordoprojetoporitemdetalhado'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - ocorrencia_chave_candidata
            - tipo_documento_comprovante
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.IncentivoFiscal.ExecucaoFinanceira
    columns:
      - name: chave_candidata_pagamento
        description: >
          Hash técnico da combinação candidata a identificar o pagamento. É
          linkável e derivado também do documento do prestador, portanto PII.
        data_type: text
        meta:
          openmetadata:
            tags: [PII.Sensitive]
      - name: ocorrencia_chave_candidata
        description: >
          Ordem da linha dentro de uma chave candidata repetida. Valor maior
          que um sinaliza duplicidade a investigar, sem apagar o registro.
        data_type: bigint
        tests:
          - not_null
      - name: id_pronac
        description: Identificador técnico do projeto informado pela view de pagamentos.
        data_type: integer
      - name: pronac
        description: >
          Chave de negócio do projeto, recuperada preferencialmente pelo mapa
          conformado e, quando possível, pelo número informado na própria view.
        data_type: text
        meta:
          openmetadata:
            glossary: [MinC.Identificadores.PRONAC]
      - name: pronac_resolvido_por_mapa
        description: >
          Verdadeiro quando o PRONAC veio de uma associação unívoca com
          `id_pronac`; falso indica uso do fallback numérico ou ausência.
        data_type: boolean
        tests:
          - not_null
      - name: documento_prestador
        description: CPF ou CNPJ do prestador, normalizado para somente dígitos.
        data_type: text
        meta:
          openmetadata:
            tags: [PII.Sensitive]
      - name: tipo_pessoa_prestador
        description: >
          Tipo PF ou PJ derivado apenas do comprimento do documento; nulo para
          documento ausente ou com quantidade de dígitos inválida.
        data_type: text
        meta:
          openmetadata:
            tags: [PII.Sensitive]
      - name: nome_prestador
        description: Nome do fornecedor ou profissional registrado no comprovante.
        data_type: text
        meta:
          openmetadata:
            tags: [PII.NonSensitive]
      - name: id_item_planilha
        description: Identificador técnico do item orçamentário pago no projeto.
        data_type: integer
      - name: nome_item
        description: Descrição do item orçamentário ao qual o pagamento foi associado.
        data_type: text
      - name: numero_comprovante
        description: Número do comprovante dentro dos registros de execução do projeto.
        data_type: integer
      - name: data_emissao
        description: Data de emissão do documento fiscal ou comprovante apresentado.
        data_type: date
      - name: tipo_documento_comprovante
        description: Código textual do tipo de documento fiscal ou comprovante.
        data_type: text
      - name: data_pagamento
        description: Data em que o pagamento ao fornecedor ou profissional foi realizado.
        data_type: date
      - name: ano_pagamento
        description: Ano civil derivado de `data_pagamento`, referência temporal do fato.
        data_type: integer
      - name: tipo_forma_pagamento
        description: Código textual da forma de pagamento registrada na origem.
        data_type: text
      - name: numero_documento_pagamento
        description: >
          Número do documento da transação de pagamento. É mantido apenas para
          auditoria no ambiente restrito e não pode ser publicado.
        data_type: integer
        meta:
          openmetadata:
            tags: [PII.Sensitive]
      - name: valor_pago_reais
        description: >
          Valor efetivamente pago, em reais nominais. Nulos, zeros e valores
          negativos são preservados para reconciliação e tratamento no gold.
        data_type: numeric
  - name: silver_sac_projeto_local_execucao
    description: >
      Camada Silver territorial da Meta 4. Relaciona o registro de abrangência
      do SALIC ao PRONAC sem carregar valores financeiros. GRÃO: uma linha por
      `id_abrangencia`. PAPEL GEOGRÁFICO: local declarado de realização, nunca
      residência do proponente ou do prestador. O art. 15, § 2º, da IN MinC
      10/2023 fundamenta essa distinção para a aferição territorial da PNAB,
      mas não é tratado como obrigação jurídica da Rouanet. MULTICIDADE: não há
      rateio nem replicação nesta bridge; essa regra permanece bloqueada para o
      fato/gold. DESCONHECIDOS: projeto ou município não resolvido permanece
      nulo e recebe flag de cobertura; nunca é classificado como não vulnerável.
      LIMITAÇÕES: os códigos territoriais da origem ainda precisam casar com a
      dimensão oficial do IBGE, e as 13 categorias do art. 15 precisam de
      fontes e limiares operacionais antes da classificação de vulnerabilidade.
    config:
      tags: [silver, salic, rouanet, meta4, territorio]
      meta:
        status: Disabled
        meta_objetivo: 'Locais declarados de realização dos projetos Rouanet'
        origem_dados: 'salic.silver_sac_abrangencia + silver_sac_chave_projeto_rouanet'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Incentivo Fiscal
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.IncentivoFiscal.LocalDeExecucao
    columns:
      - name: id_abrangencia
        description: Identificador do registro territorial na tabela de abrangência do SALIC.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: id_projeto
        description: Identificador antigo do projeto usado pela tabela de abrangência.
        data_type: integer
      - name: pronac
        description: >
          Chave de negócio do projeto quando `id_projeto` possui associação
          unívoca no mapa conformado; nula em caso de ausência ou ambiguidade.
        data_type: text
        meta:
          openmetadata:
            glossary: [MinC.Identificadores.PRONAC]
      - name: pronac_resolvido
        description: Verdadeiro quando o local pôde ser ligado sem ambiguidade a um PRONAC.
        data_type: boolean
        tests:
          - not_null
      - name: id_pais_origem
        description: Identificador de país conforme o domínio interno do SALIC.
        data_type: integer
      - name: id_uf_origem
        description: Identificador de unidade federativa conforme o domínio interno do SALIC.
        data_type: integer
      - name: codigo_municipio_ibge_origem
        description: >
          Código municipal informado pela origem. É preservado como recebido e
          não recebe zeros artificiais antes do casamento com base oficial.
        data_type: integer
        meta:
          openmetadata:
            glossary: [MinC.Identificadores.CodigoIBGE]
      - name: registro_ativo
        description: Indicador do SALIC de que o registro de abrangência está ativo.
        data_type: boolean
      - name: codigo_realizacao
        description: 'Código original de realização: 0 sem informação, 1 não e 2 sim.'
        data_type: text
      - name: local_realizado
        description: >
          Indicador triestado derivado: verdadeiro para código 2, falso para 1
          e nulo para ausência, sem informação ou código desconhecido.
        data_type: boolean
      - name: situacao_realizacao
        description: >
          Rótulo controlado derivado do código: SEM_INFORMACAO, NAO_REALIZADO,
          REALIZADO ou CODIGO_DESCONHECIDO.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: [SEM_INFORMACAO, NAO_REALIZADO, REALIZADO, CODIGO_DESCONHECIDO]
      - name: data_inicio_realizacao
        description: Data inicial declarada para a realização na localidade.
        data_type: date
      - name: data_fim_realizacao
        description: Data final declarada para a realização na localidade.
        data_type: date
