version: 2

# Silvers do assunto proposta e projeto do banco sac do SALIC: a proposta
# (preprojeto) e o que se liga a ela, o plano de distribuição, as fases, o
# monitoramento e as views de projeto, captação e renúncia por projeto.
# Medições de 29/10/2026 na Bronze (salic.bronze_sac_*), por agregados, sem
# valor de linha. Os códigos vêm da tabela de verificação do sac, de
# sac.tbnormativos e do código público do SalicWeb.

models:
  - name: silver_sac_preprojeto
    description: >
      Uma linha por proposta cultural apresentada pelo SalicWeb, antes de virar
      projeto. São 450.003 propostas, de 2009 a 2026, de 153.330 agentes.
      155.574 viraram projeto: silver_sac_projetos.idprojeto aponta para o
      idpreprojeto. Duas origens: 339.507 propostas de incentivo fiscal
      (mecanismo 1, tipo de demanda NA) e 110.465 de edital (mecanismo 2, ED).


      Os campos de texto longo (justificativa, objetivos, acessibilidade, ficha
      técnica e outros) vêm em HTML do editor do SalicWeb. dtatotombamento tem
      só datas de 1900, sentinela de vazio. 2.614 propostas têm agente que não
      existe em silver_agentes_agentes.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_preprojeto'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - agenciabancaria
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idpreprojeto
        description: >
          Identificador da proposta. Único. É o que
          silver_sac_projetos.idprojeto, silver_sac_abrangencia.idprojeto e
          silver_sac_tbdeslocamento.idprojeto gravam.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idagente
        description: >
          Proponente, código de silver_agentes_agentes.idagente. 2.614 não
          existem lá.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: nomeprojeto
        description: >
          Título da proposta, como o proponente escreveu.
        data_type: text
      - name: mecanismo
        description: >
          Mecanismo da proposta: 1 incentivo fiscal, 339.526; 2 convênio ou
          edital, 110.477. A proposta só tem esses dois.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: False
              config:
                severity: warn
      - name: agenciabancaria
        description: >
          Agência bancária indicada para a conta do projeto, em texto: 8% não
          são número.
        data_type: text
      - name: areaabrangencia
        description: >
          Se a proposta declara abrangência em mais de um local.
        data_type: boolean
      - name: dtiniciodeexecucao
        description: >
          Início previsto da execução.
        data_type: timestamp
      - name: dtfinaldeexecucao
        description: >
          Fim previsto da execução.
        data_type: timestamp
      - name: justificativa
        description: >
          Justificativa da proposta, em HTML.
        data_type: text
      - name: nratotombamento
        description: >
          Número do ato de tombamento, para patrimônio tombado, em texto.
          Preenchido em 4.985 propostas.
        data_type: text
      - name: dtatotombamento
        description: >
          Data do ato de tombamento. Só tem datas de 1900, sentinela de vazio:
          não use.
        data_type: timestamp
      - name: esferatombamento
        description: >
          Esfera do tombamento: 0 em 434.981 propostas, que não são de
          patrimônio; 1 a 5 nas outras, sem tabela de domínio ingerida.
        data_type: integer
      - name: resumodoprojeto
        description: >
          Resumo da proposta, em texto livre.
        data_type: text
      - name: objetivos
        description: >
          Objetivos da proposta, em HTML do editor do SalicWeb.
        data_type: text
      - name: acessibilidade
        description: >
          Medidas de acessibilidade, em HTML.
        data_type: text
      - name: democratizacaodeacesso
        description: >
          Medidas de democratização de acesso, em HTML.
        data_type: text
      - name: etapadetrabalho
        description: >
          Etapas de trabalho, em HTML.
        data_type: text
      - name: fichatecnica
        description: >
          Ficha técnica, em HTML.
        data_type: text
      - name: sinopse
        description: >
          Sinopse da proposta, em HTML do editor do SalicWeb.
        data_type: text
      - name: impactoambiental
        description: >
          Impacto ambiental, em HTML. Preenchido em 27%.
        data_type: text
      - name: especificacaotecnica
        description: >
          Especificação técnica, em HTML.
        data_type: text
      - name: estrategiadeexecucao
        description: >
          Estratégia de execução, em HTML.
        data_type: text
      - name: dtaceite
        description: >
          Data em que o proponente enviou a proposta, de 2009 a 2026.
        data_type: timestamp
      - name: dtarquivamento
        description: >
          Data de arquivamento da proposta. Preenchida em 90.140.
        data_type: timestamp
      - name: stestado
        description: >
          Se a proposta está ativa: true em 312.440, false em 137.563.
        data_type: boolean
      - name: stdatafixa
        description: >
          Se a proposta tem data fixa de realização.
        data_type: boolean
      - name: stplanoanual
        description: >
          Se a proposta é plano anual de atividades.
        data_type: boolean
      - name: idusuario
        description: >
          Conta que criou a proposta. 449.573 existem em
          silver_controledeacesso_sgcacesso, o login do SalicWeb.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: sttipodemanda
        description: >
          Tipo de demanda: NA proposta comum de incentivo fiscal, 339.507; ED
          proposta de edital, 110.481. DE (9) e EP (3) sem significado
          confirmado. O SalicWeb lista as propostas do proponente filtrando NA.
        data_type: text
      - name: idedital
        description: >
          Edital da proposta, nas propostas de edital. Preenchido em 110.464.
        data_type: integer
      - name: stproposta
        description: >
          Plano de execução imediata, código da tabela de verificação do banco
          sac (grupo 23): 610 projeto normal com 10% de captação, 203.202; 618
          aprovado em edital, 12.659; 614 plano anual, 8.104; 923 emergencial
          do Rio Grande do Sul, 2.024. Vazio em 214.089.
        data_type: integer
      - name: tpprorrogacao
        description: >
          Se a proposta aceita prorrogação automática: true em 230.559, false
          em 5.065, vazio em 214.379.
        data_type: boolean
      - name: descricaoatividade
        description: >
          Descrição da atividade, em HTML.
        data_type: text
      - name: tptipicidade
        description: >
          Tipicidade da proposta, código da tabela de verificação do banco sac
          (grupo 28), como 832 projetos normais e 758 normais até R$ 500 mil.
          Vazia em 253.470.
        data_type: integer
      - name: tptipologia
        description: >
          Tipologia da proposta, código da tabela de verificação do banco sac
          (grupos 29, 30 e 34), como 767 concertos de orquestra ou 918
          festivais e mostras.
        data_type: integer
      - name: idpronaccontinuacao
        description: >
          PRONAC de que a proposta é continuação. Preenchido em 7.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbplanodistribuicao
    description: >
      Uma linha por produto no plano de distribuição de um projeto em
      readequação: quantidade produzida, quanto vai para patrocinador,
      proponente e outros, e preços. São 20.017 linhas de 6.256 projetos;
      19.920 têm idreadequacao. O plano de distribuição original de cada
      produto fica em sac.PlanoDistribuicaoProduto, que não é ingerida.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbplanodistribuicao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - qtproponente
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idplanodistribuicao
        description: >
          Identificador da linha. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idreadequacao
        description: >
          Readequação a que o plano pertence. Vazio em 97.
        data_type: integer
      - name: idproduto
        description: >
          Produto cultural, código de produto do sac.
        data_type: integer
      - name: cdarea
        description: >
          Área cultural do projeto, código de silver_sac_area: 1 Artes Cênicas,
          2 Audiovisual, 3 Música, 4 Artes Visuais, 5 Patrimônio Cultural, 6
          Humanidades, 7 Artes Integradas, 9 Museus e Memória.
        data_type: text
      - name: cdsegmento
        description: >
          Segmento cultural, código de silver_sac_vsegmento, em texto porque há
          códigos com letra. O código só é único junto com a área.
        data_type: text
      - name: idposicaologo
        description: >
          Posição da logomarca do governo no produto, código da tabela de
          verificação do banco sac (grupo 3), como 26 primeira página ou 32
          antes dos créditos finais.
        data_type: integer
      - name: qtproduzida
        description: >
          Quantidade produzida.
        data_type: integer
      - name: qtpatrocinador
        description: >
          Quantidade destinada ao patrocinador.
        data_type: integer
      - name: qtproponente
        description: >
          Quantidade destinada ao proponente.
        data_type: integer
      - name: qtoutros
        description: >
          Quantidade destinada a outros, como distribuição gratuita.
        data_type: integer
      - name: qtvendanormal
        description: >
          Quantidade vendida a preço normal.
        data_type: integer
      - name: qtvendapromocional
        description: >
          Quantidade vendida a preço promocional.
        data_type: integer
      - name: vlunitarionormal
        description: >
          Preço unitário normal, em reais.
        data_type: numeric
      - name: vlunitariopromocional
        description: >
          Preço unitário promocional, em reais.
        data_type: numeric
      - name: stprincipal
        description: >
          Se é o produto principal do projeto.
        data_type: boolean
      - name: tpsolicitacao
        description: >
          Tipo da solicitação na readequação: N em 10.663, A em 9.286, I em 60,
          E em 8. Sem tabela de domínio ingerida.
        data_type: text
      - name: tpanalisetecnica
        description: >
          Resultado da análise técnica: N em 14.742, D em 5.062, I em 213. Sem
          tabela de domínio ingerida.
        data_type: text
      - name: tpanalisecomissao
        description: >
          Resultado da análise da comissão: N em todas as linhas.
        data_type: text
      - name: stativo
        description: >
          Se a linha está ativa: S em 7.205, N em 12.812.
        data_type: text
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: canalaberto
        description: >
          Se a distribuição é em canal aberto, como TV aberta.
        data_type: boolean
      - name: qtdevendapopularnormal
        description: >
          Quantidade vendida a preço popular normal.
        data_type: integer
      - name: qtdevendapopularpromocional
        description: >
          Quantidade vendida a preço popular promocional.
        data_type: integer
      - name: vlunitariopopularnormal
        description: >
          Preço popular unitário, em reais.
        data_type: numeric
      - name: precounitarionormal
        description: >
          Preço unitário normal, em reais.
        data_type: numeric
      - name: receitapopularpromocional
        description: >
          Receita popular promocional prevista, em reais. Vale 0 em 18.917
          linhas.
        data_type: numeric
      - name: receitapopularnormal
        description: >
          Receita popular normal prevista, em reais.
        data_type: numeric
      - name: vlreceitatotalprevista
        description: >
          Receita total prevista do produto, em reais.
        data_type: numeric
      - name: idplanodistribuicaooriginal
        description: >
          Linha do plano original que esta substitui, em
          sac.PlanoDistribuicaoProduto.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbdetalhaplanodistribuicao
    description: >
      Uma linha por local e produto do plano de distribuição: UF, município e
      quantidades gratuitas, populares e do proponente. São 626.585 linhas para
      284.010 planos. O plano detalhado, idplanodistribuicao, é o de
      sac.PlanoDistribuicaoProduto, que não é ingerida: só 12 linhas casam por
      acaso com silver_sac_tbplanodistribuicao, que é o plano da readequação.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbdetalhaplanodistribuicao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
          derivadas_nao_identificantes:
            - qtproponenteintegral
            - qtproponenteparcial
            - vlunitarioproponenteintegral
            - vlreceitaproponenteintegral
            - vlreceitaproponenteparcial
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iddetalhaplanodistribuicao
        description: >
          Identificador da linha. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idplanodistribuicao
        description: >
          Plano detalhado, de sac.PlanoDistribuicaoProduto, que não é ingerida.
          Não liga com silver_sac_tbplanodistribuicao.
        data_type: integer
      - name: iduf
        description: >
          UF do local, código IBGE.
        data_type: integer
      - name: idmunicipio
        description: >
          Município do local, código IBGE de 6 dígitos.
        data_type: integer
      - name: stdistribuicao
        description: >
          Se o local tem distribuição: true em 626.580 linhas, false em 5.
        data_type: boolean
      - name: dsproduto
        description: >
          Descrição do produto no local.
        data_type: text
      - name: qtexemplares
        description: >
          Quantidade de exemplares no local.
        data_type: integer
      - name: qtgratuitadivulgacao
        description: >
          Quantidade gratuita para divulgação.
        data_type: integer
      - name: qtgratuitapatrocinador
        description: >
          Quantidade gratuita para o patrocinador.
        data_type: integer
      - name: qtgratuitapopulacao
        description: >
          Quantidade gratuita para a população.
        data_type: integer
      - name: qtpopularintegral
        description: >
          Quantidade a preço popular, inteira.
        data_type: integer
      - name: qtpopularparcial
        description: >
          Quantidade a preço popular, meia.
        data_type: integer
      - name: vlunitariopopularintegral
        description: >
          Preço popular inteiro, em reais: 0, 10, 20, 40 ou 50.
        data_type: numeric
      - name: vlreceitapopularintegral
        description: >
          Receita popular inteira prevista, em reais.
        data_type: numeric
      - name: vlreceitapopularparcial
        description: >
          Receita popular meia prevista, em reais.
        data_type: numeric
      - name: qtproponenteintegral
        description: >
          Quantidade vendida pelo proponente, inteira.
        data_type: integer
      - name: qtproponenteparcial
        description: >
          Quantidade vendida pelo proponente, meia.
        data_type: integer
      - name: vlunitarioproponenteintegral
        description: >
          Preço do proponente, inteiro, em reais.
        data_type: numeric
      - name: vlreceitaproponenteintegral
        description: >
          Receita do proponente, inteira, em reais.
        data_type: numeric
      - name: vlreceitaproponenteparcial
        description: >
          Receita do proponente, meia, em reais.
        data_type: numeric
      - name: vlreceitaprevista
        description: >
          Receita total prevista no local, em reais.
        data_type: numeric
      - name: tplocal
        description: >
          Tipo de local, em letra minúscula ou maiúscula conforme a época: a em
          360.231, f em 261.552; vazio em 4.795. Sem tabela de domínio
          ingerida.
        data_type: text
      - name: tpespaco
        description: >
          Tipo de espaço: n em 341.046, s em 280.729; poucas linhas com 0, 1 ou
          maiúscula. Sem tabela de domínio ingerida.
        data_type: text
      - name: tpvenda
        description: >
          Tipo de venda: i em 529.448, e em 92.337; vazio em 4.796. Sem tabela
          de domínio ingerida.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbdeslocamento
    description: >
      Uma linha por deslocamento previsto numa proposta: origem e destino
      (país, UF, município) e quantidade de pessoas. São 446.848 deslocamentos
      de 80.300 propostas, todas existentes em silver_sac_preprojeto (idprojeto
      é o idpreprojeto).
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbdeslocamento'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iddeslocamento
        description: >
          Identificador do deslocamento. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idprojeto
        description: >
          Proposta, pelo idpreprojeto de silver_sac_preprojeto, sem órfão.
        data_type: integer
        tests:
          - not_null
      - name: idpaisorigem
        description: >
          País de origem, código de silver_agentes_vpais: 31 é Brasil.
        data_type: integer
      - name: iduforigem
        description: >
          UF de origem, código IBGE.
        data_type: integer
      - name: idmunicipioorigem
        description: >
          Município de origem, código IBGE.
        data_type: integer
      - name: idpaisdestino
        description: >
          País de destino, código de silver_agentes_vpais.
        data_type: integer
      - name: idufdestino
        description: >
          UF de destino, código IBGE.
        data_type: integer
      - name: idmunicipiodestino
        description: >
          Município de destino, código IBGE.
        data_type: integer
      - name: qtde
        description: >
          Quantidade de pessoas no deslocamento.
        data_type: integer
      - name: idusuario
        description: >
          Conta que gravou a linha. Confira a origem antes de cruzar: em
          silver_sac_preprojeto quase todas são contas do SalicWeb
          (silver_controledeacesso_sgcacesso).
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbprojetofase
    description: >
      Uma linha por fase de um projeto, com o normativo que rege o projeto. São
      842.182 linhas de 195.646 projetos. A fase é código da tabela de
      verificação do banco sac (grupo 26): 647 comprovação de capacidade de
      execução, 648 avaliação técnica, 649 captação para liberar a execução,
      650 execução e comprovação dos gastos, 651 avaliação dos resultados, 652
      projeto encerrado. stestado true marca a fase atual.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbprojetofase'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idprojetofase
        description: >
          Identificador da linha. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idnormativo
        description: >
          Normativo do projeto, código de sac.tbnormativos: de 1 sem instrução
          a 15 IN MinC 29/2026, a vigente.
        data_type: integer
      - name: idfase
        description: >
          Fase, código da tabela de verificação do banco sac (grupo 26), de 647
          a 652.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [647, 648, 649, 650, 651, 652]
                quote: False
              config:
                severity: warn
      - name: dtiniciofase
        description: >
          Data de início da fase do projeto.
        data_type: timestamp
      - name: dtfinalfase
        description: >
          Fim da fase. Vazio em 85.910, nas fases em curso.
        data_type: timestamp
      - name: stestado
        description: >
          Se é a fase atual do projeto.
        data_type: boolean
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbmonitoramentoprojeto
    description: >
      Uma linha por fotografia financeira de um projeto no monitoramento: valor
      homologado, captado, comprovado, saldos das contas e percentuais. São
      210.970 linhas de 11.167 projetos, de novembro de 2023 a 2026. É a fonte
      mais completa do estado financeiro do projeto em cada momento.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
