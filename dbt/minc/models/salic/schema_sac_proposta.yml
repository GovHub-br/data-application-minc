  - name: silver_sac_preprojeto
    description: >
      Uma linha por pré-projeto — a proposta cultural antes de virar PRONAC.
      Guarda os textos longos da proposta (justificativa, objetivos, sinopse,
      ficha técnica) em HTML da origem, e o ciclo de aceite/arquivamento.
      ~450 mil linhas. Camada Silver tipada a partir de salic.bronze_sac_preprojeto.
      Cruza com agentes__agentes por idagente.
      Armadilha: `dtatotombamento` traz muito o sentinela '1900-01-01'
      (equivale a "sem data"); `idpronaccontinuacao` chega 100% vazia.
    columns:
      - name: idpreprojeto
        description: Identificador do pré-projeto. Chave da tabela.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: idagente
        description: Agente proponente. Chave estrangeira lógica para agentes__agentes.idagente.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: nomeprojeto
        description: Nome da proposta.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: mecanismo
        description: Código do mecanismo de incentivo.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: agenciabancaria
        description: >
          Código da agência bancária. Mantido text: ~75% preenchida e pode conter
          dígito verificador não numérico (ex. '6856X').
        data_type: text
      - name: areaabrangencia
        description: Flag de abrangência (bit True/False).
        data_type: boolean
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtiniciodeexecucao
        description: Início previsto de execução. ~75% preenchida.
        data_type: timestamp
      - name: dtfinaldeexecucao
        description: Fim previsto de execução. ~75% preenchida.
        data_type: timestamp
      - name: justificativa
        description: Justificativa da proposta. Texto longo em HTML (não higienizado).
        data_type: text
      - name: nratotombamento
        description: Número do ato de tombamento. Preenchida em ~1% das linhas.
        data_type: integer
      - name: dtatotombamento
        description: >
          Data do ato de tombamento. ~3,5% preenchida e boa parte é o sentinela
          '1900-01-01' do SQL Server, que significa "sem data", não uma data real.
        data_type: timestamp
      - name: esferatombamento
        description: Código da esfera do tombamento (federal/estadual/municipal).
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: resumodoprojeto
        description: Resumo da proposta. ~97% preenchida.
        data_type: text
      - name: objetivos
        description: Objetivos da proposta. Texto longo em HTML.
        data_type: text
      - name: acessibilidade
        description: Medidas de acessibilidade. Texto longo em HTML.
        data_type: text
      - name: democratizacaodeacesso
        description: Democratização de acesso. Texto longo em HTML.
        data_type: text
      - name: etapadetrabalho
        description: Etapas de trabalho. Texto longo em HTML.
        data_type: text
      - name: fichatecnica
        description: Ficha técnica. Texto longo em HTML.
        data_type: text
      - name: sinopse
        description: Sinopse da proposta. Texto longo em HTML.
        data_type: text
      - name: impactoambiental
        description: Impacto ambiental. Texto em HTML, ~30% preenchida.
        data_type: text
      - name: especificacaotecnica
        description: Especificação técnica. Texto longo em HTML.
        data_type: text
      - name: estrategiadeexecucao
        description: Estratégia de execução. Texto longo em HTML.
        data_type: text
      - name: dtaceite
        description: Data de aceite da proposta. ~88% preenchida.
        data_type: timestamp
      - name: dtarquivamento
        description: Data de arquivamento. ~18% preenchida.
        data_type: timestamp
      - name: stestado
        description: Flag de estado da proposta (bit True/False).
        data_type: boolean
        tests:
          - not_null   # inferido do perfil do banco
      - name: stdatafixa
        description: Flag de data fixa (bit True/False).
        data_type: boolean
        tests:
          - not_null   # inferido do perfil do banco
      - name: stplanoanual
        description: Flag de plano anual (bit True/False).
        data_type: boolean
        tests:
          - not_null   # inferido do perfil do banco
      - name: idusuario
        description: Identificador do usuário.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: sttipodemanda
        description: Tipo de demanda (ex. NA = não-edital, ED = edital).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: idedital
        description: Identificador do edital, quando aplicável. ~25% preenchida.
        data_type: integer
      - name: stproposta
        description: Código do status da proposta. ~40% preenchida.
        data_type: integer
      - name: tpprorrogacao
        description: Flag de prorrogação (bit True/False). ~40% preenchida.
        data_type: boolean
      - name: descricaoatividade
        description: Descrição de atividade. Texto em HTML, ~15% preenchida.
        data_type: text
      - name: tptipicidade
        description: Código de tipicidade. ~32% preenchida.
        data_type: integer
      - name: tptipologia
        description: Código de tipologia. ~32% preenchida.
        data_type: integer
      - name: idpronaccontinuacao
        description: '[VAZIA EM 100% DAS LINHAS] PRONAC de continuação; sem valor na origem.'
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a
          linha (ADR 0005). Não é campo de negócio.
        data_type: integer
