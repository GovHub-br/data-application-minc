  - name: silver_sac_projetos
    description: >
      Uma linha por projeto cultural do mecanismo de incentivo fiscal (Lei
      Rouanet), identificado pelo PRONAC. É a tabela-núcleo do domínio SAC: liga
      proponente (cgccpf), situação, órgão, valores solicitados e as datas de
      tramitação. ~277 mil linhas. Camada Silver tipada a partir de
      salic.bronze_sac_projetos. Cruza com sac__situacao por `situacao` = codigo
      e com sac__tbapiaprovacoes/sac__tbapiincentivos por idpronac.
      Armadilha: a coluna `idprojeto` chega 100% vazia; use `idpronac` como chave.
    columns:
      - name: idpronac
        description: Identificador interno do PRONAC. Chave do projeto, preenchida em 100% das linhas.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: anoprojeto
        description: >
          Ano do projeto em 2 dígitos ('00'=2000, '08'=2008). Mantido text para
          não perder o zero à esquerda.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: sequencial
        description: Sequencial do projeto no ano, 4 dígitos com zero à esquerda.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: ufprojeto
        description: Sigla da UF do projeto.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: area
        description: Código da área cultural.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: segmento
        description: Código do segmento cultural.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: mecanismo
        description: Código do mecanismo de incentivo.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: nomeprojeto
        description: Nome do projeto cultural.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: processo
        description: >
          Número do processo administrativo (15 dígitos). Identificador, mantido
          text (não é quantidade).
        data_type: text
      - name: cgccpf
        description: >
          CNPJ (14) ou CPF (11) do proponente, sem máscara. Dado pessoal; mantido
          text para preservar o zero à esquerda. Não interpretar como número.
        data_type: text
      - name: situacao
        description: >
          Código da situação de tramitação (3 caracteres). Chave estrangeira
          lógica para sac__situacao.codigo.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtprotocolo
        description: Data de protocolo do projeto.
        data_type: timestamp
      - name: dtanalise
        description: Data de análise.
        data_type: timestamp
      - name: modalidade
        description: Código da modalidade. Preenchida em ~21% das linhas.
        data_type: integer
      - name: orgaoorigem
        description: Código do órgão de origem.
        data_type: integer
      - name: orgao
        description: Código do órgão responsável.
        data_type: integer
      - name: dtsaida
        description: Data de saída para análise externa. Preenchida em ~77% das linhas.
        data_type: timestamp
      - name: dtretorno
        description: Data de retorno da análise externa. Preenchida em ~75% das linhas.
        data_type: timestamp
      - name: unidadeanalise
        description: Unidade responsável pela análise. ~56% preenchida.
        data_type: text
      - name: analista
        description: Nome do analista responsável (servidor). Dado pessoal.
        data_type: text
      - name: dtsituacao
        description: >
          Data da situação atual. A origem mistura precisões (só data e
          data-hora com milissegundos); o cast normaliza ambas para timestamp.
        data_type: timestamp
      - name: resumoprojeto
        description: Resumo textual do projeto.
        data_type: text
      - name: providenciatomada
        description: Providência administrativa registrada.
        data_type: text
      - name: localizacao
        description: Localização física do processo. ~18% preenchida.
        data_type: text
      - name: dtinicioexecucao
        description: Data de início da execução. Preenchida em ~5% das linhas.
        data_type: timestamp
      - name: dtfimexecucao
        description: Data de fim da execução. Preenchida em ~5% das linhas.
        data_type: timestamp
      - name: solicitadoufir
        description: Valor total solicitado, em UFIR.
        data_type: numeric
      - name: solicitadoreal
        description: Valor total solicitado, em reais.
        data_type: numeric
      - name: solicitadocusteioufir
        description: Valor de custeio solicitado, em UFIR.
        data_type: numeric
      - name: solicitadocusteioreal
        description: Valor de custeio solicitado, em reais.
        data_type: numeric
      - name: solicitadocapitalufir
        description: Valor de capital solicitado, em UFIR. Quase sempre 0.
        data_type: numeric
      - name: solicitadocapitalreal
        description: Valor de capital solicitado, em reais. Quase sempre 0.
        data_type: numeric
      - name: logon
        description: Identificador do usuário que registrou.
        data_type: integer
      - name: idprojeto
        description: '[VAZIA EM 100% DAS LINHAS] Sem valor na origem; não é a chave. Use idpronac.'
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a
          linha (ADR 0005). Não é campo de negócio.
        data_type: integer

  - name: silver_sac_tbapicomprovacoes
    description: >
      Uma linha por comprovante de pagamento da execução do projeto, publicado
      pela API pública do SALIC. É a maior tabela deste lote (~2,6 M linhas).
      Camada Silver tipada a partir de salic.bronze_sac_tbapicomprovacoes. Cruza
      com sac__projetos por idpronac.
      Armadilha: a coluna `sguf` NÃO contém sigla de UF (valores medidos como
      'Mi', 'Ri'); não usar como UF sem checagem. `dtatualizacao` é o instante da
      carga da API, não data de negócio.
    columns:
      - name: idapicomprovacoes
        description: Identificador do comprovante. Chave da tabela.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: idpronac
        description: Identificador interno do PRONAC.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrpronac
        description: Número PRONAC (zero à esquerda). Mantido text.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmprojeto
        description: Nome do projeto.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmitem
        description: Nome do item comprovado.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmfornecedor
        description: Nome do fornecedor.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: tpfornecedor
        description: "Tipo do fornecedor (medido constante 'Nacional')."
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dsregiao
        description: Região do fornecedor (Sudeste, Nordeste, ...).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: sguf
        description: >
          [NÃO VERIFICADO] Deveria ser a sigla da UF, mas os valores medidos
          ('Mi', 'Ri') têm 2 letras que não formam sigla de UF válida — parecem
          truncamento de outro campo. Não usar como UF sem confirmar na origem.
        data_type: text
      - name: nmmunicipio
        description: Nome do município. ~99% preenchida.
        data_type: text
      - name: dtcomprovacao
        description: Data da comprovação (AAAA-MM-DD).
        data_type: date
        tests:
          - not_null   # inferido do perfil do banco
      - name: aaanocomprovacao
        description: Ano da comprovação.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: mmmescomprovacao
        description: Mês da comprovação (1 a 12).
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: tpdocumento
        description: Tipo do documento comprobatório (Nota Fiscal/Fatura, Guia de Recolhimento, ...).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrcomprovante
        description: Número do comprovante.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtemissao
        description: Data de emissão do documento (AAAA-MM-DD).
        data_type: date
        tests:
          - not_null   # inferido do perfil do banco
      - name: tpformadepagamento
        description: Forma de pagamento (Transferência Bancária, ...).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: nrdocumentodepagamento
        description: Número do documento de pagamento (ex. 2019OB0369).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: vlpagamento
        description: Valor do pagamento, em reais.
        data_type: numeric
        tests:
          - not_null   # inferido do perfil do banco
      - name: idarquivo
        description: Identificador do arquivo anexado.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: nmarquivo
        description: Nome do arquivo anexado (ex. NF_5521.pdf).
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: hashregistro
        description: Hash SHA (hex, 64 caracteres) do registro na API.
        data_type: text
      - name: dtatualizacao
        description: Instante da carga do registro pela API. Não é data de negócio.
        data_type: timestamp
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe a
          linha (ADR 0005). Não é campo de negócio.
        data_type: integer
