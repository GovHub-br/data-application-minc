        data_type: integer
      - name: idprojeto
        description: >
          Código de projeto da origem. Vazio em todas as linhas.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbapicomprovacoes
    description: >
      Uma linha por comprovante de despesa de um projeto, como publicado pela
      API pública do SALIC. São 2.621.182 comprovantes de 21.134 projetos. Vem
      de uma carga própria da API, atualizada em 386 momentos diferentes. É a
      fonte de fct_proponente_ano_rouanet, da Meta 5.


      Armadilhas: sguf não é sigla de UF, são as duas primeiras letras do nome
      do estado, e é ambíguo: Ri é Rio de Janeiro, Rio Grande do Sul ou Rio
      Grande do Norte, e Ma no Centro-Oeste é Mato Grosso ou Mato Grosso do
      Sul. As datas vão de 1767 a 9201. Os comprovantes são os mesmos de
      silver_bdcorporativo_tbcomprovantepagamento, vistos pela API.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbapicomprovacoes'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - tpdocumento
            - nrdocumentodepagamento
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idapicomprovacoes
        description: >
          Identificador do comprovante na API. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: nrpronac
        description: >
          PRONAC do projeto, em texto: 6 dígitos em 2.463.542 linhas e 7 em
          157.640.
        data_type: text
      - name: nmprojeto
        description: >
          Nome do projeto cultural.
        data_type: text
      - name: nmitem
        description: >
          Item da planilha do projeto a que a despesa se refere.
        data_type: text
      - name: nmfornecedor
        description: >
          Nome do fornecedor pago. Vazio em 561.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: tpfornecedor
        description: >
          Tipo do fornecedor: Nacional em todas as linhas.
        data_type: text
      - name: dsregiao
        description: >
          Região do fornecedor. Vazia em 61.275.
        data_type: text
      - name: sguf
        description: >
          Duas primeiras letras do nome do estado do fornecedor, como Sã ou Ri.
          Não é sigla e é ambíguo; só junto com dsregiao separa Pará, Paraná e
          Paraíba. Não use como UF.
        data_type: text
      - name: nmmunicipio
        description: >
          Município do fornecedor. Vazio em 309.471.
        data_type: text
      - name: dtcomprovacao
        description: >
          Data em que a despesa foi comprovada no sistema.
        data_type: date
      - name: aaanocomprovacao
        description: >
          Ano de dtcomprovacao.
        data_type: integer
      - name: mmmescomprovacao
        description: >
          Mês de dtcomprovacao.
        data_type: integer
      - name: tpdocumento
        description: >
          Tipo do documento por extenso: Nota Fiscal/Fatura, Recibo de
          Pagamento, RPA ou Guia de Recolhimento.
        data_type: text
      - name: nrcomprovante
        description: >
          Número do documento fiscal, em texto: 20% não são número.
        data_type: text
      - name: dtemissao
        description: >
          Data de emissão do documento, de 1767 a 9201: há datas digitadas
          errado.
        data_type: date
      - name: tpformadepagamento
        description: >
          Forma de pagamento: Transferência Bancária ou Cheque. Vazia em 9.655.
        data_type: text
      - name: nrdocumentodepagamento
        description: >
          Número do cheque ou da transferência, em texto.
        data_type: text
      - name: vlpagamento
        description: >
          Valor pago, em reais.
        data_type: numeric
        tests:
          - not_null
      - name: idarquivo
        description: >
          Arquivo do comprovante anexado na origem.
        data_type: integer
      - name: nmarquivo
        description: >
          Nome do arquivo do comprovante.
        data_type: text
      - name: hashregistro
        description: >
          Hash do registro na API, para detectar mudança entre cargas. Não é
          credencial.
        data_type: text
      - name: dtatualizacao
        description: >
          Momento em que a carga da API gravou a linha. Não é data de negócio.
        data_type: timestamp
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

