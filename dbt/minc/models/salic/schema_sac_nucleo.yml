version: 2

# Silvers do núcleo do banco sac do SALIC: projeto, aprovação, enquadramento,
# captação, comprovação e as views que os modelos de core e das metas 3, 4 e
# 5 leem. Medições de 29/10/2026 na Bronze (salic.bronze_sac_*), por
# agregados, sem valor de linha. Os códigos vêm das tabelas de domínio do sac e
# do código público do SalicWeb.

models:
  - name: silver_sac_projetos
    description: >
      Uma linha por projeto cultural do SALIC, identificado por idpronac e pelo
      PRONAC (anoprojeto e sequencial), ambos únicos. São 277.187 projetos,
      protocolados de 1992 a 2026, de 102.757 proponentes. É a tabela central
      do banco sac: aprovação, enquadramento, captação e comprovação ligam
      aqui. Inclui todos os mecanismos, não só a Rouanet: 195.777 são de
      incentivo fiscal (mecanismo 1) e 80.356 de convênio (2 e 6).


      Armadilhas: a situação mais comum é K00, arquivado, com 78 mil projetos;
      muitos outros códigos também são de arquivamento. O segmento tem códigos
      com letra, e 135.921 projetos têm segmento que não está em
      silver_sac_vsegmento. 33.409 projetos têm cgccpf que não existe em
      silver_agentes_agentes.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_projetos'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    tests:
      - unique:
          arguments:
            column_name: "anoprojeto || '-' || sequencial"
    columns:
      - name: idpronac
        description: >
          Identificador interno do projeto. Único e preenchido em todas as
          linhas. É a chave que as outras tabelas do sac usam.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: ufprojeto
        description: >
          UF do projeto, em sigla.
        data_type: text
      - name: area
        description: >
          Área cultural do projeto, código de silver_sac_area: 1 Artes Cênicas,
          2 Audiovisual, 3 Música, 4 Artes Visuais, 5 Patrimônio Cultural, 6
          Humanidades, 7 Artes Integradas, 9 Museus e Memória.
        data_type: integer
      - name: segmento
        description: >
          Segmento cultural, código de silver_sac_vsegmento, em texto porque há
          códigos com letra. O código só é único junto com a área.
        data_type: text
      - name: mecanismo
        description: >
          Mecanismo de financiamento: 1 é Incentivo Fiscal Federal, o mecenato
          da Lei Rouanet, confirmado pela descrição que a origem grava em
          vwanalisefinanceiravirtual. 2 e 6 são tratados como convênio pelo
          SalicWeb. 3 e 5 não têm significado confirmado; a tabela
          sac.Mecanismo, com os nomes, não é ingerida.
        data_type: integer
        tests:
          - not_null
      - name: nomeprojeto
        description: >
          Nome do projeto cultural.
        data_type: text
      - name: processo
        description: >
          Número do processo administrativo do projeto, 15 dígitos, em texto.
        data_type: text
      - name: cgccpf
        description: >
          CPF ou CNPJ do proponente, sem máscara, em texto para manter o zero à
          esquerda. 33.409 não existem em silver_agentes_agentes.cnpjcpf.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: situacao
        description: >
          Situação atual do projeto, código de três caracteres da tabela
          sac.situacao, como K00 arquivado, E10 autorizada a captação total ou
          E19 prestação de contas aprovada.
        data_type: text
        tests:
          - not_null
      - name: dtprotocolo
        description: >
          Data de protocolo do projeto, de 1992 a 2026.
        data_type: timestamp
      - name: dtanalise
        description: >
          Data de análise do projeto.
        data_type: timestamp
      - name: modalidade
        description: >
          Código de modalidade do projeto. Preenchido em 29% das linhas, com
          dezenas de valores e sem tabela de domínio ingerida.
        data_type: integer
      - name: orgaoorigem
        description: >
          Órgão de origem. Vale 0 em todas as linhas.
        data_type: integer
      - name: orgao
        description: >
          Órgão do MinC responsável pelo projeto, código de
          silver_tabelas_orgaos: 290, DCA, tem 190.818 projetos.
        data_type: integer
      - name: dtsaida
        description: >
          Data de saída do processo para análise externa. Preenchida em 27%.
        data_type: timestamp
      - name: dtretorno
        description: >
          Data de retorno do processo. Preenchida em 29%.
        data_type: timestamp
      - name: unidadeanalise
        description: >
          Unidade que analisou o projeto, em texto: códigos numéricos e siglas
          misturados. Preenchida em 25%.
        data_type: text
      - name: analista
        description: >
          Nome do servidor que analisou o projeto, em texto livre. Preenchido
          em 43%.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: dtsituacao
        description: >
          Data da situação atual. Vazia em 2.719 linhas.
        data_type: timestamp
      - name: resumoprojeto
        description: >
          Resumo do projeto, em texto livre.
        data_type: text
      - name: providenciatomada
        description: >
          Última providência registrada no projeto, em texto livre.
        data_type: text
      - name: localizacao
        description: >
          Localização física do processo em papel, como ARQUIVO GERAL.
          Preenchida em 11%.
        data_type: text
      - name: dtinicioexecucao
        description: >
          Data de início da execução. Preenchida em 51%.
        data_type: timestamp
      - name: dtfimexecucao
        description: >
          Data de fim da execução. Preenchida em 51%.
        data_type: timestamp
      - name: solicitadoufir
        description: >
          Valor solicitado em UFIR, unidade fiscal extinta em 2000.
        data_type: numeric
      - name: solicitadoreal
        description: >
          Valor solicitado em reais. Vazio em 33.126 projetos.
        data_type: numeric
      - name: solicitadocusteioufir
        description: >
          Parte de custeio do valor solicitado, em UFIR.
        data_type: numeric
      - name: solicitadocusteioreal
        description: >
          Parte de custeio do valor solicitado, em reais.
        data_type: numeric
      - name: solicitadocapitalufir
        description: >
          Parte de capital do valor solicitado, em UFIR. Quase sempre 0.
        data_type: numeric
      - name: solicitadocapitalreal
        description: >
          Parte de capital do valor solicitado, em reais. Quase sempre 0.
        data_type: numeric
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idprojeto
        description: >
          Proposta de origem do projeto. Liga com sac.preprojeto.idpreprojeto,
          sem órfão. Preenchido em 56%, nos projetos que vieram de proposta
          pelo SalicWeb.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_aprovacao
    description: >
      Uma linha por ato de aprovação de um projeto: a aprovação inicial e cada
      mudança depois dela. São 472.606 aprovações para 181.291 projetos, de
      1992 a 2026. O tipo vem do SalicWeb: 1 inicial, 181.746; 2
      complementação, 10.793; 3 prorrogação, 260.007; 4 redução, 14.862; 8
      readequação, 4.053; 5 e 6, com 1.145, sem significado no código.


      Como somar: o SalicWeb calcula o valor aprovado do projeto como a soma
      dos tipos 1 e 2 menos a do tipo 4. A prorrogação (3) só muda o prazo e
      tem valor perto de zero. Somar aprovadoreal de todas as linhas mistura
      essas coisas. 1.507 linhas não têm idpronac; nas outras, 66 têm PRONAC
      diferente do projeto.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_aprovacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idaprovacao
        description: >
          Identificador da aprovação. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac. Vazio em 1.507 linhas, sem órfão nas
          outras.
        data_type: integer
      - name: idparecer
        description: >
          Parecer que fundamentou a aprovação. Preenchido em 10%.
        data_type: integer
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: tipoaprovacao
        description: >
          Tipo da aprovação, em texto, pelo SalicWeb: 1 inicial, 2
          complementação, 3 prorrogação, 4 redução, 8 readequação. 5 e 6 não
          têm significado no código.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5', '6', '8']
              config:
                severity: warn
      - name: dtaprovacao
        description: >
          Data da aprovação, de 1992 a 2026.
        data_type: timestamp
        tests:
          - not_null
      - name: resumoaprovacao
        description: >
          Resumo do ato de aprovação, em texto livre.
        data_type: text
      - name: portariaaprovacao
        description: >
          Número da portaria que publicou a aprovação, no formato número/ano.
          Vazio em 5%.
        data_type: text
      - name: dtportariaaprovacao
        description: >
          Data da portaria de aprovação.
        data_type: timestamp
      - name: dtpublicacaoaprovacao
        description: >
          Data de publicação da portaria no Diário Oficial.
        data_type: timestamp
      - name: dtiniciocaptacao
        description: >
          Início do prazo de captação autorizado por esta aprovação.
        data_type: timestamp
      - name: dtfimcaptacao
        description: >
          Fim do prazo de captação autorizado por esta aprovação. É o que a
          prorrogação muda.
        data_type: timestamp
      - name: aprovadoufir
        description: >
          Valor aprovado em UFIR.
        data_type: numeric
      - name: aprovadoreal
        description: >
          Valor aprovado por este ato, em reais. Na redução (tipo 4), é o valor
          reduzido, a subtrair.
        data_type: numeric
      - name: autorizadoufir
        description: >
          Valor autorizado em UFIR. Vale 0 em todas as linhas.
        data_type: numeric
      - name: autorizadoreal
        description: >
          Valor autorizado em reais. Vale 0 em todas as linhas.
        data_type: numeric
      - name: concedidocusteioreal
        description: >
          Parte de custeio concedida, em reais. Quase sempre 0.
        data_type: numeric
      - name: concedidocapitalreal
        description: >
          Parte de capital concedida, em reais. Quase sempre 0.
        data_type: numeric
      - name: contrapartidareal
        description: >
          Contrapartida do proponente, em reais. Quase sempre 0.
        data_type: numeric
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idprorrogacao
        description: >
          Pedido de prorrogação que gerou esta linha. Preenchido em 33%.
        data_type: integer
      - name: idreadequacao
        description: >
          Pedido de readequação que gerou esta linha. Preenchido em 2%.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_captacao
    description: >
      Uma linha por recibo de captação: dinheiro que um incentivador depositou
      na conta de um projeto. São 668.765 recibos, de 1993 a 2026, para 55.043
      projetos e 126.552 incentivadores. Não tem idpronac: liga ao projeto por
      anoprojeto e sequencial, sem órfão. É a fonte de fct_captacao_rouanet.


      Armadilhas: o tipo de apoio é ambíguo no próprio SalicWeb (ver
      tipoapoio). 28.304 recibos têm incentivador que não existe em
      silver_agentes_agentes. Captação não é pagamento: o valor captado entra
      na conta do projeto, e o que foi gasto está nas comprovações.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_captacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idcaptacao
        description: >
          Identificador do recibo. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC. Na origem vem com espaço à
          direita, que o cast retira.
        data_type: text
      - name: numerorecibo
        description: >
          Número do recibo de captação, em texto. Vazio em 10.
        data_type: text
      - name: cgccpfmecena
        description: >
          CPF (358.844 recibos) ou CNPJ (309.921) do incentivador, sem máscara.
          28.304 não existem em silver_agentes_agentes.cnpjcpf.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: tipoapoio
        description: >
          Tipo de apoio do incentivador: 1 em 274.957 recibos, 2 em 393.808. O
          dicionário de dados do SALIC e três consultas do SalicWeb leem 1 como
          doação e 2 como patrocínio; outras duas consultas do SalicWeb leem ao
          contrário. Confirme antes de usar.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['1', '2']
              config:
                severity: warn
      - name: medidaprovisoria
        description: >
          Enquadramento legal do recibo: 1 artigo 26 e 2 artigo 18 da Lei
          8.313/91, pelo dicionário de dados, o mesmo código de
          silver_sac_enquadramento. 2 tem 600.894 recibos e 32 bilhões de
          reais; 1 tem 67.855. O 0, em 15 recibos, e o 3, em 1, não estão no
          dicionário.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3']
              config:
                severity: warn
      - name: dtchegadarecibo
        description: >
          Data em que o recibo chegou ao MinC.
        data_type: timestamp
      - name: dtrecibo
        description: >
          Data do depósito, de 1993 a 2026. É a data da captação.
        data_type: timestamp
        tests:
          - not_null
      - name: captacaoreal
        description: >
          Valor captado, em reais. Um recibo tem valor zero ou negativo.
        data_type: numeric
        tests:
          - not_null
      - name: captacaoufir
        description: >
          Valor captado em UFIR.
        data_type: numeric
      - name: logon
        description: >
          Usuário interno que registrou o recibo. Três valores em todas as
          linhas.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idprojeto
        description: >
          Código de projeto da origem. Vale 0 em 237.540 linhas e vazio em
          72.611; não é chave. Use anoprojeto e sequencial.
        data_type: integer
      - name: sitransferenciarecurso
        description: >
          Se o recurso foi liberado ao proponente, pelo dicionário: 1 liberado,
          336.648; 0 bloqueado, 20.276. Vazio em 311.841.
        data_type: text
      - name: dttransferenciarecurso
        description: >
          Data da liberação do recurso. Preenchida em 336.642.
        data_type: timestamp
      - name: isbemservico
        description: >
          Se a captação foi em bem ou serviço, e não em dinheiro. Vale 0 em
          todas as linhas.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_enquadramento
    description: >
      Uma linha por projeto enquadrado, com o artigo da Lei 8.313/91 que define
      o abatimento do incentivador: 1 artigo 26, 34.299 projetos; 2 artigo 18,
      145.880. A tradução vem do SalicWeb. São 180.190 linhas e o idpronac é
      único: a tabela guarda só o enquadramento atual, sem histórico de
      reenquadramento.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_enquadramento'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idenquadramento
        description: >
          Identificador do enquadramento. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: enquadramento
        description: >
          Artigo da Lei 8.313/91: 1 artigo 26, em que o incentivador abate
          parte do valor; 2 artigo 18, em que abate 100%. 0 em 11 linhas.
        data_type: integer
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: False
              config:
                severity: warn
      - name: dtenquadramento
        description: >
          Data do enquadramento.
        data_type: timestamp
      - name: observacao
        description: >
          Observação livre do enquadramento. Preenchida em 47%.
        data_type: text
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac. Único: um enquadramento por projeto.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_abrangencia
    description: >
      Uma linha por local onde uma proposta pretende realizar ações: país, UF e
      município. São 860.304 locais para 365.548 propostas. Liga com
      sac.preprojeto por idprojeto, que é o idpreprojeto, e não com
      silver_sac_projetos. 832.003 locais são no Brasil.


      Armadilha: 30.228 linhas têm município que não existe em
      silver_agentes_municipios. Só 52.332 locais dizem se a ação foi realizada
      (siabrangencia diferente de 0).
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_abrangencia'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idabrangencia
        description: >
          Identificador do local. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idprojeto
        description: >
          Proposta, pelo idpreprojeto de sac.preprojeto. Não é o idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idpais
        description: >
          País, código de silver_agentes_vpais: 31 é Brasil.
        data_type: integer
      - name: iduf
        description: >
          UF, código IBGE de 2 dígitos.
        data_type: integer
      - name: idmunicipioibge
        description: >
          Município, código IBGE de 6 dígitos. Liga com
          silver_agentes_municipios.idmunicipioibge; 30.228 não existem lá.
        data_type: integer
      - name: usuario
        description: >
          Conta que gravou o local na proposta.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: stabrangencia
        description: >
          Se o local está ativo na proposta: true em 821.234, false em 39.070.
        data_type: boolean
      - name: siabrangencia
        description: >
          Se a ação foi realizada no local, pelo dicionário: 0 sem informação,
          807.972; 1 não, 9.454; 2 sim, 42.447. O código 3, em 431 linhas, não
          está no dicionário.
        data_type: text
        tests:
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3']
              config:
                severity: warn
