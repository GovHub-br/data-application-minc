version: 2

# Silvers do assunto cópias datadas e extrações do DBA do banco sac do SALIC:
# cópias de tabelas guardadas com data no nome, arquivos de abertura de conta
# bancária, cargas de recibos de captação e as extrações denormalizadas que o
# DBA mantém para relatórios. Nada aqui é fonte primária: cada uma diz de qual
# tabela atual vem. Medições de 30/10/2026 na Bronze, por agregados.

models:
  - name: silver_sac_aberturadecontabancaria
    description: >
      Uma linha por projeto com a abertura das contas bloqueada (captação) e
      livre (movimento) no Banco do Brasil, de 2007 a 2012. São 23.573
      projetos. Cópia ou extração, não fonte primária. O controle atual das
      contas está em silver_sac_contabancaria.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_aberturadecontabancaria'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - contabloqueada
            - dtcontabloqueada
            - contalivre
            - dtcontalivre
            - idaberturadeconta
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: contabloqueada
        description: >
          Se a conta bloqueada foi aberta.
        data_type: boolean
      - name: dtcontabloqueada
        description: >
          Data de abertura da conta bloqueada.
        data_type: timestamp
      - name: contalivre
        description: >
          Se a conta livre foi aberta.
        data_type: boolean
      - name: dtcontalivre
        description: >
          Data de abertura da conta livre.
        data_type: timestamp
      - name: dtnascimento
        description: >
          Data de nascimento do proponente pessoa física. Preenchida em 5.006.
        data_type: timestamp
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: orgao
        description: >
          Órgão: 272 em 21.426, 166 em 2.146, 0 em 1.
        data_type: integer
      - name: logon
        description: >
          Usuário interno que gravou a linha. Em silver_sac_projetos, 99,6% dos
          valores existem em silver_tabelas_usuarios.usu_codigo, o cadastro de
          servidores.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idaberturadeconta
        description: >
          Abertura de conta. Vazia em todas.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

