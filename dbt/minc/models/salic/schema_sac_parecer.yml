version: 2

# Silvers do assunto parecer e análise do banco sac do SALIC: distribuição de
# projetos a pareceristas, diligências, homologação, fiscalização, pagamento e
# credenciamento de pareceristas, avaliações de risco de projeto e proponente e
# as views de acompanhamento da análise. Medições de 29/10/2026 na Bronze
# (salic.bronze_sac_*), por agregados, sem valor de linha.

models:
  - name: silver_sac_avaliacaopc
    description: >
      Uma linha por avaliação antiga de prestação de contas de um projeto, num
      checklist de 27 itens com nota, resultado, manifestação e pronunciamento.
      São 13.500 projetos, cada um com uma linha, avaliados de 2002 a 2019 por
      176 analistas. O sistema atual registra a avaliação em
      silver_sac_tbcumprimentoobjeto e silver_sac_tblaudofinal; esta tabela é o
      legado.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_avaliacaopc'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - prestacao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: prestacao
        description: >
          Se a avaliação é de prestação de contas.
        data_type: boolean
      - name: analista
        description: >
          Analista que avaliou, código de usuário interno.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtanalise
        description: >
          Data da avaliação, de 2002 a 2019.
        data_type: timestamp
      - name: campo_0
        description: >
          Nota de 0 a 2 dada ao item do checklist; 9 aparece em todos os itens
          e parece marcar item não aplicável. O significado de cada item não
          está em tabela ingerida.
        data_type: integer
      - name: campo_01
        description: >
          Nota de 0 a 2 dada ao item do checklist; 9 aparece em todos os itens
