  - name: silver_sac_tbfiscalizacao
    description: >
      Tabela responsável por registrar as fiscalizações realizadas nos projetos, incluindo
      datas de início e fim, demandante, situação e responsáveis internos. Camada Silver tipada a partir de salic.bronze_sac_tbfiscalizacao.
    columns:
      - name: idfiscalizacao
        description: >
          Identificador sequencial de fiscalização de determinados projetos culturais.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: idpronac
        description: >
          Identificador único de projetos cultural no Ministério da Cultura, faz referencia a
          tabela Projetos.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtiniciofiscalizacaoprojeto
        description: >
          Data de inicio da fiscalização de um determinado projeto cultural.
        data_type: timestamp
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtfimfiscalizacaoprojeto
        description: >
          Data final da fiscalização de um determinado projeto cultural.
        data_type: timestamp
        tests:
          - not_null   # inferido do perfil do banco
      - name: dtrespostasolicitada
        description: >
          Data para posicionar o período de resposta da fiscalização.
        data_type: timestamp
      - name: dsfiscalizacaoprojeto
        description: >
          Descrição de informações relativas aos projetos que será fiscalizado.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: tpdemandante
        description: >
          Tipo do demandante responsável pela realização da fiscalização: 0 - SEFIC 1 - SAV
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: stfiscalizacaoprojeto
        description: >
          Situação da fiscalização. 0 - Fiscalização em andamento 1 - Fiscalização em atraso
          2 - Fiscalização concluída para parecer.
        data_type: text
        tests:
          - not_null   # inferido do perfil do banco
      - name: idagente
        description: >
          Identificador do agente responsável para execução da fiscalização, faz referência a
          tabela Agentes do banco Agentes, controle de integridade referencial via aplicação.
        data_type: integer
      - name: idsolicitante
        description: >
          Identificador do solicitante da fiscalização, faz referência a tabela Agentes do
          banco Agentes, controle de integridade referencial via aplicação.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
