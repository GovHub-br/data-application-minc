  - name: silver_sac_avaliacaoprojeto
    description: >
      Uma linha por projeto e parâmetro da classificação de risco do projeto,
      com o peso dado. São 43.552 projetos com exatamente 5 parâmetros cada,
      217.760 linhas. A soma dos pesos dá a classificação de
      silver_sac_vprojetoavaliado.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_avaliacaoprojeto'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: anoprojeto
        description: >
          Ano do PRONAC em dois dígitos, com zero à esquerda: 00 é 2000, 92 é
          1992. Junto com sequencial forma o PRONAC.
        data_type: text
      - name: sequencial
        description: >
          Sequencial do PRONAC dentro do ano, em texto com zero à esquerda.
          Junto com anoprojeto forma o PRONAC.
        data_type: text
      - name: codparametro
        description: >
          Parâmetro de risco avaliado, de 1 a 5. A tabela com o nome dos
          parâmetros não é ingerida.
        data_type: integer
      - name: codpeso
        description: >
          Peso dado ao parâmetro, quase sempre de 0 a 3; 6 linhas do parâmetro
          3 têm peso de 4 a 14.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_avaliacaoproponente
    description: >
      Uma linha por proponente e parâmetro da classificação de risco do
      proponente, com o peso dado. São 14.299 proponentes com 6 parâmetros em
      média, 85.861 linhas. A soma dos pesos dá a classificação de
      silver_sac_vproponenteavaliado.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_avaliacaoproponente'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: cgccpf
        description: >
          CPF ou CNPJ do proponente, sem máscara, em texto para manter o zero à
          esquerda.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: codparametro
        description: >
          Parâmetro de risco avaliado, de 1 a 7. A tabela com o nome dos
          parâmetros não é ingerida.
        data_type: integer
      - name: codpeso
        description: >
          Peso dado ao parâmetro, quase sempre de 1 a 3.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_distribuicao_avaliacao_proposta
    description: >
      Uma linha por envio de uma proposta para avaliação na fase de
      admissibilidade, antes de virar projeto. São 204.111 envios de 77.742
      propostas, de 2018 a 2026. avaliacao_atual true marca o envio vigente:
      77.881 linhas, um por proposta salvo poucas. 95.009 envios não têm
      avaliador designado.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_distribuicao_avaliacao_proposta'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: id_distribuicao_avaliacao_proposta
        description: >
          Identificador do envio. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: id_preprojeto
        description: >
          Proposta, idpreprojeto de silver_sac_preprojeto.
        data_type: integer
      - name: id_orgao_superior
        description: >
          Secretaria que avalia: 251 SEFIC (180.829) ou 160 SAV (23.282).
        data_type: integer
      - name: id_perfil
        description: >
          Perfil de quem avalia: 118 em 80.908, 147 em 54.283, 92 em 36.509,
          131 em 32.410. Sem domínio ingerido.
        data_type: integer
      - name: data_distribuicao
        description: >
          Data do envio, de 2018 a 2026.
        data_type: timestamp
      - name: avaliacao_atual
        description: >
          Se é o envio vigente da proposta.
        data_type: boolean
      - name: id_avaliador
        description: >
          Avaliador designado, usuário interno. Vazio em 95.009.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbdiligencia
    description: >
      Uma linha por diligência aberta num projeto: pedido de informação ou
      documento ao proponente, com a resposta. São 114.567 diligências de
      50.367 projetos, de 2009 a 2026; 562 sem resposta. O tipo diz em que
      etapa a diligência foi aberta (ver idtipodiligencia). O histórico de cada
      rodada está em silver_sac_tbhistoricodiligencia.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbdiligencia'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - idcodigodocumentosexigidos
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iddiligencia
        description: >
          Identificador da diligência. Único.
        data_type: integer
        tests:
          - not_null
          - unique
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idtipodiligencia
        description: >
          Tipo da diligência, da verificação do sac (grupo 8): 124 análise
          técnica inicial (47.671), 181 checklist da análise (19.660), 183
          movimentação bancária (16.059), 171 readequação pelo técnico (9.232),
          744 análise preditiva (7.999), 180 avaliação do relatório final
          (3.308), 126 CNIC na análise inicial (3.168), 179 readequação pelo
          parecerista, 645 prestação de contas em todos os itens, 174 prestação
          de contas, 627 notificação de cobrança da prestação de contas, 563 e
          564 recurso, 172 fiscalização.
        data_type: integer
      - name: dtsolicitacao
        description: >
          Data em que a diligência foi aberta.
        data_type: timestamp
      - name: solicitacao
        description: >
          O que foi pedido, em HTML.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: idsolicitante
        description: >
          Usuário interno que abriu a diligência.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtresposta
        description: >
          Data da resposta do proponente. Vazia em 562.
        data_type: timestamp
      - name: resposta
        description: >
          Resposta do proponente, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: idproponente
        description: >
          Proponente que respondeu, código de agente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: stestado
        description: >
          Se a linha está ativa na origem: true ativa, false inativa ou
          substituída.
        data_type: boolean
      - name: idplanodistribuicao
        description: >
          Plano de distribuição diligenciado. Vazio em todas as linhas.
        data_type: integer
      - name: idarquivo
        description: >
          Arquivo anexado. Preenchido em 9.
        data_type: integer
      - name: idcodigodocumentosexigidos
        description: >
          Documento exigido. Preenchido em 5.
        data_type: integer
      - name: idproduto
        description: >
          Produto diligenciado, código de silver_sac_vwprodutos. Preenchido em
          40.238.
        data_type: integer
      - name: stprorrogacao
        description: >
          Se o prazo de resposta foi prorrogado: 1 em 9.310, N em 69; vazio no
          resto.
        data_type: text
      - name: stenviado
        description: >
          Se a diligência foi enviada ao proponente: S em 113.815, N em 139.
        data_type: text
      - name: cdsituacaoorigem
        description: >
          Situação do projeto quando a diligência foi aberta, código de
          sac.situacao, como B11 ou E24. Vazia em 63.797.
        data_type: text
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbdiligenciaxarquivo
    description: >
      Uma linha por arquivo anexado a uma diligência. São 83.985 anexos de
      43.538 diligências.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbdiligenciaxarquivo'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iddiligencia
        description: >
          Diligência, código de silver_sac_tbdiligencia.
        data_type: integer
      - name: idarquivo
        description: >
          Arquivo anexado à diligência.
        data_type: integer
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

  - name: silver_sac_tbdistribuirparecer
    description: >
      Uma linha por envio de um produto de um projeto a uma unidade e a um
      parecerista, para análise de conteúdo ou de custo. São 1.116.537 envios
      de 75.540 projetos, de 2009 a 2026, com 1.789 pareceristas. Cada nova
      movimentação grava uma linha e desativa a anterior (stestado false). A
      FUNARTE (92) recebe 73% dos envios.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbdistribuirparecer'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - dtdistribuicao
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: iddistribuirparecer
        description: >
          Identificador do envio.
        data_type: integer
        tests:
          - not_null
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
      - name: idproduto
        description: >
          Produto cultural, código de silver_sac_vwprodutos, como livro ou
          espetáculo; 0 é a administração do projeto.
        data_type: integer
      - name: tipoanalise
        description: >
          Tipo da análise, pelo SalicWeb: 0 conteúdo, 1 custo do produto, 2
          custo administrativo. 3 é o tipo que o SalicWeb usa para os projetos
          do modelo novo, que juntam conteúdo e custo; isso só aparece num
          comentário do código, sem confirmação. Contagem: 0 em 269.006, 1 em
          267.117, 2 em 172.712, 3 em 407.698; 4 linhas com 91.
        data_type: integer
      - name: idorgao
        description: >
          Unidade que analisa, código de silver_tabelas_orgaos: 92 FUNARTE
          (812.684), 93 FBN, 160 SAV, 335 IBRAM, 91 IPHAN e outras.
        data_type: integer
      - name: dtenvio
        description: >
          Data do envio à unidade.
        data_type: timestamp
      - name: idagenteparecerista
        description: >
          Parecerista, código de agente em silver_agentes_agentes.idagente.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dtdistribuicao
        description: >
          Data em que a análise foi distribuída ao parecerista.
        data_type: timestamp
      - name: dtdevolucao
        description: >
          Data em que o parecerista devolveu a análise.
        data_type: timestamp
      - name: observacao
        description: >
          Observação do envio, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: stestado
        description: >
