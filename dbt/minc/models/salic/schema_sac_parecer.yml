      - name: resultado
        description: >
          Resultado da avaliação, de 0 a 3; 3 é o mais comum. Sem domínio
          ingerido.
        data_type: integer
      - name: manifestacao
        description: >
          Manifestação do analista, de 0 a 3. Sem domínio ingerido.
        data_type: integer
      - name: pronunciamento
        description: >
