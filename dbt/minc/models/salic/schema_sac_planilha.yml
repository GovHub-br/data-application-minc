  - name: silver_sac_tbplanilhaaprovacao
    description: >
      Uma linha por item de uma versão da planilha de um projeto depois da
      aprovação. tpplanilha diz a versão, pelo SalicWeb: CO a planilha
      aprovada, 3.148.087 itens; RP remanejamento de até 20%, 2.220.566; SR
      solicitação de readequação, 1.251.407; SE, 2.403, sem significado no
      código. stativo S marca a versão vigente. São 6.622.463 itens, de 2011 a
      2026. O valor aprovado do item é qtitem × nrocorrencia × vlunitario: a
      planilha CO ativa soma 50,4 bilhões de reais em 50.841 projetos.


      Armadilha: somar todas as linhas soma versões substituídas e
      readequações; filtre tpplanilha e stativo.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbplanilhaaprovacao'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - nrocorrencia
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idplanilhaaprovacao
        description: >
          Identificador do item. Único.
        data_type: integer
        tests:
          - not_null
      - name: tpplanilha
        description: >
          Versão da planilha: CO aprovada, RP remanejamento de até 20%, SR
          solicitação de readequação, SE sem significado no código.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CO', 'RP', 'SR', 'SE']
              config:
                severity: warn
      - name: dtplanilha
        description: >
          Data em que a versão da planilha foi gravada.
        data_type: timestamp
      - name: idplanilhaprojeto
        description: >
          Item de origem na planilha do projeto, código de
          silver_sac_tbplanilhaprojeto.
        data_type: integer
      - name: idplanilhaproposta
        description: >
          Item de origem na proposta, código de silver_sac_tbplanilhaproposta.
        data_type: integer
      - name: idpronac
        description: >
          Identificador interno do projeto no SALIC. Liga com
          silver_sac_projetos.idpronac.
        data_type: integer
        tests:
          - not_null
      - name: idproduto
        description: >
          Produto cultural, código de silver_sac_vwprodutos, como livro ou
          espetáculo; 0 é a administração do projeto.
        data_type: integer
      - name: idetapa
        description: >
          Etapa do orçamento, código de silver_sac_tbplanilhaetapa: 1 pré-
          produção, 2 produção, 3 divulgação, 4 custos administrativos, 5
          recolhimentos, 6 elaboração e agenciamento, 7 pós-produção, 8 custos
          vinculados, 9 assessoria contábil e jurídica, 10 captação de
          recursos.
        data_type: integer
      - name: idplanilhaitem
        description: >
          Item de orçamento, código de silver_sac_tbplanilhaitens, como cachê
          de músico ou passagem aérea.
        data_type: integer
      - name: dsitem
        description: >
          Descrição livre do item. Preenchida em 472.
        data_type: text
      - name: idunidade
        description: >
          Unidade de medida, código de silver_sac_tbplanilhaunidade, como 5
          dia, 7 unidade, 21 verba, 25 cachê.
        data_type: integer
      - name: qtitem
        description: >
          Quantidade do item. A origem grava em notação científica, como 1.0E0,
          e a silver converte para número.
        data_type: numeric
      - name: nrocorrencia
        description: >
          Número de ocorrências do item, multiplicador da quantidade.
        data_type: numeric
      - name: vlunitario
        description: >
          Valor unitário do item, em reais.
        data_type: numeric
      - name: qtdias
        description: >
          Quantidade de dias do item, quando cobrado por dia.
        data_type: integer
      - name: tpdespesa
        description: >
          Tipo de despesa: 0 em quase todas as linhas, sem domínio ingerido.
        data_type: integer
      - name: tppessoa
        description: >
          Tipo de pessoa do fornecedor previsto: 0 em quase todas as linhas,
          sem domínio ingerido.
        data_type: integer
      - name: nrcontrapartida
        description: >
          Indicador de contrapartida: 0 em quase todas as linhas.
        data_type: integer
      - name: nrfonterecurso
        description: >
          Fonte de recurso do item: 109 incentivo fiscal federal, quase todas
          as linhas; 99 recursos privados de terceiros, 100 ONG, 101 organismo
          internacional, 102 a 104 administração municipal, estadual e federal,
          110 e 111 incentivo fiscal estadual e municipal, 112 recursos
          privados próprios.
        data_type: integer
      - name: idufdespesa
        description: >
          UF onde a despesa ocorre, código IBGE.
        data_type: integer
      - name: idmunicipiodespesa
        description: >
          Município onde a despesa ocorre, código IBGE de 6 dígitos.
        data_type: integer
      - name: dsjustificativa
