          Justificativa do item, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: idagente
        description: >
          Agente, quando o item é ligado a um. Preenchido em 59%.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: idplanilhaaprovacaopai
        description: >
          Item da versão anterior que este substitui.
        data_type: integer
      - name: idreadequacao
        description: >
          Readequação que gerou a versão.
        data_type: integer
      - name: tpacao
        description: >
          Ação sobre o item na readequação: N nenhuma, 2.813.345; A alteração,
          369.938; E exclusão, 122.889; I inclusão, 122.428. Vazio em
          3.193.863.
        data_type: text
      - name: idrecursodecisao
        description: >
          Recurso que mudou a decisão. Preenchido em 21.
        data_type: integer
      - name: stativo
        description: >
          Se a versão está vigente: S ou N.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['S', 'N']
              config:
                severity: warn
      - name: stcustopraticado
        description: >
          Se o valor está acima do custo praticado.
        data_type: boolean
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
