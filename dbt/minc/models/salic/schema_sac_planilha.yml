version: 2

# Silvers do assunto planilha orçamentária do banco sac do SALIC: o orçamento
# da proposta, a planilha do projeto em análise, a planilha aprovada e suas
# versões de remanejamento e readequação, os domínios de etapa, item, unidade e
# produto, e as views de custo, preço médio e itens comprovados. Medições de
# 29/10/2026 na Bronze (salic.bronze_sac_*), por agregados, sem valor de linha.
# Valores em float na origem chegam em notação científica e são convertidos
# pela macro bronze_numerico_cientifico.

models:
  - name: silver_sac_tbplanilhaproposta
    description: >
      Uma linha por item do orçamento de uma proposta, como o proponente
      apresentou: produto, etapa, item, unidade, quantidade, ocorrências, valor
      unitário e local da despesa. São 10.894.342 itens de 276.133 propostas,
      todas existentes em silver_sac_preprojeto (idprojeto é o idpreprojeto). O
      valor do item é quantidade × ocorrência × valor unitário. Quase tudo é
      fonte 109, incentivo fiscal federal.
    config:
      tags: [silver, salic, sac]
      meta:
        status: Disabled
        origem_dados: 'salic.bronze_sac_tbplanilhaproposta'
        governance:
          produto_dados: 'SALIC — Rouanet'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes:
            - ocorrencia
        openmetadata:
          tier: "Tier.Tier3"
          domain: "Cultura.Incentivo Fiscal"
          owner: "minc-data-engineering"
    columns:
      - name: idplanilhaproposta
        description: >
          Identificador do item. Único.
        data_type: integer
        tests:
          - not_null
      - name: idprojeto
        description: >
          Proposta, idpreprojeto de silver_sac_preprojeto, sem órfão.
        data_type: integer
        tests:
          - not_null
      - name: idproduto
        description: >
          Produto cultural, código de silver_sac_vwprodutos, como livro ou
          espetáculo; 0 é a administração do projeto.
        data_type: integer
      - name: idetapa
        description: >
          Etapa do orçamento, código de silver_sac_tbplanilhaetapa: 1 pré-
          produção, 2 produção, 3 divulgação, 4 custos administrativos, 5
          recolhimentos, 6 elaboração e agenciamento, 7 pós-produção, 8 custos
          vinculados, 9 assessoria contábil e jurídica, 10 captação de
          recursos.
        data_type: integer
        tests:
          - not_null
      - name: idplanilhaitem
        description: >
          Item de orçamento, código de silver_sac_tbplanilhaitens, como cachê
          de músico ou passagem aérea.
        data_type: integer
      - name: descricao
        description: >
          Descrição livre do item. Preenchida em 3.
        data_type: text
      - name: unidade
        description: >
          Unidade de medida, código de silver_sac_tbplanilhaunidade, como 5
          dia, 7 unidade, 21 verba, 25 cachê.
        data_type: integer
      - name: quantidade
        description: >
          Quantidade do item. A origem grava em notação científica, como 1.0E0,
          e a silver converte para número.
        data_type: numeric
      - name: ocorrencia
        description: >
          Número de ocorrências do item, multiplicador da quantidade.
        data_type: numeric
      - name: valorunitario
        description: >
          Valor unitário do item, em reais.
        data_type: numeric
      - name: qtdedias
        description: >
          Quantidade de dias do item, quando cobrado por dia.
        data_type: integer
      - name: tipodespesa
        description: >
          Tipo de despesa: 0 em quase todas as linhas, sem domínio ingerido.
        data_type: integer
      - name: tipopessoa
        description: >
          Tipo de pessoa do fornecedor previsto: 0 em quase todas as linhas,
          sem domínio ingerido.
        data_type: integer
      - name: contrapartida
        description: >
          Indicador de contrapartida: 0 em quase todas as linhas.
        data_type: integer
      - name: fonterecurso
        description: >
          Fonte de recurso do item: 109 incentivo fiscal federal, quase todas
          as linhas; 99 recursos privados de terceiros, 100 ONG, 101 organismo
          internacional, 102 a 104 administração municipal, estadual e federal,
          110 e 111 incentivo fiscal estadual e municipal, 112 recursos
          privados próprios.
        data_type: integer
      - name: ufdespesa
        description: >
          UF onde a despesa ocorre, código IBGE.
        data_type: integer
      - name: municipiodespesa
        description: >
          Município onde a despesa ocorre, código IBGE de 6 dígitos.
        data_type: integer
      - name: idusuario
        description: >
          Conta que gravou o item.
        data_type: integer
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: dsjustificativa
        description: >
          Justificativa do item, em texto livre.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: stcustopraticado
        description: >
          Se o valor está acima do custo praticado: false em 5.389.640, true em
          1.650.939, vazio no resto.
        data_type: boolean
      - name: _fatia
        description: >
          Coluna técnica da ingestão: identifica a fatia de extração que trouxe
          a linha. Não é campo de negócio.
        data_type: text

