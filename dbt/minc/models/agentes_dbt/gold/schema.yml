version: 2

models:
  - name: perfil_agentes_completo
    description: >
      Camada Gold — Master Data de proponentes (Meta 5).
      Grain: 1 linha por identificador_unico (CPF/CNPJ). Consolida perfil_acesso_fomento
      eliminando duplicatas entre programas: proponentes presentes em mais de um programa
      têm veterania confirmada por presença multi-programa, sobrepondo a resposta declarada.
      Serve como base para dois consumos:
        - Relatório consolidado (sem inferência): filtrar WHERE status_origem = 'Confirmado'
        - Visão analítica (com inferência): consumir todos os registros
    config:
      meta:
        meta_objetivo: 'Meta 5 — Master Data de Proponentes'
        origem_dados: 'perfil_acesso_fomento e identificadores_agentes'
        tags: [gold, agentes, master_data, meta5, deduplicado]
    columns:
      - name: identificador_unico
        description: CPF ou CNPJ do proponente (normalizado). Chave única do modelo.
        tests:
          - not_null
          - unique
      - name: tipo_proponente
        description: >
          Classificação do proponente — 'Pessoa Física', 'Pessoa Jurídica',
          'Coletivo' ou 'Organização'.
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Programa de origem do primeiro registro do proponente (proxy temporal:
          LPG precede PNAB). Reflete o contexto da análise inicial do perfil.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: >
          Resposta original do proponente sobre acesso anterior a recursos públicos
          (dado cru, sem normalização), alinhado ao primeiro programa de ingresso.
      - name: status_origem
        description: >
          Flag de qualidade: 'Confirmado' — proponente respondeu explicitamente sim/não;
          'Inferido' — classificação derivada da sequência de programas ou presença
          multi-programa; 'Não Informado' — dado ausente ou inválido.
        tests:
          - not_null
          - accepted_values:
              values: ['Confirmado', 'Inferido', 'Não Informado']
      - name: perfil_classificacao
        description: >
          Classificação final consolidada (1 linha por proponente):
          'Primeira Vez' — confirmado pelo proponente;
          'Veterano' — confirmado pelo proponente ou por presença em >1 programa com resposta vet.;
          'Veterano (Multi-Programa)' — veterania inferida pela presença em múltiplos programas;
          'Provável Primeira Vez' — inferido por ser estreante na base;
          'Provável Veterano' — inferido por sequência histórica;
          'Indeterminado' — dado insuficiente para classificação.
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Primeira Vez'
                - 'Veterano'
                - 'Veterano (Multi-Programa)'
                - 'Provável Primeira Vez'
                - 'Provável Veterano'
                - 'Indeterminado'

  - name: perfil_acesso_fomento
    description: >
      Camada Gold — Meta 5 (Mapeamento de agentes culturais acessando fomento
      pela primeira vez). Classifica cada proponente por programa com a coluna
      perfil_acesso_fomento. Respostas confirmadas ('Sim'/'Não') são mantidas;
      respostas nulas ou omitidas recebem inferência cronológica via ROW_NUMBER()
      particionado por CPF/CNPJ e ordenado por programa_fomento (proxy temporal:
      LPG precede PNAB). Um proponente com sequencia_fomento > 1 acessou mais
      de um programa, evidenciando veterania.
    config:
      meta:
        meta_objetivo: 'Meta 5 — Inferência de Primeiro Acesso'
        origem_dados: 'LPG e PNAB (via identificadores_agentes)'
        tags: [gold, agentes, primeiro_acesso, meta5, inferencia]
    columns:
      - name: identificador_unico
        description: CPF ou CNPJ do proponente (já normalizado em minúsculas e sem espaços).
        tests:
          - not_null
      - name: tipo_proponente
        description: Classificação do proponente — 'Pessoa Física', 'Pessoa Jurídica', 'Coletivo' ou 'Organização'.
        tests:
          - not_null
      - name: programa_fomento
        description: Programa de fomento de origem — 'LPG' ou 'PNAB'.
        tests:
          - not_null
      - name: historico_acesso_limpo
        description: Resposta bruta normalizada (lowercase, sem pontuação). NULL quando omitida ou inválida.
      - name: sequencia_fomento
        description: >
          Ordem de acesso do proponente dentro de seu histórico, particionado por
          identificador_unico e ordenado por programa_fomento (proxy temporal).
          sequencia_fomento = 1 indica o primeiro registro; > 1 indica veterano.
        tests:
          - not_null
      - name: perfil_acesso_fomento
        description: >
          Classificação final para a Meta 5:
          'Confirmado - Primeira Vez' | 'Confirmado - Veterano' |
          'Inferido - Primeira Vez (Estreante na base)' |
          'Inferido - Veterano (Possui histórico)' |
          'Não sabe/Não informou'.
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Confirmado - Primeira Vez'
                - 'Confirmado - Veterano'
                - 'Inferido - Primeira Vez (Estreante na base)'
                - 'Inferido - Veterano (Possui histórico)'
                - 'Não sabe/Não informou'

  - name: primeiro_acesso_contemplados
    description: >
      Camada Gold — Meta 5 com flag de contemplação. Mesma estrutura de
      primeiro_acesso_resumo com duas dimensões adicionais: se o proponente
      foi contemplado em edital e a discriminação entre dados confirmados
      (resposta declarada no formulário) vs. inferidos (derivados por sequência
      ou presença multi-programa). Grain: 1 linha por
      (programa_fomento × categoria_primeiro_acesso × contemplado).

      Cobertura de contemplados:
        - LPG: CPF e CNPJ completos via planilha_contemplados_lpg — cobertura total.
        - PNAB PNCV: CPF real (fatia tabela_origem = raw_pnab_lista_contemplados_pncv
          de planilha_contemplados_pnab_ciclo_1) — cobertura PF.
        - PNAB Geral: apenas CNPJ (fatia raw_pnab_lista_contemplados_geral) — CPF
          anonimizado (***XXXXXX**), PF da lista geral fora do PNCV não é rastreável.
    config:
      meta:
        meta_objetivo: 'Meta 5 — Primeiro Acesso com Contemplação'
        origem_dados: 'perfil_acesso_fomento + planilha_contemplados_lpg + planilha_contemplados_pnab_ciclo_1'
        tags: [gold, agentes, meta5, contemplados, primeiro_acesso]
    columns:
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        tests:
          - not_null
          - accepted_values:
              values: ['LPG', 'PNAB']
      - name: categoria_primeiro_acesso
        description: >
          Categoria de acesso derivada do perfil_acesso_fomento:
          'Sim' (Primeira Vez), 'Não' (Veterano) ou 'Não sabe/Não informou'.
        tests:
          - not_null
          - accepted_values:
              values: ['Sim', 'Não', 'Não sabe/Não informou']
      - name: contemplado
        description: >
          Flag de contemplação em edital público — 'sim' se o identificador
          aparece em alguma lista de contemplados do respectivo programa,
          'não' caso contrário.
        tests:
          - not_null
          - accepted_values:
              values: ['sim', 'não']
      - name: total_proponentes
        description: Contagem distinta de proponentes no cruzamento programa × categoria × contemplado.
        tests:
          - not_null
      - name: total_campo_preenchido
        description: >
          Proponentes onde a categoria foi determinada por resposta declarada
          no formulário (status_dado = 'Confirmado'). Exclui inferências.
        tests:
          - not_null
      - name: total_inferido
        description: >
          Proponentes onde a categoria foi inferida por sequência de programas
          ou presença multi-programa (status_dado = 'Inferido').
        tests:
          - not_null
      - name: percentual
        description: >
          Percentual da linha sobre o total de proponentes do mesmo
          programa_fomento e status de contemplação. Cada combinação
          (programa × contemplado) soma 100% independentemente.
        tests:
          - not_null

  - name: primeiro_acesso_resumo
    description: >
      Camada Gold — resumo agregado da Meta 5 (Indicador de Primeiro Acesso).
      Conta proponentes distintos por programa de fomento e categoria de acesso
      anterior a recursos públicos. Calcula o percentual de cada categoria
      sobre o total do respectivo programa (cada programa soma 100%).
    config:
      meta:
        meta_objetivo: 'Meta 5 — Indicador de Primeiro Acesso'
        origem_dados: 'LPG e PNAB'
        tags: [gold, agentes, primeiro_acesso, meta5]
    columns:
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        tests:
          - not_null
          - accepted_values:
              values: ['LPG', 'PNAB']
      - name: categoria_primeiro_acesso
        description: >
          Categoria padronizada da resposta sobre acesso anterior a recursos
          de fomento — 'Sim', 'Não' ou 'Não sabe/Não informou'.
        tests:
          - not_null
          - accepted_values:
              values: ['Sim', 'Não', 'Não sabe/Não informou']
      - name: total_proponentes
        description: Contagem distinta de proponentes na categoria dentro do programa.
        tests:
          - not_null
      - name: percentual
        description: >
          Percentual da categoria sobre o total de proponentes do mesmo programa
          (cada programa soma 100% independentemente).
        tests:
          - not_null

  - name: primeiro_acesso_agentes
    description: >
      Camada Gold — Meta 5. Grão fino do indicador de novos entrantes: uma
      linha por (agente × mecanismo), com a data em que ele entrou naquele
      mecanismo e se aquela entrada foi a porta de entrada dele no fomento
      federal como um todo. Substitui primeiro_pagamento_bancario, que
      comparava datas apenas entre LPG e PNAB — num universo de dois
      programas, "não é novo entrante" só conseguia significar "recebeu o
      outro programa antes", e quem aparecia num programa só era sempre
      classificado como novo. Aqui a comparação é cross-mecanismo de
      verdade, e inclui a Rouanet desde 1993.

      Exatamente uma linha por agente tem eh_porta_de_entrada = true;
      empates de data no mesmo dia são desempatados por ordem de mecanismo
      (ROUANET, LAB, LPG, PNAB) para que ninguém conte duas vezes.
    config:
      meta:
        meta_objetivo: 'Meta 5 — Primeiro Acesso ao Fomento Federal (por agente)'
        origem_dados: 'eventos_fomento (BB Ágil + SALIC)'
        tags: [gold, agentes, meta5, primeiro_acesso]
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do agente, normalizado com LPAD.
        tests:
          - not_null
      - name: programa_fomento
        description: Mecanismo de fomento — 'LAB', 'LPG', 'PNAB' ou 'ROUANET'.
        tests:
          - not_null
          - accepted_values:
              values: ['LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: tipo_pessoa
        description: "'PF' quando o documento tem 11 dígitos, 'PJ' quando tem 14."
        tests:
          - not_null
          - accepted_values:
              values: ['PF', 'PJ']
      - name: data_primeiro_acesso_mecanismo
        description: Primeiro evento observado do agente neste mecanismo.
        tests:
          - not_null
      - name: data_primeiro_acesso_geral
        description: >
          Primeiro evento do agente em QUALQUER mecanismo. É a data que
          define se ele é novo entrante.
        tests:
          - not_null
      - name: ano_primeiro_acesso_geral
        description: Ano de data_primeiro_acesso_geral.
        tests:
          - not_null
      - name: qtd_mecanismos_agente
        description: Em quantos mecanismos distintos o agente já recebeu recurso.
        tests:
          - not_null
      - name: eh_porta_de_entrada
        description: >
          Verdadeiro no mecanismo pelo qual o agente entrou no fomento
          federal. Exatamente uma linha por agente.
        tests:
          - not_null
      - name: categoria_primeiro_acesso
        description: "'Sim' quando esta linha é a porta de entrada do agente; 'Não' caso contrário."
        tests:
          - not_null
          - accepted_values:
              values: ['Sim', 'Não']
      - name: entrada_em_ano_censurado
        description: >
          Verdadeiro quando a entrada caiu no primeiro ano observável da
          fonte daquele mecanismo (2023 para LAB/LPG/PNAB), onde não existe
          passado com que comparar e todo agente parece estreante.
        tests:
          - not_null

  - name: primeiro_acesso_anual
    description: >
      Camada Gold — Meta 5. A série que responde às perguntas 1, 2.1 e 2.2:
      percentual anual de agentes de primeiro acesso, no total
      (programa_fomento = 'TODOS') e por mecanismo (LAB, LPG, PNAB,
      ROUANET). Grão: 1 linha por (ano × mecanismo) mais o roll-up.

      A linha 'TODOS' não é a soma das linhas por mecanismo — um agente
      atendido por dois mecanismos no mesmo ano conta uma vez só nela.

      Os percentuais são TETO, não estimativa pontual: faltam o FSA
      (planilha Ancine, fora do banco) e a Lei Aldir Blanc I emergencial
      de 2020-2021 (não existe em nenhuma fonte do banco). Fonte ausente
      só transforma veterano em falso novo entrante, nunca o contrário,
      então o valor real é menor ou igual ao publicado.
    config:
      meta:
        meta_objetivo: 'Meta 5 — Percentual anual de proponentes de primeiro acesso'
        origem_dados: 'eventos_fomento + primeiro_acesso_agentes'
        tags: [gold, agentes, meta5, primeiro_acesso, serie_anual]
    columns:
      - name: ano
        description: Ano civil do evento de recebimento de recurso.
        tests:
          - not_null
      - name: programa_fomento
        description: Mecanismo, ou 'TODOS' para o roll-up de todos os mecanismos.
        tests:
          - not_null
          - accepted_values:
              values: ['LAB', 'LPG', 'PNAB', 'ROUANET', 'TODOS']
      - name: agentes_atendidos
        description: Agentes distintos que receberam recurso do mecanismo naquele ano (denominador).
        tests:
          - not_null
      - name: novos_entrantes
        description: >
          Destes, quantos tiveram ali o primeiro acesso a qualquer fomento
          federal observável (numerador).
        tests:
          - not_null
      - name: ja_contemplados_antes
        description: agentes_atendidos - novos_entrantes.
        tests:
          - not_null
      - name: percentual_primeiro_acesso
        description: novos_entrantes / agentes_atendidos, em %.
        tests:
          - not_null
      - name: ano_censurado
        description: >
          Verdadeiro no primeiro ano observável da fonte, onde o percentual
          é artefato de janela e não medição. No roll-up 'TODOS' inclui 2023,
          primeiro ano do BB Ágil.
        tests:
          - not_null
      - name: ano_parcial
        description: >
          Verdadeiro no último ano com dado, que ainda não terminou. O
          percentual de um ano parcial vem deprimido — menos gente nova
          acumulada — e não deve ser comparado com anos fechados.
        tests:
          - not_null

  - name: trajetoria_fomento_direto_rouanet
    description: >
      Camada Gold — Meta 5, pergunta 2.3: há novos entrantes pelo fomento
      direto (LAB/LPG/PNAB) que depois acessaram a Lei Rouanet? Grão: 1
      linha por (trajetória × tipo de pessoa).

      Mede as duas direções. DIRETO_DEPOIS_ROUANET responde a pergunta 2.3
      literalmente. ROUANET_ANTES_DIRETO é a direção oposta e vale como
      controle do indicador inteiro: são agentes que já acessavam recurso
      público federal antes de 2023 e que, sem a fonte do SALIC, seriam
      contados como novos entrantes do fomento direto.
    config:
      meta:
        meta_objetivo: 'Meta 5 — Trajetória entre fomento direto e Rouanet'
        origem_dados: 'primeiro_acesso_agentes'
        tags: [gold, agentes, meta5, primeiro_acesso, rouanet]
    columns:
      - name: trajetoria
        description: >
          'SO_DIRETO', 'SO_ROUANET', 'DIRETO_DEPOIS_ROUANET',
          'ROUANET_ANTES_DIRETO' ou 'MESMO_DIA'.
        tests:
          - not_null
          - accepted_values:
              values: ['SO_DIRETO', 'SO_ROUANET', 'DIRETO_DEPOIS_ROUANET', 'ROUANET_ANTES_DIRETO', 'MESMO_DIA']
      - name: tipo_pessoa
        description: "'PF' ou 'PJ'."
        tests:
          - not_null
      - name: agentes
        description: Quantidade de agentes distintos naquela trajetória.
        tests:
          - not_null

  - name: primeiro_acesso_contemplados_bancario
    description: >
      Camada Gold — Meta 5. O mesmo indicador de novos entrantes, restrito a
      quem aparece nas listas oficiais de contemplados dos editais (LPG e
      PNAB), em vez de a todo agente visto recebendo dinheiro. Grão: 1 linha
      por (programa × categoria de primeiro acesso).

      A classificação vem de primeiro_acesso_agentes, então já é
      cross-mecanismo e já considera a Rouanet desde 1993.

      Cobertura parcial e medida: a interseção entre lista de contemplados e
      extrato bancário fica em torno de 46% na LPG e 89% no PNAB. A causa
      não é atraso de pagamento nem filtro agressivo — o BB Ágil só enxerga
      contas administradas pelo Banco do Brasil, e o município frequentemente
      declara ter pago um contemplado cujo pagamento não passou por lá.
      Contemplado sem evento observável fica de fora, sem fallback
      autodeclarado.
    config:
      meta:
        meta_objetivo: 'Meta 5 — Novos Entrantes entre contemplados de edital'
        origem_dados: 'primeiro_acesso_agentes + identificadores_contemplados'
        tags: [gold, agentes, bbagil, meta5, contemplados, primeiro_acesso]
    columns:
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        tests:
          - not_null
          - accepted_values:
              values: ['LPG', 'PNAB']
      - name: categoria_primeiro_acesso
        description: >
          'Sim' — foi por este mecanismo que o agente entrou no fomento
          federal (novo entrante); 'Não' — já havia recebido recurso antes,
          em qualquer mecanismo observável.
        tests:
          - not_null
          - accepted_values:
              values: ['Sim', 'Não']
      - name: total_proponentes
        description: Contagem distinta de contemplados com evento observável, por categoria.
        tests:
          - not_null
      - name: percentual
        description: >
          Percentual da categoria sobre o total de contemplados com evento
          observável no mesmo programa_fomento (cada programa soma 100%).
        tests:
          - not_null
