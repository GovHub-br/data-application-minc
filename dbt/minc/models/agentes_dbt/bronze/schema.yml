version: 2

models:
  - name: lpg_agentes_pf
    description: >
      Camada Bronze — dados brutos de pessoas físicas da LPG (Lei Paulo Gustavo).
      Mapeia o CPF como identificador único e traz a coluna bruta de histórico
      de acesso a recursos públicos de fomento à cultura. Carga incremental
      (materialized='incremental'), deduplicada por identificador_unico;
      descarta CPF nulo, vazio ou 'nan'/'none'.
    config:
      tags: [bronze, agentes, pessoa_fisica, lpg]
      meta:
        status: Active
    columns:
      - name: identificador_unico
        description: CPF do proponente pessoa física, normalizado para lowercase.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: Resposta bruta da LPG sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'LPG' neste modelo.

  - name: lpg_agentes_pj
    description: >
      Camada Bronze — dados brutos de pessoas jurídicas da LPG.
      Mapeia o CNPJ como identificador único e traz a coluna bruta de histórico
      de acesso a recursos públicos de fomento à cultura. Carga incremental,
      deduplicada por identificador_unico; descarta CNPJ nulo, vazio ou 'nan'/'none'.
    config:
      tags: [bronze, agentes, pessoa_juridica, lpg]
      meta:
        status: Active
    columns:
      - name: identificador_unico
        description: CNPJ do proponente pessoa jurídica, normalizado para lowercase.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: Resposta bruta da LPG sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'LPG' neste modelo.

  - name: lpg_agentes_coletivos
    description: >
      Camada Bronze — dados brutos de proponentes coletivos da LPG.
      Mapeia o CPF do representante do grupo/coletivo como identificador único
      e traz a coluna bruta de histórico de acesso a recursos públicos de fomento.
      Carga incremental, deduplicada por identificador_unico.
    config:
      tags: [bronze, agentes, coletivo, lpg]
      meta:
        status: Active
    columns:
      - name: identificador_unico
        description: CPF do representante do grupo/coletivo, normalizado para lowercase.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: Resposta bruta da LPG sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'LPG' neste modelo.

  - name: pnab_agentes_pf
    description: >
      Camada Bronze — dados brutos de pessoas físicas da PNAB (Política Nacional Aldir Blanc).
      Mapeia o CPF como identificador único e traz a coluna bruta de histórico
      de acesso a recursos públicos de fomento à cultura nos últimos 5 anos.
      Carga incremental, deduplicada por identificador_unico; descarta CPF nulo,
      vazio ou 'nan'/'none'.
    config:
      tags: [bronze, agentes, pessoa_fisica, pnab]
      meta:
        status: Active
    columns:
      - name: identificador_unico
        description: CPF do proponente pessoa física, normalizado para lowercase.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: Resposta bruta da PNAB sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'PNAB' neste modelo.

  - name: pnab_agentes_pj
    description: >
      Camada Bronze — dados brutos de organizações da PNAB.
      Mapeia o CNPJ como identificador único e traz a coluna bruta de histórico
      de acesso a recursos públicos de fomento à cultura anteriormente.
      Carga incremental, deduplicada por identificador_unico.
    config:
      tags: [bronze, agentes, pessoa_juridica, pnab]
      meta:
        status: Active
    columns:
      - name: identificador_unico
        description: CNPJ da organização, normalizado para lowercase.
        tests:
          - not_null
      - name: historico_acesso_bruto
        description: Resposta bruta da PNAB sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'PNAB' neste modelo.

  - name: bbagil_extrato_filtrado
    description: >
      Camada Bronze — extrato bancário do BB Gestão Ágil (schema `bsc`),
      filtrado pelos 8 filtros de negócio (documento válido, sem
      subtransação, exclui BB/FNC/estornos/repasses entre entes públicos).
      Só débitos (pagamentos de fato) sobrevivem. Fonte primária da Meta 5
      Fase 4 (primeiro acesso comprovado por dado bancário).
    config:
      meta:
        tags: [bronze, agentes, bbagil, meta5, fase4]
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono da conta bancária.
        tests:
          - not_null
      - name: id
        description: >
          Identificador da transação no extrato (id_plano_acao + id é a
          chave da tabela raw). Usado por bbagil_subtransacoes_filtrado
          pra achar a transação-mãe (id_transacao_pai = id).
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa devolvido pelo BSC (governmentprogramname —
          ex. 'MINC-LPG-MUNI-AUD', 'MINC-PNAB-2023'). Insumo pra derivar
          programa_fomento em pagamentos_bbagil_beneficiarios.
      - name: beneficiario_documento
        description: >
          CPF/CNPJ do beneficiário do pagamento, normalizado (LPAD por
          beneficiarypersontype — 11 dígitos p/ CPF, 14 p/ CNPJ).
        tests:
          - not_null
      - name: beneficiario_nome
        description: Nome do beneficiário do pagamento, como devolvido pelo BSC.
      - name: valor
        description: Valor do pagamento (débito), em reais.
        tests:
          - not_null
      - name: data_pagamento
        description: Data do lançamento no extrato (bookingdate), convertida pra DATE.
        tests:
          - not_null

  - name: bbagil_subtransacoes_filtrado
    description: >
      Camada Bronze — sublançamentos do BB Gestão Ágil, usados quando a
      transação-mãe do extrato tem subtransactionquantity > 0 (o
      beneficiário real só aparece aqui). Filtra por status 'Pago' e
      exclui repasses entre entes públicos.
    config:
      meta:
        tags: [bronze, agentes, bbagil, meta5, fase4]
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação, herdado da transação-mãe.
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa (governmentprogramname), herdado da
          transação-mãe do extrato via id_plano_acao + id_transacao_pai = id.
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do sublançamento, normalizado (LPAD por persontype).
        tests:
          - not_null
      - name: beneficiario_nome
        description: Nome do beneficiário do sublançamento, como devolvido pelo BSC.
      - name: valor
        description: Valor do sublançamento (em módulo), em reais.
        tests:
          - not_null
      - name: data_pagamento
        description: Data de pagamento do sublançamento (paymentdate), convertida pra DATE.
        tests:
          - not_null
