version: 2

models:
  - name: bbagil_extrato_filtrado
    description: >
      Camada Bronze — extrato bancário do BB Gestão Ágil (schema `bsc`),
      filtrado pelos 8 filtros de negócio (documento válido, sem
      subtransação, exclui BB/FNC/estornos/repasses entre entes públicos).
      Só débitos (pagamentos de fato) sobrevivem. Fonte primária da Meta 5
      Fase 4 (primeiro acesso comprovado por dado bancário).
    config:
      meta:
        tags: [bronze, agentes, bbagil, meta5, fase4]
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono da conta bancária.
        tests:
          - not_null
      - name: id
        description: >
          Identificador da transação no extrato (id_plano_acao + id é a
          chave da tabela raw). Usado por bbagil_subtransacoes_filtrado
          pra achar a transação-mãe (id_transacao_pai = id).
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa devolvido pelo BSC (governmentprogramname —
          ex. 'MINC-LPG-MUNI-AUD', 'MINC-PNAB-2023'). Insumo pra derivar
          programa_fomento em pagamentos_bbagil_beneficiarios.
      - name: beneficiario_documento
        description: >
          CPF/CNPJ do beneficiário do pagamento, normalizado (LPAD por
          beneficiarypersontype — 11 dígitos p/ CPF, 14 p/ CNPJ).
        tests:
          - not_null
      - name: beneficiario_nome
        description: Nome do beneficiário do pagamento, como devolvido pelo BSC.
      - name: valor
        description: Valor do pagamento (débito), em reais.
        tests:
          - not_null
      - name: data_pagamento
        description: Data do lançamento no extrato (bookingdate), convertida pra DATE.
        tests:
          - not_null

  - name: bbagil_subtransacoes_filtrado
    description: >
      Camada Bronze — sublançamentos do BB Gestão Ágil, usados quando a
      transação-mãe do extrato tem subtransactionquantity > 0 (o
      beneficiário real só aparece aqui). Filtra por status 'Pago' e
      exclui repasses entre entes públicos.
    config:
      meta:
        tags: [bronze, agentes, bbagil, meta5, fase4]
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação, herdado da transação-mãe.
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa (governmentprogramname), herdado da
          transação-mãe do extrato via id_plano_acao + id_transacao_pai = id.
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do sublançamento, normalizado (LPAD por persontype).
        tests:
          - not_null
      - name: beneficiario_nome
        description: Nome do beneficiário do sublançamento, como devolvido pelo BSC.
      - name: valor
        description: Valor do sublançamento (em módulo), em reais.
        tests:
          - not_null
      - name: data_pagamento
        description: Data de pagamento do sublançamento (paymentdate), convertida pra DATE.
        tests:
          - not_null

  - name: identificadores_contemplados
    description: >
      Bronze — unifica identificadores (CPF/CNPJ normalizados) de
      contemplados LPG + PNAB, para que primeiro_acesso_contemplados possa
      restringir o indicador a quem foi de fato selecionado em edital.

      As colunas de documento são resolvidas dinamicamente via
      information_schema nas três tabelas de origem, porque a ingestão de
      planilhas não normaliza espaços nem NBSP nos cabeçalhos e o mesmo
      campo vira várias colunas, cada uma com parte dos dados. O padrão
      anterior (ILIKE '%cpf%cnpj%') exigia "cpf" antes de "cnpj" e não casava
      "cnpj" sozinho nem "cpf/ cnpj", deixando de fora ~2.100 contemplados do
      PNAB — a maioria deles com pagamento comprovado no extrato bancário.

      Colunas "cpf (anonimizado)" são excluídas de propósito: trazem
      ***XXXXXX** no lugar do documento. Continua valendo que o CPF de PF da
      lista geral do PNAB, fora do PNCV, não é rastreável.
    config:
      meta:
        tags: [bronze, agentes, contemplados, meta5]
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: id_normalizado
        description: CPF ou CNPJ do contemplado, normalizado (só dígitos).
        tests:
          - not_null
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']
