version: 2

models:
  - name: bbagil_extrato_filtrado
    description: >
      Camada Bronze — extrato bancário do BB Gestão Ágil (schema `bbagil`),
      filtrado pelos 8 filtros de negócio (documento válido, sem
      subtransação, exclui BB/FNC/estornos/repasses entre entes públicos).
      Só débitos (pagamentos de fato) sobrevivem. Fonte primária da Meta 5
      Fase 4 (primeiro acesso comprovado por dado bancário).

      Grão: 1 linha por transação de débito do extrato — a chave da origem é
      (id_plano_acao, id). Transações com subtransactionquantity > 0 ficam
      fora de propósito: nelas o beneficiário real só aparece no
      sublançamento, e quem os traz é bbagil_subtransacoes_filtrado.

      O par débito/crédito de mesmo valor, mesmo documento e mesmo plano de
      ação é lido como estorno e removido dos dois lados — cobrar o débito
      sem descontar o crédito inventaria pagamento que foi desfeito.
    config:
      tags: [bronze, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — pagamentos do BB Ágil sem subtransação'
        origem_dados: 'bbagil.extrato_bbagil'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
          tags:
            - Certification.Bronze
          glossary:
            - MinC.Politicas.FundoAFundo
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono da conta bancária.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: id
        description: >
          Identificador da transação no extrato (id_plano_acao + id é a
          chave da tabela raw). Usado por bbagil_subtransacoes_filtrado
          pra achar a transação-mãe (id_transacao_pai = id).
        data_type: text
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa devolvido pelo BSC (governmentprogramname —
          ex. 'MINC-LPG-MUNI-AUD', 'MINC-PNAB-2023'). Insumo pra derivar
          programa_fomento em pagamentos_bbagil_beneficiarios.
        data_type: text
      - name: beneficiario_documento
        description: >
          CPF/CNPJ do beneficiário do pagamento, normalizado (LPAD por
          beneficiarypersontype — 11 dígitos p/ CPF, 14 p/ CNPJ).
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do beneficiário do pagamento, como devolvido pelo BSC. Também
          é o campo em que os filtros de repasse entre entes públicos agem:
          nomes começados por MUNICIPIO, ESTADO, FUNDO, SECRETARIA ou SEFAZ
          não chegam aqui.
        data_type: text
      - name: valor
        description: Valor do pagamento (débito), em reais.
        data_type: numeric
        tests:
          - not_null
      - name: data_pagamento
        description: Data do lançamento no extrato (bookingdate), convertida pra DATE.
        data_type: date
        tests:
          - not_null

  - name: bbagil_subtransacoes_filtrado
    description: >
      Camada Bronze — sublançamentos do BB Gestão Ágil, usados quando a
      transação-mãe do extrato tem subtransactionquantity > 0 (o
      beneficiário real só aparece aqui). Filtra por status 'Pago' e
      exclui repasses entre entes públicos.

      Grão: 1 linha por sublançamento pago. Complementa
      bbagil_extrato_filtrado sem sobrepô-lo — um trata a transação que é
      pagamento direto, o outro a que é bolo repartido entre vários
      beneficiários. Os dois juntos formam pagamentos_bbagil_beneficiarios.

      O valor vem em módulo (ABS): no sublançamento o sinal indica o lado da
      partida dobrada, não devolução.
    config:
      tags: [bronze, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — sublançamentos pagos do BB Ágil'
        origem_dados: 'bbagil.subtransacao_bbagil + bbagil.extrato_bbagil'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
          tags:
            - Certification.Bronze
          glossary:
            - MinC.Politicas.FundoAFundo
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação, herdado da transação-mãe.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código curto do programa (governmentprogramname), herdado da
          transação-mãe do extrato via id_plano_acao + id_transacao_pai = id.
        data_type: text
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do sublançamento, normalizado (LPAD por persontype).
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do beneficiário do sublançamento, como devolvido pelo BSC.
          Mesmos filtros de ente público do extrato agem sobre este campo.
        data_type: text
      - name: valor
        description: Valor do sublançamento (em módulo), em reais.
        data_type: numeric
        tests:
          - not_null
      - name: data_pagamento
        description: Data de pagamento do sublançamento (paymentdate), convertida pra DATE.
        data_type: date
        tests:
          - not_null

  - name: identificadores_contemplados
    description: >
      Bronze — unifica identificadores (CPF/CNPJ normalizados) de
      contemplados LPG + PNAB, para que primeiro_acesso_contemplados possa
      restringir o indicador a quem foi de fato selecionado em edital.
      Grão: 1 linha por (documento × programa), já distinta.

      As colunas de documento são resolvidas dinamicamente via
      information_schema nas tabelas de origem, porque a ingestão de
      planilhas não normaliza espaços nem NBSP nos cabeçalhos e o mesmo
      campo vira várias colunas, cada uma com parte dos dados. O padrão
      anterior (ILIKE '%cpf%cnpj%') exigia "cpf" antes de "cnpj" e não casava
      "cnpj" sozinho nem "cpf/ cnpj", deixando de fora ~2.100 contemplados do
      PNAB — a maioria deles com pagamento comprovado no extrato bancário.

      São duas fontes hoje: planilha_contemplados_lpg e
      planilha_contemplados_pnab_ciclo_1. Se nenhuma coluna de documento for
      encontrada nelas, o modelo aborta na compilação com mensagem explícita,
      em vez de gerar um UNION ALL vazio e quebrar com erro de sintaxe.

      Colunas "cpf (anonimizado)" são excluídas de propósito: trazem
      ***XXXXXX** no lugar do documento. Continua valendo que o CPF de PF da
      lista geral do PNAB, fora do PNCV, não é rastreável.

      Único modelo do domínio materializado como VIEW, contra o
      `+materialized: table` que o dbt_project.yml aplica a agentes_dbt — a
      varredura do information_schema roda em tempo de compilação e o
      resultado é pequeno. A view existe no banco, então o conector do
      OpenMetadata a enxerga normalmente.
    config:
      tags: [bronze, agentes, contemplados, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — identificadores de contemplados de edital'
        origem_dados: 'relatorio_gestao.planilha_contemplados_lpg + planilha_contemplados_pnab_ciclo_1'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Bronze
          glossary:
            - MinC.Agentes.Contemplado
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_normalizado
        description: >
          CPF ou CNPJ do contemplado, normalizado (só dígitos, LPAD para 11 ou
          14). Descarta documento com menos de 9 ou mais de 14 dígitos e
          documento só de zeros.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']
