version: 2

models:
  - name: lpg_agentes_pf
    description: >
      Camada Bronze — dados brutos de pessoas físicas da LPG (Lei Paulo Gustavo).
      Mapeia o CPF como identificador único e traz a coluna bruta de histórico
      de acesso a recursos públicos de fomento à cultura. Carga incremental
      (materialized='incremental'), deduplicada por id_agente;
      descarta CPF nulo, vazio ou 'nan'/'none'.
    config:
      tags: [bronze, agentes, pessoa_fisica, lpg]
      meta:
        status: Active
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
    columns:
      - name: id_agente
        description: >
          Pseudônimo do CPF do proponente: sha256(salt || documento canônico),
          em hex. NÃO é o documento e não é reversível sem o salt. Documento que
          chegou mascarado da origem é hasheado como veio, e por isso nunca casa
          com um documento completo — para esse caso existe id_agente_miolo.
        tests:
          - not_null
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
      - name: id_agente_miolo
        description: >
          Pseudônimo dos 6 dígitos centrais do CPF, preenchido SÓ quando o
          documento veio mascarado ('***.NNN.NNN-**') e sobraram exatamente 6
          dígitos. Sustenta o match parcial de primeiro_acesso_contemplados, que
          hash nenhum preservaria por substring. NULL em todo o resto.
      - name: documento_mascarado
        description: >
          Verdadeiro quando a origem entregou o documento mascarado, logo não
          casável com a lista de contemplados a não ser pelo miolo.
      - name: historico_acesso_bruto
        description: Resposta bruta da LPG sobre acesso anterior a recursos públicos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — sempre 'LPG' neste modelo.

