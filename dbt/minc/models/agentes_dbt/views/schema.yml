version: 2

models:
  - name: identificadores_agentes
    description: >
      Camada Views — consolidação dos cinco modelos bronze (3 LPG + 2 PNAB)
      em um único dataset via UNION ALL. Padroniza id_agente e adiciona
      as colunas literais programa_fomento e tipo_proponente para rastrear
      a origem de cada registro. Base de onde partem perfil_agentes_historico
      e perfil_acesso_fomento.
    config:
      tags: [views, agentes, identificadores]
      meta:
        status: Active
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: id_agente
        description: >
          Pseudônimo do identificador do proponente (CPF, CNPJ, ou CPF do
          representante no caso de coletivo). Não é o documento.
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
      - name: id_agente_miolo
        description: >
          Pseudônimo dos 6 dígitos centrais do CPF, só para proponente cujo
          documento veio mascarado da origem. NULL no resto.
      - name: documento_mascarado
        description: >
          Verdadeiro quando a origem entregou o documento mascarado.
      - name: historico_acesso_bruto
        description: Resposta bruta sobre acesso anterior a recursos de fomento.
      - name: programa_fomento
        description: Programa de fomento de origem — 'LPG' ou 'PNAB'.
        tests:
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']
      - name: tipo_proponente
        description: >
          Tipo do proponente — 'Pessoa Física', 'Pessoa Jurídica',
          'Coletivo' ou 'Organização'.

  - name: identificadores_contemplados
    description: >
      Views — unifica identificadores (CPF/CNPJ normalizados) de
      contemplados LPG + PNAB. Extraído de primeiro_acesso_contemplados
      para reuso também em primeiro_acesso_contemplados_bancario.

      As colunas de documento são resolvidas dinamicamente via
      information_schema nas três tabelas de origem, porque a ingestão de
      planilhas não normaliza espaços nem NBSP nos cabeçalhos e o mesmo
      campo vira várias colunas, cada uma com parte dos dados. O padrão
      anterior (ILIKE '%cpf%cnpj%') exigia "cpf" antes de "cnpj" e não casava
      "cnpj" sozinho nem "cpf/ cnpj", deixando de fora ~2.100 contemplados do
      PNAB — a maioria deles com pagamento comprovado no extrato bancário.

      Colunas "cpf (anonimizado)" são excluídas de propósito: trazem
      ***XXXXXX** no lugar do documento. Continua valendo que o CPF de PF da
      lista geral do PNAB, fora do PNCV, não é rastreável.
    config:
      meta:
        tags: [views, agentes, contemplados, meta5]
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: id_contemplado
        description: >
          Pseudônimo do CPF/CNPJ: sha256(salt || documento canônico), em hex.
          Não é o documento e não é reversível sem o salt. Canonizado (só dígitos + LPAD) antes do hash,
          que é o que o mantém casável com o lado bancário e o de proponentes.
        tests:
          - not_null
      - name: id_contemplado_miolo
        description: >
          Pseudônimo dos 6 dígitos centrais do CPF. É NULL para CNPJ, que a
          origem não mascara — por isso NÃO leva not_null. Existe para casar com
          proponente cujo CPF veio mascarado: hash não preserva substring, então
          o recorte é feito antes.
      - name: programa_fomento
        description: Programa de fomento — 'LPG' ou 'PNAB'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB']
