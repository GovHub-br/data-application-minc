version: 2

models:
  - name: pagamentos_bbagil_beneficiarios
    description: >
      Camada Silver — Meta 5 Fase 4. Unifica bbagil_extrato_filtrado e
      bbagil_subtransacoes_filtrado em 1 linha por pagamento real a um
      beneficiário, com programa_fomento (LPG/PNAB/LAB) derivado do código
      curto de programa do BSC. Alimenta eventos_fomento.

      LAB deixou de ser colapsado em PNAB: os códigos SECULT-A BLANC são a
      Lei Aldir Blanc II (Lei 14.399/2022), e a pergunta 2.2 da Meta 5 pede
      os mecanismos separados. A LAB I emergencial (2020-2021) não existe em
      nenhuma fonte do banco.
    config:
      tags: [silver, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono da conta que fez o pagamento.
        tests:
          - not_null
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do pagamento, normalizado.
        tests:
          - not_null
      - name: programa_fomento
        description: Programa de fomento — 'LPG', 'PNAB' ou 'LAB'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB', 'LAB']
      - name: valor
        description: Valor do pagamento, em reais.
        tests:
          - not_null
      - name: data_pagamento
        description: Data do pagamento.
        tests:
          - not_null

  - name: eventos_fomento_rouanet
    description: >
      Camada Silver — Meta 5. Um evento por captação real de recurso na Lei
      Rouanet, no mesmo formato dos pagamentos do BB Ágil. O evento é o
      recibo de captação (dinheiro efetivamente captado), não a aprovação do
      projeto: projeto aprovado que nunca captou não deu acesso a recurso
      nenhum, e misturar aprovação com pagamento tornaria a comparação entre
      mecanismos incoerente.

      Liga sac__captacao (dinheiro e data, sem proponente) a
      sac__tbapiprojetorouanet (proponente) pelo PRONAC —
      anoprojeto || sequencial = nrpronac, que casa 99,86% dos recibos.
      sac__projetos, que seria a ponte natural, existe no schema mas foi
      carregada com 0 linhas.
    config:
      tags: [silver, agentes, salic, rouanet, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de captação da Lei Rouanet'
        origem_dados: 'bronze.sac__captacao + bronze.sac__tbapiprojetorouanet'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        tests:
          - not_null
      - name: programa_fomento
        description: Sempre 'ROUANET'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ROUANET']
      - name: data_evento
        description: Data do recibo de captação.
        tests:
          - not_null
      - name: valor
        description: Valor captado no recibo, em reais. Sempre maior que zero.
        tests:
          - not_null
      - name: pronac
        description: PRONAC do projeto que captou.
        tests:
          - not_null

  - name: eventos_fomento_ancine
    description: >
      Camada Silver — um evento por captação de projeto audiovisual registrada
      pela Ancine (`ancine.consulta`), no mesmo formato dos recibos da Rouanet e
      dos pagamentos do BB Ágil, para entrar em eventos_fomento.

      Dois mecanismos, não um: 'FSA' responde literalmente ao que o documento da
      meta nomeia; 'AUDIOVISUAL' carrega Lei do Audiovisual (ART1/ART3/1A/3A),
      FUNCINES e os editais da Ancine. ART25/ART18 ficam de fora porque são
      Rouanet e já entram pelo SALIC, por fonte melhor — incluí-los duplicaria
      evento. Também ficam de fora RENDIMENTOS, CONTRAPARTIDA, OUTRAS FONTES e
      lei estadual/municipal, que não são fomento federal ao agente.

      Armadilhas de formato, as duas medidas nesta tabela: `data_captacao` é
      TEXT no padrão AMERICANO M/D/YYYY ('7/12/2007' é 12 de julho, não 7 de
      dezembro), e `valor_de_captacao` é TEXT no padrão brasileiro ('50.000,00').

      A fonte é quase toda CNPJ — proponente pessoa física é, na prática,
      invisível aqui. É a limitação desta fonte, e empurra na mesma direção de
      todas as outras: pode deixar de revelar um veterano, nunca inventar um.
    config:
      tags: [silver, agentes, ancine, audiovisual, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de captação do audiovisual federal'
        origem_dados: 'ancine.consulta'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do proponente como a Ancine registra. Não é usado por nenhum
          modelo a jusante — morre em eventos_fomento.
      - name: programa_fomento
        description: Mecanismo — 'FSA' ou 'AUDIOVISUAL'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FSA', 'AUDIOVISUAL']
      - name: data_evento
        description: Data da captação, convertida do formato americano da origem.
        tests:
          - not_null
      - name: valor
        description: Valor captado, convertido do formato brasileiro da origem.
      - name: no_salic
        description: >
          Número do projeto no SALIC anotado pela Ancine. Não vem do SALIC — é
          coluna da própria `ancine.consulta`. Serve de rastreabilidade e não
          atravessa para eventos_fomento.

  - name: eventos_fomento
    description: >
      Camada Silver — Meta 5. Espinha unificada: um evento por vez que um
      agente cultural recebeu recurso de uma política federal de fomento,
      num formato só. É a tabela que permite perguntar "este agente já havia
      sido contemplado antes?" acima do mecanismo, que é o que a pergunta da
      meta exige. Grão: 1 linha por (documento, mecanismo, data, valor).

      Janelas de observação, muito assimétricas: ROUANET 1993+, LAB/LPG/PNAB
      2023+, FSA ausente. Por isso a coluna ano_inicio_observacao, que a gold
      usa para marcar os anos censurados à esquerda.

      O piso de valor (var limiar_valor_fomento, padrão 375) é aplicado sobre
      o TOTAL do agente naquele mecanismo, não por transação, e só ao BB Ágil
      — é lá que existe resíduo de transação que não é repasse de fomento.
    config:
      tags: [silver, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — espinha de eventos de acesso a fomento federal'
        origem_dados: 'pagamentos_bbagil_beneficiarios + eventos_fomento_rouanet'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do agente, normalizado com LPAD.
        tests:
          - not_null
      - name: programa_fomento
        description: Mecanismo — 'LAB', 'LPG', 'PNAB' ou 'ROUANET'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: data_evento
        description: Data em que o recurso chegou ao agente.
        tests:
          - not_null
      - name: ano_evento
        description: Ano civil de data_evento.
        tests:
          - not_null
      - name: valor
        description: Valor do evento, em reais.
        tests:
          - not_null
      - name: fonte
        description: "'BB_AGIL', 'SALIC' ou 'ANCINE'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ANCINE', 'BB_AGIL', 'SALIC']
      - name: ano_inicio_observacao
        description: Primeiro ano em que a fonte daquele mecanismo enxerga qualquer coisa.
        tests:
          - not_null
      - name: tipo_pessoa
        description: "'PF' (11 dígitos) ou 'PJ' (14)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']

  - name: primeiro_acesso_agentes
    description: >
      Camada Silver — Meta 5. Grão fino do indicador de novos entrantes: uma
      linha por (agente × mecanismo), com a data em que ele entrou naquele
      mecanismo e se aquela entrada foi a porta de entrada dele no fomento
      federal como um todo. Substitui primeiro_pagamento_bancario, que
      comparava datas apenas entre LPG e PNAB — num universo de dois
      programas, "não é novo entrante" só conseguia significar "recebeu o
      outro programa antes", e quem aparecia num programa só era sempre
      classificado como novo. Aqui a comparação é cross-mecanismo de
      verdade, e inclui a Rouanet desde 1993.

      Exatamente uma linha por agente tem eh_porta_de_entrada = true;
      empates de data no mesmo dia são desempatados por ordem de mecanismo
      (ROUANET, LAB, LPG, PNAB) para que ninguém conte duas vezes.
    config:
      tags: [silver, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Primeiro Acesso ao Fomento Federal (por agente)'
        origem_dados: 'eventos_fomento (BB Ágil + SALIC)'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do agente, normalizado com LPAD.
        tests:
          - not_null
      - name: programa_fomento
        description: Mecanismo de fomento — 'LAB', 'LPG', 'PNAB' ou 'ROUANET'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: tipo_pessoa
        description: "'PF' quando o documento tem 11 dígitos, 'PJ' quando tem 14."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: data_primeiro_acesso_mecanismo
        description: Primeiro evento observado do agente neste mecanismo.
        tests:
          - not_null
      - name: data_primeiro_acesso_geral
        description: >
          Primeiro evento do agente em QUALQUER mecanismo. É a data que
          define se ele é novo entrante.
        tests:
          - not_null
      - name: ano_primeiro_acesso_geral
        description: Ano de data_primeiro_acesso_geral.
        tests:
          - not_null
      - name: qtd_mecanismos_agente
        description: Em quantos mecanismos distintos o agente já recebeu recurso.
        tests:
          - not_null
      - name: eh_porta_de_entrada
        description: >
          Verdadeiro no mecanismo pelo qual o agente entrou no fomento
          federal. Exatamente uma linha por agente.
        tests:
          - not_null
      - name: categoria_primeiro_acesso
        description: "'Sim' quando esta linha é a porta de entrada do agente; 'Não' caso contrário."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sim', 'Não']
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
      - name: entrada_em_ano_censurado
        description: >
          Verdadeiro quando a entrada caiu no primeiro ano observável daquele
          mecanismo (2023 para LAB/LPG/PNAB). Descritivo: para a LAB isso é
          corte de janela, para LPG e PNAB é o ano de nascimento do programa —
          ver ano_censurado em primeiro_acesso_anual, que separa os dois.
        tests:
          - not_null
