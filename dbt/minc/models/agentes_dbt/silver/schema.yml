version: 2

models:
  - name: pagamentos_bbagil_beneficiarios
    description: >
      Camada Silver — Meta 5 Fase 4. Unifica bbagil_extrato_filtrado e
      bbagil_subtransacoes_filtrado em 1 linha por pagamento real a um
      beneficiário, com programa_fomento (LPG/PNAB/LAB) derivado do código
      curto de programa do BSC. Alimenta eventos_fomento.

      LAB deixou de ser colapsado em PNAB: os códigos SECULT-A BLANC são a
      Lei Aldir Blanc II (Lei 14.399/2022), e a pergunta 2.2 da Meta 5 pede
      os mecanismos separados. A LAB I emergencial (2020-2021) não existe em
      nenhuma fonte do banco.

      Pagamento cujo programa_curto não casa com nenhum dos três padrões sai
      da tabela (programa_fomento NULL é filtrado). É movimentação de conta
      de plano de ação que não é repasse de política do MinC.
    config:
      tags: [silver, agentes, bbagil, meta5, fase4]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — pagamentos do BB Ágil por beneficiário e mecanismo'
        origem_dados: 'bbagil_extrato_filtrado + bbagil_subtransacoes_filtrado'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.AgenteCultural
            - MinC.Politicas.FundoAFundo
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: id_plano_acao
        description: Identificador do plano de ação (ente + programa) dono da conta que fez o pagamento.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: beneficiario_documento
        description: CPF/CNPJ do beneficiário do pagamento, normalizado.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Programa de fomento — 'LPG', 'PNAB' ou 'LAB'. Derivado do
          programa_curto do BSC: 'MINC-LPG%' vira LPG, '%PNAB%' vira PNAB e
          '%A-BLANC%' vira LAB (a comparação normaliza underscore e espaço
          para hífen antes de casar).
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LPG', 'PNAB', 'LAB']
      - name: valor
        description: Valor do pagamento, em reais.
        data_type: numeric
        tests:
          - not_null
      - name: data_pagamento
        description: Data do pagamento.
        data_type: date
        tests:
          - not_null

  - name: eventos_fomento_rouanet
    description: >
      Camada Silver — Meta 5. Um evento por captação real de recurso na Lei
      Rouanet, no mesmo formato dos pagamentos do BB Ágil. O evento é o
      recibo de captação (dinheiro efetivamente captado), não a aprovação do
      projeto: projeto aprovado que nunca captou não deu acesso a recurso
      nenhum, e misturar aprovação com pagamento tornaria a comparação entre
      mecanismos incoerente. Grão: 1 linha por recibo de captação.

      O proponente de cada PRONAC é resolvido por prioridade, com DISTINCT ON:
      sac__projetos vem primeiro (é a ponte natural, com cgccpf), e
      sac__tbapiprojetorouanet entra como segunda opção, pelo nrpronac. As
      duas chegam à mesma chave — anoprojeto || sequencial = nrpronac.

      O PRONAC NÃO leva LPAD: é ano de 2 dígitos seguido de sequencial de
      largura variável, e preencher com zero à esquerda quebra o casamento
      com sac__captacao.
    config:
      tags: [silver, agentes, salic, rouanet, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de captação da Lei Rouanet'
        origem_dados: 'bronze.sac__captacao + bronze.sac__projetos + bronze.sac__tbapiprojetorouanet'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Politicas.Rouanet
            - MinC.Agentes.Proponente
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do proponente. Só existe quando o casamento veio por
          sac__tbapiprojetorouanet — a prioridade 1 (sac__projetos) não traz
          nome e devolve NULL. Não atravessa para eventos_fomento.
        data_type: text
      - name: programa_fomento
        description: Sempre 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ROUANET']
      - name: data_evento
        description: Data do recibo de captação.
        data_type: date
        tests:
          - not_null
      - name: valor
        description: Valor captado no recibo, em reais. Sempre maior que zero.
        data_type: numeric
        tests:
          - not_null
      - name: pronac
        description: >
          PRONAC do projeto que captou — anoprojeto (2 dígitos) concatenado
          ao sequencial, sem preenchimento. Chave de ligação entre o recibo e
          o proponente.
        data_type: text
        tests:
          - not_null

  - name: eventos_fomento_ancine
    description: >
      Camada Silver — um evento por captação de projeto audiovisual registrada
      pela Ancine (`ancine.consulta`), no mesmo formato dos recibos da Rouanet e
      dos pagamentos do BB Ágil, para entrar em eventos_fomento.

      Dois mecanismos, não um: 'FSA' responde literalmente ao que o documento da
      meta nomeia; 'AUDIOVISUAL' carrega Lei do Audiovisual (ART1/ART3/1A/3A),
      FUNCINES e os editais da Ancine. ART25/ART18 ficam de fora porque são
      Rouanet e já entram pelo SALIC, por fonte melhor — incluí-los duplicaria
      evento. Também ficam de fora RENDIMENTOS, CONTRAPARTIDA, OUTRAS FONTES e
      lei estadual/municipal, que não são fomento federal ao agente.

      Armadilhas de formato, as duas medidas nesta tabela: `data_captacao` é
      TEXT no padrão AMERICANO M/D/YYYY ('7/12/2007' é 12 de julho, não 7 de
      dezembro), e `valor_de_captacao` é TEXT no padrão brasileiro ('50.000,00').

      A fonte é quase toda CNPJ — proponente pessoa física é, na prática,
      invisível aqui. É a limitação desta fonte, e empurra na mesma direção de
      todas as outras: pode deixar de revelar um veterano, nunca inventar um.
    config:
      tags: [silver, agentes, ancine, audiovisual, meta5]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de captação do audiovisual federal'
        origem_dados: 'ancine.consulta'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.Proponente
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do proponente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: beneficiario_nome
        description: >
          Nome do proponente como a Ancine registra. Não é usado por nenhum
          modelo a jusante — morre em eventos_fomento.
        data_type: text
      - name: programa_fomento
        description: Mecanismo — 'FSA' ou 'AUDIOVISUAL'.
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FSA', 'AUDIOVISUAL']
      - name: data_evento
        description: Data da captação, convertida do formato americano da origem.
        data_type: date
      - name: valor
        description: Valor captado, convertido do formato brasileiro da origem.
        data_type: numeric
      - name: no_salic
        description: >
          Número do projeto no SALIC anotado pela Ancine. Não vem do SALIC — é
          coluna da própria `ancine.consulta`. Serve de rastreabilidade e não
          atravessa para eventos_fomento.
        data_type: text

  - name: eventos_fomento
    description: >
      Camada Silver — Meta 5. Espinha unificada: um evento por vez que um
      agente cultural recebeu recurso de uma política federal de fomento,
      num formato só. É a tabela que permite perguntar "este agente já havia
      sido contemplado antes?" acima do mecanismo, que é o que a pergunta da
      meta exige. Grão: 1 linha por (documento, mecanismo, data, valor).

      Janelas de observação, muito assimétricas: ROUANET 1993+, AUDIOVISUAL
      2005+, FSA 2011+, LAB/LPG/PNAB 2023+. Por isso a coluna
      ano_inicio_observacao, que a gold usa para marcar os anos censurados à
      esquerda.

      O piso de valor (var limiar_valor_fomento, padrão 375) é aplicado sobre
      o TOTAL do agente naquele mecanismo, não por transação, e só ao BB Ágil
      — é lá que existe resíduo de transação que não é repasse de fomento.
      Rouanet e Ancine não passam pelo piso: lá o evento já é uma captação
      formal.
    config:
      tags: [silver, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — espinha de eventos de acesso a fomento federal'
        origem_dados: 'pagamentos_bbagil_beneficiarios + eventos_fomento_rouanet + eventos_fomento_ancine'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.AgenteCultural
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: CPF (11) ou CNPJ (14) do agente, normalizado com LPAD.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Mecanismo — 'AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB' ou 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: data_evento
        description: Data em que o recurso chegou ao agente.
        data_type: date
        tests:
          - not_null
      - name: ano_evento
        description: Ano civil de data_evento.
        data_type: integer
        tests:
          - not_null
      - name: valor
        description: Valor do evento, em reais.
        data_type: numeric
        tests:
          - not_null
      - name: fonte
        description: "'BB_AGIL', 'SALIC' ou 'ANCINE'."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ANCINE', 'BB_AGIL', 'SALIC']
      - name: ano_inicio_observacao
        description: >
          Primeiro ano em que a fonte daquele mecanismo enxerga qualquer
          coisa: 1993 ROUANET, 2005 AUDIOVISUAL, 2011 FSA, 2023 LAB/LPG/PNAB.
          A gold usa este valor para marcar o ano censurado, em que todo mundo
          parece estreante porque não existe passado observável.
        data_type: integer
        tests:
          - not_null
      - name: tipo_pessoa
        description: "'PF' (11 dígitos) ou 'PJ' (14)."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']

  - name: primeiro_acesso_agentes
    description: >
      Camada Silver — Meta 5. Grão fino do indicador de novos entrantes: uma
      linha por (agente × mecanismo), com a data em que ele entrou naquele
      mecanismo e se aquela entrada foi a porta de entrada dele no fomento
      federal como um todo. Substitui primeiro_pagamento_bancario, que
      comparava datas apenas entre LPG e PNAB — num universo de dois
      programas, "não é novo entrante" só conseguia significar "recebeu o
      outro programa antes", e quem aparecia num programa só era sempre
      classificado como novo. Aqui a comparação é cross-mecanismo de
      verdade, e inclui a Rouanet desde 1993.

      Exatamente uma linha por agente tem eh_porta_de_entrada = true;
      empates de data no mesmo dia são desempatados por ordem de mecanismo
      (ROUANET, AUDIOVISUAL, FSA, LAB, LPG, PNAB) para que ninguém conte duas
      vezes.
    config:
      tags: [silver, agentes, meta5, primeiro_acesso]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — Primeiro Acesso ao Fomento Federal (por agente)'
        origem_dados: 'eventos_fomento (BB Ágil + SALIC + Ancine)'
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier1
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.AgenteCultural
            - MinC.Agentes.PrimeiroAcesso
          customProperties:
            responsavel_negocio: 'Meta 5 - agentes'
    columns:
      - name: beneficiario_documento
        description: >
          CPF (11) ou CNPJ (14) do agente, normalizado com LPAD. Chave de
          ligação com identificadores_contemplados e com as demais fontes de
          evento. NÃO é pseudonimizado — sai em claro, como toda coluna de
          documento neste domínio hoje.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null
      - name: programa_fomento
        description: >
          Mecanismo de fomento — 'AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB'
          ou 'ROUANET'.
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Politicas.LPG
              - MinC.Politicas.PNAB
              - MinC.Politicas.Rouanet
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['AUDIOVISUAL', 'FSA', 'LAB', 'LPG', 'PNAB', 'ROUANET']
      - name: tipo_pessoa
        description: "'PF' quando o documento tem 11 dígitos, 'PJ' quando tem 14."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: data_primeiro_acesso_mecanismo
        description: Primeiro evento observado do agente neste mecanismo.
        data_type: date
        tests:
          - not_null
      - name: data_ultimo_acesso_mecanismo
        description: >
          Último evento observado do agente neste mecanismo. Não entra no
          indicador de primeiro acesso; serve para medir por quanto tempo o
          agente permaneceu naquele mecanismo.
        data_type: date
        tests:
          - not_null
      - name: ano_entrada_mecanismo
        description: >
          Ano de data_primeiro_acesso_mecanismo. É o ano de entrada NESTE
          mecanismo — não confundir com ano_primeiro_acesso_geral, que é o ano
          de entrada no fomento federal. Os dois coincidem só na linha em que
          eh_porta_de_entrada é verdadeiro.
        data_type: integer
        tests:
          - not_null
      - name: data_primeiro_acesso_geral
        description: >
          Primeiro evento do agente em QUALQUER mecanismo. É a data que
          define se ele é novo entrante.
        data_type: date
        tests:
          - not_null
      - name: ano_primeiro_acesso_geral
        description: Ano de data_primeiro_acesso_geral.
        data_type: integer
        tests:
          - not_null
      - name: qtd_mecanismos_agente
        description: Em quantos mecanismos distintos o agente já recebeu recurso.
        data_type: bigint
        tests:
          - not_null
      - name: qtd_eventos
        description: >
          Quantos eventos de fomento o agente teve neste mecanismo. Um
          pagamento parcelado conta várias vezes — é contagem de lançamento,
          não de projeto nem de contrato.
        data_type: bigint
        tests:
          - not_null
      - name: valor_total
        description: >
          Soma dos valores dos eventos do agente neste mecanismo, em reais.
          Já reflete o piso de eventos_fomento (var limiar_valor_fomento),
          que descarta o agente inteiro do mecanismo quando o total fica
          abaixo dele — nenhuma linha aqui tem total abaixo do piso no BB Ágil.
        data_type: numeric
        tests:
          - not_null
      - name: eh_porta_de_entrada
        description: >
          Verdadeiro no mecanismo pelo qual o agente entrou no fomento
          federal. Exatamente uma linha por agente.
        data_type: boolean
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
      - name: categoria_primeiro_acesso
        description: "'Sim' quando esta linha é a porta de entrada do agente; 'Não' caso contrário."
        data_type: text
        meta:
          openmetadata:
            glossary:
              - MinC.Agentes.PrimeiroAcesso
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sim', 'Não']
      - name: entrada_em_ano_censurado
        description: >
          Verdadeiro quando a entrada caiu no primeiro ano observável daquele
          mecanismo (2023 para LAB/LPG/PNAB). Descritivo: para a LAB isso é
          corte de janela, para LPG e PNAB é o ano de nascimento do programa —
          ver ano_censurado em primeiro_acesso_anual, que separa os dois.
        data_type: boolean
        tests:
          - not_null
