version: 2

models:
  - name: controledeacesso__sgcacesso
    description: >
      Tabela responsável por armazenar os dados de acesso dos usuários, incluindo
      identificação, CPF, senha, e situação do cadastro. Camada bronze tipada a partir de
      salic_bronze.controledeacesso__sgcacesso.
    columns:
      - name: idusuario
        description: >
          [NÃO VERIFICADO] Coluna ausente do dicionário de dados original.
        data_type: integer
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: cpf
        description: >
          [NÃO VERIFICADO] Coluna ausente do dicionário de dados original.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null   # inferido do perfil do banco
          - unique   # inferido do perfil do banco
      - name: nome
        description: >
          [NÃO VERIFICADO] Coluna ausente do dicionário de dados original.
        data_type: text
        meta:
          openmetadata:
