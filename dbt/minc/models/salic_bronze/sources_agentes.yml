version: 2
sources:
  - name: bronze_agentes
    schema: salic_bronze
    description: >
      Registro de identidade de agentes (pessoas físicas e jurídicas), compartilhado com outros
      domínios do MinC além do SALIC (ex.: LPG, PNAB). Camada bronze (dados brutos do SALIC,
      réplica do sistema de origem via Airflow, sem tratamento). Descrições e tiers gerados
      automaticamente a partir do dicionário de dados original do SALIC (export SchemaSpy) cruzado
      com o levantamento estatístico do bronze — ver dbt/minc/docs/salic/ para o catálogo completo
      (YAML semântico, dicionário e catálogo em DOCX/HTML).
