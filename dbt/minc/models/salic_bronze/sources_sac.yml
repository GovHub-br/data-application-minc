version: 2
sources:
  - name: bronze_sac
    schema: salic_bronze
    description: >
      Núcleo do SALIC (Sistema de Apoio às Leis de Incentivo à Cultura) — projetos culturais
      incentivados, proponentes, captação de recursos, editais, prestação de contas, pareceres
      e patrocínio (Lei Rouanet e leis correlatas de incentivo fiscal à cultura). Camada bronze
      (dados brutos do SALIC, réplica do sistema de origem via Airflow, sem tratamento). Descrições
      e tiers gerados automaticamente a partir do dicionário de dados original do SALIC (export
      SchemaSpy) cruzado com o levantamento estatístico do bronze — ver dbt/minc/docs/salic/
      para o catálogo completo (YAML semântico, dicionário e catálogo em DOCX/HTML).
    tables:
      - name: sac__aberturadecontabancaria
        description: >
          Tabela responsável por armazenar informações sobre a abertura de contas bancárias
          vinculadas aos projetos, incluindo status da conta, datas de liberação/bloqueio, órgão
          responsável e identificação do projeto.
        config:
          tags:
            - bronze
            - salic
            - sac
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: anoprojeto
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): char(2).
            data_type: text
            tests:
              - not_null
          - name: sequencial
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): varchar(5).
            data_type: text
            tests:
              - not_null
          - name: contabloqueada
            description: >
              0.Não;1.Sim Tipo original (SQL Server): bit(1).
            data_type: text
          - name: dtcontabloqueada
            description: >
              [não documentado no dicionário de dados original do SALIC] Tipo original (SQL
              Server): datetime(16,3).
            data_type: text
          - name: contalivre
