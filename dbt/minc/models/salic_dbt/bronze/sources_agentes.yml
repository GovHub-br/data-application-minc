version: 2
sources:
  - name: bronze_agentes
    schema: salic_bronze
    description: >
      Registro de identidade de agentes (pessoas físicas e jurídicas), compartilhado com outros
      domínios do MinC além do SALIC (ex.: LPG, PNAB). Camada bronze (dados brutos do SALIC,
      réplica do sistema de origem via Airflow, sem tratamento). Descrições e tiers gerados
      automaticamente a partir do dicionário de dados original do SALIC (export SchemaSpy) cruzado
      com o levantamento estatístico do bronze — ver dbt/minc/docs/salic/ para o catálogo completo
      (YAML semântico, dicionário e catálogo em DOCX/HTML).
    tables:
      - name: agentes__municipios
        description: >
          Tabela de domínio geográfico: município IBGE, sua UF, meso e
          microrregião. Camada bronze (raw do SALIC via Trino, tudo text).
        config:
          tags: [bronze, salic, agentes]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idmunicipioibge
            description: Código IBGE do município (6 dígitos). Chave da tabela.
            data_type: text
          - name: idufibge
            description: Código IBGE da UF (2 dígitos).
            data_type: text
          - name: idmeso
            description: Código da mesorregião.
            data_type: text
          - name: idmicro
            description: Código da microrregião.
            data_type: text
          - name: descricao
            description: Nome do município.
            data_type: text
          - name: _fatia
            description: Coluna técnica da ingestão por fatias (ADR 0005). Não é campo de negócio.
            data_type: text

      - name: agentes__populacaomunicipio
        description: >
          População por município. Camada bronze (raw do SALIC via Trino, tudo
          text).
        config:
          tags: [bronze, salic, agentes]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: idmunicipio
            description: Código IBGE do município (6 dígitos). Chave da tabela.
            data_type: text
          - name: idmunicipio7
            description: Código IBGE do município (7 dígitos, com dígito verificador).
            data_type: text
          - name: populacao
            description: População do município.
            data_type: text
          - name: _fatia
            description: Coluna técnica da ingestão por fatias (ADR 0005). Não é campo de negócio.
            data_type: text

      - name: agentes__uf
        description: >
          Unidades federativas com sigla, nome e região. Ingerida em 2026-09-04.
          Complementa `agentes__municipios` em `dim_municipio_ibge` — é onde estão a
          sigla e a região, que a tabela de municípios não carrega.
        config:
          tags: [bronze, salic, agentes]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: iduf
            description: Código IBGE da unidade federativa.
            data_type: text
          - name: sigla
            description: Sigla de duas letras.
            data_type: text
          - name: descricao
            description: Nome da unidade federativa.
            data_type: text
          - name: regiao
            description: Região geográfica.
            data_type: text
      - name: agentes__vpais
