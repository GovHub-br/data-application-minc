      - name: sac__situacao
        identifier: bronze_sac_situacao
        description: >
          Tabela de domínio das situações de tramitação de um projeto: o código
          (A01, K00, ...) e sua descrição. É a ponta de sac__projetos.situacao.
          Camada bronze (raw do SALIC via Trino, tudo text).
        config:
          tags: [bronze, salic, sac]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: codigo
            description: Código da situação (3 caracteres, ex. A01). Chave da tabela.
            data_type: text
          - name: descricao
            description: Descrição da situação.
            data_type: text
          - name: areaatuacao
            description: Letra da área de atuação. ~55% preenchida.
            data_type: text
          - name: statusprojeto
            description: Flag de status (bit 0/1).
            data_type: text
          - name: _fatia
            description: Coluna técnica da ingestão por fatias (ADR 0005). Não é campo de negócio.
            data_type: text

      - name: sac__tbapiaprovacoes
        identifier: bronze_sac_tbapiaprovacoes
        description: >
          Uma linha por aprovação/prorrogação do projeto, publicada pela API
          pública do SALIC: portaria, datas de captação e valor aprovado. Camada
          bronze (raw do SALIC via Trino, tudo text).
        config:
          tags: [bronze, salic, sac]
        meta:
          openmetadata:
            tier: Tier.Tier4
            domain: Cultura.Incentivo Fiscal
            owner: minc-data-engineering
        columns:
          - name: id
            description: Identificador da linha na API. Chave da tabela.
            data_type: text
          - name: idaprovacao
            description: Identificador da aprovação.
            data_type: text
          - name: idpronac
            description: Identificador interno do PRONAC.
            data_type: text
          - name: nrpronac
            description: Número PRONAC (zero à esquerda).
            data_type: text
          - name: nmprojeto
            description: Nome do projeto.
            data_type: text
          - name: dsarea
            description: Área cultural (descrição).
            data_type: text
          - name: dssegmento
            description: Segmento cultural (descrição).
            data_type: text
          - name: tpaprovacao
            description: Tipo de aprovação (Aprovação Inicial, Prorrogação, ...).
            data_type: text
          - name: resumoaprovacao
            description: Resumo/parecer da aprovação. Texto longo.
            data_type: text
          - name: portariaaprovacao
            description: Número da portaria de aprovação (ex. 0004/11).
            data_type: text
          - name: dtportariaaprovacao
            description: Data da portaria (AAAA-MM-DD).
            data_type: text
          - name: dtpublicacaoaprovacao
            description: Data de publicação da portaria (AAAA-MM-DD).
            data_type: text
          - name: dtiniciocaptacao
            description: Início do período de captação. ~96% preenchida.
            data_type: text
          - name: dtfimcaptacao
            description: Fim do período de captação. ~96% preenchida.
            data_type: text
          - name: vlaprovado
            description: Valor aprovado, em reais.
            data_type: text
          - name: hashregistro
            description: Hash SHA (hex) do registro na API.
            data_type: text
          - name: dtatualizacao
            description: Instante da carga do registro pela API.
            data_type: text
          - name: _fatia
            description: Coluna técnica da ingestão por fatias (ADR 0005). Não é campo de negócio.
            data_type: text
