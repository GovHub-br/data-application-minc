version: 2
sources:
  - name: bronze_sac
    schema: salic
    description: >
      Núcleo do SALIC (Sistema de Apoio às Leis de Incentivo à Cultura) — projetos culturais
      incentivados, proponentes, captação de recursos, editais, prestação de contas, pareceres
      e patrocínio (Lei Rouanet e leis correlatas de incentivo fiscal à cultura). Camada bronze
      (dados brutos do SALIC, réplica do sistema de origem via Airflow, sem tratamento). Descrições
      e tiers gerados automaticamente a partir do dicionário de dados original do SALIC (export
      SchemaSpy) cruzado com o levantamento estatístico do bronze — ver dbt/minc/docs/salic/
      para o catálogo completo (YAML semântico, dicionário e catálogo em DOCX/HTML).
