  - name: silver_subtransacao_bbagil
    description: >
      Camada Silver / BB Ágil. Sublançamentos das transações do extrato que
      se desdobram em vários pagamentos, com todas as colunas da API.

      GRÃO: uma linha por sublançamento; a chave da origem é
      (id_plano_acao, id_transacao_pai, id). UNIVERSO: todo sublançamento,
      de qualquer status, das transações-mãe com subtransactionquantity > 0
      que a DAG do BB Ágil extraiu.

      PARA QUE SERVE: é a base de silver_pagamento_subtransacao_bbagil. Numa
      transação desdobrada, o beneficiário real só aparece aqui, não no
      extrato.

      TIPAGEM: lida de bronze_subtransacao_bbagil. As 33 colunas ficam como
      texto: o padrão do dado não pôde ser medido no perfilamento, e sem
      medida não se tipa. Data e valor chegam como texto e são convertidos
      em silver_pagamento_subtransacao_bbagil.

      LIMITAÇÕES: o BB Ágil só enxerga contas administradas pelo Banco do
      Brasil. O sinal do valor indica o lado da partida dobrada, não
      devolução.

      ZONA RESTRITA. Carrega documento, nome, agência e conta do
      beneficiário em claro: não publicável e proibida em corpus de RAG. A
      anonimização no momento do acesso é responsabilidade do Apache Ranger
      (ADR 0009).

      ATUALIZAÇÃO: view sobre a bronze; reflete os sublançamentos carregados
      no momento da consulta.
