  - name: silver_controle_extracao_bbagil_extrato
    description: >
      Camada Silver / BB Ágil. Controle da extração do extrato bancário:
      cada tentativa da DAG de buscar o extrato de uma conta num período, com
      o resultado.

      GRÃO: uma linha por (plano de ação × conta × período tentado).
      UNIVERSO: toda tentativa registrada pela extração do extrato, com
      sucesso ou com erro.

      PARA QUE SERVE: auditoria e retomada da extração — saber o que já foi
      buscado, com que resultado e quantas transações vieram. Não é dado de
      fomento e não entra na Meta 5.

      TIPAGEM: lida de bronze_controle_extracao_bbagil_extrato. 5 das 7
      colunas recebem cast; o cast vem do padrão medido no dado
      (scripts/perfilar_padroes.py), não do nome da coluna, e exige 100% dos
      valores preenchidos casando.

      LIMITAÇÕES: registra a tentativa, não o conteúdo do extrato. Uma conta
      sem linha aqui não foi tentada; uma conta com status de erro pode ter
      extrato parcial.

      ATUALIZAÇÃO: view sobre a bronze; reflete a tabela de controle no
      momento da consulta.
    config:
      tags:
        - silver
        - bbagil
      meta:
        status: Active
        meta_objetivo: 'Auditoria da extração do extrato do BB Ágil'
        origem_dados: 'bronze_controle_extracao_bbagil_extrato'
        governance:
          produto_dados: 'BB Ágil — pagamentos'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Repasse Federativo
          tier: Tier.Tier4
          owner: minc-data-engineering
    columns:
      - name: id_plano_acao
        description: >
          Tipagem: 100% dos 931528 valores casam com inteiro.
        data_type: integer
      - name: id_plano_acao_dado_bancario
        description: >
          Conta bancaria consultada, parte da chave do checkpoint. Acrescentada
          junto com a mudanca de chave de 03/09/2026.
        data_type: integer
      - name: periodo_inicial
        description: >
          Tipagem: 100% dos 931528 valores casam com data.
        data_type: date
      - name: periodo_final
        description: >
          Tipagem: 100% dos 931528 valores casam com data.
        data_type: date
      - name: status
        description: >
          Tipagem: valores heterogeneos.
        data_type: text
      - name: qtd_transacoes
        description: >
          Tipagem: 100% dos 931528 valores casam com inteiro.
        data_type: integer
      - name: mensagem_erro
        description: >
          Tipagem: valores heterogeneos.
        data_type: text

  - name: silver_controle_extracao_bbagil_subtransacoes
    description: >
      Camada Silver / BB Ágil. Controle da extração dos sublançamentos:
      cada tentativa da DAG de buscar as subtransações de uma transação-mãe,
      com o resultado.

      GRÃO: uma linha por (plano de ação × conta × transação-mãe tentada).
      UNIVERSO: toda tentativa registrada pela extração dos sublançamentos,
      com sucesso ou com erro.

      PARA QUE SERVE: auditoria e retomada da extração — saber quais
      transações-mãe já tiveram os sublançamentos buscados e com que
      resultado. Não é dado de fomento e não entra na Meta 5.

      TIPAGEM: lida de bronze_controle_extracao_bbagil_subtransacoes. As 6
      colunas ficam como texto: o padrão do dado não pôde ser medido no
      perfilamento, e sem medida não se tipa.

      LIMITAÇÕES: registra a tentativa, não o conteúdo dos sublançamentos.
      Os identificadores chegam como texto, então junção com as tabelas
      tipadas exige cast.

      ATUALIZAÇÃO: view sobre a bronze; reflete a tabela de controle no
      momento da consulta.
    config:
      tags:
        - silver
        - bbagil
      meta:
        status: Active
        meta_objetivo: 'Auditoria da extração dos sublançamentos do BB Ágil'
        origem_dados: 'bronze_controle_extracao_bbagil_subtransacoes'
        governance:
          produto_dados: 'BB Ágil — pagamentos'
          classificacao_uso: interno
          rag_publication: eligible_after_security_validation
        openmetadata:
          domain: Cultura.Repasse Federativo
          tier: Tier.Tier4
          owner: minc-data-engineering
    columns:
      - name: id_plano_acao
        description: >
          Tipagem: tabela sem permissao de leitura para esta role: o padrao do dado nao pode
          ser medido, entao nao se tipa.
        data_type: text
      - name: id_plano_acao_dado_bancario
