  - name: silver_extrato_bbagil
    description: >
      Camada Silver / BB Ágil. Extrato bancário das contas dos planos de ação
      administradas no BB Gestão Ágil, tipado, com todas as colunas da API.

      GRÃO: uma linha por transação do extrato; a chave da origem é
      (id_plano_acao, id_plano_acao_dado_bancario, id). UNIVERSO: todo
      lançamento, débito e crédito, das contas extraídas pela DAG do BB
      Ágil, sem filtro.

      PARA QUE SERVE: é a base de silver_pagamento_extrato_bbagil e a
      transação-mãe de silver_pagamento_subtransacao_bbagil. Não limpa nem
      recorta — só tipa.

      TIPAGEM: lida de bronze_extrato_bbagil. 22 das 42 colunas recebem
      cast; o cast vem do padrão medido no dado (scripts/perfilar_padroes.py),
      não do nome da coluna, e exige 100% dos valores preenchidos casando.
      beneficiarydocumentid fica texto mesmo casando com inteiro: é CPF/CNPJ,
      identificador e não número, e como integer perdia o zero à esquerda.

      LIMITAÇÕES: o BB Ágil só enxerga contas administradas pelo Banco do
      Brasil; pagamento que o ente fez por outro banco não aparece. A
      extração começa em 2023.

      ZONA RESTRITA. Carrega documento, nome, agência e conta do
      beneficiário em claro: não publicável e proibida em corpus de RAG. A
      anonimização no momento do acesso é responsabilidade do Apache Ranger
      (ADR 0009).

      ATUALIZAÇÃO: view sobre a bronze; reflete o extrato carregado no
      momento da consulta.
    config:
      tags:
        - silver
        - bbagil
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — extrato bancário das contas do fomento direto (base)'
        origem_dados: 'bronze_extrato_bbagil'
        governance:
