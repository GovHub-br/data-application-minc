  - name: silver_pagamento_extrato_bbagil
    description: >
      Camada Silver / BB Ágil. Lançamentos do extrato bancário do BB Gestão
      Ágil, débito e crédito, sem subtransação e com beneficiário informado.
      Lê silver_extrato_bbagil e só limpa.

      GRÃO: uma linha por transação do extrato; a chave da origem é
      (id_plano_acao, id_plano_acao_dado_bancario, id). UNIVERSO: as
      transações de silver_extrato_bbagil com beneficiário informado e sem
      subtransação.

      PARA QUE SERVE: é o lado do extrato de silver_pagamento_bbagil, que
      alimenta a Meta 5.

      POR QUE A TRANSAÇÃO DESDOBRADA FICA DE FORA: nas transações com
      subtransactionquantity > 0, o beneficiário real só aparece no
      sublançamento, e quem as traz é silver_pagamento_subtransacao_bbagil.
      Trazê-las aqui contaria o mesmo dinheiro duas vezes.

      O QUE NÃO É DECIDIDO AQUI: o que é pagamento efetivo — o crédito fica,
      com creditdebitindicator e a chave do pareamento (conta, documento
      bruto, valor), e a Gold eixo2_meta5_evento_fomento descarta os dois
      lados de um estorno e fica só com o débito. Quem conta como pagamento
      a agente cultural também não: repasse a ente público, devolução ao
      FNC, transferência ao Banco do Brasil e lançamento interno continuam
      na tabela, para a Gold filtrar.

      LIMITAÇÕES: o BB Ágil só enxerga contas administradas pelo Banco do
      Brasil, e a extração começa em 2023.

      ZONA RESTRITA. Carrega documento e nome do beneficiário em claro: não
      publicável e proibida em corpus de RAG. A anonimização no momento do
      acesso é responsabilidade do Apache Ranger (ADR 0009).

      ATUALIZAÇÃO: table, recalculada a cada `dbt build`; não há carga
      incremental.
    config:
      tags: [silver, bbagil]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — lançamentos do extrato do fomento direto, limpos'
        origem_dados: 'silver_extrato_bbagil'
        governance:
          produto_dados: 'BB Ágil — pagamentos'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier3
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Politicas.FundoAFundo
    columns:
      - name: id_plano_acao
        description: >
          Identificador do plano de ação (ente + programa) dono da conta.
        data_type: integer
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
        tests:
          - not_null
      - name: id_plano_acao_dado_bancario
        description: >
          Identificador da conta bancária no Transferegov. Um plano de ação
          tem mais de uma conta (os da LPG têm duas) e cada uma é consultada
          separadamente no BB Ágil — por isso a conta faz parte da chave da
          tabela raw, do join com as subtransações e da detecção de estorno.
        data_type: integer
        tests:
          - not_null
      - name: id
        description: >
          Identificador da transação no extrato. Usado por
          silver_pagamento_subtransacao_bbagil para achar a transação-mãe
          (id_transacao_pai = id, dentro da mesma conta).
        data_type: bigint
        tests:
          - not_null
      - name: programa_curto
        description: >
          Código do programa como o BSC devolve (governmentprogramname — ex.
          'MINC-LPG-MUNI-AUD', 'MINC-PNAB-2023', 'SECULT-A BLANC-MUN'). Sem
          classificação: o mapeamento para política de fomento é regra de
          produto e fica na Gold.
        data_type: text
      - name: beneficiario_documento_bruto
        description: >
          CPF/CNPJ do beneficiário como a origem devolve, sem zero à esquerda.
          É a forma em que os códigos especiais aparecem ('191' é o Banco do
          Brasil, '3793086100189' o Fundo Nacional de Cultura).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
        tests:
          - not_null
      - name: beneficiario_documento
        description: >
          CPF/CNPJ do beneficiário, normalizado (LPAD por
          beneficiarypersontype — 11 dígitos p/ CPF, 14 p/ CNPJ).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          # nulo quando beneficiarypersontype não é 1 nem 2; a linha fica
          # para o pareamento de estorno, e a Gold a descarta depois
          - not_null:
              config:
                severity: warn
      - name: beneficiario_nome
        description: >
          Nome do beneficiário, como o BSC devolve. É nele que a Gold reconhece
          repasse a ente público (MUNICIPIO, ESTADO, FUNDO, SECRETARIA, SEFAZ).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: descriptionname
        description: >
          Descrição do lançamento no extrato. É nela que a Gold reconhece
          lançamento interno da conta (aplicação, resgate, imposto, ordem
          bancária cancelada).
        data_type: text
      - name: creditdebitindicator
        description: >
          'D' (débito, saída de dinheiro da conta) ou 'C' (crédito). A Gold
          usa para parear estorno e para ficar só com o débito.
        data_type: text
      - name: valor
        description: >
          Valor do lançamento, em reais, como a origem registra.
        data_type: numeric
        tests:
          # nulo quando o valor da origem está fora do padrão numérico; aviso
          # para conferir a origem, e a Gold não conta o evento
          - not_null:
              config:
                severity: warn
      - name: data_pagamento
        description: >
          Data do lançamento, convertida para DATE.
        data_type: date
        tests:
          # nulo quando a data está vazia ou não é data de calendário
          # (macro data_texto); a Gold descarta depois de parear o estorno
          - not_null:
              config:
                severity: warn

  - name: silver_pagamento_subtransacao_bbagil
    description: >
      Camada Silver / BB Ágil. Sublançamentos do BB Gestão Ágil das
      transações-mãe desdobradas (subtransactionquantity > 0), com
