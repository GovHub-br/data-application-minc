  - name: silver_pagamento_bbagil
    description: >
      Camada Silver / BB Ágil. Os movimentos de dinheiro com beneficiário
      informado das contas do fomento direto, do extrato e dos
      sublançamentos numa tabela só, com tipo_lancamento dizendo de qual
      lado a linha veio.

      GRÃO: uma linha por movimento de dinheiro. UNIVERSO: a união de
      silver_pagamento_extrato_bbagil e silver_pagamento_subtransacao_bbagil,
      sem sobreposição entre elas.

      PARA QUE SERVE: é a entrada do BB Ágil (LPG, PNAB e LAB) na Meta 5, via
      int_ancine_bbagil_salic.

      O QUE NÃO É DECIDIDO AQUI: não decide o que é pagamento efetivo
      (estorno, só débito, status 'Pago'), não classifica programa nem
      decide quem conta como agente cultural. As linhas saem como a limpeza
      deixou, com as colunas que a Gold usa para essas decisões.

      LIMITAÇÕES: o BB Ágil só enxerga contas administradas pelo Banco do
      Brasil, e a extração começa em 2023 — a Aldir Blanc emergencial de
      2020-2021 não está aqui.

      ZONA RESTRITA. Carrega documento e nome do beneficiário em claro: não
      publicável e proibida em corpus de RAG. A anonimização no momento do
      acesso é responsabilidade do Apache Ranger (ADR 0009).

      ATUALIZAÇÃO: table, recalculada a cada `dbt build`; não há carga
      incremental.
    config:
      tags: [silver, bbagil]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — pagamentos do fomento direto, extrato e sublançamento juntos'
        origem_dados: 'silver_pagamento_extrato_bbagil + silver_pagamento_subtransacao_bbagil'
        governance:
          produto_dados: 'BB Ágil — pagamentos'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes: [status_prestacao_contas]
