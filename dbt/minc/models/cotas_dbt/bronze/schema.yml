version: 2

models:
  - name: stg_bbagil
    description: >
      [MODELO DESABILITADO — config(enabled=false)] Aguarda a DAG
      extracao_bbagil_dag rodar com sucesso (hoje falha na autenticação SCA por
      SCA_TOKEN_URL vazio no .env); reativar (enabled=true) quando
      bsc_pnab.fato_bbagil existir.

      Lado-valor via extrato bancário (BB Gestão Ágil/SERPRO): mede o valor
      efetivamente PAGO ao beneficiário final (pessoa), não o repasse a entes
      públicos. Fonte já vem agregada e filtrada na origem (grão ente+documento,
      só débito ao beneficiário, sem repasse entre entes públicos, valores ≥R$375).

      Por que importa: fct_pagamentos_elegiveis (lado das listas de contemplados)
      mede valor RECEBIDO pelos entes (~R$2,7bi, painel "recebido"); o bbágil mede
      o valor GASTO/pago às pessoas (~R$447mi, painel "gasto") — o denominador
      correto para as cotas. O documento do beneficiário vem real (não mascarado),
      normalizado pela mesma macro normaliza_documento usada em
      perfil_agentes_normalizado, garantindo join direto e consistente entre as
      duas bases.

    config:
      tags: [bronze, cotas, pnab, bbagil]
      meta:
        status: Disabled
        openmetadata:
          tier: "Tier.Tier3"
          owner: "minc-data-engineering"
          domain: "Cultura.Fomento Direto"
          tags: ["Certification.Bronze", "PII.Sensitive"]
          customProperties:
            responsavel_negocio: "Meta 3 - cotas"

    columns:
      - name: ente_bbagil
        description: >
          Ente federado (município/estado) titular da conta no BB Gestão Ágil.
          Chave de junção com bbagil_ente_ano, que traz ano e código IBGE.
        data_type: text

      - name: identificador_unico
        description: >
          CPF/CNPJ do beneficiário final normalizado por normaliza_documento —
          a MESMA macro usada em perfil_agentes_normalizado, o que garante
          casamento maçã com maçã entre extrato bancário e perfil.
        data_type: text
        meta:
          openmetadata:
            glossary: ["MinC.Identificadores.IdentificadorUnico"]
            tags: ["PII.Sensitive"]

      - name: documento_raw
        description: >
          Documento do beneficiário exatamente como veio do extrato, antes da
          normalização. Preservado para auditoria do casamento.
        data_type: text
        meta:
          openmetadata:
            tags: ["PII.Sensitive"]

      - name: chave_anonimizada
        description: True quando o documento do extrato contém máscara ('*').
        data_type: boolean

      - name: valor_pago_num
        description: >
          Valor da transação convertido por parse_valor. Diferente do lado das
          listas, aqui é o valor EFETIVAMENTE PAGO à pessoa — o denominador
          correto para as cotas quando o modelo for reativado.
        data_type: numeric
        meta:
          openmetadata:
