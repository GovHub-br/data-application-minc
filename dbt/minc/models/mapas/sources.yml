version: 2

sources:
  - name: mapas
    schema: mapas
    description: >
      Mapas Culturais (Hacklab) — cadastro de agentes, espaços, eventos,
      oportunidades e inscrições. Bronze: cópia fiel do banco da plataforma,
      sem tipagem nem regra de negócio, gravada pela DAG
      `mapas_ingestion_trino` como `mapas.bronze_<tabela>`. Toda coluna é
      `varchar`, mais a coluna técnica `_fatia`.

      O Mapas não passa pelo MinIO (camada Raw): a origem já é um banco de
      dados, então a DAG lê dele direto pelo Trino. Só o schema `public` da
      origem é ingerido, sem as tabelas descritas no ADR 0008.

      Esta fonte é distinta de `dados_mapa_cultura`, a cópia antiga do Mapas, que
      não está ligada a nenhum modelo.
    tables:
      - name: bronze_agent
        description: >
          Agentes culturais (pessoa física ou coletivo). 17 colunas na origem.
          Chave: `id`. `location` chega como texto do `point` do PostgreSQL
          ("(x,y)") e `_geo_location` como o hexadecimal EWKB do `geography`.
        meta:
          used: true
      - name: bronze_agent_meta
        description: >
          Atributos dos agentes no formato chave-valor: uma linha por
          (`object_id`, `key`). Chave: `id`. É onde ficam campos como
          documento e autodeclaração, e por isso contém dado pessoal.
        meta:
          used: true
      - name: bronze_agent_relation
        description: >
          Relação de um agente com outro objeto do Mapas (inscrição, espaço,
          projeto etc.), com o tipo do objeto em `object_type`. Chave: `id`.
        meta:
          used: true
      - name: bronze_usr
        description: >
          Usuários da plataforma. Chave: `id`. `agent.user_id` aponta para cá.
          A origem tem também `auth_uid` e `email`, que NÃO são levados para a
          silver por serem identificadores pessoais sem uso analítico.
        meta:
          used: true
      - name: bronze_chat_message
        description: >
          Cópia fiel de `public.chat_message` do Mapas (6 colunas na origem; mensagens do chat da plataforma, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_chat_thread
        description: >
          Cópia fiel de `public.chat_thread` do Mapas (9 colunas na origem; conversas do chat, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_cultbr_request_log
        description: >
          Cópia fiel de `public.cultbr_request_log` do Mapas (8 colunas na origem; registro das chamadas à integração CultBR, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_cultbr_request_log_attempt
        description: >
          Cópia fiel de `public.cultbr_request_log_attempt` do Mapas (14 colunas na origem; tentativas de cada chamada à integração CultBR, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_db_update
        description: >
          Cópia fiel de `public.db_update` do Mapas (2 colunas na origem; controle das atualizações de banco já aplicadas, inferido do nome).
          Chave: `name`.
        meta:
          used: true
      - name: bronze_evaluation_method_configuration
        description: >
          Cópia fiel de `public.evaluation_method_configuration` do Mapas (6 colunas na origem; configuração do método de avaliação de uma oportunidade, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_evaluationmethodconfiguration_meta
        description: >
          Cópia fiel de `public.evaluationmethodconfiguration_meta` do Mapas (4 colunas na origem; atributos da configuração do método de avaliação, em chave-valor, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_event
        description: >
          Cópia fiel de `public.event` do Mapas (13 colunas na origem; eventos, inferido do nome).
          Chave: `id`.
        meta:
          used: true
      - name: bronze_event_attendance
        description: >
          Cópia fiel de `public.event_attendance` do Mapas (10 colunas na origem; presenças confirmadas em ocorrências de eventos, inferido do nome).
          Chave: `id`.
        meta:
