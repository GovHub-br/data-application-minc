      - name: bronze_event_occurrence_cancellation
        description: >
          Cópia fiel de `public.event_occurrence_cancellation` do Mapas (3 colunas na origem; cancelamentos de ocorrências de eventos, inferido do nome).
          Chave: `id`.
        meta:
