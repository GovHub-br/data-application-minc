version: 2

sources:
  - name: transferegov
    schema: transferegov
    tables:
      - name: programa_minc
      - name: plano_acao_minc
      - name: plano_acao_meta_minc
      - name: plano_acao_dado_bancario_minc
      - name: relatorios_gestao
      - name: anexos_relatorios
      # Território IBGE CD2022 (setor->FCU->município->UF) p/ 4ª cota territorial
      - name: territorio_fcu_setores

  # As planilhas dos relatórios de gestão. Antes eram ~15 tabelas, uma por aba
  # ou template do Excel; agora são seis, três por política. Qual aba/template
  # deu origem à linha está em `tabela_origem` e `aba_origem` — é por
  # `tabela_origem` que os modelos filtram a fatia que antes era uma tabela.
  - name: relatorio_gestao
    schema: relatorio_gestao
    tables:
      - name: planilha_contemplados_lpg
      - name: planilha_editais_lpg
      # Perfil LPG (autodeclaração raça/PCD) e abas de instrumentos vivem aqui,
      # separados por tabela_origem (lpg_dados_pessoa_fisica, lpg_dados_*).
      - name: planilha_dados_lpg
      - name: planilha_contemplados_pnab_ciclo_1
      - name: planilha_editais_pnab_ciclo_1
      # Perfil PNAB (raça/PCD + CPF/CNPJ real): tabela_origem = pnab_pessoas
      # ou pnab_organizacoes.
      - name: planilha_dados_pnab_ciclo_1

  - name: bbagil
    schema: bbagil
    tables:
      # Declarada só para `stg_bbagil` continuar parseando: a tabela não é mais
      # produzida por ninguém (a DAG parou de gerar o fato_bbagil) e o modelo
      # que a lê está enabled=false. Sai junto com o modelo, quando ele for
      # reescrito sobre extrato_bbagil.
      - name: fato_bbagil
      - name: extrato_bbagil
        description: >
          Uma linha por transacao do extrato bancario do BB Gestao Agil
          (orgao de controle), persistida por ``extracao_bbagil_dag`` direto
          da resposta da API do BSC/SERPRO.
      - name: subtransacao_bbagil
        description: >
          Uma linha por sub-lancamento das transacoes com
          ``subtransactionquantity`` > 0, persistida por
          ``extracao_bbagil_dag``.

  - name: ancine
    schema: ancine
    tables:
      - name: consulta
        description: >
          Captacao de projetos audiovisuais registrada pela Ancine, uma linha
          por aporte: ``cnpj_proponente`` e quem RECEBEU, ``cnpj_investidor``
          quem aportou (mesma estrutura da captacao da Rouanet). Cobre 17
          mecanismos de 2005 a 2026, entre eles o FSA e a Lei do Audiovisual.
          ARMADILHAS DE FORMATO: ``data_captacao`` e TEXT no padrao americano
          (``7/12/2007`` e 12 de julho) e ``valor_de_captacao`` vem como
          ``50.000,00``. ART25/ART18 sao Rouanet e NAO devem ser usados aqui —
          ja entram pelo SALIC, por uma fonte melhor.

  # SALIC (Lei Rouanet) — ingestao do SQL Server do MinC para o schema bronze.
  # Rastreada por ``control.salic_ingestion_log``. So as tres tabelas abaixo
  # sao usadas pela Meta 5; o resto da base (1.000+ tabelas) nao entra aqui.
  - name: salic
    schema: bronze
    tables:
      - name: sac__projetos
        description: >
          Cadastro oficial do projeto, com CPF/CNPJ do proponente
          (``cgccpf``) e o PRONAC em duas colunas (``anoprojeto`` +
          ``sequencial``). Carregada em 19/08/2026, depois de meses falhando
          na ingestao. E a fonte primaria de proponente: cobre 100% dos
          recibos validos de ``sac__captacao``.
      - name: sac__tbapiprojetorouanet
        description: >
          Espelho da API publica: um projeto Rouanet por linha, com CPF/CNPJ
          do proponente (``nrcnpjcpf``) e PRONAC (``nrpronac``). Foi a unica
          ponte disponivel ate 19/08/2026 e segue como reserva — cobre 99,86%
          dos recibos e concorda com ``sac__projetos`` em 100,00% dos 195.240
          projetos que ambas resolvem.
      - name: sac__captacao
        description: >
          Um recibo de captacao por linha (dinheiro efetivamente captado
          pelo projeto junto a um incentivador). Liga a
          ``sac__tbapiprojetorouanet`` por ``anoprojeto || sequencial =
          nrpronac``. ``cgccpfmecena`` e o incentivador, NAO o proponente.
