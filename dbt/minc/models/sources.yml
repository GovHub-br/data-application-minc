      Base de dados de execução do PNAB. [Descrição anterior — "contemplados,
      editais, instrumentos e anexos" — era copiada de outro schema; corrigida
      nesta revisão.] Schema não integrado a nenhum model deste projeto dbt;
      hipótese não confirmada: pode ser a fonte dos números do "painel
      oficial" (recebido/gasto) citados nos comentários de
      distribuicao_cotas_pnab.sql e stg_bbagil.sql.
    tables:
