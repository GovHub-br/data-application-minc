version: 2

sources:
  - name: agentes
    schema: agentes
    description: >
      NÃO é uma fonte raw externa — é o schema físico de SAÍDA do bronze do
      domínio agentes_dbt (config +schema: agentes em dbt_project.yml). As 5
      tabelas abaixo são os models incrementais lpg_agentes_pf/pj/coletivos e
      pnab_agentes_pf/pj (ver agentes_dbt/bronze/schema.yml e descriptions.yml
      para a documentação real deles); nenhum model deste projeto as lê via
      source(), só via ref(). Documentadas aqui para quem consulta o Postgres
      ou o catálogo (OpenMetadata) sem passar pela lineage do dbt.
    tables:
      - name: lpg_agentes_coletivos
        description: >
          Dados brutos de proponentes coletivos da LPG. [= model
          agentes_dbt.lpg_agentes_coletivos, não fonte externa — ver nota do schema]
        meta:
          used: false
          openmetadata:
            domain: Cultura.Fomento Direto
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: lpg_agentes_pf
        description: >
          Dados brutos de pessoas físicas da LPG (Lei Paulo Gustavo). [= model
          agentes_dbt.lpg_agentes_pf, não fonte externa — ver nota do schema]
        meta:
          used: false
          openmetadata:
            domain: Cultura.Fomento Direto
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: lpg_agentes_pj
        description: >
          Dados brutos de pessoas jurídicas da LPG. [= model
          agentes_dbt.lpg_agentes_pj, não fonte externa — ver nota do schema]
        meta:
          used: false
          openmetadata:
            domain: Cultura.Fomento Direto
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: pnab_agentes_pf
        description: >
          Dados brutos de pessoas físicas da PNAB (Política Nacional Aldir Blanc).
          [= model agentes_dbt.pnab_agentes_pf, não fonte externa — ver nota do schema]
        meta:
          used: false
          openmetadata:
            domain: Cultura.Fomento Direto
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: pnab_agentes_pj
        description: >
          Dados brutos de organizações da PNAB. [= model
          agentes_dbt.pnab_agentes_pj, não fonte externa — ver nota do schema]
        meta:
          used: false

          openmetadata:
            domain: Cultura.Fomento Direto
            tier: Tier.Tier4
            owner: minc-data-engineering
  - name: bb_agil
    schema: bb_agil
    description: >
      Schema de ingestão do extrato bancário BB Gestão Ágil/SERPRO — pouso dos
      lançamentos financeiros brutos, anterior à agregação/filtragem que gera
      bsc_pnab.fato_bbagil (a fonte de fato lida pelo model, hoje desabilitado,
      stg_bbagil). Não consumido diretamente por nenhum model deste projeto.
    tables:
      - name: raw_ingestao_financeira_lancamentos
        description: >
          [Inferido do nome + do pipeline bbágil, não verificado a nível de
          coluna] Lançamentos financeiros brutos do extrato bancário, um passo
          antes da agregação em bsc_pnab.fato_bbagil.
        meta:
          used: false

          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
  - name: bsc
    schema: bsc
    description: >
      Schema de apoio à ingestão bbágil (extrato bancário BB Gestão Ágil).
      [Descrição anterior — "contemplados, editais, instrumentos e anexos" —
      estava copiada de outro schema e não correspondia às tabelas reais aqui;
      corrigida nesta revisão.] Não consumido diretamente por nenhum model
      deste projeto.
    tables:
      - name: raw_bbagil_extrato_transacoes
        description: >
          [Inferido do nome + do pipeline bbágil, não verificado a nível de
          coluna] Transações do extrato bancário BB Gestão Ágil.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: raw_bbagil_subtransacoes
        description: >
          [Inferido do nome + do pipeline bbágil, não verificado a nível de
          coluna] Subtransações (desdobramento/rateio) de uma transação do
          extrato BB Gestão Ágil.
        meta:
          used: false

          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
