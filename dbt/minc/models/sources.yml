          Uma linha por transacao do extrato bancario do BB Gestao Agil
          (orgao de controle), persistida por ``extracao_bbagil_dag`` direto
          da resposta da API do BSC/SERPRO.
        meta:
          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
      - name: subtransacao_bbagil
        description: >
          Uma linha por sub-lancamento das transacoes com
          ``subtransactionquantity`` > 0, persistida por
          ``extracao_bbagil_dag``.

        meta:
          openmetadata:
            domain: Cultura.Repasse Federativo
            tier: Tier.Tier4
            owner: minc-data-engineering
  - name: ancine
    schema: ancine
    description: >
      Captação de projetos audiovisuais registrada pela Ancine. É a fonte do
      FSA e da Lei do Audiovisual na Meta 5 — durante meses se registrou que o
      FSA vinha de "uma planilha da Ancine fora do banco"; não vem, está aqui.

      CARGA MANUAL: não existe DAG de ingestão para este schema. A tabela foi
      carregada a partir do relatório "Captações Por Mecanismo" exportado da
      Ancine, e não se atualiza sozinha. Quem repuxar o relatório precisa
      recarregar à mão e conferir os totais contra o pivô do próprio arquivo
      (ver `consulta`).
    tables:
      - name: consulta
        description: >
          Uma linha por APORTE de recurso a um projeto audiovisual — não por
          projeto e não por agente. 57.860 linhas, 17 mecanismos, captações de
          2005-01-03 a 2026-04-09, R$ 10.328.702.836,57 no total.

          QUEM É QUEM: ``cnpj_proponente`` é quem RECEBEU (a produtora dona do
          projeto) e ``cnpj_investidor`` é quem APORTOU. É a mesma estrutura da
          captação da Rouanet (``sac__captacao``), e trocar os dois inverte
          completamente a leitura — os maiores "investidores" da base são
          Globo, Telecine e Disney, que são pagadores, nunca beneficiários de
          fomento.

          GRÃO SEM CHAVE NATURAL: (``no_salic``, ``cnpj_investidor``,
          ``data_captacao``, ``valor_de_captacao``, ``mecanismo``) ainda repete
          em 204 grupos — aportes iguais do mesmo investidor no mesmo dia são
          legítimos. Qualquer modelo que precise de chave tem de gerar
          surrogate key; não existe coluna de id no relatório.

          DIMENSÃO DE PROJETO EMBUTIDA: ``no_salic`` determina sozinho
          ``nome_projeto``, ``cnpj_proponente``, ``nome_proponente`` e
          ``valor_total_de_captacao_do_projeto`` — 0 violações em 9.741
          projetos. Ou seja, a tabela é um fato de captação com uma dimensão de
          projeto desnormalizada dentro. Dá para partir daqui direto para
          `dim_projeto_audiovisual` sem deduplicação de conflito.

          CRUZAMENTO COM O SALIC (a ponte que dá mais retorno): ``no_salic``
          está no formato ``AA-NNNN`` e é o PRONAC do projeto. Remover o hífen
          produz exatamente a chave que `eventos_fomento_rouanet` monta do lado
          do SALIC como ``TRIM(anoprojeto) || TRIM(sequencial)``:
          ``'00-0201' -> '000201'``. Isso liga esta tabela a
          ``bronze_sac.sac__projetos``, ``bronze_sac.sac__captacao`` e ao resto
          do catálogo SALIC pelo projeto. RESSALVA: os 9.741 PRONACs daqui têm
          todos 6 caracteres, mas ``sac__projetos.sequencial`` é varchar(5) —
          projeto com sequencial de 5 dígitos (PRONAC de 7) não tem
          representação neste relatório, então a ponte é parcial por
          construção. Validar cobertura antes de usar como INNER JOIN.

          RECONCILIAÇÃO: o arquivo de origem traz uma aba-pivô (mecanismo × ano)
          cujos totais batem centavo a centavo com a soma desta tabela, nos 17
          mecanismos e no total geral. É o controle de carga: se um dia a soma
          por mecanismo divergir do pivô, a carga veio truncada.

          ARMADILHAS DE FORMATO — as duas são reais e já mordidas:
            ``data_captacao``     TEXT no padrão AMERICANO M/D/YYYY.
                                  ``'7/12/2007'`` é 12 de julho, não 7 de
                                  dezembro. Ordenar como texto mente.
            ``valor_de_captacao`` TEXT no padrão brasileiro, ``'50.000,00'``.

          CENSURA À ESQUERDA: a série começa em 2005-01-03 com 5 linhas nesse
          mesmo dia e 46 em todo janeiro de 2005 — tem cara de extrato cortado,
          não de início real da atividade. `primeiro_acesso_anual` trata 2005
          como ano censurado por causa disso.

          ESCOPO DE USO: ART25 e ART18 são Rouanet e NÃO devem ser lidos daqui —
          já entram pelo SALIC, por fonte melhor; usar os dois duplicaria
          evento. Ver `eventos_fomento_ancine` para o recorte completo do que
          entra e do que fica de fora, com o porquê de cada exclusão.
        meta:
          openmetadata:
            domain: Cultura.Incentivo Fiscal
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: no_salic
            description: >
              PRONAC do projeto no formato ``AA-NNNN`` (ex.: ``00-0201``). Os
              dois primeiros dígitos são o ANO DO PROJETO, não o ano da
              captação: há projetos com prefixo 96-99 (1996-1999) captando a
              partir de 2005. 9.741 projetos distintos. Chave de cruzamento com
              o SALIC depois de remover o hífen — ver a nota da tabela.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Identificadores.PRONAC
          - name: cnpj_proponente
            description: >
              Documento de QUEM RECEBEU o aporte — a produtora dona do projeto.
              2.240 documentos distintos, formatados com pontuação
              (``52.308.558/0001-32``). Quase toda a base é CNPJ: 57.837 linhas
              de 14 dígitos contra 23 de 11. Pessoa física é praticamente
              invisível nesta fonte, e essa limitação empurra sempre para o
              mesmo lado — pode deixar de revelar um veterano, nunca inventar
              um. Normalizar antes de cruzar: o resto do projeto usa só dígitos
              com LPAD.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Identificadores.IdentificadorUnico
                  - MinC.Agentes.Proponente
          - name: data_captacao
            description: >
              Data do aporte, TEXT no padrão AMERICANO ``M/D/YYYY`` — sem zero
              à esquerda no mês e no dia. Converter com
              ``TO_DATE(data_captacao, 'FMMM/FMDD/YYYY')``. 5.192 datas
              distintas entre 2005-01-03 e 2026-04-09; 100% das linhas casam
              com ``^[0-9]{1,2}/[0-9]{1,2}/[0-9]{4}$``.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Qualificadores.JanelaDeObservacao
          - name: mecanismo
            description: >
              Instrumento pelo qual o recurso chegou ao projeto. 17 valores, e
              eles NÃO são intercambiáveis — a decisão de escopo da Meta 5 é
              feita nesta coluna. Por volume de recurso: OUTROS EDITAIS
              (R$ 3,75 bi), ART 3A (R$ 1,73 bi), ART 1A (R$ 1,15 bi), ART3
              (R$ 1,01 bi), ART39 CONDECINE (R$ 970 mi), FSA (R$ 721 mi),
              ART1 (R$ 469 mi), RENDIMENTOS (R$ 135 mi), ART41 FUNCINES
              (R$ 115 mi), ART25 Rouanet (R$ 89 mi), EDITAL ANCINE (PAR)
              (R$ 63 mi), ART18 Rouanet (R$ 37 mi), EDITAL ANCINE (R$ 37 mi),
              OUTRAS FONTES (R$ 25 mi), LEI ESTADUAL (R$ 13 mi), LEI MUNICIPAL
              (R$ 12 mi), CONTRAPARTIDA (R$ 2,7 mi). Por linhas o retrato é
              outro: ART39 CONDECINE sozinho é 24.062 das 57.860.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Politicas.FSA
                  - MinC.Politicas.LeiDoAudiovisual
                  - MinC.Politicas.CONDECINE
                  - MinC.Politicas.FUNCINES
          - name: valor_de_captacao
            description: >
              Valor do aporte em reais, TEXT no padrão brasileiro
              (``'50.000,00'``). Converter com
              ``REPLACE(REPLACE(valor_de_captacao, '.', ''), ',', '.')::NUMERIC``.
              100% das linhas casam com ``^-?[0-9.]+,[0-9]{2}$``, não há
              negativo, e há 33 linhas com valor exatamente zero — captação de
              R$ 0 não deu acesso a recurso e é descartada rio abaixo.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Cotas.ValorPonderado
          - name: nome_proponente
            description: >
              Razão social de quem recebeu. 2.238 nomes distintos para 2.240
              documentos — dois documentos compartilham nome com outro, então
              NÃO use o nome como chave. Serve para conferência humana.
            data_type: text
          - name: nome_projeto
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO — ver nota no fim do bloco]
              Título do projeto audiovisual. 8.995 títulos para 9.741 projetos:
              títulos se repetem entre PRONACs (refilmagens, temporadas,
              projetos homônimos). Determinado por ``no_salic``, nunca o
              contrário.
            data_type: text
          - name: uf_proponente
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO] UF de quem recebeu, sigla
              de 2 letras. Preenchida em 99,8% das linhas (107 vazias), sem
              nenhum valor fora das 27 siglas oficiais — é a coluna geográfica
              limpa desta fonte. Concentração extrema: SP (30.155) e RJ
              (20.311) somam 87% das linhas, o que é o retrato real do setor
              audiovisual incentivado e precisa ser dito junto de qualquer
              recorte territorial.
            data_type: text
          - name: cnpj_investidor
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO] Documento de QUEM APORTOU
              — patrocinador, incentivador ou o próprio fundo. NÃO é
              beneficiário de fomento. Preenchida em 79,6% das linhas: fica
              vazia quando o recurso não vem de investidor identificado (é o
              caso do FSA, que é fundo). 3.406 documentos distintos, 44.547
              linhas de 14 dígitos e 1.523 de 11.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Agentes.Investidor
          - name: nome_investidor
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO] Nome de quem aportou,
              preenchido em 84,6% das linhas — 5 pontos a mais que o CNPJ, ou
              seja, há aporte com nome e sem documento. 3.517 nomes para 3.406
              documentos: grafias divergentes do mesmo investidor. Agregar por
              nome infla a contagem; agregue por documento.
            data_type: text
            meta:
              openmetadata:
                glossary:
                  - MinC.Agentes.Investidor
          - name: uf_investidor
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO] UF de quem aportou.
              Coluna SUJA, ao contrário da UF do proponente: preenchida em
              76,7% e com valores fora do padrão — ``'CA'``, ``'NI'``,
              ``'P'``, ``'S'`` e ``'Rj'`` (minúscula). Normalizar e validar
              antes de qualquer uso; não serve para recorte territorial como
              está.
            data_type: text
          - name: valor_total_de_captacao_do_projeto
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO] Total captado pelo projeto,
              repetido em toda linha do mesmo ``no_salic`` (agregado
              desnormalizado). ATENÇÃO: NÃO é a soma das linhas presentes —
              diverge em 208 dos 9.741 projetos, e sempre para mais (o
              declarado é maior que a soma). Isso indica captações que existem
              no total oficial do projeto mas não vieram neste relatório.
              Somar ``valor_de_captacao`` e comparar com esta coluna é a
              medida de completude por projeto; usar as duas como se fossem a
              mesma coisa produz números inconsistentes.
            data_type: text
          - name: percentual_da_captacao_do_projeto
            description: >
              [NOME FÍSICO DA COLUNA NÃO VERIFICADO — no relatório o cabeçalho
              é ``% da Captação do Projeto``] Participação do aporte no total
              do projeto, em % (0-100), padrão brasileiro (``'2,63'``).
              Derivada: bate com
              ``valor_de_captacao / valor_total_de_captacao_do_projeto`` em
              100% das 57.860 linhas. Redundante para cálculo — herda a
              divergência de ``valor_total_de_captacao_do_projeto`` descrita
              acima, porque é medida contra o total declarado.
            data_type: text

  - name: ibge_sidra
    schema: ibge_sidra
    description: >
      Catálogo do SIDRA — o repositório de tabelas estatísticas do IBGE —
      extraído da API de Agregados v3 por `ibge_agregados_dag`. NÃO são dados
      culturais: é o catálogo de o que o IBGE publica, e serve para descobrir
      qual tabela responde a uma pergunta antes de baixar a série.

      ESTRUTURA — o catálogo desce em quatro níveis:
        pesquisas            70 pesquisas (Censo, PNAD, POF...)
        └─ agregados_catalogo   9.298 agregados (as "tabelas" do SIDRA)
           ├─ metadados         9.293 fichas técnicas
           ├─ periodos         85.170 períodos disponíveis
           ├─ variaveis        as variáveis de cada agregado
           └─ localidades     222.862 pares agregado × localidade
        resultados           as séries em si

      Integridade verificada: nenhum `agregado_id` órfão em periodos,
      localidades ou metadados, e nenhum `pesquisa_id` órfão em
      agregados_catalogo.

      ⚠ TRÊS TABELAS ACUMULAM DUPLICATAS A CADA EXECUÇÃO. A DAG roda semanal
      (domingo 3h). `pesquisas` e `agregados_catalogo` são recriadas com
      DROP+INSERT, e `metadados` faz upsert por `agregado_id` — essas três estão
      corretas. Mas `periodos`, `localidades`, `variaveis` e `resultados` são
      gravadas com INSERT puro, sem `primary_key` e sem DROP, então cada
      execução empilha tudo de novo. Já é visível: `localidades` tem 222.862
      linhas para 167.291 combinações reais — 24,9% da tabela é repetição — e
      `periodos` tem 2.657 linhas duplicadas. QUEM CONSULTAR PRECISA DE DISTINCT
      até isso ser corrigido na DAG; contar linhas direto superestima.

      ESCOPO ATUAL: `localidades` só traz nível N3 (Unidade da Federação),
      padrão da Variable `ibge_config`. Não há dado municipal aqui — para
      município é preciso mudar `localidades_nivel` para N6. E `resultados` só é
      populada se `resultados_agregados_ids` estiver preenchida na mesma
      Variable; vazia, a task passa em silêncio.

      COLUNAS JSON EM TEXTO: várias colunas guardam JSON como string
      (`agregados`, `literals`, `nivel`, `periodicidade`, `nivelterritorial`,
      `variaveis`, `classificacoes`). São payload da API achatado, não colunas
      relacionais — precisam de parse antes de qualquer filtro.

      Nenhum modelo dbt lê este schema hoje.
    tables:
      - name: pesquisas
        description: >
          As 70 pesquisas do IBGE que agrupam os agregados. Recriada por
          DROP+INSERT a cada execução — sem risco de duplicata.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Cadastro Cultural
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: id
            description: >
              Código da pesquisa. É ALFANUMÉRICO e curto ('D5', por exemplo),
              não um número — tratar como texto. 70 valores distintos.
            tests: [not_null, unique]
            meta:
              openmetadata:
                glossary:
                  - MinC.Instrumentos.PesquisaIBGE
          - name: nome
            description: >
              Nome da pesquisa — 'Censo Demográfico', 'Áreas Urbanizadas do
              Brasil'. Único por pesquisa.
          - name: agregados
            description: >
              JSON EM TEXTO com a lista de agregados da pesquisa, no formato
              `[{"id": "10763", "nome": "..."}]`. É a mesma informação que
              `agregados_catalogo` traz já achatada — use a tabela, não este
              campo, salvo se precisar do agrupamento original.

      - name: agregados_catalogo
        description: >
          Versão plana de todos os agregados do SIDRA, um por linha. 9.298
          registros. É a tabela de entrada para descobrir o que existe.
          Recriada por DROP+INSERT — sem risco de duplicata.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Cadastro Cultural
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: id
            description: >
              Id do agregado — o número da tabela no SIDRA. 9.298 distintos, é a
              chave que `metadados`, `periodos`, `variaveis` e `localidades`
              referenciam como `agregado_id`.
            tests: [not_null, unique]
            meta:
              openmetadata:
                glossary:
                  - MinC.Instrumentos.Agregado
          - name: nome
            description: >
              Nome do agregado. 9.268 nomes para 9.298 agregados — há nomes
              repetidos entre pesquisas, então não serve como chave.
          - name: pesquisa_id
            description: "Pesquisa dona do agregado. Zero órfãos verificados."
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('ibge_sidra', 'pesquisas')
                    field: id
          - name: pesquisa_nome
            description: "Nome da pesquisa, desnormalizado de `pesquisas.nome`."

      - name: metadados
        description: >
          A ficha técnica de cada agregado: assunto, periodicidade, níveis
          territoriais, variáveis e classificações. 9.293 registros — 5
          agregados do catálogo não têm metadados. Grava com upsert por
          `agregado_id`, então NÃO acumula duplicata.

          É a tabela mais densa do schema (42 MB em CSV) porque quatro colunas
          guardam JSON inteiro.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Cadastro Cultural
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: agregado_id
            description: "Chave primária e chave de conflito da carga. Zero órfãos verificados."
            tests: [not_null, unique]
            meta:
              openmetadata:
                glossary:
                  - MinC.Instrumentos.Agregado
          - name: id
            description: >
              [REDUNDANTE — idêntico a `agregado_id` em 100% das 9.293 linhas]
              Sobrou do payload da API, que repete o id dentro do objeto.
          - name: nome
            description: "Nome do agregado, como no catálogo."
          - name: url
            description: >
              URL da tabela no SIDRA (`https://sidra.ibge.gov.br/tabela/1990`).
              Única por agregado — é o link direto para conferência humana.
          - name: pesquisa
            description: "Nome da pesquisa. 70 valores, espelha `agregados_catalogo.pesquisa_nome`."
          - name: assunto
            description: >
              Assunto do agregado. 255 valores distintos — é a melhor coluna
              para navegar o catálogo por tema.
          - name: periodicidade
            description: >
              JSON EM TEXTO: `{"frequencia": "anual", "inicio": 2000, "fim":
              2000}`. 365 combinações distintas. Precisa de parse para filtrar
              por janela temporal.
          - name: nivelterritorial
            description: >
              JSON EM TEXTO com os níveis geográficos disponíveis:
              `{"Administrativo": ["N1", "N2", "N6", ...]}`. 88 combinações. É
              aqui que se descobre se um agregado tem dado municipal (N6) antes
              de tentar baixá-lo.
          - name: variaveis
            description: >
              JSON EM TEXTO com as variáveis do agregado. 3.486 combinações
              distintas. Duplica o conteúdo da tabela `variaveis`, em outro
              formato.
          - name: classificacoes
            description: >
              JSON EM TEXTO com as classificações e categorias do agregado.
              4.979 combinações — é o campo que define os recortes possíveis
              (sexo, cor/raça, faixa etária) de cada tabela.

      - name: periodos
        description: >
          Os períodos disponíveis de cada agregado. 85.170 linhas cobrindo 9.293
          agregados.

          ⚠ ACUMULA DUPLICATA: gravada com INSERT puro, sem chave. Há 2.657
          linhas repetidas do par (`agregado_id`, `id`) — 82.513 combinações
          reais. Consulte com DISTINCT.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Cadastro Cultural
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: agregado_id
            description: "Agregado dono do período. Zero órfãos verificados."
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('ibge_sidra', 'agregados_catalogo')
                    field: id
          - name: id
            description: >
              Código do período — 635 valores distintos, tipicamente o ano
              ('2022') ou ano+mês. Não é único sozinho: repete entre agregados.
          - name: literals
            description: >
              JSON EM TEXTO com as formas literais do período (`["2022"]`).
              1.022 valores distintos.
          - name: modificacao
            description: >
              Data da última modificação do período na origem, no padrão
              BRASILEIRO DD/MM/YYYY como texto. 1.836 valores. Ordenar como
              texto mente — converter antes.

      - name: localidades
        description: >
          As localidades para as quais cada agregado tem dado. 222.862 linhas
          cobrindo 6.268 dos 9.298 agregados — um terço do catálogo não tem
          localidade neste nível.

          ⚠ É A TABELA MAIS AFETADA PELA DUPLICAÇÃO: 55.571 linhas repetidas,
          24,9% do total, para 167.291 combinações reais de (`agregado_id`,
          `id`). Contar linhas aqui superestima em um quarto.

          ESCOPO: só nível N3 (Unidade da Federação) — as 27 UFs. Não há
          município. Mudar exige alterar `localidades_nivel` na Variable
          `ibge_config`.
        meta:
          used: false
          openmetadata:
            domain: Cultura.Cadastro Cultural
            tier: Tier.Tier4
            owner: minc-data-engineering
        columns:
          - name: agregado_id
            description: "Agregado dono da localidade. Zero órfãos verificados."
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('ibge_sidra', 'agregados_catalogo')
                    field: id
          - name: nivel
            description: >
              [CONSTANTE] JSON EM TEXTO com o nível geográfico:
              `{"id": "N3", "nome": "Unidade da Federação"}` em 100% das linhas.
              Vira variável se `localidades_nivel` mudar na Variable.
          - name: id
            description: >
              Código da localidade — os 27 códigos de UF do IBGE ('11' a '53').
              Cruza com `cd_uf` de `transferegov.territorio_fcu_setores`.
          - name: nome
            description: "Nome da localidade — as 27 UFs por extenso ('Rondônia')."

      - name: variaveis
        description: >
          As variáveis mensuráveis de cada agregado, do endpoint
          `/agregados/{id}/variaveis`.

          ⚠ ACUMULA DUPLICATA pelo mesmo motivo de `periodos` e `localidades`:
          INSERT puro, sem chave, sem DROP.

          [COLUNAS NÃO DOCUMENTADAS — não havia extração desta tabela disponível
          quando este bloco foi escrito. O conteúdo equivalente, em JSON, está
          em `metadados.variaveis`.]
        meta:
          used: false
          openmetadata:
            domain: Cultura.Cadastro Cultural
            tier: Tier.Tier4
            owner: minc-data-engineering

      - name: resultados
        description: >
