version: 2

# Intermediate (ADR 0010): só cruza bases, sem regra de negócio final.
#
# NOMES: int_<fonte1>_<fonte2>_..._<fonteN>, uma intermediate por combinação de
# fontes, com as fontes em ordem alfabética — assim o mesmo cruzamento não
# ganha dois nomes.
models:
  - name: int_ancine_bbagil_salic
    description: >
      Camada Intermediate. Os eventos em que um agente recebeu recurso, de
      três fontes numa forma só: saída de dinheiro das contas do BB Ágil
      (silver_pagamento_bbagil), recibo de captação da Rouanet
      (silver_sac_captacao_proponente) e captação de projeto audiovisual da
      Ancine (silver_consulta).

      GRÃO: uma linha por evento da fonte. UNIVERSO: todo movimento de
      silver_pagamento_bbagil, todo recibo de silver_sac_captacao_proponente
      e toda captação de silver_consulta. Nada é descartado aqui.

      PARA QUE SERVE: dá às três fontes uma forma comum para a Gold
      eixo2_meta5_evento_fomento aplicar a regra de negócio da Meta 5.

      NADA É DECIDIDO AQUI: quais eventos contam, a que política cada um
      pertence e o piso de valor são regra de negócio e ficam na Gold (ADR
      0010). Por isso cada linha leva o que a fonte tem para essa decisão —
      programa_bruto, beneficiario_nome, beneficiario_documento_bruto,
      descriptionname, tipo_lancamento —, nulo onde a fonte não tem.

      POR QUE O BB ÁGIL CHEGA INCOMPLETO: as linhas do BB Ágil chegam mesmo
      sem documento normalizado, sem data ou sem valor, e com crédito e
      sublançamento de qualquer status. O pareamento de estorno na Gold é
      por conta e precisa das duas pernas, e só depois dele a Gold descarta
      o que não é atribuível a um agente. Por isso os testes de não nulo
      daqui valem só para SALIC e Ancine.

      LIMITAÇÕES: a identidade entre fontes é só o CPF/CNPJ normalizado; não
      há resolução por nome. As janelas das fontes são muito diferentes
      (Rouanet desde 1993, Ancine desde 2005, BB Ágil desde 2023), e quem
      trata isso é a Gold.

      ZONA RESTRITA. Carrega CPF/CNPJ e nome em claro: não publicável e
      proibida em corpus de RAG. A anonimização no momento do acesso é
      responsabilidade do Apache Ranger (ADR 0009).

      ATUALIZAÇÃO: table, recalculada a cada `dbt build`; não há carga
      incremental.
    config:
      tags: [intermediate, bbagil, salic, ancine]
      meta:
        status: Active
        meta_objetivo: 'Meta 5 — eventos de recebimento de recurso das três fontes, numa forma só'
        origem_dados: 'silver_pagamento_bbagil + silver_sac_captacao_proponente + silver_consulta'
        governance:
          produto_dados: 'Intermediate — eventos de fomento (BB Ágil, SALIC, Ancine)'
          classificacao_uso: restrito
          rag_publication: prohibited
          derivadas_nao_identificantes: [status_prestacao_contas]
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          tags:
            - Certification.Silver
          glossary:
            - MinC.Agentes.AgenteCultural
    columns:
      - name: fonte
        description: "'BB_AGIL', 'SALIC' ou 'ANCINE'."
        data_type: text
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ANCINE', 'BB_AGIL', 'SALIC']
      - name: programa_bruto
        description: >
          O programa como a fonte registra, sem classificação: no BB Ágil o
          código curto do programa (governmentprogramname, ex.
          'MINC-LPG-MUNI-AUD'), na Ancine o mecanismo ('FSA', 'ART1',
          'ART25'...). Nulo no SALIC, onde todo evento é Rouanet.
        data_type: text
      - name: beneficiario_documento
        description: >
          CPF (11) ou CNPJ (14) de quem recebeu, normalizado com LPAD. Pode ser
          nulo no BB Ágil (beneficiarypersontype fora de 1/2).
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
            glossary:
              - MinC.Identificadores.IdentificadorUnico
        tests:
          - not_null:
              config:
                where: "fonte <> 'BB_AGIL'"
      - name: beneficiario_documento_bruto
        description: >
          Documento como o BB Ágil devolve, sem zero à esquerda. É onde a Gold
          reconhece o Banco do Brasil ('191') e o Fundo Nacional de Cultura
          ('3793086100189'). Nulo nas outras fontes.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.Sensitive
      - name: beneficiario_nome
        description: >
          Nome de quem recebeu, quando a fonte traz. No BB Ágil é onde a Gold
          reconhece repasse a ente público.
        data_type: text
        meta:
          openmetadata:
            tags:
              - PII.NonSensitive
      - name: tipo_pessoa
        description: "'PF' (11 dígitos) ou 'PJ' (14). Nulo quando o documento é nulo."
        data_type: text
        tests:
          - not_null:
              config:
                where: "fonte <> 'BB_AGIL'"
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: data_evento
        description: >
          Data em que o recurso chegou: data do lançamento no BB Ágil, do
          recibo na Rouanet, da captação na Ancine.
        data_type: date
        tests:
          - not_null:
              config:
                where: "fonte <> 'BB_AGIL'"
      - name: ano_evento
        description: Ano civil de data_evento.
        data_type: integer
        tests:
          - not_null:
              config:
                where: "fonte <> 'BB_AGIL'"
      - name: valor
        description: Valor do evento, em reais, como a fonte registra.
        data_type: numeric
      - name: tipo_lancamento
        description: >
          No BB Ágil, 'extrato' ou 'subtransacao' (ver silver_pagamento_bbagil).
          Nulo nas outras fontes.
        data_type: text
      - name: descriptionname
        description: >
          Descrição do lançamento no extrato do BB Ágil. Nula no sublançamento
          e nas outras fontes.
        data_type: text
      - name: creditdebitindicator
        description: >
          No extrato do BB Ágil, 'D' (débito) ou 'C' (crédito); a Gold usa para
          parear estorno e ficar só com o débito. Nulo no sublançamento e nas
          outras fontes.
        data_type: text
      - name: status_prestacao_contas
        description: >
          No sublançamento do BB Ágil, o status na prestação de contas ('Pago'
          é o que chegou ao beneficiário). Nulo no extrato e nas outras fontes.
        data_type: text
      - name: id_plano_acao
        description: Plano de ação dono da conta, no BB Ágil. Nulo nas outras fontes.
        data_type: integer
        meta:
          openmetadata:
            glossary:
              - MinC.Identificadores.IdPlanoAcao
      - name: id_plano_acao_dado_bancario
        description: >
          A conta bancária, no BB Ágil — chave do pareamento de estorno na
          Gold, que acontece dentro de uma conta só. Nulo nas outras fontes.
        data_type: integer
      - name: pronac
        description: PRONAC do projeto, no SALIC. Nulo nas outras fontes.
        data_type: text
      - name: no_salic
        description: >
          Número do projeto no SALIC anotado pela Ancine. Nulo nas outras
          fontes.
        data_type: text

  - name: int_ancine_bbagil_salic_transferegov
    description: >
      Camada Intermediate. Os eventos de int_ancine_bbagil_salic, cada um
      marcado com as listas oficiais de contemplados de edital do
      TransfereGov (silver_planilha_contemplados) em que o documento
      aparece.

      GRÃO: o de int_ancine_bbagil_salic, uma linha por evento. UNIVERSO:
      todos os eventos de int_ancine_bbagil_salic, com ou sem contemplado
      correspondente.

      PARA QUE SERVE: só cruza. A regra de primeiro acesso dos contemplados
      fica em eixo2_meta5_primeiro_acesso_contemplados.

      AUSÊNCIA NÃO É EVIDÊNCIA: contemplado_lpg e contemplado_pnab são nulos,
      e não falsos, quando o documento não está na lista.

      LIMITAÇÕES: a marca só cobre as listas da LPG e da PNAB ciclo 1 que
      a cadeia de anexos do TransfereGov extraiu, e só as em ODS ou Excel —
      lista publicada em PDF não entra. Contemplado de edital ausente
      dessas listas aparece como evento sem marca, indistinguível de quem
      nunca foi contemplado.

      DESABILITADO (enabled=false), junto com silver_planilha_contemplados:
      as planilhas só nascem da cadeia de anexos do TransfereGov, que ainda
      não rodou neste banco.

      ZONA RESTRITA. Herda o CPF/CNPJ e o nome em claro de
      int_ancine_bbagil_salic: não publicável e proibida em corpus de RAG.

      ATUALIZAÇÃO: table, recalculada a cada `dbt build` quando habilitada;
      não há carga incremental.
    config:
      tags: [intermediate, bbagil, salic, ancine, transferegov, contemplados]
      meta:
        status: Disabled
        meta_objetivo: 'Meta 5 — eventos de fomento marcados com as listas de contemplados'
        origem_dados: 'int_ancine_bbagil_salic + silver_planilha_contemplados'
        governance:
          produto_dados: 'Intermediate — eventos de fomento com contemplados (TransfereGov)'
          classificacao_uso: restrito
          rag_publication: prohibited
        openmetadata:
          domain: Cultura.Fomento Direto
          tier: Tier.Tier2
          owner: minc-data-engineering
          glossary:
            - MinC.Agentes.Contemplado
    columns:
      - name: contemplado_lpg
        description: >
          Verdadeiro quando o documento está na lista de contemplados da LPG.
          Nulo, e não falso, quando não está: ausência na planilha não é
          evidência.
        data_type: boolean
      - name: contemplado_pnab
        description: >
          Verdadeiro quando o documento está na lista de contemplados da PNAB
          (ciclo 1). Nulo quando não está.
        data_type: boolean

  - name: int_bacen_bbagil_siconfi
    description: >
      Camada Intermediate. O gasto dos entes numa forma só: a Matriz de Saldos
      Contábeis orçamentária do SICONFI (silver_msc_orcamentaria) e o extrato
      bancário do BB Ágil (silver_extrato_bbagil), empilhados linha a linha e
      sem filtro, com o nome, a UF, a esfera e a região do ente (silver_entes,
      pelo cod_ibge) e o IPCA do exercício (SGS 433, silver_serie_sgs do
      BACEN).

      GRÃO: uma linha por item da MSC (base_origem 'siconfi_msc') ou por
      lançamento do extrato (base_origem 'bbagil_extrato'). UNIVERSO: toda
      linha das duas silvers, de todo ente, matriz, mês, classe, programa e
      indicador de débito e crédito. Nada é descartado aqui.

      UMA FORMA SÓ: as colunas da MSC ficam nulas na linha do extrato, e as
      do extrato na linha da MSC. Do extrato não vem nenhuma coluna do
      beneficiário (nome, documento, agência, conta).

      O EXERCÍCIO do lançamento do extrato é o ano da data do lançamento
      (bookingdate, dd/mm/aaaa, pela macro data_texto). Nulo quando a data
      não é data de calendário.

      O IPCA: ipca_indice_medio_ano é a média, nos meses do exercício, do
      número-índice que encadeia as variações mensais da série 433 desde o
      primeiro mês dela. O nível do índice é arbitrário; só a razão entre dois
      anos tem sentido, e é ela que a Gold usa como deflator, com o ano-base
      que escolher. ipca_meses_ano diz quantos meses o ano tem na série (12
      no ano fechado, menos no ano corrente). Nulo no exercício sem IPCA.

      PARA QUE SERVE: dá à Gold eixo1_orcamento_empenho_cultura, numa tabela
      só, o empenho da MSC, a LAB 1 municipal do BB Ágil e o deflator, que vêm
      de fontes diferentes (ADR 0010, regra 2). Qual matriz, mês, conta,
      função, fonte, programa e lançamento contam é regra de negócio e fica
      lá.

      ATUALIZAÇÃO: view. A linha é a da MSC inteira mais o extrato inteiro;
      materializar duplicaria as silvers. A Gold, que filtra, é que é tabela.
      O filtro da Gold em base_origem vira constante em cada ramo do union
      all, e o Postgres não lê o ramo que não serve.

      SEM TESTE DE UNICIDADE AQUI, de propósito: numa view, ele refaria a
      deduplicação da silver inteira a cada build. A chave da MSC é testada em
      silver_msc_orcamentaria, a do lançamento na Gold, e os dois joins não
      multiplicam linha: silver_entes tem cod_ibge único (testado) e o IPCA é
      agrupado por ano.
    config:
      tags: [intermediate, bacen, bbagil, siconfi]
      meta:
        status: Active
        meta_objetivo: 'Eixo 1 — orçamento: o empenho da MSC e o extrato do BB Ágil com o ente e o IPCA, numa forma só'
        origem_dados: 'silver_msc_orcamentaria + silver_extrato_bbagil + silver_entes + silver_serie_sgs'
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: base_origem
        description: >-
          De qual silver a linha veio: 'siconfi_msc' (silver_msc_orcamentaria)
          ou 'bbagil_extrato' (silver_extrato_bbagil). Constante em cada ramo
          do union all; sem teste aqui pelo mesmo motivo da unicidade.
        data_type: text
      - name: cod_ibge
        description: >-
          Código IBGE do ente: o do item da MSC, ou o da conta do BB Ágil. No
          extrato, o DF vem com o código da UF (53).
        data_type: bigint
      - name: ente
        description: Nome do ente em silver_entes. Nulo se o código não está lá.
        data_type: text
      - name: uf
        description: >-
          Sigla da UF do ente: a sigla_uf de silver_entes, não a uf do SICONFI,
          que é 'BR' nos estados e no DF.
        data_type: text
      - name: esfera
        description: "Esfera do ente em silver_entes: 'E', 'D', 'M' ou 'U'."
        data_type: text
      - name: regiao
        description: Sigla da região do ente em silver_entes.
        data_type: text
      - name: exercicio
        description: >-
          Ano do exercício: o da MSC, ou o ano da data do lançamento do
          extrato.
        data_type: integer
      - name: codigo_programa
        description: >-
          Só no extrato: código do programa do TransfereGov da conta
          (30882120200002 é a Aldir Blanc dos municípios).
        data_type: bigint
      - name: id_plano_acao
        description: Só no extrato. Plano de ação do TransfereGov dono da conta.
        data_type: integer
      - name: id_plano_acao_dado_bancario
        description: Só no extrato. A conta bancária do plano de ação.
        data_type: integer
      - name: id_transacao
        description: >-
          Só no extrato. O id do lançamento no BB Ágil (o id de
          silver_extrato_bbagil); a chave é (id_plano_acao,
          id_plano_acao_dado_bancario, id_transacao).
        data_type: bigint
      - name: data_lancamento
        description: >-
          Só no extrato. A data do lançamento (bookingdate), como date. Nula
          quando o texto não é data de calendário.
        data_type: date
      - name: creditdebitindicator
        description: "Só no extrato. 'C' é crédito; 'D', débito."
        data_type: text
      - name: descriptioncode
        description: >-
          Só no extrato. Código do tipo de lançamento do BB (271, 345 e 248 são
          movimentos de aplicação financeira).
        data_type: integer
      - name: descriptionname
        description: Só no extrato. Nome do tipo de lançamento.
        data_type: text
      - name: valor
        description: >-
          O valor da MSC (saldo, com sinal), ou o value do lançamento do
          extrato.
        data_type: numeric
      - name: ipca_indice_medio_ano
        description: >
          Média do número-índice do IPCA nos meses do exercício. Escala
          arbitrária; use a razão entre dois anos.
        data_type: numeric
      - name: ipca_meses_ano
        description: Quantos meses do exercício a série 433 tem.
        data_type: bigint
      - name: _pagina_id
        description: Só na MSC. A página de onde o item veio.
        data_type: text
      - name: _item
        description: Só na MSC. Posição do item na página.
        data_type: integer

  - name: int_ibge_sidra_siconfi
    description: >
      Camada Intermediate — os municípios do SICONFI (silver_entes, esfera 'M')
      com a população residente do Censo 2022 (silver_resultados, agregado 4709,
      variável 93, nível N6), pelo código IBGE.


      Cruza as duas fontes e não decide nada: o porte do município (faixas da
      PNAS) é regra e fica nas golds eixo1_orcamento_municipal_*. Município sem
      linha no Censo fica com populacao_censo_2022 nula.


      GRÃO: uma linha por município de silver_entes (cod_ibge).
    config:
      tags:
        - intermediate
        - siconfi
        - ibge_sidra
    meta:
      openmetadata:
        domain: Cultura.Indicadores
        tier: Tier.Tier2
        owner: minc-data-engineering
    columns:
      - name: cod_ibge
        description: Código IBGE do município, 7 dígitos.
        data_type: bigint
        tests:
          - not_null
          - unique
      - name: ente
        description: Nome do município em silver_entes.
        data_type: text
      - name: sigla_uf
        description: Sigla da UF do município.
        data_type: text
        tests:
          - not_null
      - name: regiao
        description: Sigla da região em silver_entes ('NO', 'NE', 'CO', 'SE', 'SU').
        data_type: text
      - name: capital
        description: Se o município é capital de UF.
        data_type: boolean
      - name: populacao_siconfi
        description: >
          A população que o SICONFI informa no cadastro de entes (estimativa do
          ano da consulta, não o Censo).
        data_type: bigint
      - name: exercicio_populacao_siconfi
        description: O exercício do cadastro de entes de onde vem populacao_siconfi.
        data_type: integer
      - name: populacao_censo_2022
        description: >
          População residente no Censo 2022 (SIDRA 4709, variável 93). Nula para
          município sem linha no Censo.
        data_type: numeric
