version: 2

# ibge, na estrutura do ADR 0010: a ibge_perfil_dag carrega cada aba das bases da
# MUNIC e da ESTADIC em seeds.ibge_<edicao>_<aba> (ADR 0012), toda coluna em texto,
# e cada uma vira um par aqui: bronze_<edicao>_<aba>, cópia fiel, e
# silver_<edicao>_<aba>, tipada com as macros bronze_* pelo padrão medido no dado.
# Só as abas que o Cultura em Números usa; o dicionário de cada edição está em
# seeds.ibge_<edicao>_dicionario.
models:
  - name: bronze_munic_2021_cultura
    description: >
      Camada Bronze — cópia fiel de seeds.ibge_munic_2021_cultura, a aba "Cultura"
      da MUNIC 2021 (IBGE, Base_MUNIC_2021_20240425.xlsx), sem cast, filtro nem
      join (ADR 0010). Uma linha por município; toda coluna chega como texto.
    config:
      tags:
        - bronze
        - ibge
      meta:
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier3
          owner: minc-data-engineering

  - name: silver_munic_2021_cultura
    description: >
      Camada Silver — a aba "Cultura" da MUNIC 2021 tipada, lida de
      bronze_munic_2021_cultura. Uma linha por município. 241 colunas, 3 com cast
      aplicado; as respostas do questionário continuam como o IBGE publica. O
      significado de cada código de variável está no dicionário da edição.
    config:
      tags:
        - silver
        - ibge
      meta:
        openmetadata:
          domain: Cultura.Indicadores
          tier: Tier.Tier2
          owner: minc-data-engineering
    columns:
      - name: codmun
        description: >
          Tipagem: 100% dos 5570 valores preenchidos casam com inteiro.
        data_type: bigint
      - name: uf
        description: >
          Tipagem: valores heterogêneos.
        data_type: text
      - name: cod_uf
        description: >
          Tipagem: 100% dos 5570 valores preenchidos casam com inteiro.
        data_type: bigint
      - name: mun
        description: >
          Tipagem: valores heterogêneos.
        data_type: text
      - name: pop
