  - name: silver_estadic_cultura_2014_orgao_gestor
    description: >
      Camada Silver — a aba "Órgão gestor" da ESTADIC 2014, suplemento de cultura
      tipada, lida de bronze_estadic_cultura_2014_orgao_gestor. Uma linha por UF.
      5 colunas, 1 com cast aplicado; as respostas do questionário continuam como
      o IBGE publica. O significado de cada código de variável está no dicionário
      da edição.
    config:
      tags:
        - silver
        - ibge
