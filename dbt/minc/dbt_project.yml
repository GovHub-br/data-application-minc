name: 'minc'

version: 1.0.0
config-version: 2

profile: minc

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# O salt do pseudônimo de CPF/CNPJ. Sem valor default de propósito: a macro
# salt_documento() falha a compilação quando ele está ausente ou curto demais,
# porque um salt vazio geraria sha256(cpf) puro — que é revertido por força
# bruta em minutos e só pareceria anonimização. Ver macros/hash_documento.sql.
#
# O salt é PERMANENTE: trocá-lo reescreve todos os pseudônimos e desfaz
# qualquer comparação com dado já materializado.
vars:
  salt_documento: "{{ env_var('MINC_SALT_DOCUMENTO', '') }}"

models:
  minc:
    metadata:
      +materialized: incremental
      +schema: metadata
    agentes_dbt:
      +materialized: table
      +schema: agentes
      bronze:
        +materialized: incremental
      views:
        +materialized: view
    # Meta 3 — cotas/reservas (LPG + PNAB). Domínio próprio, schema minc_cotas,
    # separado do agentes_dbt (meta 5 do colega). Bronze materializado como table
    # porque filtra o lixo de parsing (fica ~20k linhas em vez de milhões).
    cotas_dbt:
      +schema: cotas
      bronze:
        +materialized: table
      silver:
        +materialized: view
      gold:
        +materialized: table
