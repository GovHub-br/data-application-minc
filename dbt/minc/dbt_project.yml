name: 'minc'

version: 1.0.0
config-version: 2

profile: minc

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  minc:
    metadata:
      +materialized: incremental
      +schema: metadata
    # Meta 5 — novos entrantes no fomento federal. Uma linhagem so, cruzando
    # LPG, PNAB, LAB (BB Agil), Rouanet (SALIC) e audiovisual (Ancine).
    agentes_dbt:
      +materialized: table
      +schema: agentes
    # Meta 3 — cotas/reservas (LPG + PNAB). Domínio próprio, schema minc_cotas,
    # separado do agentes_dbt (meta 5 do colega). Bronze materializado como table
    # porque filtra o lixo de parsing (fica ~20k linhas em vez de milhões).
    cotas_dbt:
      +schema: cotas
      bronze:
        +materialized: table
      silver:
        +materialized: view
      gold:
        +materialized: table
