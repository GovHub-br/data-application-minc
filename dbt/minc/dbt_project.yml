name: 'minc'

version: 1.0.0
config-version: 2

profile: minc

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  minc:
    metadata:
      +materialized: incremental
      +schema: metadata
    # Estrutura do ADR 0010: uma pasta por fonte, a `intermediate` e, dentro
    # de `data_products/`, uma por produto; arquivos planos com a camada no
    # prefixo do nome, e o schema e o nome da pasta. A Meta 5 (novos entrantes
    # no fomento federal) mora aqui: bbagil, salic, ancine e transferegov ate a
    # silver, o cruzamento na intermediate e a regra de negocio nas golds de
    # data_products/cultura_em_numeros.
    #
    # As pastas de fonte caem no MESMO schema da tabela que a ingestao grava
    # (bbagil.extrato_bbagil, ancine.consulta). Nao colide: todo modelo aqui
    # comeca com bronze_ ou silver_, e nenhuma tabela de origem tem esse
    # prefixo. View por padrao, como a antiga bbagil_bronze: a bronze e
    # `select *` e a silver tipada so aplica cast. Os modelos que filtram e
    # cruzam declaram `table` no proprio arquivo.
    bbagil:
      +schema: bbagil
      +materialized: view
    ancine:
      +schema: ancine
      +materialized: view
    # TransfereGov: as entidades da API do Fundo a Fundo (source no schema
    # `transferegov`, gravada pelas pontes do ADR 0011) e as planilhas que os
    # entes anexam ao relatorio de gestao (source no schema `relatorio_gestao`,
    # onde a extracao_anexos_dag grava). Nao colide com as tabelas de origem do
    # schema `transferegov`: aqui tudo comeca com bronze_ ou silver_. View por
    # padrao; as silvers da Meta 3 que cortam lixo de parsing declaram `table`
    # no arquivo.
    transferegov:
      +schema: transferegov
      +materialized: view
    # SALIC no layout do ADR. A Bronze nao e modelo: e a copia crua que a
    # salic_ingestion_trino grava em salic.bronze_<banco>_<tabela>, declarada
    # como source. As silvers caem no mesmo schema. Divide o schema `salic` com
    # as views do salic_dbt ate ele migrar; os nomes nao colidem (bronze_* e
    # silver_* aqui, <banco>__<tabela> la). Um modelo chamado bronze_* aqui
    # substituiria a tabela que a DAG grava com esse nome.
    salic:
      +schema: salic
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    # Produtos de dados (Gold), um por subpasta. A pasta `data_products/` e so
    # organizacao no repositorio: o schema e o nome do produto, pelo +schema
    # explicito de cada um.
    data_products:
      # Cultura em Numeros. Convencao de nome do produto:
      # eixo<N>_meta<M>_<nome> -- ver o schema.yml da pasta.
      cultura_em_numeros:
        +schema: cultura_em_numeros
        +materialized: table
    # Mapas Culturais, na estrutura do ADR 0010: pasta por fonte, arquivos planos
    # e o schema é o nome da pasta. O nome do arquivo é o nome da tabela
    # (silver_<entidade>), sem alias.
    #
    # A bronze (mapas.bronze_<tabela>) não é modelo: é a cópia crua que a DAG
    # mapas_ingestion_trino grava, declarada como source. A silver cai no MESMO
    # schema, e `silver_*` nunca coincide com `bronze_*`, então o dbt não tem como
    # sobrescrever a bronze. Um modelo bronze_<entidade> aqui, ao contrário,
    # substituiria a tabela que a DAG grava com esse mesmo nome.
    #
    # Table, e não view: a silver é consumida via Trino (ML, análise exploratória).
    mapas:
      +schema: mapas
      +materialized: table
    # SALIC — Lei Rouanet. Legado: um dominio, as camadas separadas por PASTA
    # (o unico que ainda esta assim; migra conforme o ADR 0010).
    #
    # Schema `salic`, o mesmo da Bronze (salic.bronze_<banco>_<tabela>, que as
    # sources daqui declaram por `identifier`). O que evita colisao e o nome:
    # as views daqui se chamam <banco>__<tabela>, nunca bronze_*. Com target
    # `prod` o generate_schema_name_for_env aplica o custom schema literal,
    # entao um modelo com o nome de uma tabela da Bronze a derrubaria para por
    # uma view no lugar.
    salic_dbt:
      +schema: salic
      # Um modelo por tabela da Bronze do SALIC, so aplicando
      # cast. View por padrao: o objetivo e a camada semantica no dbt docs e no
      # OpenMetadata, e view entrega isso com zero armazenamento. Os 52,7 GB do
      # raw nao se duplicam antes de alguem saber quais modelos importam --
      # promova a table so as pesadas, depois.
      bronze:
        +materialized: view
      # Silvers conformadas da Rouanet. `table`, e nao `view`: sao poucos
      # modelos, todos com join pesado sobre views da bronze que ja leem 157 M
      # de linhas. Materializar aqui e o que evita recomputar a bronze inteira
      # a cada consulta de painel.
      core:
        +materialized: table
      meta3:
        +materialized: table
      meta4:
        +materialized: table
      meta5:
        +materialized: table

    # SIDRA/IBGE e SGS/Bacen ja na estrutura do ADR 0010: pasta por fonte,
    # bronze_<tabela> copia fiel e silver_<tabela> com o cast. Caem no MESMO
    # schema da tabela que a ingestao grava (bacen.serie_sgs), e nao colidem
    # porque todo modelo comeca com bronze_ ou silver_.
    ibge_sidra:
      +schema: ibge_sidra
      +materialized: view
    bacen:
      +schema: bacen
      +materialized: view
