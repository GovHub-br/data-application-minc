name: 'minc'

version: 1.0.0
config-version: 2

profile: minc

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  minc:
    metadata:
      +materialized: incremental
      +schema: metadata
    # Meta 5 — novos entrantes no fomento federal. Uma linhagem so, cruzando
    # LPG, PNAB, LAB (BB Agil), Rouanet (SALIC) e audiovisual (Ancine).
    agentes_dbt:
      +materialized: table
      +schema: agentes
    # Meta 3 — cotas/reservas (LPG + PNAB). Domínio próprio, schema minc_cotas,
    # separado do agentes_dbt (meta 5 do colega). Bronze materializado como table
    # porque filtra o lixo de parsing (fica ~20k linhas em vez de milhões).
    cotas_dbt:
      +schema: cotas
      bronze:
        +materialized: table
      silver:
        +materialized: view
      gold:
        +materialized: table
    # SALIC — camada bronze tipada, um modelo por tabela do raw salic_bronze
    # (571 hoje). View por padrão: o objetivo é a camada semântica no dbt docs
    # e no OpenMetadata, e view entrega isso com zero armazenamento. Os 52,7 GB
    # do raw não se duplicam antes de alguém saber quais modelos importam —
    # promova a table só as pesadas, depois.
    salic_bronze:
      +materialized: view
      # Schema `salic`, NAO `salic_bronze`. Com target `prod` o
      # generate_schema_name_for_env aplica o custom schema literal, entao
      # `+schema: salic_bronze` faria o modelo resolver para a MESMA relacao
      # que a sua propria source -- e o dbt derrubaria a tabela raw de 157 M
      # de linhas para por uma view no lugar. Segue o padrao de agentes/cotas:
      # um schema por dominio, as camadas separadas por pasta.
      +schema: salic

    # Fontes de API (TransfereGov, SIDRA/IBGE, SGS/Bacen). Chegam 100% como
    # `text`, entao precisam da mesma camada de tipagem do SALIC -- as macros
    # bronze_* sao as mesmas, e o cast de cada coluna foi decidido pelo padrao
    # medido no dado, nao pelo nome (scripts/perfilar_padroes.py).
    #
    # Aqui o schema de destino repete o nome da PASTA, e nao o dominio, pelo
    # mesmo motivo explicado acima no salic_bronze -- so que invertido: la o
    # raw e `salic_bronze` e sobra o nome limpo `salic`; aqui o raw ja ocupa o
    # nome limpo (`transferegov`), entao `+schema: transferegov` faria a view
    # colidir com a tabela de origem.
    #
    # View pelo mesmo motivo do salic_bronze: a camada so aplica cast.
    transferegov_bronze:
      +materialized: view
      +schema: transferegov_bronze
    ibge_sidra_bronze:
      +materialized: view
      +schema: ibge_sidra_bronze
    bacen_bronze:
      +materialized: view
      +schema: bacen_bronze
    bbagil_bronze:
      +materialized: view
      +schema: bbagil_bronze
