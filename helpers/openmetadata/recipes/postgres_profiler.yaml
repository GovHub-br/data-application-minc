source:
  type: postgres
  serviceName: MinC
  serviceConnection:
    config:
      type: Postgres
      hostPort: ${DB_DW_HOST}:${DB_DW_PORT}
      username: ${DB_DW_USER}
      authType:
        password: ${DB_DW_PASSWORD}
      database: ${DB_DW_DBNAME}
      sslMode: disable

  sourceConfig:
    config:
      type: Profiler
      computeMetrics: true
      profileSample: 25
      schemaFilterPattern:
        includes:
          # Uniao do que o projeto dbt declara como source com o que ele
          # produz, menos o seeds. tests/test_openmetadata_packaging.py deriva
          # a mesma lista do projeto dbt e falha quando as duas divergem.
          #
          # O seeds fica de fora so aqui: e a copia crua de planilhas, 108
          # tabelas em 10/11/2026. O dbt le 19: 16 pela bronze `ibge` e uma
          # por cada bronze de `dados_cultura`, `siop` e
          # `tesouro_transparente`. Essas bronzes sao
          # view, e o profiler pula view (includeViews fica false), entao o
          # que o projeto le dessas planilhas e medido nas golds de
          # cultura_em_numeros.
          #
          # Nao use excludes para tirar schema daqui: com includes, o profiler
          # manda ao servidor so o regex dos includes e descarta o excludes
          # (_build_regex_from_filter, openmetadata-ingestion 1.13.3.2).
          - '^ancine$'
          - '^bacen$'
          - '^bb_agil$'
          - '^bbagil$'
          - '^bsc$'
          - '^bsc_pnab$'
          - '^cultura_em_numeros$'
          - '^dados_cultura$'
          - '^dados_mapa_cultura$'
          - '^dados_salic$'
          - '^execucao_pnab$'
          - '^ibge$'
          - '^ibge_sidra$'
          - '^intermediate$'
          - '^mapas$'
          - '^metadata$'
          - '^relatorio_gestao$'
          - '^salic$'
          - '^senado$'
          - '^siconfi$'
          - '^siop$'
          - '^tesouro_transparente$'
          - '^transferegov$'
processor:
  type: orm-profiler
  config: {}

sink:
  type: metadata-rest
  config:
    # Lote pequeno de proposito: o proxy na frente do OpenMetadata corta a
    # conexao antes de um PUT grande terminar.
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${PROFILER_TOKEN}
