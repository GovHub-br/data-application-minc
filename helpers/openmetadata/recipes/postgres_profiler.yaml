source:
  type: postgres
  serviceName: MinC
  serviceConnection:
    config:
      type: Postgres
      hostPort: ${DB_DW_HOST}:${DB_DW_PORT}
      username: ${DB_DW_USER}
      authType:
        password: ${DB_DW_PASSWORD}
      database: ${DB_DW_DBNAME}
      sslMode: disable

  sourceConfig:
    config:
      type: Profiler
      computeMetrics: true
      profileSample: 25
      schemaFilterPattern:
        includes:
          # Uniao do que o projeto dbt declara como source com o que ele
          # produz. tests/test_openmetadata_packaging.py deriva a mesma lista
          # do projeto dbt e falha quando as duas divergem.
          - '^ancine$'
          - '^bacen$'
          - '^bb_agil$'
          - '^bbagil$'
          - '^bsc$'
          - '^bsc_pnab$'
          - '^cultura_em_numeros$'
          - '^dados_mapa_cultura$'
          - '^dados_salic$'
          - '^execucao_pnab$'
          - '^ibge$'
          - '^ibge_sidra$'
          - '^intermediate$'
          - '^mapas$'
          - '^metadata$'
          - '^relatorio_gestao$'
          - '^salic$'
          - '^seeds$'
          - '^siconfi$'
          - '^transferegov$'
        # O seeds fica nos includes porque as tres recipes tem de ter a mesma
        # lista (o teste acima), mas o profiler nao mede ele: e a copia crua de
        # planilhas, 108 tabelas em 10/11/2026, e o dbt usa 16, que a bronze
        # `ibge` copia sem mudar nada. Medir a bronze ja mede o que o projeto le.
        # Com includes e excludes juntos, o OpenMetadata tira o que casar com
        # qualquer exclude.
        excludes:
          - '^seeds$'
processor:
  type: orm-profiler
  config: {}

sink:
  type: metadata-rest
  config:
    # Lote pequeno de proposito: o proxy na frente do OpenMetadata corta a
    # conexao antes de um PUT grande terminar.
    bulk_sink_batch_size: 10

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: ${OM_HOST}
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${PROFILER_TOKEN}
