# Trino de nó único: o mesmo processo é coordinator e worker. Não há cluster —
# o gargalo desta ingestão é a rede até o SQL Server, não CPU do Trino.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Catálogos vêm dos arquivos em etc/catalog/. O modo `dynamic` (CREATE CATALOG
# via SQL) é experimental e, pior para nós, registra a senha do catálogo no log
# e na Web UI — o que contraria a regra de segredos do repositório.
catalog.management=static

# Uma carga de terabytes gera centenas de queries. O padrão (100 queries, 15min)
# apaga do histórico da Web UI justamente a query que falhou no meio da noite.
query.max-history=1000
query.min-expire-age=120m
