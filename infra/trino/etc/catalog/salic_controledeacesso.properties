# SALIC — banco ControleDeAcesso (origem). Um catálogo do Trino aponta para UM banco
# do SQL Server: o conector amarra o databaseName na connection-url, então
# cada banco do SALIC tem o seu arquivo.
#
# Nenhuma credencial aqui: as referências ENV abaixo são resolvidas pelo Trino
# a partir do ambiente do container, que o docker-compose preenche com o .env
# (gitignorado). Um valor real neste arquivo entraria no git.
connector.name=sqlserver
connection-url=jdbc:sqlserver://${ENV:SALIC_MSSQL_HOST}:${ENV:SALIC_MSSQL_PORT};databaseName=ControleDeAcesso;${ENV:SALIC_MSSQL_URL_OPTS}
connection-user=${ENV:SALIC_MSSQL_USER}
connection-password=${ENV:SALIC_MSSQL_PASSWORD}

# CRÍTICO. No padrão (IGNORE) o Trino **descarta silenciosamente** as colunas
# cujo tipo ele não sabe mapear (sql_variant, geography, hierarchyid...). A
# bronze declara 561 tabelas em dbt/minc/models/salic_bronze/ — perder coluna
# sem erro é o pior modo de falha possível aqui.
unsupported-type-handling=CONVERT_TO_VARCHAR

# OBRIGATÓRIO aqui, e não é preferência de estilo. O SALIC nomeia em CamelCase
# (Projetos, IdPRONAC). Em false — o padrão — o Trino lista a tabela como
# `projetos` mas procura o nome remoto exatamente assim, e não acha a `Projetos`
# real: o information_schema mostra as 561 tabelas e nenhuma delas pode ser
# lida. Em true o Trino guarda o nome remoto e resolve a ida e a volta.
case-insensitive-name-matching=true
case-insensitive-name-matching.cache-ttl=30m

# 561 tabelas × várias queries cada = muito round-trip só para ler metadado de
# um schema que não muda durante a carga. 30min cobre uma execução inteira.
metadata.cache-ttl=30m
metadata.cache-missing=true
metadata.cache-maximum-size=20000

# A DAG fatia a tabela em faixas de chave (WHERE k >= a AND k < b) e conta com
# o pushdown desse predicado para o SQL Server. dynamic-filtering não atua aqui
# (não há join), mas os 20s de espera padrão atrasariam cada fatia.
dynamic-filtering.enabled=false
