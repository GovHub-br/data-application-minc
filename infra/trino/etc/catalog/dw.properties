# Data warehouse do MinC (destino). É o mesmo Postgres onde o dbt roda a
# bronze → silver → gold; o Trino escreve só na bronze.
#
# Do container do Trino, o Postgres do compose responde pelo nome do serviço
# (`postgres`), não por localhost — o Airflow é que roda em network_mode: host.
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:TRINO_DW_HOST}:${ENV:TRINO_DW_PORT}/${ENV:TRINO_DW_DB}
connection-user=${ENV:TRINO_DW_USER}
connection-password=${ENV:TRINO_DW_PASSWORD}

# O QUE MAIS IMPORTA NESTE ARQUIVO. No padrão (false), todo INSERT do Trino
# escreve primeiro numa tabela temporária e só então renomeia para a de
# destino. Para terabytes isso significa escrever tudo duas vezes e precisar do
# dobro do disco — e inviabiliza o carregamento em fatias, porque cada fatia
# criaria a sua própria temporária e sobrescreveria a anterior.
#
# Ligar isso transfere a responsabilidade de atomicidade para a DAG, que a
# assume explicitamente: DROP + CREATE da tabela bronze antes da carga, e
# DELETE da faixa antes de reinserir quando uma fatia é repetida.
insert.non-transactional-insert.enabled=true

# Sem cache. A DAG cria a tabela bronze via psycopg2 e insere via Trino no
# instante seguinte: se o metadado ficasse em cache, o INSERT não enxergaria a
# tabela recém-criada. Este é o padrão do conector — está escrito para que
# ninguém o "otimize" copiando o metadata.cache-ttl dos catálogos de origem.
metadata.cache-ttl=0s

# write.batch-size fica no padrão (1000) de propósito: a documentação do Trino
# pede explicitamente para não mexer nesta propriedade.

case-insensitive-name-matching=false
