# Mapas Culturais (origem). Banco PostgreSQL — um catálogo aponta para um banco.
#
# Nenhuma credencial aqui: as referências ENV abaixo são resolvidas pelo Trino
# a partir do ambiente do container. Os valores reais ficam em infra/.env
# (gitignorado). Ver local.env para o template de nomes.
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:MAPAS_PG_HOST}:${ENV:MAPAS_PG_PORT}/${ENV:MAPAS_PG_DB}
connection-user=${ENV:MAPAS_PG_USER}
connection-password=${ENV:MAPAS_PG_PASSWORD}

# Cache longo de propósito: o schema ingerido não muda de estrutura durante a
# carga e são muitas tabelas de metadado para ler em cada round-trip.
metadata.cache-ttl=30m
metadata.cache-missing=true
metadata.cache-maximum-size=10000

# false é o padrão e o correto para PostgreSQL: nomes de objetos já são
# minúsculos por convenção — sem o CamelCase do SQL Server que forçou o true
# nos catálogos do SALIC.
case-insensitive-name-matching=false

# O Mapas tem PostGIS. Duas colunas de local, agent._geo_location e
# space._geo_location, são `geography`, tipo que o Trino não suporta: no padrão
# (IGNORE) elas somem do information_schema SEM erro nenhum, e a bronze nasce
# sem a localização. Com CONVERT_TO_VARCHAR chegam como texto hexadecimal (EWKB,
# ex.: 0101000020E610…), que o PostGIS lê de volta com ST_GeogFromText/
# ST_GeomFromEWKB. Só vale para este catálogo; os do SALIC já têm o seu.
unsupported-type-handling=CONVERT_TO_VARCHAR

# Já public.geo_division.geom é `geometry`, que o Trino 478 SUPORTA (tipo
# Geometry) — por isso a opção acima não o converte, e o CAST(... AS varchar) da
# bronze falha (TYPE_MISMATCH), deixando a carga da tabela em erro. A
# geo_division fica fora da ingestão (ADR 0008). Se um dia for necessária, a
# conversão certa é ST_AsText(col) ou to_hex(ST_AsBinary(col)), em
# plugins/trino_bronze.py (cast_to_text) — não nesta configuração.
